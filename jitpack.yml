jdk:
  - openjdk21
before_install:
  - ls -la sdk/kotlin/gradle/wrapper && sha256sum sdk/kotlin/gradle/wrapper/gradle-wrapper.jar && df -h . /tmp ~ && file sdk/kotlin/gradle/wrapper/gradle-wrapper.jar; head -c 200 sdk/kotlin/gradle/wrapper/gradle-wrapper.jar | od -c | head -5
install:
  - cd sdk/kotlin && ./gradlew --console=plain :yuva:publishToMavenLocal

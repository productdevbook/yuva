        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of designs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDesignPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createEmailDesign
      summary: Create an e-mail design
      description: |
        From a `document`, from a gallery `template` (its files become the workspace's images,
        reused when the same file is already there), or empty when neither is given. `inbox_id`
        ties the design to an inbox; without it the design is workspace-wide. The answer carries
        the render's `warnings`.

        Owners, admins and API keys. Scope: `broadcasts:write`.
      tags: [designs]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailDesignCreate"
      responses:
        "201":
          description: The design.
          content:
            application/json:
              schema:

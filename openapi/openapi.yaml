            `POST …/forwarding-address/rotate` changes it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelCreate:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/ChannelKind"
        name:
          type: string
          minLength: 1
          maxLength: 200
        settings:
          $ref: "#/components/schemas/ChannelSettings"
        email:
          $ref: "#/components/schemas/EmailChannelInput"
        chat:
          $ref: "#/components/schemas/ChatChannelInput"
        app:
          $ref: "#/components/schemas/AppChannelInput"
    ChannelUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        settings:
          $ref: "#/components/schemas/ChannelSettings"
        email:
          $ref: "#/components/schemas/EmailChannelInput"
        chat:
          $ref: "#/components/schemas/ChatChannelInput"
        app:
          $ref: "#/components/schemas/AppChannelInput"
    ChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    ExternalId:
      type: object
      required: [inbox_id, external_id]
      properties:
        inbox_id:
          type: string
          format: uuid
        external_id:
          type: string
          minLength: 1
          maxLength: 200
          description: The host app's user id.
    Attributes:
      type: object
      additionalProperties: true
      description: Free-form data about the contact (plan, app version, ...), at most 16 KiB.
    UndeliverableEmail:
      type: object
      description: An address that bounced permanently or complained; replies to it are refused.
      required: [email, reason, created_at]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        reason:
          type: string
          enum: [bounce, complaint]
        detail:
          type: string
          description: The diagnostic from the receiving server, when there was one.
        created_at:
          type: string
          format: date-time
    Contact:
      type: object
      required: [id, name, emails, external_ids, attributes, blocked, undeliverable, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emails:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        external_ids:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        attributes:
          $ref: "#/components/schemas/Attributes"
        blocked:
          type: boolean
          description: Mail and chat from a blocked contact are refused.
        locale:
          $ref: "#/components/schemas/LanguageTag"
          description: The language from the contact's identity token; absent when not known.
        undeliverable:
          type: array
          description: The contact's addresses that must not be mailed.
          items:
            $ref: "#/components/schemas/UndeliverableEmail"
        activity:
          $ref: "#/components/schemas/ContactActivity"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactActivity:
      type: object
      description: |
        Only on `GET /v1/contacts` and `GET /v1/contacts/{contactId}`. The counts cover the
        conversations the caller can see, spam left out; `last_seen_at` does not depend on the caller.
      required: [conversations, open_conversations]
      properties:
        last_seen_at:
          type: string
          format: date-time
          description: |
            The contact's last activity: a message (any channel), a rating, or use of a widget or
            app session. Absent when never active.
        conversations:
          type: integer
          format: int64
        open_conversations:
          type: integer
          format: int64
        last_conversation_at:
          type: string
          format: date-time
          description: The last message in any of those conversations, else when the newest one started.
    ContactNote:
      type: object
      required: [id, contact_id, author, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/MessageAuthor"
          description: A `member` or a `bot` (API key); `member_id` is absent once the member was removed.
        body:
          type: string
          description: Plain text.
        created_at:
          type: string
          format: date-time
    ContactNoteCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
    ContactNotePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactNote"
        next_cursor:
          type: string
    ContactSummary:
      type: object
      description: |
        How the team has served the contact, over all their conversations the caller can see (spam
        left out).
      required: [first_replies, ratings]
      properties:
        first_replies:
          type: integer
          format: int64
          description: Conversations where a member answered the contact's first message.
        median_first_reply_seconds:
          type: integer
          format: int64
          description: Median seconds from the contact's first message to the first member reply; absent when `first_replies` is 0.
        ratings:
          type: object
          required: [good, bad]
          description: The latest rating of each conversation.
          properties:
            good:
              type: integer
              format: int64
            bad:
              type: integer
              format: int64
    ContactPresence:
      type: object
      required: [contact_id, online]
      properties:
        contact_id:
          type: string
          format: uuid
        online:
          type: boolean
          description: A `/client/v1/realtime` connection of the contact was seen in the last 75 seconds.
        last_seen_at:
          type: string
          format: date-time
          description: The contact's last client activity (a connection or a session use); absent when never seen.
    FeedbackContact:
      type: object
      required: [external_id]
      properties:
        external_id:
          type: string
          minLength: 1
          maxLength: 200
          description: The host app's id for this user, per inbox.
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
          maxLength: 200
    FeedbackCreate:
      allOf:
        - $ref: "#/components/schemas/FeedbackFields"
        - type: object
          required: [inbox_id, contact, category, body]
          properties:
            inbox_id:
              type: string
              format: uuid
            contact:
              $ref: "#/components/schemas/FeedbackContact"
            category:
              $ref: "#/components/schemas/FeedbackCategory"
            subject:
              type: string
              maxLength: 500
            body:
              type: string
              minLength: 1
              maxLength: 65536
            client_id:
              type: string
              minLength: 1
              maxLength: 200
            allow_email:
              type: boolean
              default: false
    FeedbackCreated:
      type: object
      required: [conversation, message, contact]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        message:
          $ref: "#/components/schemas/Message"
        contact:
          $ref: "#/components/schemas/Contact"
    FeedbackCount:
      type: object
      required: [category, count]
      properties:
        category:
          $ref: "#/components/schemas/FeedbackCategory"
        count:
          type: integer
          format: int64
    WebhookEventType:
      type: string
      enum: [conversation.created, conversation.updated, conversation.rated, message.created, feedback.created, contact.updated, contact.deleted, draft.created, draft.updated, draft.deleted, discussion.created, discussion.post_created, discussion.answered, discussion.updated, subscription.created, subscription.updated, broadcast.updated, analytics.alert]
    WebhookEndpoint:
      type: object
      required: [id, url, description, events, include_notes, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
          description: Absent for workspace endpoints.
        url:
          type: string
          format: uri
        description:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        include_notes:
          type: boolean
          description: "`message.created` also for members' notes."
        enabled:
          type: boolean
        disabled_at:
          type: string
          format: date-time
        disabled_reason:
          type: string
          description: |
            Why Yuva turned the endpoint off: every attempt failed for 24 hours, or it answered
            `410 Gone`. Absent while enabled or when a member turned it off.
        failing_since:
          type: string
          format: date-time
          description: Every attempt since then failed; absent while deliveries succeed.
        secret_rotated_at:
          type: string
          format: date-time
          description: While the previous secret still signs (24 hours after a rotation), when it was replaced.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookEndpointCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2000
        inbox_id:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 200
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
        include_notes:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
    WebhookEndpointUpdate:
      type: object
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          maxLength: 2000
        description:
          type: string
          maxLength: 200
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
        include_notes:
          type: boolean
        enabled:
          type: boolean
    WebhookEndpointSecret:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint:
          $ref: "#/components/schemas/WebhookEndpoint"
        secret:
          type: string
          description: "`whsec_` and 32 random bytes in base64. Shown only now."
    WebhookEndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
    WebhookDeliveryState:
      type: string
      description: |
        `pending` while attempts remain, `succeeded` after a 2xx answer, `failed` when the retries
        (about 24 hours) ran out or the endpoint was disabled.
      enum: [pending, succeeded, failed]
    WebhookAttempt:
      type: object
      required: [id, delivery_id, attempted_at, manual, success, latency_ms, response_body]
      properties:
        id:
          type: string
          format: uuid
        delivery_id:
          type: string
          format: uuid
        attempted_at:
          type: string
          format: date-time
        manual:
          type: boolean
          description: Sent by a redeliver.
        success:
          type: boolean
        status_code:
          type: integer
          format: int32
          description: Absent when no HTTP answer arrived.
        latency_ms:
          type: integer
          format: int32
        response_body:
          type: string
          description: The first 1 KiB of the answer.
        error:
          type: string
          description: Why the attempt failed (timeout, refused address, non-2xx status, ...).
    WebhookAttemptList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookAttempt"
    WebhookDelivery:
      type: object
      required: [id, message_id, event_type, state, attempts, created_at]
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          description: The `webhook-id` header.
        event_type:
          $ref: "#/components/schemas/WebhookEventType"
        state:
          $ref: "#/components/schemas/WebhookDeliveryState"
        attempts:
          type: integer
          format: int32
        next_attempt_at:
          type: string
          format: date-time
          description: Pending deliveries only.
        last_attempt:
          $ref: "#/components/schemas/WebhookAttempt"
        created_at:
          type: string
          format: date-time
    WebhookDeliveryDetail:
      allOf:
        - $ref: "#/components/schemas/WebhookDelivery"
        - type: object
          required: [payload, attempt_log]
          properties:
            payload:
              type: object
              additionalProperties: true
              description: The body sent, one of the webhook payloads.
            attempt_log:
              type: array
              description: The delivery's attempts that are still kept, newest first.
              items:
                $ref: "#/components/schemas/WebhookAttempt"
    WebhookDeliveryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        next_cursor:
          type: string
          description: Absent on the last page.
    WebhookContact:
      type: object
      description: The contact as a host backend needs it.
      required: [id, name, emails, external_ids, attributes, online]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emails:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        external_ids:
          type: array
          description: The host app's ids for this person, per inbox.
          items:
            $ref: "#/components/schemas/ExternalId"
        attributes:
          $ref: "#/components/schemas/Attributes"
        locale:
          type: string
        online:
          type: boolean
          description: |
            The contact had a live `/client/v1/realtime` connection when the webhook was prepared.
            When false, the app is closed or in the background: a push notification is the way to
            reach them.
        last_seen_at:
          type: string
          format: date-time
    WebhookDeletedContact:
      type: object
      required: [id, external_ids]
      properties:
        id:
          type: string
          format: uuid
        external_ids:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        merged_into_id:
          type: string
          format: uuid
          description: Set when the contact was merged into this contact, which now has its external ids.
    WebhookConversationData:
      type: object
      required: [conversation, contact]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        contact:
          $ref: "#/components/schemas/WebhookContact"
    WebhookMessageData:
      type: object
      required: [message, conversation, contact]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        conversation:
          $ref: "#/components/schemas/Conversation"
        contact:
          $ref: "#/components/schemas/WebhookContact"
    WebhookContactData:
      type: object
      required: [contact]
      properties:
        contact:
          $ref: "#/components/schemas/WebhookContact"
    WebhookContactDeletedData:
      type: object
      required: [contact]
      properties:
        contact:
          $ref: "#/components/schemas/WebhookDeletedContact"
    WebhookPayloadBase:
      type: object
      description: Standard Webhooks payload envelope.
      required: [type, timestamp, workspace_id]
      properties:
        type:
          $ref: "#/components/schemas/WebhookEventType"
        timestamp:
          type: string
          format: date-time
          description: When the event happened (not when it was sent).
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
          description: The conversation's inbox; absent for contact events.
    WebhookConversationPayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/WebhookConversationData"
    WebhookMessagePayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/WebhookMessageData"
    WebhookFeedbackPayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/WebhookMessageData"
    WebhookContactPayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/WebhookContactData"
    WebhookContactDeletedPayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/WebhookContactDeletedData"
    ContactCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        emails:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Email"
        external_ids:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExternalId"
        attributes:
          $ref: "#/components/schemas/Attributes"
        blocked:
          type: boolean
    ContactUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 200
        emails:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Email"
        external_ids:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExternalId"
        attributes:
          $ref: "#/components/schemas/Attributes"
        blocked:
          type: boolean
        clear_undeliverable:
          type: array
          maxItems: 20
          description: Addresses to mail again, e.g. after the recipient fixed their mailbox.
          items:
            $ref: "#/components/schemas/Email"
    ContactMerge:
      type: object
      required: [source_id]
      properties:
        source_id:
          type: string
          format: uuid
          description: The contact to merge into this one and delete.
    ContactPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        next_cursor:
          type: string
          description: Absent on the last page.
    ConversationStatus:
      type: string
      enum: [open, pending, snoozed, closed]
    Priority:
      type: string
      enum: [low, normal, high, urgent]
    Conversation:
      type: object
      required: [id, inbox_id, contact_id, kind, subject, status, priority, spam, labels, last_activity_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ConversationKind"
        feedback:
          $ref: "#/components/schemas/Feedback"
          description: "`feedback` conversations only: category and what the app sent with it."
        page:
          $ref: "#/components/schemas/SourcePage"
          description: The documentation page it was sent from (page feedback, questions asked on a page before discussions); absent otherwise.
        channel_id:
          type: string
          format: uuid
          description: The channel it started on; absent when unknown or removed.
        channel_kind:
          $ref: "#/components/schemas/ChannelKind"
          description: |
            Read-only: the kind of the channel it started on, kept when that channel is removed or
            the conversation moves to another inbox. Absent when it started without a channel.
        broadcast_id:
          type: string
          format: uuid
          description: |
            Set when a reply to this broadcast opened the conversation (the recipient's own reply,
            or someone else answering a forwarded copy); absent otherwise or when the broadcast was
            deleted.
        imported:
          $ref: "#/components/schemas/ConversationImport"
          description: |
            Set on history moved into Yuva from another mailbox: such conversations keep their
            original times, were never unread and wrote no events, notifications or webhooks when
            they were imported. Absent otherwise.
        related_conversation_id:
          type: string
          format: uuid
          description: |
            Set when this conversation was opened for a sender who answered in the e-mail thread of
            another contact's conversation (a forward, a CC'd colleague): the conversation whose
            thread the mail named. That mail never joins the other conversation and replies here go
            only to this conversation's contact. Absent otherwise or when that conversation is gone.
        subject:
          type: string
        status:
          $ref: "#/components/schemas/ConversationStatus"
        snooze_until:
          type: string
          format: date-time
        priority:
          $ref: "#/components/schemas/Priority"
        spam:
          type: boolean
          description: |
            Flagged as spam, e.g. because the first e-mail failed DMARC. Spam is left out of lists
            and counts unless asked for, and gets no automatic reply.
        assignee_id:
          type: string
          format: uuid
          description: The assigned member; absent when unassigned.
        labels:
          type: array
          description: Label ids.
          items:
            type: string
            format: uuid
        last_message_at:
          type: string
          format: date-time
          description: The last `message` to or from the contact.
        last_activity_at:
          type: string
          format: date-time
          description: The last message or note, or the creation time.
        closed_at:
          type: string
          format: date-time
          description: When it was last closed; absent when it never was.
        rating:
          $ref: "#/components/schemas/ConversationRating"
        last_read_by_contact_at:
          type: string
          format: date-time
          description: |
            The contact has read every message created at or before this time, in the widget or
            an app (`POST /client/v1/conversations/{id}/read`). Absent until the contact has read
            anything, and in conversations the contact only reaches by e-mail. A `contact.read`
            event tells when it moves.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationRating:
      type: object
      description: |
        The contact's latest rating. A conversation can be rated once each time it is closed, so
        this may belong to an earlier close (compare `rated_at` with `closed_at`). The thread also
        has it as a `rated` event message whose body is the comment.
      required: [rating, rated_at]
      properties:
        rating:
          $ref: "#/components/schemas/Rating"
        comment:
          type: string
        rated_at:
          type: string
          format: date-time
    Rating:
      type: string
      enum: [good, bad]
    ConversationCreate:
      type: object
      required: [inbox_id, contact_id]
      properties:
        inbox_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
          description: A channel of the same inbox.
        subject:
          type: string
          maxLength: 500
        priority:
          $ref: "#/components/schemas/Priority"
        assignee_id:
          type: string
          format: uuid
          description: A member with access to the inbox.
        labels:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    ConversationUpdate:
      type: object
      minProperties: 1
      properties:
        subject:
          type: string
          maxLength: 500
        status:
          $ref: "#/components/schemas/ConversationStatus"
        snooze_until:
          type: string
          format: date-time
        priority:
          $ref: "#/components/schemas/Priority"
        spam:
          type: boolean
          description: Flag or unflag as spam.
        assignee_id:
          type: [string, "null"]
          format: uuid
          description: A member with access to the inbox; `null` unassigns.
        labels:
          type: array
          maxItems: 50
          description: Replaces the labels.
          items:
            type: string
            format: uuid
    ConversationBulkUpdate:
      type: object
      required: [conversation_ids]
      minProperties: 2
      properties:
        conversation_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        status:
          $ref: "#/components/schemas/ConversationStatus"
        snooze_until:
          type: string
          format: date-time
          description: Required with status `snoozed`.
        assignee_id:
          type: [string, "null"]
          format: uuid
          description: A member; `null` unassigns.
        add_labels:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        remove_labels:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    ConversationBulkFailure:
      type: object
      required: [id, status, code]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: integer
          format: int32
          description: The HTTP status the single change would have answered.
        code:
          type: string
        detail:
          type: string
    ConversationBulkResult:
      type: object
      required: [updated, failed]
      properties:
        updated:
          type: array
          description: The conversations after the change, in request order.
          items:
            $ref: "#/components/schemas/Conversation"
        failed:
          type: array
          items:
            $ref: "#/components/schemas/ConversationBulkFailure"
    ConversationMove:
      type: object
      required: [inbox_id]
      properties:
        inbox_id:
          type: string
          format: uuid
    ConversationContact:
      type: object
      description: The conversation's contact, enough for a list row.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          $ref: "#/components/schemas/Email"
          description: The contact's first e-mail address; absent when none is known.
    MessagePreview:
      type: object
      description: The last `message` of a conversation, for a list row.
      required: [id, kind, author_type, text, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/MessageKind"
        author_type:
          $ref: "#/components/schemas/AuthorType"
        text:
          type: string
          description: The plain-text body on one line, cut to 140 characters with `...` when longer.
        created_at:
          type: string
          format: date-time
    ConversationListItem:
      description: A conversation with what a list row shows.
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [contact, unread]
          properties:
            contact:
              $ref: "#/components/schemas/ConversationContact"
            last_message:
              $ref: "#/components/schemas/MessagePreview"
            unread:
              type: boolean
              description: |
                A message or note from someone other than the calling member is newer than the
                member's read cursor, or the member marked it unread. Always `false` for API keys.
            pinned_at:
              type: string
              format: date-time
              description: When the calling member pinned it; absent when they did not, and for API keys.
    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationListItem"
        next_cursor:
          type: string
          description: Absent on the last page.
    ConversationSummary:
      type: object
      description: Enough of a conversation to show where an item belongs.
      required: [id, inbox_id, subject, status, contact]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        subject:
          type: string
        status:
          $ref: "#/components/schemas/ConversationStatus"
        contact:
          $ref: "#/components/schemas/ConversationContact"
    MentionNote:
      type: object
      required: [id, text, author, created_at]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          description: The plain-text body on one line, cut to 140 characters with `...` when longer.
        author:
          $ref: "#/components/schemas/MessageAuthor"
        created_at:
          type: string
          format: date-time
    Mention:
      type: object
      required: [note, conversation, seen]
      properties:
        note:
          $ref: "#/components/schemas/MentionNote"
        conversation:
          $ref: "#/components/schemas/ConversationSummary"
        seen:
          type: boolean
          description: The calling member has read the conversation up to this note.
    MentionPage:
      type: object
      required: [items, unseen]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Mention"
        next_cursor:
          type: string
          description: Absent on the last page.
        unseen:
          type: integer
          format: int64
          description: Unseen mentions over all pages.
    DraftAuthorKind:
      type: string
      description: |
        `bot`: written with an API key. `assistant`: written by a member through an OAuth client.
        `member`: written by a member in the panel.
      enum: [bot, assistant, member]
    DraftItem:
      type: object
      required: [draft, conversation]
      properties:
        draft:
          $ref: "#/components/schemas/Message"
        conversation:
          $ref: "#/components/schemas/ConversationSummary"
    DraftPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DraftItem"
        next_cursor:
          type: string
          description: Absent on the last page.
        total:
          type: integer
          format: int64
          description: Drafts matching the filters over all pages.
    CountByID:
      type: object
      required: [id, count]
      properties:
        id:
          type: string
          format: uuid
        count:
          type: integer
          format: int64
    Stats:
      type: object
      required: [since, until, replies, closed, first_replies, members, ratings]
      properties:
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
          description: When it was counted.
        replies:
          type: integer
          format: int64
          description: Replies sent by members.
        closed:
          type: integer
          format: int64
          description: Times a conversation was closed, by anyone (members, API keys, the server).
        first_replies:
          type: integer
          format: int64
          description: Conversations whose first member reply to the contact was sent in the window.
        median_first_reply_seconds:
          type: integer
          format: int64
          description: Median seconds from the contact's first message to that reply; absent when `first_replies` is 0.
        ratings:
          $ref: "#/components/schemas/RatingStats"
        members:
          type: array
          description: Per member, by member id.
          items:
            $ref: "#/components/schemas/MemberStats"
    RatingStats:
      type: object
      description: Ratings contacts gave in the window, in total and per inbox (inboxes without any are left out).
      required: [good, bad, inboxes]
      properties:
        good:
          type: integer
          format: int64
        bad:
          type: integer
          format: int64
        inboxes:
          type: array
          items:
            $ref: "#/components/schemas/InboxRatingStats"
    InboxRatingStats:
      type: object
      required: [inbox_id, good, bad]
      properties:
        inbox_id:
          type: string
          format: uuid
        good:
          type: integer
          format: int64
        bad:
          type: integer
          format: int64
    MemberStats:
      type: object
      required: [member_id, replies, closed]
      properties:
        member_id:
          type: string
          format: uuid
        replies:
          type: integer
          format: int64
        closed:
          type: integer
          format: int64
    ConversationCounts:
      type: object
      description: Open conversations in the inboxes the caller can see.
      required: [all, mine, unassigned, spam, inboxes, labels, assignees, feedback, feedback_categories]
      properties:
        feedback:
          type: integer
          format: int64
          description: Open feedback conversations (included in the other counts too).
        feedback_categories:
          type: array
          description: Open feedback per category; categories without any are left out.
          items:
            $ref: "#/components/schemas/FeedbackCount"
        all:
          type: integer
          format: int64
        spam:
          type: integer
          format: int64
          description: Open conversations flagged as spam (not included in the other counts).
        mine:
          type: integer
          format: int64
        unassigned:
          type: integer
          format: int64
        inboxes:
          type: array
          description: Per inbox id.
          items:
            $ref: "#/components/schemas/CountByID"
        assignees:
          type: array
          description: |
            Per assignee's member id: each member's open load, for choosing whom to hand a
            conversation to. Counts only the inboxes the caller can see.
          items:
            $ref: "#/components/schemas/CountByID"
        labels:
          type: array
          description: Per label id.
          items:
            $ref: "#/components/schemas/CountByID"
    Home:
      type: object
      description: The Home blocks; a block the member may not see is absent.
      required: [inbox]
      properties:
        inbox:
          $ref: "#/components/schemas/HomeInbox"
        analytics:
          $ref: "#/components/schemas/HomeAnalytics"
        broadcasts:
          $ref: "#/components/schemas/HomeBroadcasts"
        setup:
          $ref: "#/components/schemas/HomeSetup"
    HomeInbox:
      type: object
      required: [open, unassigned, waiting]
      properties:
        open:
          type: integer
          format: int64
          description: Open conversations, spam left out (`all` in the conversation counts).
        unassigned:
          type: integer
          format: int64
        waiting:
          type: integer
          format: int64
          description: Open conversations whose contact waits for a reply.
        oldest_waiting:
          $ref: "#/components/schemas/HomeWaitingConversation"
    HomeWaitingConversation:
      type: object
      description: The open conversation that has waited longest; absent when none waits.
      required: [id, inbox_id, subject, contact, since]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        subject:
          type: string
        contact:
          $ref: "#/components/schemas/HomeContact"
        since:
          type: string
          format: date-time
          description: The contact's first message after the last reply.
    HomeContact:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Empty when the contact has no name.
        email:
          type: string
          format: email
          description: The contact's first address, when it has one.
    HomeAnalytics:
      type: object
      required: [properties]
      properties:
        properties:
          type: array
          items:
            $ref: "#/components/schemas/HomeProperty"
    HomeProperty:
      type: object
      required: [id, name, domains, platforms, timezone, visitors_today, realtime_visitors, days]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        name:
          type: string
        domains:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsDomain"
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsPlatform"
        timezone:
          type: string
          description: IANA time zone that defines the property's day.
        visitors_today:
          type: integer
          format: int64
          description: Distinct visitors so far today, in the property's time zone.
        realtime_visitors:
          type: integer
          format: int64
          description: Distinct visitors in the last 30 minutes.
        days:
          type: array
          description: Visitors per local day, the last seven days, oldest first; the last one is today.
          items:
            $ref: "#/components/schemas/HomeDay"
    HomeDay:
      type: object
      required: [day, visitors]
      properties:
        day:
          type: string
          format: date
        visitors:
          type: integer
          format: int64
    HomeBroadcasts:
      type: object
      properties:
        last_sent:
          $ref: "#/components/schemas/HomeBroadcast"
    HomeBroadcast:
      type: object
      description: The broadcast that finished sending last; absent when none has.
      required: [id, inbox_id, name, subject, sent_at, click_tracking, recipients, sent, clicked, replied]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        name:
          type: string
        subject:
          type: string
        sent_at:
          type: string
          format: date-time
          description: When sending finished.
        click_tracking:
          type: boolean
          description: Whether links were tracked; `clicked` stays `0` without it.
        recipients:
          type: integer
          format: int64
        sent:
          type: integer
          format: int64
        clicked:
          type: integer
          format: int64
        replied:
          type: integer
          format: int64
    HomeSetup:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: |
            One item per part of the setup hub, in this order: `chat` (live chat channels),
            `email` (e-mail channels), `app` (app channels), `docs` (chat channels that
            documentation pages have used: ratings, feedback or discussions), `analytics`
            (properties; only when the server collects analytics) and `newsletter` (mailing
            lists that are not archived). An item is `done` when its `count` is above zero.
          items:
            $ref: "#/components/schemas/HomeSetupItem"
    HomeSetupItem:
      type: object
      required: [id, done, count]
      properties:
        id:
          type: string
          enum: [chat, email, app, docs, analytics, newsletter]
        done:
          type: boolean
        count:
          type: integer
          format: int64
    ConversationReadCreate:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
          description: A message, note or event of the conversation; the latest when absent.
    ConversationRead:
      type: object
      description: A member's read cursor in a conversation.
      required: [conversation_id, member_id, unread]
      properties:
        conversation_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        last_read_message_id:
          type: string
          format: uuid
          description: Absent when the conversation has nothing to read yet.
        unread:
          type: boolean
          description: Something is newer than the cursor, or the member marked it unread.
    ConversationPin:
      type: object
      description: Whether a member pinned a conversation to the top of their lists.
      required: [conversation_id, member_id]
      properties:
        conversation_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        pinned_at:
          type: string
          format: date-time
          description: Absent when it is not pinned.
    MessageKind:
      type: string
      description: |
        `message` goes to or comes from the contact, `note` is for members only, `event` records a
        change (assignment, status, labels).
      enum: [message, note, event]
    Direction:
      type: string
      enum: [in, out]
    AuthorType:
      type: string
      description: |
        `bot` is an API key. Rows written with a key before bot authors existed have `system`.
      enum: [contact, member, system, bot]
    MessageAuthor:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/AuthorType"
        member_id:
          type: string
          format: uuid
          description: Set for `member`; absent when that member was removed or deleted their account.
        contact_id:
          type: string
          format: uuid
          description: Set for `contact`.
        api_key_id:
          type: string
          format: uuid
          description: Set for `bot`.
        name:
          type: string
          description: "`bot` only: the bot's current display name."
        avatar_url:
          type: string
          description: "`bot` only, when the bot has an avatar."
        via:
          type: string
          description: |
            The OAuth client the member wrote this with (its name at the time), as in
            "Ayşe via Claude Code"; absent for the panel, API keys and contacts.
    EventType:
      type: string
      enum: [assigned, unassigned, status_changed, labels_changed, moved, rated, broadcast_reply]
    MessageEvent:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/EventType"
        assignee_id:
          type: string
          format: uuid
          description: The new assignee (`assigned`).
        previous_assignee_id:
          type: string
          format: uuid
          description: The previous assignee (`assigned`, `unassigned`).
        status:
          $ref: "#/components/schemas/ConversationStatus"
        previous_status:
          $ref: "#/components/schemas/ConversationStatus"
        added_labels:
          type: array
          items:
            type: string
            format: uuid
        removed_labels:
          type: array
          items:
            type: string
            format: uuid
        inbox_id:
          type: string
          format: uuid
          description: The inbox it moved to (`moved`).
        previous_inbox_id:
          type: string
          format: uuid
          description: The inbox it moved from (`moved`).
        rating:
          $ref: "#/components/schemas/Rating"
          description: "`rated` only: the contact's rating; the message body is their comment."
        broadcast:
          $ref: "#/components/schemas/BroadcastRef"
          description: "`broadcast_reply` only: the broadcast the contact answered; the first entry of the conversation."
    Attachment:
      type: object
      required: [id, filename, content_type, size, inline, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Download it from `/v1/attachments/{id}`.
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
        content_id:
          type: string
          description: |
            The `Content-ID` of an inbound e-mail part, without angle brackets. The message HTML
            refers to it as `cid:<content_id>` in `img` sources.
        inline:
          type: boolean
          description: An inline part of an inbound e-mail (shown in the HTML) rather than an attachment.
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, conversation_id, kind, author, body, attachments, draft, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/MessageKind"
        direction:
          $ref: "#/components/schemas/Direction"
        author:
          $ref: "#/components/schemas/MessageAuthor"
        body:
          type: string
          description: Plain text.
        html:
          type: string
          description: Sanitized HTML, when the message has an HTML form.
        client_id:
          type: string
        event:
          $ref: "#/components/schemas/MessageEvent"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        delivery:
          $ref: "#/components/schemas/MessageDelivery"
        email:
          $ref: "#/components/schemas/MessageEmail"
        draft:
          type: boolean
          description: |
            An outgoing message that is not delivered until it is sent
            (`POST /v1/messages/{id}/send`). Drafts are shown only on `/v1`: never to contacts,
            never e-mailed, notified, counted as unread, previewed or found by search.
        sent_by:
          $ref: "#/components/schemas/MessageAuthor"
          description: Who sent a draft (`member` or `bot`); absent for messages that were never drafts.
        mentions:
          type: array
          description: "Members a note mentions (notes only; absent when it mentions nobody)."
          items:
            type: string
            format: uuid
        imported_at:
          type: string
          format: date-time
          description: |
            When the message was moved into Yuva from another mailbox; `created_at` keeps its
            original time. Absent for messages written or received in Yuva.
        imported_author:
          $ref: "#/components/schemas/ImportedAuthor"
          description: An imported outgoing message whose sender is not mapped to a member; absent otherwise.
        created_at:
          type: string
          format: date-time
          description: For a sent draft, when it was sent.
    MessageDelivery:
      type: object
      description: Delivery of an outgoing message by e-mail.
      required: [channel, state, updated_at]
      properties:
        channel:
          type: string
          enum: [email]
        state:
          type: string
          enum: [queued, sent, failed]
        error:
          type: string
          description: Why it failed (`failed` only).
        updated_at:
          type: string
          format: date-time
    MessageEmail:
      type: object
      description: |
        Set on messages that came or went by e-mail. `body` and `html` of the message show the new
        text only; `quoted` tells whether quoted history or a signature was hidden, which
        `GET /v1/messages/{id}/email` returns in full.
      required: [message_id, from, to, quoted, raw, auto, dmarc, has_remote_images, unverified_sender]
      properties:
        message_id:
          type: string
          description: The `Message-ID` header without angle brackets.
        from:
          $ref: "#/components/schemas/Email"
        to:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        cc:
          type: array
          description: The `Cc` of an inbound mail, as received. Replies go to the contact only and copy no one.
          items:
            $ref: "#/components/schemas/Email"
        subject:
          type: string
        quoted:
          type: boolean
        raw:
          type: boolean
          description: The original is kept; download it from `/v1/messages/{id}/raw`.
        auto:
          type: boolean
          description: Automatic mail (auto-reply, list, bulk) or our own automatic message.
        dmarc:
          type: string
          description: |
            The DMARC result from the topmost `Authentication-Results`, only when its authserv-id is
            the server's `YUVA_INGRESS_AUTHSERV_ID`; `unknown` otherwise.
          enum: [pass, fail, none, unknown]
        unverified_sender:
          type: boolean
          description: |
            An inbound mail whose `from` is not one of the contact's addresses: a reply from the
            address a widget visitor typed and has not confirmed. It joined the visitor's
            conversation without linking the address; once the address is confirmed this is false.
        has_remote_images:
          type: boolean
          description: |
            The message's `html` loads images from other servers. They are kept as received; show
            them only when the member asks, since loading them tells the sender the mail was read.
    MessageEmailDetail:
      type: object
      required: [message_id, full_text, headers, has_remote_images]
      properties:
        message_id:
          type: string
        full_text:
          type: string
          description: The whole text part, quoted history and signature included.
        full_html:
          type: string
          description: The whole HTML part, sanitized.
        original_html:
          type: string
          description: |
            The whole HTML part of the kept original, built on request and sanitized with a policy
            that keeps inline styles limited to an allowlist of CSS properties (no `url(`,
            `expression` or `@import` values) and the colour, alignment and size attributes of
            tables and `font`; never `<style>` blocks, scripts, forms, frames, stylesheets or event
            handlers. `cid:` sources are kept as in `full_html`. Absent when the original is not
            kept, has no HTML part or is too large.
        has_remote_images:
          type: boolean
          description: "`full_html` or `original_html` loads images from other servers; block them until the member asks."
        in_reply_to:
          type: string
        references:
          type: array
          items:
            type: string
        authentication_results:
          type: string
          description: The receiving server's `Authentication-Results` header, as received.
        headers:
          type: object
          description: Selected headers as received (Date, Reply-To, Auto-Submitted, Precedence, ...).
          additionalProperties:
            type: string
    MessageCreate:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [message, note]
        direction:
          $ref: "#/components/schemas/Direction"
        body:
          type: string
          maxLength: 65536
          description: Required unless files are attached.
        html:
          type: string
          maxLength: 262144
          description: Sanitized before it is stored.
        client_id:
          type: string
          minLength: 1
          maxLength: 200
          description: Makes the request idempotent within the conversation.
        draft:
          type: boolean
          description: Stores an outgoing message as a draft instead of delivering it.
        mentions:
          type: array
          maxItems: 50
          uniqueItems: true
          description: |
            Notes only: members to notify about the note. Each must be a member of the workspace
            who can see the conversation's inbox (`400 validation_failed` otherwise). They get the
            `mentioned` notification (realtime as `message.created`, Web Push and e-mail per their
            notification settings); the author is never notified. The panel shows mentions in the
            body as it likes; the server does not parse `@` in the text.
          items:
            type: string
            format: uuid
    MessageCreateMultipart:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [message, note]
        direction:
          $ref: "#/components/schemas/Direction"
        body:
          type: string
          maxLength: 65536
        html:
          type: string
          maxLength: 262144
        client_id:
          type: string
          minLength: 1
          maxLength: 200
        draft:
          type: boolean
        mentions:
          type: array
          maxItems: 50
          description: Notes only; repeat the field once per member id.
          items:
            type: string
            format: uuid
        files:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary
    MessageUpdate:
      type: object
      description: Only the fields sent change.
      properties:
        body:
          type: string
          maxLength: 65536
        html:
          type: [string, "null"]
          maxLength: 262144
          description: Sanitized before it is stored; `null` removes it.
    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: string
          description: Absent on the last page.
    Label:
      type: object
      required: [id, name, color, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        created_at:
          type: string
          format: date-time
    LabelCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Defaults to `#6b7280`.
    LabelUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    LabelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Label"
    CannedReply:
      type: object
      required: [id, shortcut, title, body, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        shortcut:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CannedReplyCreate:
      type: object
      required: [shortcut, title, body]
      properties:
        shortcut:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 65536
    CannedReplyUpdate:
      type: object
      minProperties: 1
      properties:
        shortcut:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 65536
    CannedReplyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CannedReply"
    UsageMonth:
      type: object
      required: [month, conversations, messages, attachment_bytes, broadcast_recipients, imported_conversations, imported_messages, imported_bytes, analytics_events]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          examples: ["2026-10"]
        conversations:
          type: integer
          format: int64
        messages:
          type: integer
          format: int64
        attachment_bytes:
          type: integer
          format: int64
        broadcast_recipients:
          type: integer
          format: int64
          description: Broadcast mails accepted by the SMTP server.
        imported_conversations:
          type: integer
          format: int64
          description: Conversations moved into Yuva from another mailbox; not in `conversations`.
        imported_messages:
          type: integer
          format: int64
          description: Messages moved into Yuva; not in `messages`.
        imported_bytes:
          type: integer
          format: int64
          description: Bytes read from mailboxes moved into Yuva.
        analytics_events:
          type: integer
          format: int64
          description: Analytics events stored.
    UsageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsageMonth"
    MigrationSource:
      type: string
      description: |
        Where the history comes from: `imap`, a mailbox read over IMAP; `file`, export files;
        `zendesk` and `helpscout`, help desks. A server offers the sources its operator allows
        (`YUVA_MIGRATION_SOURCES`) among those built: all four.
      enum: [imap, file, zendesk, helpscout]
      x-enum-varnames: [MigrationSourceImap, MigrationSourceFile, MigrationSourceZendesk, MigrationSourceHelpscout]
    MigrationPresetId:
      type: string
      description: |
        The provider of an `imap` mailbox: `gmail`, `google_workspace`, `microsoft` (Outlook.com
        and Microsoft 365, through "Sign in with Microsoft"), `yandex`, `icloud`, `zoho`, `yahoo`,
        `fastmail`, `gmx`, or `imap` for any other server. For a `file` migration: `takeout`, a
        Google Takeout file, or `file`, any other export file; both read every format the server
        knows, which `upload.format` names once the upload is complete. A help desk has the preset
        of its source: `zendesk` or `helpscout`.
      enum: [gmail, google_workspace, microsoft, yandex, icloud, zoho, yahoo, fastmail, gmx, imap, takeout, file, zendesk, helpscout]
      x-enum-varnames: [PresetGmail, PresetGoogleWorkspace, PresetMicrosoft, PresetYandex, PresetIcloud, PresetZoho, PresetYahoo, PresetFastmail, PresetGmx, PresetImap, PresetTakeout, PresetFile, PresetZendesk, PresetHelpscout]
    MigrationState:
      type: string
      description: |
        - `draft`: created; not connected yet.
        - `connected`: the connection test passed; choose what to read.
        - `scanning`: reading message headers for the dry run.
        - `ready`: the dry run is ready; nothing is imported yet.
        - `copying`: importing history, newest threads first.
        - `paused`: stopped by a member; resumes where it was.
        - `needs_attention`: stopped by a problem with the source (`state_reason`), such as a
          revoked app password; reconnect to continue.
        - `syncing`: history copied; new mail in the old mailbox, or what changed in the help
          desk, is fetched every two minutes while the team switches its mail over.
        - `completed`: finished; the credentials, or the export file, are deleted. A `file`
          migration completes when its copy ends.
        - `cancelled`: stopped for good; what was imported stays and the credentials are deleted.
        - `removing`, `removed`: imported history is being, or was, removed.
      enum: [draft, connected, scanning, ready, copying, paused, needs_attention, syncing, completed, cancelled, removing, removed]
      x-enum-varnames: [MigrationDraft, MigrationConnected, MigrationScanning, MigrationReady, MigrationCopying, MigrationPaused, MigrationNeedsAttention, MigrationSyncing, MigrationCompleted, MigrationCancelled, MigrationRemoving, MigrationRemoved]
    MigrationAction:
      type: string
      description: |
        What can be done with a migration in its current state: `update` (`PATCH`),
        `set_credentials`, `test_connection`, `scan`, `start`, `pause`, `resume`, `cancel`, `finish`,
        `retry` (failed items), `remove_history`, `delete`, `probe` (a test mail to check the
        switch), `upload` (parts of the export file, and completing it) and `sign_in` (a help
        desk's sign-in with the team's OAuth client, or Sign in with Microsoft). A server lists
        only the actions it offers.
      enum: [update, set_credentials, test_connection, scan, start, pause, resume, cancel, finish, retry, remove_history, delete, probe, upload, sign_in]
      x-enum-varnames: [MigrationActionUpdate, MigrationActionSetCredentials, MigrationActionTestConnection, MigrationActionScan, MigrationActionStart, MigrationActionPause, MigrationActionResume, MigrationActionCancel, MigrationActionFinish, MigrationActionRetry, MigrationActionRemoveHistory, MigrationActionDelete, MigrationActionProbe, MigrationActionUpload, MigrationActionSignIn]
    MigrationTls:
      type: string
      description: "`tls`: TLS from the start (port 993). `starttls`: plain connection upgraded with `STARTTLS` (port 143)."
      enum: [tls, starttls]
      x-enum-varnames: [ImapTls, ImapStarttls]
    MigrationServer:
      type: object
      required: [host, port, tls]
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        tls:
          $ref: "#/components/schemas/MigrationTls"
    MigrationAuth:
      type: string
      description: |
        `password`: a user name with an app password or password. `microsoft`: Sign in with
        Microsoft (`POST /v1/migrations/{migrationId}/sign-in`), whose token is sent with
        `AUTHENTICATE XOAUTH2`. `oauth`: a help desk's sign-in with an OAuth client the team
        creates in its own account (`POST /v1/migrations/{migrationId}/sign-in`).
      enum: [password, microsoft, oauth]
      x-enum-varnames: [MigrationAuthPassword, MigrationAuthMicrosoft, MigrationAuthOauth]
    MigrationCredentials:
      type: object
      description: |
        The stored credentials, without the secret. A help desk's are `oauth`, with the account's
        API host as `server` (`<subdomain>.zendesk.com`, `api.helpscout.net`). A Microsoft
        sign-in's are `oauth` too, with `outlook.office365.com:993` as `server`, the granted
        `scopes` and when the access token expires; the token is refreshed before a connection
        when it expires within five minutes.
      required: [kind, server, updated_at]
      properties:
        kind:
          type: string
          enum: [password, oauth]
          x-enum-varnames: [CredentialsPassword, CredentialsOauth]
        server:
          $ref: "#/components/schemas/MigrationServer"
        certificate_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The trusted certificate's SHA-256, when one is pinned.
        scopes:
          type: array
          description: "`oauth` only: the scopes granted."
          items:
            type: string
        expires_at:
          type: string
          format: date-time
          description: "`oauth` only: when the access token expires."
        updated_at:
          type: string
          format: date-time
    MigrationCredentialsInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 320
          description: Usually the mailbox address; iCloud takes the part before `@`.
        password:
          type: string
          minLength: 1
          maxLength: 1000
          writeOnly: true
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        tls:
          $ref: "#/components/schemas/MigrationTls"
        certificate_sha256:
          type: string
          pattern: "^[0-9a-fA-F:]{64,95}$"
          description: Trust this certificate (SHA-256, hexadecimal, colons allowed) even if it is not valid for the host.
    MigrationSignInStart:
      type: object
      description: |
        Help desks need `client_id` and `client_secret`. Microsoft needs them when the preset has
        `team_client: true`; otherwise they are left out to use the server's own app, or given to
        use the team's own app registration instead.
      properties:
        subdomain:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
          description: "Zendesk only, and required there: the account's subdomain, `acme` of `acme.zendesk.com`."
        client_id:
          type: string
          minLength: 1
          maxLength: 200
          x-go-type-skip-optional-pointer: true
          description: |
            The OAuth client's identifier (Zendesk), the app's ID (Help Scout) or the app
            registration's Application (client) ID (Microsoft).
        client_secret:
          type: string
          minLength: 1
          maxLength: 500
          writeOnly: true
        tenant:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$"
          description: |
            Microsoft, with the team's own app registration only: the Directory (tenant) ID or a
            verified domain of the tenant that holds a single-tenant app. Without it the authority
            follows the mailbox's address.
    MigrationSignIn:
      type: object
      required: [authorize_url, redirect_url, expires_at]
      properties:
        authorize_url:
          type: string
          format: uri
          description: The help desk's consent page; open it in the browser.
        redirect_url:
          type: string
          format: uri
          description: Where the help desk sends the browser back; it must be the OAuth client's redirect URL.
        expires_at:
          type: string
          format: date-time
          description: The sign-in must come back before this.
    MigrationSignInResult:
      type: string
      description: |
        The `result` of the redirect to `/migrations/{migrationId}/connect` after a sign-in:
        `connected`; `access_denied` (the person declined); `expired` (unknown, used or older
        than 10 minutes); `session_mismatch` (it came back in another member's browser);
        `scope_too_broad` (the token grants other permissions than the requested ones: more than
        `read` for Zendesk, anything but `IMAP.AccessAsUser.All` for Microsoft; nothing was
        stored); `not_admin`, `plan_has_no_api`, `subdomain_not_found` (as the connection test's
        codes); `account_mismatch` (a help desk's reconnect signed in to another account, or a
        Microsoft sign-in by an account whose token Exchange did not let open the mailbox;
        nothing was stored);
        `token_failed` (the provider refused the code: usually a wrong client secret or redirect
        URL); `source_unreachable`.

        Microsoft only: `consent_required` (Microsoft wants the person to consent again: sign in
        again and accept); `admin_consent_required` (`AADSTS65001`, `AADSTS90094`, `AADSTS90095`:
        the organization lets only an admin consent to the app; the migration's
        `admin_consent_url` is the link to send the admin); `conditional_access` (a Conditional
        Access policy of the organization blocked the sign-in, `AADSTS53000`–`AADSTS53011`);
        `xoauth2_failed` (Microsoft signed the mailbox in but the mailbox refused the token over
        IMAP: usually IMAP is turned off for it, which an admin turns on in the Microsoft 365
        admin center › Users › Mail › Email apps, or with `Set-CASMailbox -ImapEnabled $true`).
        `admin_consented` is where an admin lands after granting consent through
        `admin_consent_url` (`/settings/migrations?result=admin_consented`).
      enum: [connected, access_denied, expired, session_mismatch, scope_too_broad, not_admin, plan_has_no_api, subdomain_not_found, account_mismatch, token_failed, source_unreachable, consent_required, admin_consent_required, conditional_access, xoauth2_failed, admin_consented]
      x-enum-varnames: [SignInConnected, SignInAccessDenied, SignInExpired, SignInSessionMismatch, SignInScopeTooBroad, SignInNotAdmin, SignInPlanHasNoApi, SignInSubdomainNotFound, SignInAccountMismatch, SignInTokenFailed, SignInSourceUnreachable, SignInConsentRequired, SignInAdminConsentRequired, SignInConditionalAccess, SignInXoauth2Failed, SignInAdminConsented]
    MigrationFileFormat:
      type: string
      description: |
        What an export file holds: `takeout`, a Google Takeout mbox (Gmail's thread ids and
        labels in `X-GM-THRID` and `X-Gmail-Labels`); `mbox`, any other mbox; `mbox_zip`, a zip of
        uncompressed mbox files, one folder each; `eml_zip`, a zip of `.eml` files whose
        directories are folders; `maildir_zip`, a zip of a Maildir (`cur` and `new`, Maildir++
        subfolders), whose folders are folders.
      enum: [takeout, mbox, mbox_zip, eml_zip, maildir_zip]
      x-enum-varnames: [FileTakeout, FileMbox, FileMboxZip, FileEmlZip, FileMaildirZip]
    MigrationMboxFormat:
      type: string
      description: |
        How an mbox escapes lines that start with `From `: `mboxrd` (Google Takeout, most
        programs) takes one `>` off every `>…>From ` line; `mboxo` only off `>From `. The two read
        alike except for lines of `>>From ` and more.
      enum: [mboxrd, mboxo]
      x-enum-varnames: [Mboxrd, Mboxo]
    MigrationFile:
      type: object
      description: A `file` migration's export file.
      required: [size_bytes, parts, part_size]
      properties:
        filename:
          type: string
          maxLength: 255
        size_bytes:
          type: integer
          format: int64
          description: Bytes uploaded so far; the file's size once complete.
        parts:
          type: integer
          format: int32
          description: Parts stored.
        part_size:
          type: integer
          format: int64
          description: The size of every part but the last, 8 MiB.
        format:
          $ref: "#/components/schemas/MigrationFileFormat"
          description: Once the upload is complete.
        mbox_format:
          $ref: "#/components/schemas/MigrationMboxFormat"
          description: For the mbox formats.
        completed_at:
          type: string
          format: date-time
          description: When the upload was completed and the file accepted.
        deleted_at:
          type: string
          format: date-time
          description: When the parts were deleted because the migration ended.
    MigrationUploadPart:
      type: object
      required: [part, size_bytes, sha256]
      properties:
        part:
          type: integer
          format: int32
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
    MigrationUpload:
      type: object
      required: [part_size, max_bytes, parts, received_bytes]
      properties:
        part_size:
          type: integer
          format: int64
          description: The size of every part but the last, 8 MiB.
        max_bytes:
          type: integer
          format: int64
          description: The largest file the server takes (`YUVA_MIGRATION_UPLOAD_MAX_BYTES`).
        parts:
          type: array
          description: The parts the server has, by number.
          items:
            $ref: "#/components/schemas/MigrationUploadPart"
        received_bytes:
          type: integer
          format: int64
        completed_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          description: The parts were deleted when the migration ended; nothing more can be uploaded.
    MigrationUploadPartInput:
      type: object
      required: [file, sha256]
      properties:
        file:
          type: string
          format: binary
          description: At most 8 MiB.
        sha256:
          type: string
          description: The part's SHA-256, hexadecimal.
          pattern: "^[0-9a-fA-F]{64}$"
    MigrationUploadComplete:
      type: object
      required: [parts, size_bytes]
      properties:
        parts:
          type: integer
          format: int32
          minimum: 1
          description: How many parts the file has.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        filename:
          type: string
          maxLength: 255
          description: The file's name, as the person chose it; shown back only.
        mbox_format:
          $ref: "#/components/schemas/MigrationMboxFormat"
          description: "`mboxrd` when absent."
    MigrationFileRefusal:
      type: string
      description: |
        Why an export file was refused: `unknown_format` (not an mbox or a zip), `empty` (no
        message in it), `corrupt` (a zip that cannot be read), `path_traversal` (an entry with
        `..` or an absolute path), `symlink` (an entry that is a symbolic link),
        `too_many_entries` (over 1,000,000), `zip_bomb` (an entry compressed more than 100:1),
        `entry_too_large` (an entry larger than `YUVA_MIGRATION_UPLOAD_MAX_BYTES` unpacked),
        `encrypted` (an entry with a password), `unsupported_compression` (neither stored nor
        deflated) or `compressed_mbox` (an mbox in a zip must be stored uncompressed: unzip the
        archive and upload the mbox file itself).
      enum: [unknown_format, empty, corrupt, path_traversal, symlink, too_many_entries, zip_bomb, entry_too_large, encrypted, unsupported_compression, compressed_mbox]
      x-enum-varnames: [RefusedUnknownFormat, RefusedEmpty, RefusedCorrupt, RefusedPathTraversal, RefusedSymlink, RefusedTooManyEntries, RefusedZipBomb, RefusedEntryTooLarge, RefusedEncrypted, RefusedUnsupportedCompression, RefusedCompressedMbox]
    MigrationFileProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            reason:
              $ref: "#/components/schemas/MigrationFileRefusal"
              description: "`file_refused` only."
            entry:
              type: string
              description: "`file_refused` only: the zip entry it is about, when one is."
            missing_parts:
              type: array
              description: "`upload_incomplete` only: the first parts that are missing, at most 100."
              items:
                type: integer
                format: int32
    MigrationCounts:
      type: object
      required: [total, imported, duplicate, skipped, failed, bytes]
      properties:
        total:
          type: integer
          format: int64
          description: |
            Messages read from the chosen folders: those to import and those the dry run already set
            aside as duplicates or skipped. Each ends as imported, duplicate, skipped or failed. A
            help desk counts conversations (tickets) instead: each is imported whole, with all its
            messages and notes.
        imported:
          type: integer
          format: int64
        duplicate:
          type: integer
          format: int64
          description: Already in Yuva, or a second copy of the same message.
        skipped:
          type: integer
          format: int64
          description: |
            Not imported: automatic or internal mail, outside the date range, from a blocked contact,
            too large, or gone from the mailbox.
        failed:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
          description: Bytes read from the source.
    MigrationPerson:
      type: object
      description: |
        A team address and the member its mail is imported as; without `member_id`, its own name
        and address are kept. For a help desk, an agent's address: the agent's replies, notes and
        assigned conversations become the member's.
      required: [address]
      properties:
        address:
          $ref: "#/components/schemas/Email"
        member_id:
          type: string
          format: uuid
    MigrationLabelMapping:
      type: object
      description: |
        What a folder, Gmail label or help-desk tag becomes: `create` a label of the same name, an

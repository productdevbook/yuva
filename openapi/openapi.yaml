          x-enum-varnames: [VerifiedForwarding, VerifiedDirect]
        quiet_until:
          type: string
          format: date-time
          description: |
            Once delivery is verified: when the quiet period ends, the time after which sync has
            found no mail that did not also reach Yuva directly for `quiet_period_hours`. Sync
            finishes the migration then; mail found only by sync moves it later.

  /v1/inboxes/{inboxId}/channels:
    get:
      operationId: listChannels
      summary: List an inbox's channels
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      responses:
        "200":
          description: The channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createChannel
      summary: Add a channel
      description: |
        Owners and admins only, with a member session. An `email` channel needs `email` (its
        address and outbound SMTP account); a `chat` channel needs `chat` (at least one allowed
        origin) and gets a generated public key; an `app` channel takes `app` (optional, defaults
        apply) and gets a generated public key; `settings` are stored as given.
        An address belongs to one channel of the whole server, because inbound mail picks its
        channel by the recipient alone; a taken address answers `409 email_address_taken`.
      tags: [channels]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelCreate"
      responses:
        "201":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/channels/{channelId}:

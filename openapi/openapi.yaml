              $ref: "#/components/schemas/DiscussionAnswer"
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: clearDiscussionAnswer
      summary: Clear the accepted answer
      description: Member sessions only.
      tags: [discussions]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/DiscussionId"
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/discussion-posts:
    get:
      operationId: listDiscussionPosts
      summary: Posts by state (the moderation queue)
      description: |
        Posts in the inboxes the caller can see, oldest first, each with its thread. With
        `state=pending` (the default) this is the moderation queue: opening posts of threads waiting
        for approval (`opening: true`) and replies waiting for approval.

        Scope: `conversations:read`.
      tags: [discussions]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/DiscussionState"
        - name: inbox_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/DocsSiteFilter"
        - name: page
          in: query
          description: Only this page's posts (a URL; query and fragment are ignored).
          schema:
            type: string
            maxLength: 2000
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscussionPostPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/discussion-posts/{postId}:
    patch:
      operationId: updateDiscussionPost
      summary: Approve, hide, or edit a member's own post
      description: |
        `state: published` approves a pending post or shows a hidden one; `state: hidden` hides it
        from the public (its author no longer sees it either). On the opening post this approves or
        hides the whole thread. Approving a reply notifies the thread's followers.

        `body` (and `title` on the opening post) edits a post the calling member wrote; other
        posts answer `403 forbidden`. Member sessions only.
      tags: [discussions]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/DiscussionPostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscussionPostUpdate"
      responses:
        "200":
          description: The post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscussionPost"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDiscussionPost
      summary: Delete a member's own post
      description: |
        As `DELETE /client/v1/discussion-posts/{postId}`, for a post the calling member wrote
        (`403 forbidden` otherwise; hide other posts instead). Member sessions only.
      tags: [discussions]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/DiscussionPostId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/discussion-posts/{postId}/spam:

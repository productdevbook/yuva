        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/discussions/{discussionId}/posts:
    post:
      operationId: createDiscussionPost
      summary: Reply as a member
      description: |
        A reply to the thread (`parent_post_id` absent) or to one of its replies, published at once,
        also in locked threads. Replies are one level deep: a reply to a reply answers
        `400 validation_failed`. Followers are notified. Member sessions only.
      tags: [discussions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/DiscussionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscussionPostCreate"
      responses:
        "201":
          description: The reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscussionPost"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

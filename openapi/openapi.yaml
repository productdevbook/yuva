        mailbox's, else its oldest), so replies from Yuva reach the customer; an inbox without an
        e-mail channel keeps them as history without a channel.
      required: [folder, inbox_id]
      properties:
        folder:
          type: string
          minLength: 1
          maxLength: 1000
        inbox_id:
          type: string
          format: uuid
    MigrationOptions:
      type: object

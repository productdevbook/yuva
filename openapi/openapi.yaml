          type: string
          format: uuid
        external_id:
          type: string
          minLength: 1
          maxLength: 200
          description: The host app's user id.
    Attributes:
      type: object
      additionalProperties: true
      description: Free-form data about the contact (plan, app version, …), at most 16 KiB.
    Contact:
      type: object
      required: [id, name, emails, external_ids, attributes, blocked, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emails:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        external_ids:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        attributes:
          $ref: "#/components/schemas/Attributes"
        blocked:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        emails:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Email"
        external_ids:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExternalId"
        attributes:
          $ref: "#/components/schemas/Attributes"
        blocked:
          type: boolean
    ContactUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 200
        emails:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Email"
        external_ids:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExternalId"
        attributes:
          $ref: "#/components/schemas/Attributes"
        blocked:
          type: boolean
    ContactPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        next_cursor:
          type: string
          description: Absent on the last page.
    ConversationStatus:
      type: string
      enum: [open, pending, snoozed, closed]
    Priority:
      type: string
      enum: [low, normal, high, urgent]
    Conversation:
      type: object
      required: [id, inbox_id, contact_id, subject, status, priority, labels, last_activity_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
          description: The channel it started on; absent when unknown or removed.
        subject:
          type: string
        status:
          $ref: "#/components/schemas/ConversationStatus"
        snooze_until:
          type: string
          format: date-time
        priority:
          $ref: "#/components/schemas/Priority"
        assignee_id:
          type: string
          format: uuid
          description: The assigned member; absent when unassigned.
        labels:
          type: array
          description: Label ids.
          items:
            type: string
            format: uuid
        last_message_at:
          type: string
          format: date-time
          description: The last `message` to or from the contact.
        last_activity_at:
          type: string
          format: date-time
          description: The last message or note, or the creation time.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationCreate:
      type: object
      required: [inbox_id, contact_id]
      properties:
        inbox_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
          description: A channel of the same inbox.
        subject:
          type: string
          maxLength: 500
        priority:
          $ref: "#/components/schemas/Priority"
        assignee_id:
          type: string
          format: uuid
          description: A member with access to the inbox.
        labels:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    ConversationUpdate:
      type: object
      minProperties: 1
      properties:
        subject:
          type: string
          maxLength: 500
        status:
          $ref: "#/components/schemas/ConversationStatus"
        snooze_until:
          type: string
          format: date-time
        priority:
          $ref: "#/components/schemas/Priority"
        assignee_id:
          type: [string, "null"]
          format: uuid
          description: A member with access to the inbox; `null` unassigns.
        labels:
          type: array
          maxItems: 50
          description: Replaces the labels.
          items:
            type: string
            format: uuid
    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        next_cursor:
          type: string
          description: Absent on the last page.
    MessageKind:
      type: string
      description: |
        `message` goes to or comes from the contact, `note` is for members only, `event` records a
        change (assignment, status, labels).
      enum: [message, note, event]
    Direction:
      type: string
      enum: [in, out]
    AuthorType:
      type: string
      enum: [contact, member, system]
    MessageAuthor:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/AuthorType"
        member_id:
          type: string
          format: uuid
          description: Set for `member`; absent when that member was removed.
        contact_id:
          type: string
          format: uuid
          description: Set for `contact`.
    EventType:
      type: string
      enum: [assigned, unassigned, status_changed, labels_changed]
    MessageEvent:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/EventType"
        assignee_id:
          type: string
          format: uuid
          description: The new assignee (`assigned`).
        previous_assignee_id:
          type: string
          format: uuid
          description: The previous assignee (`assigned`, `unassigned`).
        status:
          $ref: "#/components/schemas/ConversationStatus"
        previous_status:
          $ref: "#/components/schemas/ConversationStatus"
        added_labels:
          type: array
          items:
            type: string
            format: uuid
        removed_labels:
          type: array
          items:
            type: string
            format: uuid
    Attachment:
      type: object
      required: [id, filename, content_type, size, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Download it from `/v1/attachments/{id}`.
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, conversation_id, kind, author, body, attachments, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/MessageKind"
        direction:
          $ref: "#/components/schemas/Direction"
        author:
          $ref: "#/components/schemas/MessageAuthor"
        body:
          type: string
          description: Plain text.
        html:
          type: string
          description: Sanitized HTML, when the message has an HTML form.
        client_id:
          type: string
        event:
          $ref: "#/components/schemas/MessageEvent"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        created_at:
          type: string
          format: date-time
    MessageCreate:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [message, note]
        direction:
          $ref: "#/components/schemas/Direction"
        body:
          type: string
          maxLength: 65536
          description: Required unless files are attached.
        html:
          type: string
          maxLength: 262144
          description: Sanitized before it is stored.
        client_id:
          type: string
          minLength: 1
          maxLength: 200
          description: Makes the request idempotent within the conversation.
    MessageCreateMultipart:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [message, note]
        direction:
          $ref: "#/components/schemas/Direction"
        body:
          type: string
          maxLength: 65536
        html:
          type: string
          maxLength: 262144
        client_id:
          type: string
          minLength: 1
          maxLength: 200
        files:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary
    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: string
          description: Absent on the last page.
    Label:

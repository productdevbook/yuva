    AnalyticsAlertKind:
      type: string
      description: |
        Fixed rules, checked every hour over the property's finished hours and days:
        `spike` and `drop`, page views of the last two finished hours at least three times, or at
        most half, the same two hours' average over the seven days before (at least 20 views
        a day in those hours); `goal_drop`, a goal's conversions yesterday at most half its
        average of the seven days before (at least 10 a day); `support_load`, yesterday's
        conversations per 1,000 page views at least twice the rate of the 28 days before, with at
        least 5 conversations (a property linked to an inbox); `new_referrer`, a referring site with
        at least 10 visits yesterday and none in the 28 days before. Each kind fires once per
        property and day (`new_referrer` once per site).
      enum: [spike, drop, goal_drop, support_load, new_referrer]
      x-enum-varnames: [AnalyticsAlertSpike, AnalyticsAlertDrop, AnalyticsAlertGoalDrop, AnalyticsAlertSupportLoad, AnalyticsAlertNewReferrer]
    AnalyticsReportFrequency:
      type: string
      enum: [none, weekly, monthly]
      x-enum-varnames: [AnalyticsReportNone, AnalyticsReportWeekly, AnalyticsReportMonthly]
    AnalyticsSubscription:
      type: object
      required: [property_id, report, alerts]
      properties:
        property_id:
          type: string
          format: uuid
        report:
          $ref: "#/components/schemas/AnalyticsReportFrequency"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsAlertKind"
        last_report_at:
          type: string
          format: date-time
          description: When the last scheduled report went out.
        updated_at:
          type: string
          format: date-time
          description: Absent until the member chose.
    AnalyticsSubscriptionUpdate:
      type: object
      minProperties: 1
      properties:
        report:
          $ref: "#/components/schemas/AnalyticsReportFrequency"
        alerts:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AnalyticsAlertKind"
    AnalyticsAlert:
      type: object
      required: [id, property_id, kind, day, metric, current, baseline, text, created_at]
      properties:
        id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AnalyticsAlertKind"
        day:
          type: string
          format: date
          description: The property's day the alert is about.
        hours_from:
          type: string
          format: date-time
          description: "`spike` and `drop`: the start of the two hours."
        hours_to:
          type: string
          format: date-time
        metric:
          type: string
          description: "`pageviews`, `conversions`, `support_rate` or `visits`."
        current:
          type: number
          format: double
        baseline:
          type: number
          format: double
          description: What the rule compared `current` with; 0 for a new referrer.
        goal_id:
          type: string
          format: uuid
        goal_name:
          type: string
        referrer:
          type: string
          description: "`new_referrer`: the site's host."
        text:
          type: string
          description: What was found, in English, as on the annotation.
        annotation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    AnalyticsAlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsAlert"
    AnalyticsAlertEventData:

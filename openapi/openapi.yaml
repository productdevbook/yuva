        reason:
          type: string
          description: Shown to the sender of the mail.
        code:
          type: string
          enum: [bad_signature, stale_timestamp, unknown_recipient, blocked_sender, too_large, malformed, rate_limited, not_configured, unavailable]
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    OAuthResource:
      type: string
      description: "`mcp` for a `<public URL>/mcp` token, `api` for a `<public URL>` token (`/v1`, `/v1/realtime` and `/mcp`)."
      enum: [mcp, api]
    OAuthClient:
      type: object

        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateChannel
      summary: Update a channel
      description: |
        Owners and admins only, with a member session. `email` replaces the e-mail settings as a
        whole, except that an absent `smtp.password` keeps the stored one; `chat` and `app` replace
        those settings as a whole, except the public key.
      tags: [channels]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: The updated channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteChannel
      summary: Remove a channel
      description: |
        Owners and admins only, with a member session. Conversations that started on it keep
        their messages and lose their `channel_id`.

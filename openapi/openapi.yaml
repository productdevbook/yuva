    SourcePage:
      type: object
      description: The documentation page a conversation was sent from.
      required: [page_url]
      properties:
        page_url:
          type: string
          description: Without query and fragment.
        page_title:
          type: string
    DiscussionMode:
      type: string
      description: |
        Discussions on the channel's documentation pages. `off`: none. `moderated` (default): a
        reader's posts wait for a member until one of theirs in the workspace was approved;
        identity-token users and members are published at once. `open`: everyone is published at
        once. Authors whose posts were marked spam always wait.
      enum: [off, moderated, open]
    DiscussionState:
      type: string
      description: |
        `published`: public. `pending`: waits for a member; only its author and members see it.
        `hidden`: a member hid it; only members see it.
      enum: [published, pending, hidden]
    DiscussionSort:
      type: string
      enum: [new, top, unanswered]
      default: new
    DiscussionTeamSort:
      type: string
      enum: [activity, new, top]
      default: activity
    DiscussionAuthorKind:
      type: string
      description: |
        `member`: someone of the team. `reader`: a signed-in reader or a user of the host app.
        `anonymous`: no author to show (threads moved over from published answers).
      enum: [member, reader, anonymous]
    DiscussionAuthor:
      type: object
      description: |
        Who wrote a post, shown by name and initials only. `deleted` is true once the member left or
        the reader deleted their account; `name` is then absent. `member_id` and `contact_id` are
        given on `/v1` only.
      required: [kind, initials, deleted]
      properties:
        kind:
          $ref: "#/components/schemas/DiscussionAuthorKind"
        name:
          type: string
          description: Absent when the author has no name (show "Reader") or is deleted.
        initials:
          type: string
          description: One or two letters for an avatar; empty when there is no name.
        deleted:
          type: boolean
        member_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
    Discussion:
      type: object
      description: |
        A thread on a documentation page. Its opening post (`opening_post_id`) carries the body,
        votes and author; vote, edit and moderate the thread through it. `inbox_id`, `channel_id`,
        `pending_posts`, `hidden_posts` and `conversation_id` are given on `/v1` only; `mine`,
        `voted` and `following` on `/client/v1` only (false without a token).
      required: [id, page, title, opening_post_id, body, body_html, author, state, locked, votes, reply_count, created_at, last_activity_at]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
          description: The chat channel whose setting applied when it was started.
        page:
          type: string
          description: The page's URL without query and fragment.
        page_title:
          type: string
        title:
          type: string
        opening_post_id:
          type: string
          format: uuid
        body:
          type: string
          description: Markdown as written; empty once the opening post was deleted.
        body_html:
          type: string
          description: "`body` rendered to HTML on the server and sanitized (no scripts, styles or raw HTML; links get `rel=\"nofollow noreferrer\"`, and links to other sites also `target=\"_blank\"` with `noopener`)."
        author:
          $ref: "#/components/schemas/DiscussionAuthor"
        state:
          $ref: "#/components/schemas/DiscussionState"
        answer_post_id:
          type: string
          format: uuid
          description: The accepted answer; absent while there is none.
        answered_at:
          type: string
          format: date-time
        locked:
          type: boolean
        votes:
          type: integer
          format: int32
        reply_count:
          type: integer
          format: int32
          description: Published replies, replies to replies included.
        pending_posts:
          type: integer
          format: int32
          description: Posts waiting for a member, the opening post included.
        hidden_posts:
          type: integer
          format: int32
        conversation_id:
          type: string
          format: uuid
          description: The conversation it was started from; absent once that is deleted.
        deleted:
          type: boolean
          description: The opening post was deleted by its author; the replies stay.
        mine:
          type: boolean
          description: The caller started it.
        voted:
          type: boolean
        following:
          type: boolean
        created_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
    DiscussionPost:
      type: object
      description: |
        One post of a thread: the opening post (`opening`), a reply to the thread, or a reply to a
        reply (`parent_post_id`). `mine` and `voted` are given on `/client/v1` only.
      required: [id, discussion_id, opening, body, body_html, author, state, votes, accepted, deleted, created_at]
      properties:
        id:
          type: string
          format: uuid
        discussion_id:
          type: string
          format: uuid
        parent_post_id:
          type: string
          format: uuid
        opening:
          type: boolean
        body:
          type: string
          description: Markdown as written; empty when `deleted`.
        body_html:
          type: string
          description: "`body` rendered to sanitized HTML."
        author:
          $ref: "#/components/schemas/DiscussionAuthor"
        state:
          $ref: "#/components/schemas/DiscussionState"
        votes:
          type: integer
          format: int32
        accepted:
          type: boolean
          description: It is the thread's accepted answer.
        deleted:
          type: boolean
        mine:
          type: boolean
        voted:
          type: boolean
        created_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
    DiscussionDetail:
      type: object
      required: [discussion, posts]
      properties:
        discussion:
          $ref: "#/components/schemas/Discussion"
        posts:
          type: array
          description: The replies, the accepted answer first, then oldest first; not the opening post.
          items:
            $ref: "#/components/schemas/DiscussionPost"
    DiscussionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:

          x-enum-varnames: [MigrationLabelCreate, MigrationLabelExisting, MigrationLabelNone]
        label_id:
          type: string
          format: uuid
    MigrationInboxMapping:
      type: object
      description: |
        Help desks: the inbox a Zendesk brand's or Help Scout mailbox's conversations go to, by the

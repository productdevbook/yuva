openapi: 3.1.1
info:
  title: Yuva API
  version: 0.0.1
  summary: Customer messaging for many products in one inbox.
  license:
    name: MIT
    identifier: MIT
  description: |
    Yuva answers every user of every product you run: e-mail, live chat and in-app
    conversations in one inbox.

    ## Surfaces

    - `/v1` is for members (panel session) and workspace API keys.
    - `/client/v1` is for the web widget and the mobile SDKs.
    - `/healthz` and `/readyz` are for load balancers and orchestrators.

    ## Errors

    Errors are `application/problem+json` documents (RFC 9457) with a stable `code`.

    ## Authentication

    - Members sign in with a one-time code sent by e-mail or with a passkey. Both set the
      `yuva_session` cookie (HttpOnly, SameSite=Lax).
    - Host backends and scripts send a workspace API key as `Authorization: Bearer <key>`. A key
      acts on its own workspace only.
    - Contacts (widget, SDKs) send a contact session token as `Authorization: Bearer <token>` on
      `/client/v1`; see the `client` tag.

    ## Workspace selection

    A member session belongs to a person, who can be a member of several workspaces. Workspace
    endpoints act on the workspace named in the `Yuva-Workspace` header; when the header is absent
    and the person belongs to exactly one workspace, that workspace is used. An API key always acts
    on its own workspace; a `Yuva-Workspace` header naming another workspace is refused.
servers:
  - url: /
security:
  - session: []
  - apiKey: []
tags:
  - name: system
    description: Health, readiness and build information.
  - name: auth
    description: Sign-in with an e-mailed code or a passkey, sign-out.
  - name: me
    description: The signed-in person and their passkeys.
  - name: workspace
    description: The current workspace, its members and invites.
  - name: api-keys
    description: Workspace API keys for host backends and scripts.
  - name: inboxes
    description: Inboxes (one per product or brand) and who may see them.
  - name: channels
    description: |
      How messages reach an inbox. E-mail channels receive mail through `/ingress/email` and send
      replies through their own SMTP account. `chat` (web widget) and `app` (mobile SDKs) channels
      have a public key that starts contact sessions on `/client/v1`; `api` channels let host
      backends post feedback with an API key (`POST /v1/feedback`).
  - name: contacts
    description: The people writing in.
  - name: conversations
    description: Threads between a contact and an inbox.
  - name: messages
    description: Messages, notes, events and their attachments.
  - name: labels
    description: Workspace labels for conversations.
  - name: canned-replies
    description: Saved answers members insert into replies.
  - name: realtime
    description: Live workspace events over WebSocket.
  - name: client
    description: |
      The contact side, for the web widget and the mobile SDKs. A contact session starts at
      `POST /client/v1/session` with a `chat` or `app` channel's public key and, for signed-in
      users of the host app, an identity token; every other call sends the session token as a
      bearer token. Requests for a `chat` channel must come from a browser on one of its allowed
      origins (CORS; a request without an `Origin` header is refused). Requests for an `app`
      channel come from native apps, which send no `Origin`, and are not checked against origins;
      a browser on an origin no chat channel allows is still refused. Contacts see their own
      conversations in the session's inbox, never notes, internal events, other contacts or member
      e-mail addresses; of members only their display name and initials.
  - name: notifications
    description: |
      Notifying members of new conversations, messages and assignments: Web Push to the panel
      installed as a PWA (VAPID, RFC 8030/8291/8292) and e-mail as a fallback. A push
      subscription belongs to the browser that created it and to the session that registered it
      (it ends with sign-out); it receives notifications from every workspace of the person.
      Preferences are per member, with per-inbox overrides.

      What causes a notification (`event` in `PushNotification`, keys of `NotificationEvents`):

      - `new_live_conversation`, `new_async_conversation`: the first message of a conversation,
        from the contact, in a `live` or `async` inbox. Every member with access to the inbox is a
        candidate.
      - `message_in_my_conversation`: a later contact message in a conversation assigned to the
        member.
      - `message_in_unassigned_conversation`: a later contact message in an unassigned
        conversation; every member with access is a candidate.
      - `assigned_to_me`: someone else assigned a conversation to the member.

      Never notified: the member who caused it (their own assignment), conversations marked spam,
      a member whose open panel reports that it is showing that conversation (the `viewing` frame
      on `/v1/realtime`), and, while the member's `availability` is `away`, everything except
      `message_in_my_conversation` and `assigned_to_me`.

      Defaults by role (`defaults` in `NotificationSettings`): push for everything except, for
      agents, `new_async_conversation` and `message_in_unassigned_conversation`; e-mail only for
      `message_in_my_conversation` and `assigned_to_me`, for every role.

      E-mail fallback: when an event with `email: true` is still unread after
      `email_delay_minutes` (15 by default), one e-mail lists the conversation's unread contact
      messages and links to it; at most one e-mail per conversation and member per hour. It goes
      to the person's sign-in address in their locale.
  - name: webhooks
    description: |
      Signed HTTP callbacks to host backends per the Standard Webhooks specification
      (https://www.standardwebhooks.com): `webhook-id`, `webhook-timestamp` and
      `webhook-signature` headers, JSON payloads `{type, timestamp, workspace_id, data}`, retries
      with exponential backoff for about 24 hours, then the endpoint is disabled. `sdk/go/webhook`
      verifies them. The payloads are described under `webhooks`.
  - name: ingress
    description: |
      Inbound mail and delivery reports from mail infrastructure. These endpoints are not called
      by members or API keys; they authenticate with a signature over the request.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness
      description: Answers `200` while the process is running. It does not touch the database.
      tags: [system]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness
      description: Answers `200` when the server can reach its database, `503` otherwise.
      tags: [system]
      security: []
      responses:
        "200":
          description: The server is ready to take traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is not reachable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/version:
    get:
      operationId: getVersion
      summary: Server version
      description: The version of the running server build.
      tags: [system]
      security: []
      responses:
        "200":
          description: The build version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /v1/auth/code:
    post:
      operationId: requestSignInCode
      summary: Request a sign-in code
      description: |
        Sends a one-time code to the address when it belongs to a member or has a pending invite.
        The answer is the same either way, so it does not reveal whether an address is known.
        Codes expire after 10 minutes; only the most recent code of an address is accepted.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInCodeRequest"
      responses:
        "202":
          description: Accepted. A code is on its way if the address is known.
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /v1/auth/code/verify:
    post:
      operationId: verifySignInCode
      summary: Sign in with a code
      description: |
        Exchanges a valid code for a member session. Each code accepts five attempts. Pending
        invites for the address are accepted on success.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInCodeVerify"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/Problem"
  /v1/auth/passkey/options:
    post:
      operationId: beginPasskeySignIn
      summary: Start a passkey sign-in
      description: |
        Returns the options for `navigator.credentials.get()` (discoverable credentials) and a
        ceremony id to send back with the result. The ceremony expires after 5 minutes.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The ceremony options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"
  /v1/auth/passkey:
    post:
      operationId: finishPasskeySignIn
      summary: Sign in with a passkey
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyCeremonyResult"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/Problem"
  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out
      description: Ends the current member session and clears the cookie.
      tags: [auth]
      security:
        - session: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: Clears `yuva_session`.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in person
      description: The person behind the session and the workspaces they belong to.
      tags: [me]
      security:
        - session: []
      responses:
        "200":
          description: The person and their memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: Update the signed-in person
      tags: [me]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: The updated person and their memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys:
    get:
      operationId: listPasskeys
      summary: List passkeys
      tags: [me]
      security:
        - session: []
      responses:
        "200":
          description: The person's passkeys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: finishPasskeyRegistration
      summary: Register a passkey
      description: Completes a registration started with `POST /v1/me/passkeys/options`.
      tags: [me]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistration"
      responses:
        "201":
          description: The registered passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys/options:
    post:
      operationId: beginPasskeyRegistration
      summary: Start a passkey registration
      description: |
        Returns the options for `navigator.credentials.create()` and a ceremony id to send back
        with the result. The ceremony expires after 5 minutes.
      tags: [me]
      security:
        - session: []
      responses:
        "200":
          description: The ceremony options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys/{passkeyId}:
    delete:
      operationId: deletePasskey
      summary: Remove a passkey
      tags: [me]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/PasskeyId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/push/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      summary: The server's Web Push key
      description: |
        The VAPID public key to pass as `applicationServerKey` to `PushManager.subscribe()`: an
        uncompressed P-256 point, base64url without padding. 404 `push_disabled` when the server
        has no VAPID keys configured; hide push settings then.
      tags: [notifications]
      security:
        - session: []
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKey"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/me/push-subscriptions:
    get:
      operationId: listPushSubscriptions
      summary: List push subscriptions
      description: The signed-in person's push subscriptions, newest first.
      tags: [notifications]
      security:
        - session: []
      responses:
        "200":
          description: The subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPushSubscription
      summary: Register a push subscription
      description: |
        Saves the browser's `PushSubscription` (`subscription.toJSON()`) for the current session.
        Registering an endpoint that is already saved updates it and moves it to this session and
        person, so call it on every panel start while notification permission is granted. The
        endpoint must be an `https` URL on a public address. At most 20 subscriptions per person.
        404 `push_disabled` when the server has no VAPID keys.
      tags: [notifications]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionCreate"
      responses:
        "201":
          description: The saved subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/me/push-subscriptions/{pushSubscriptionId}:
    delete:
      operationId: deletePushSubscription
      summary: Remove a push subscription
      description: Call it before `PushSubscription.unsubscribe()` when the member turns push off.
      tags: [notifications]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/PushSubscriptionId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/me/push-subscriptions/{pushSubscriptionId}/test:
    post:
      operationId: testPushSubscription
      summary: Send a test notification
      description: |
        Queues a test notification to the subscription and returns its payload. The outcome shows
        up as `last_success_at` or `last_error` on the subscription.
      tags: [notifications]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/PushSubscriptionId"
      responses:
        "202":
          description: Queued; the push carries this payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushNotification"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/me/notifications:
    get:
      operationId: getNotificationSettings
      summary: Your notification settings
      description: The calling member's notification settings in the workspace. Member sessions only.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateNotificationSettings
      summary: Change your notification settings
      description: |
        Each event sent replaces that event's channels; events not sent keep theirs. Member
        sessions only.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsUpdate"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/me/notifications/inboxes/{inboxId}:
    put:
      operationId: setInboxNotifications
      summary: Override your notifications for one inbox
      description: |
        Replaces the member's override for the inbox: the events sent here win over the
        workspace-wide settings in that inbox; the others follow them. Member sessions only.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxNotificationsUpdate"
      responses:
        "200":
          description: The override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxNotifications"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteInboxNotifications
      summary: Remove your override for one inbox
      description: The inbox follows the workspace-wide settings again. Member sessions only.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/workspace:
    get:
      operationId: getWorkspace
      summary: The current workspace
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/members:
    get:
      operationId: listMembers
      summary: List members
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The workspace's members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/members/{memberId}:
    get:
      operationId: getMember
      summary: Get a member
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMember
      summary: Change a member's role
      description: |
        Owners and admins only, with a member session. Only an owner grants or takes away the
        `owner` role. The last owner cannot be demoted.
      tags: [workspace]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: The updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeMember
      summary: Remove a member
      description: |
        Owners and admins only, with a member session; only an owner removes an owner. The last
        owner cannot be removed.
      tags: [workspace]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/invites:
    get:
      operationId: listInvites
      summary: List pending invites
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Invites that are not accepted yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInvite
      summary: Invite a member
      description: |
        Owners and admins only, with a member session; only an owner invites an owner. Sends an
        invitation e-mail; the invite is accepted when the person signs in with a code sent to
        that address. Inviting the same address again replaces the pending invite. Invites expire
        after 7 days.
      tags: [workspace]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCreate"
      responses:
        "201":
          description: The invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/invites/{inviteId}:
    delete:
      operationId: deleteInvite
      summary: Withdraw an invite
      tags: [workspace]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InviteId"
      responses:
        "204":
          description: Withdrawn.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys
      description: Owners and admins only, with a member session. Revoked keys are included.
      tags: [api-keys]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The workspace's API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createApiKey
      summary: Create an API key
      description: |
        Owners and admins only, with a member session. The secret is returned once and stored
        only as a hash.
      tags: [api-keys]
      security:
        - session: []

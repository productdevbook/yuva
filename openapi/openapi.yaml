          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthRedirect"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/oauth/requests/{oauthRequestId}/deny:
    post:
      operationId: denyOAuthRequest
      summary: Deny an authorization request
      description: |
        With a member session. Ends the request and answers the client's redirect URI with
        `error=access_denied`, `state` and `iss`.
      tags: [oauth]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/OAuthRequestId"
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthRedirect"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/oauth/grants:
    get:
      operationId: listOAuthGrants
      summary: List connected apps
      description: |
        With a member session. A member sees their own grants in the workspace; owners and admins
        see every grant in it. Revoked grants are not listed.
      tags: [oauth]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthGrantList"
        "401":

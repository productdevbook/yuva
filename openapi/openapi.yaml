      description: |
        Moves the contact's read cursor to `message_id`, or to the latest message when it is
        absent; it only moves forward. Replies the contact has read are not e-mailed to them.
        When it moves, members see it as the conversation's `last_read_by_contact_at` and a
        `contact.read` event on `/v1/realtime`.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientReadCreate"
      responses:
        "200":
          description: The contact's read state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientReadState"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /client/v1/conversations/{conversationId}/rating:
    post:
      operationId: rateClientConversation
      summary: Rate a closed conversation
      description: |
        Records the contact's rating (`good` or `bad`) and optional comment for a conversation
        whose `can_rate` is true. It is stored once per close: members see it in the thread as a
        `rated` event and on the conversation, and it sends the `conversation.rated` webhook.
        Answers `409 rating_unavailable` when `can_rate` is false (the inbox does not ask for
        ratings, the conversation is open, the close is older than 30 days) and
        `409 already_rated` when the contact already rated this close.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRatingCreate"
      responses:
        "201":
          description: The conversation with its rating.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConversation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /client/v1/conversations/{conversationId}/typing:
    post:
      operationId: setClientTyping
      summary: Tell members the contact is typing
      description: |
        Members with access receive a `typing` event on `/v1/realtime`. Call it at most every few
        seconds while the contact types, and with `typing: false` when they stop. Nothing is
        stored. Rate limited per session.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypingCreate"
      responses:
        "204":
          description: Sent.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/feedback:
    post:
      operationId: createClientFeedback
      summary: Send feedback
      description: |
        Starts a `feedback` conversation on the session's channel with its first message: a
        category, the text and what the app knows about where it was sent from (app version,
        build, OS, device, locale, screen, installation id). It is answered like any other
        conversation and listed with the contact's conversations (`kind: feedback`).

        `allow_email: true` lets members' replies the contact has not read in the app be e-mailed
        to them (after the same delay as chat replies); `email` is the address to use while the
        contact has no address from an identity token or their own mail, kept like
        `PUT /client/v1/contact/email`. Without `allow_email`, replies reach the contact only in
        the app.

        Send `multipart/form-data` to attach screenshots (the other fields as form fields and up to
        10 `files` parts), with the same size and type rules as messages. `client_id` makes the
        request idempotent: the same `client_id` again answers `201` with the first conversation.
        Rate limited per IP address and per channel.

        From a `chat` channel session (a documentation page's feedback form) it carries the page in
        `page_url` and `page_title` and the visitor's rating of it in `rating`; `page_url`'s origin
        must be one of the channel's allowed origins (`400 page_origin`), and replies are e-mailed
        only with `allow_email`. `page_url` from an `app` channel session answers `400 page_origin`.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientFeedbackCreate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ClientFeedbackCreateMultipart"
      responses:
        "201":
          description: The feedback conversation and its first message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConversationCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/contact/email:
    put:
      operationId: setClientContactEmail
      summary: Leave an e-mail address for replies
      description: |
        Stores the address the contact typed (e.g. when nobody is available), so replies they have
        not read can be e-mailed to them. A typed address is never used to find or merge an
        existing contact; it is used only while the contact has no address from an identity token
        or from their own mail. Yuva mails the address a confirmation link (unless a contact already
        has it; at most 3 per hour); it becomes one of the contact's addresses only once that link
        is confirmed.
        Allowed when the channel asks for an address (`ask_email_offline`), else `403 forbidden`.
      tags: [client]
      security:
        - contactSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientEmailUpdate"
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientContact"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/attachments/{attachmentId}:
    get:
      operationId: downloadClientAttachment
      summary: Download an attachment
      description: |
        An attachment of a message (not a note) in one of the contact's conversations, served as a
        download. Fetch it with the `Authorization` header and show it from a blob URL.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /client/v1/analytics/{key}:
    post:
      operationId: collectAnalytics
      summary: Send analytics events
      description: |
        Called by `/yuva-analytics.js` and `useyuva/analytics` with an analytics property's public
        key: one event, or up to 100 as `{"e": [...]}`, at most 64 KiB. Send the JSON as
        `text/plain` so a browser needs no preflight; `application/json` works too, with a
        preflight. No cookie, session or `Set-Cookie`, and the answer is `202` before anything is
        written.

        A browser's `Origin` host and every event's page host (`u`) must be one of the property's
        `domains` (`403 origin_not_allowed`, `403 page_not_allowed`); refusals carry
        `Access-Control-Allow-Origin` so the script can read them. An unknown or deleted key
        answers `404`.

        Apps (the Swift and Kotlin SDKs) send without an `Origin`, always in the batch form with
        `k` and `a` (`AnalyticsEventBatch`), to a property whose `platforms` hold `a.platform`
        (`403 platform_not_allowed` otherwise; a request without an `Origin` to a property with
        neither `ios` nor `android` answers `403 origin_not_allowed`). A screen is a page view whose
        `u` is `app://<app id>/<screen>`; the app id is the visit's `hostname` and is not checked
        against `domains`. The visitor is a keyed hash of `k`, a random key the app holds in memory
        for the life of its process, under the salt of the event's day, or of the day the event
        arrives once that day's salt is gone: a new process is a new visitor and a new visit. Events
        carry their own time in `t`; one older than 72 hours is dropped and counted as `late`, one
        in the future is taken as now. The browser-only header rules for bots do not apply to apps,
        the volume rules do.

        Custom and built-in events carry props (`p`) and revenue (`$`) within the limits of
        `AnalyticsEvent`. An invalid event (a `u` that is not an http(s) URL, a reserved name, props
        or revenue that break those limits, revenue on a page view or engagement, an
        `outbound_click` or `file_download` without an http(s) `url` prop, or an `outbound_click`
        to the page's own host) answers `400` with the reason when it is sent alone. In a batch
        it is dropped on its own and counted as `invalid` in the property's health, the batch's
        other events are taken, and the answer is `202`. A body that is not JSON or does not match
        `AnalyticsBatch`, a body over 64 KiB, a refused origin or page host and an unknown key
        still refuse the whole request.

        Consent features (`AnalyticsConsent`): an event with `c.a: 1` and a persistent id `c.p`, on
        a general-audience property that offers `persistent`, is the visitor of that id on every
        day instead of the day's hash; `c.j` with it, on a property that also offers `identify`,
        links the id to a contact. Without them, or on any other property, the event is counted
        exactly as in default mode. `yuva_consent` carries an identification or a withdrawal at
        once and is never stored; 20 a minute per shortened address and property.

        Accepted but not stored, still `202`: every request with `Sec-GPC: 1` or `DNT: 1` (but for
        a `yuva_consent` withdrawal); events
        older than 72 hours; events of a `consent` property that do not carry `c.a: 1`; events from an excluded address or
        path; events over the property's per-minute limit or the workspace's monthly cap. One
        shortened address may send 120 events a minute to a property (`429 rate_limited` with
        `Retry-After`). When the server cannot take more events it answers `503` with
        `Retry-After`.
      tags: [client]
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: The analytics property's public key, `yuva_ak_…`.
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/AnalyticsBatch"
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsBatch"
      responses:
        "202":
          description: Taken; stored unless one of the rules above dropped it.
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /client/v1/analytics-shares/{token}:
    get:
      operationId: getSharedAnalytics
      summary: A share link's page settings
      description: |
        What the public share page (`<public URL>/share/<token>`, served by the panel) needs first.
        A link with a password answers only `password_required: true` until the request carries
        an access token from `unlockSharedAnalytics` as `Authorization: Bearer yuva_sa_…`; then,
        like a link without a password, it answers the views it may show, the property's name,
        time zone and currency, the raw window, its goals (with the `goals` view) and the GeoIP
        attribution to show next to locations.

        The share page itself is served with `Content-Security-Policy: frame-ancestors` set to the
        link's `embed_origins` (`'none'` without them, an unknown, revoked or expired link included),
        so only those sites can show it in an iframe; it carries no analytics script.

        An unknown, revoked or expired token answers `404`. Every share endpoint is limited per IP
        address (`429 rate_limited` with `Retry-After`).
      tags: [client]
      security:
        - {}
        - shareAccess: []
      parameters:
        - $ref: "#/components/parameters/AnalyticsShareToken"
      responses:
        "200":
          description: The link's page settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSharedPage"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/analytics-shares/{token}/access:
    post:
      operationId: unlockSharedAnalytics
      summary: Unlock a share link with its password
      description: |
        Answers an access token for the link's other endpoints, valid for 12 hours or until the
        link expires, is revoked or gets another password. A wrong password answers
        `401 wrong_password`; an IP address may try 10 times a minute per link and 30 times a minute
        in all (`429 rate_limited`). A link without a password answers `409 no_password`.
      tags: [client]
      security: []
      parameters:
        - $ref: "#/components/parameters/AnalyticsShareToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsShareUnlock"
      responses:
        "200":
          description: The access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsShareAccess"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/analytics-shares/{token}/query:
    post:
      operationId: querySharedAnalytics
      summary: Query a shared property's numbers
      description: |
        `queryAnalytics` for a share link, with the same body and answer, limited to the link's
        views: totals and time grains with any view; `page`, `entry_page`, `exit_page` and
        `hostname` with `pages`; `channel`, `source`, `referrer` and the UTM dimensions with
        `sources`; `country`, `region` and `city` with `locations`; `device`, `browser`,
        `browser_version`, `os`, `os_version`, `screen_size`, `language`, `platform` and
        `app_version` with `devices`; `event`, `prop` and the `events` metric with `events`; a
        `goal_id` of the property and the goal metrics with `goals`. Dimensions and filters outside
        them answer `403 view_not_shared`; `segment_id` is refused (`400`).

        A link with a password needs its access token (`401 share_password_required`). Answers are
        cached like `queryAnalytics` and count towards the workspace's four concurrent queries.
      tags: [client]
      security:
        - {}
        - shareAccess: []
      parameters:
        - $ref: "#/components/parameters/AnalyticsShareToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsQuery"
      responses:
        "200":
          description: The numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: "`needs_raw_window` or `range_too_large`, as on `queryAnalytics`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AnalyticsRangeProblem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/analytics-shares/{token}/realtime:
    get:
      operationId: getSharedAnalyticsRealtime
      summary: A shared property's last 30 minutes
      description: |
        `getAnalyticsRealtime` for a share link with the `realtime` view (`403 view_not_shared`
        otherwise). A link with a password needs its access token (`401 share_password_required`).
      tags: [client]
      security:
        - {}
        - shareAccess: []
      parameters:
        - $ref: "#/components/parameters/AnalyticsShareToken"
      responses:
        "200":
          description: The last 30 minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsRealtime"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/realtime:
    get:
      operationId: clientRealtime
      summary: Live events for a contact (WebSocket)
      description: |
        Upgrades to a WebSocket that streams the events of the contact's own conversations in the
        session's inbox. Authenticate with the session token, either as the `token` query
        parameter or as a WebSocket subprotocol: offer `yuva` and `yuva.token.<token>`
        (`new WebSocket(url, ["yuva", "yuva.token." + token])`); the server selects `yuva`.
        Cookies are not used. A browser's `Origin` must be one of the channel's allowed origins.

        Every server message is one JSON text frame matching `ClientRealtimeMessage`. Stored events
        (`conversation.created`, `conversation.updated`, `message.created`, `message.updated`,
        `read`) carry an increasing `id`; resume exactly as on `/v1/realtime`: remember the larger
        of `ready.last_event_id` and the last `id` received, reconnect with `?last_event_id=`, and
        reload over HTTP on `resync_required`. `typing`, `presence` and `inbox.updated` have no
        `id` and are not replayed. `message.*` carries only messages (no notes or internal events),
        and `conversation.updated` only the status. `typing` (a member typing), `read` (how far
        members have read) and `presence` (whether someone is available; sent after `ready` and
        whenever it changes) come only for `live` inboxes. `inbox.updated` carries the inbox's
        public settings, the same `ClientInbox` as `GET /client/v1/channels/{channel_key}`, whenever
        a member changes the inbox (mode, business hours, branding, greeting) or the session's
        channel; replace the settings shown with it. After a reconnect, fetch the channel settings
        again, since a change made while disconnected is not replayed.

        The server pings every 30 seconds; the client sends nothing. Close codes as on
        `/v1/realtime`: 1008 when the session ends or the contact is deleted (start a new session),
        1013 and 1012 (reconnect with `last_event_id`).
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - name: token
          in: query
          description: The contact session token, when it is not sent as a subprotocol.
          schema:
            type: string
        - name: last_event_id
          in: query
          description: Replay the events after this one before streaming live ones.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "101":
          description: |
            Switching to the WebSocket protocol. Each text frame is one `ClientRealtimeMessage`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRealtimeMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /ingress/email:
    post:
      operationId: ingestEmail
      summary: Receive an e-mail
      description: |
        Called by the edge Email Worker or any MTA with the raw message and its envelope. The
        signature is `v2=` and the lowercase hex HMAC-SHA256, keyed with the server's
        `YUVA_INGRESS_SECRET`, over
        `<X-Yuva-Timestamp>.<X-Yuva-Envelope-To>.<X-Yuva-Envelope-From>.<raw body>` (an empty
        envelope sender leaves its place empty). The deprecated `v1=`, over
        `<X-Yuva-Timestamp>.<X-Yuva-Envelope-To>.<raw body>`, is accepted only when
        `YUVA_INGRESS_ACCEPT_V1` is set, and then the envelope sender is not trusted (it never marks
        a delivery report or automatic mail). The headers and the timestamp, which must be within 5
        minutes of the server's clock, are checked before the body is read. A message with a
        Message-ID seen before on the same channel is accepted again without being stored twice.
        At most `YUVA_INGRESS_MAX_CONCURRENT` messages are processed at once; more are answered
        `503 unavailable`.

        The recipient selects the channel: its exact address, then `local@` for `local+tag@`, then
        the domain's catch-all channel (`*@domain`). Volume never bounces mail: a sender over the
        hourly limit of new conversations on a channel has the message added to its latest
        conversation there instead. Only a sender over the server's hard cap of inbound mails per
        hour (`YUVA_EMAIL_SENDER_HOURLY_CAP`, default 500) is refused with `429 rate_limited`.

        Refusals are permanent (4xx) and carry a `reason` that the sending server shows to the
        sender. 5xx means try again later.
      tags: [ingress]
      security: []
      parameters:
        - name: X-Yuva-Envelope-To
          in: header
          required: true
          schema:
            type: string
        - name: X-Yuva-Envelope-From
          in: header
          required: false
          schema:
            type: string
        - name: X-Yuva-Timestamp
          in: header
          required: true
          description: Unix time in seconds.
          schema:
            type: string
            pattern: "^[0-9]+$"
        - name: X-Yuva-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^v[12]=[0-9a-f]{64}$"
      requestBody:
        required: true
        description: The raw RFC 5322 message, at most 25 MiB.
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Accepted earlier (same Message-ID on the same channel).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressResult"
        "202":
          description: Accepted, stored or deliberately dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressResult"
        "400":
          $ref: "#/components/responses/IngressRejection"
        "401":
          $ref: "#/components/responses/IngressRejection"
        "403":
          $ref: "#/components/responses/IngressRejection"
        "404":
          $ref: "#/components/responses/IngressRejection"
        "413":
          $ref: "#/components/responses/IngressRejection"
        "429":
          $ref: "#/components/responses/IngressRejection"
        "503":
          $ref: "#/components/responses/IngressRejection"
  /ingress/ses:
    post:
      operationId: ingestSes
      summary: Receive an SES notification
      description: |
        Amazon SNS delivers Amazon SES bounce and complaint notifications here. The SNS signature
        is verified against the AWS signing certificate, and the topic must be one of
        `YUVA_SES_TOPIC_ARNS`. A subscription confirmation is confirmed by fetching its
        `SubscribeURL` (only on an `sns.<region>.amazonaws.com` host). A permanent bounce or a
        complaint marks the recipient undeliverable in the workspace that sent the message and the
        message `failed`.
      tags: [ingress]
      security: []
      requestBody:
        required: true
        description: The SNS message (SNS sends it as `text/plain`).
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Handled or ignored.
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /.well-known/oauth-authorization-server:
    get:
      operationId: oauthAuthorizationServerMetadata
      summary: Authorization server metadata
      description: RFC 8414. The issuer is the server's public URL.
      tags: [oauth]
      security: []
      responses:
        "200":
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthServerMetadata"
  /.well-known/oauth-protected-resource:
    get:
      operationId: oauthProtectedResourceMetadata
      summary: Protected resource metadata for the whole API
      description: RFC 9728, for the resource `<public URL>` (`/v1`, `/v1/realtime` and `/mcp`).
      tags: [oauth]
      security: []
      responses:
        "200":
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthResourceMetadata"
  /.well-known/oauth-protected-resource/mcp:
    get:
      operationId: oauthProtectedResourceMetadataMcp
      summary: Protected resource metadata for /mcp
      description: RFC 9728, for the resource `<public URL>/mcp`.
      tags: [oauth]
      security: []
      responses:
        "200":
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthResourceMetadata"
  /oauth/register:
    post:
      operationId: oauthRegister
      summary: Register a client
      description: |
        Dynamic client registration (RFC 7591) for public clients: `token_endpoint_auth_method` is
        always `none` and no secret is issued. Redirect URIs must be `https`, `http` on a loopback
        host (`localhost`, `127.0.0.1`, `[::1]`), or a private-use scheme of a native app, without
        a fragment; they are matched exactly. `grant_types` may hold `authorization_code` and
        `refresh_token`, `response_types` only `code`. At most 20 registrations per address and
        hour (`429`). Clients that never got a grant are deleted after 30 days.
      tags: [oauth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClientMetadata"
      responses:
        "201":
          description: The registered client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientRegistration"
        "400":
          description: "`invalid_redirect_uri` or `invalid_client_metadata`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          description: Too many registrations from this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oauth/authorize:
    get:
      operationId: oauthAuthorize
      summary: Start an authorization
      description: |
        Checks the request and redirects the browser to the panel's consent page,
        `/oauth/consent?request=<id>`. `client_id` is a registered client id or an `https` URL of a
        Client ID Metadata Document, fetched with the same address rules as webhooks and cached for
        24 hours; its `client_id` must equal the URL. An unknown client or a redirect URI that does
        not exactly match one of the client's is answered here with `400` and a plain text
        explanation; every other error goes back to the redirect URI as `error`,
        `error_description`, `state` and `iss` (`unsupported_response_type`, `invalid_request` for a
        missing or non-`S256` PKCE challenge, `invalid_scope`, `invalid_target` for a missing or
        unknown `resource`).
      tags: [oauth]
      security: []
      parameters:
        - {name: response_type, in: query, required: true, schema: {type: string, enum: [code]}}
        - {name: client_id, in: query, required: true, schema: {type: string}}
        - name: redirect_uri
          in: query
          required: false
          description: May be left out when the client has exactly one.
          schema: {type: string}
        - {name: code_challenge, in: query, required: true, schema: {type: string}}
        - {name: code_challenge_method, in: query, required: true, schema: {type: string, enum: [S256]}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - name: scope
          in: query
          required: false
          description: Space-separated `ApiKeyScope` values; every scope when absent.
          schema: {type: string}
        - name: resource
          in: query
          required: true
          description: "`<public URL>/mcp` or `<public URL>` (RFC 8707)."
          schema: {type: string}
      responses:
        "302":
          description: To the consent page, or back to the client with an error.
        "400":
          description: The client or redirect URI is not valid.
          content:
            text/plain:
              schema:
                type: string
  /oauth/token:
    post:
      operationId: oauthToken
      summary: Get tokens
      description: |
        `authorization_code` (with `code`, `redirect_uri`, `client_id`, `code_verifier` and
        optionally `resource`, which must match the authorization) and `refresh_token` (with
        `refresh_token` and `client_id`). Every refresh returns a new refresh token; the old one is
        spent, and presenting a spent one revokes the grant (`invalid_grant`). A code used twice
        also revokes the grant. Answers carry `Cache-Control: no-store`.
      tags: [oauth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "400":
          description: "`invalid_request`, `invalid_grant`, `invalid_client`, `unsupported_grant_type` or `invalid_target`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oauth/revoke:
    post:
      operationId: oauthRevoke
      summary: Revoke a token
      description: |
        RFC 7009. Revoking a refresh token revokes the whole grant; revoking an access token ends
        only that token. Unknown tokens, and tokens of another `client_id`, are answered `200` too.
      tags: [oauth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
                client_id:
                  type: string
      responses:
        "200":
          description: Revoked, or nothing to revoke.
        "400":
          description: "`invalid_request` when `token` is missing."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
webhooks:
  conversation.created:
    post:
      operationId: webhookConversationCreated
      summary: A conversation started
      description: |
        Any channel, feedback included (which also sends `feedback.created`).
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookConversationPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  conversation.rated:
    post:
      operationId: webhookConversationRated
      summary: A contact rated a conversation
      description: |
        The contact rated a closed conversation; `conversation.rating` holds the rating and
        comment. Sent once per rating, with `conversation.updated` for the same change.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookConversationPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  conversation.updated:
    post:
      operationId: webhookConversationUpdated
      summary: A conversation changed
      description: |
        Status, assignee, priority, labels, subject or spam flag changed, or it moved to
        another contact.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookConversationPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  message.created:
    post:
      operationId: webhookMessageCreated
      summary: A message was added
      description: |
        A message to or from the contact. Members' notes only for endpoints with
        `include_notes`; internal events never. When a member answers and `contact.online` is
        false, the contact has no live connection: send your push notification.

        The conversation is `data.message.conversation_id` (the same as `data.conversation.id`).
        Put it in the push payload as `yuva_conversation_id` (APNs: a top-level key next to `aps`;
        FCM: a `data` entry); `Yuva.handleNotification` in the Swift and Kotlin SDKs reads it and
        returns the conversation to open. Map the contact to your user with
        `data.contact.external_ids`.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessagePayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  feedback.created:
    post:
      operationId: webhookFeedbackCreated
      summary: Feedback arrived
      description: |
        A `feedback` conversation started, from an app or with `POST /v1/feedback`, with its
        first message.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookFeedbackPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  contact.updated:
    post:
      operationId: webhookContactUpdated
      summary: A contact changed
      description: |
        Name, addresses, external ids, attributes or the blocked flag changed.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookContactPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  contact.deleted:
    post:
      operationId: webhookContactDeleted
      summary: A contact was deleted
      description: |
        With the external ids the contact had, so the host can match its own user.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookContactDeletedPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  draft.created:
    post:
      operationId: webhookDraftCreated
      summary: A draft was written
      description: |
        A bot or a member stored an outgoing message as a draft; nothing was delivered.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessagePayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  draft.updated:
    post:
      operationId: webhookDraftUpdated
      summary: A draft was edited
      description: |
        `data.message` is the draft after the edit.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessagePayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  draft.deleted:
    post:
      operationId: webhookDraftDeleted
      summary: A draft was discarded
      description: |
        `data.message` is the draft as it was. Sending a draft sends `message.created` instead.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessagePayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  discussion.created:
    post:
      operationId: webhookDiscussionCreated
      summary: A discussion thread was started
      description: "Also when it waits for a member (`state: pending`)."
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookDiscussionPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  discussion.post_created:
    post:
      operationId: webhookDiscussionPostCreated
      summary: A reply was written in a thread
      description: "Also when it waits for a member (`state: pending` on `post`)."
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookDiscussionPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  discussion.answered:
    post:
      operationId: webhookDiscussionAnswered
      summary: An answer was accepted
      description: "The accepted reply is in `post`."
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookDiscussionPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  discussion.updated:
    post:
      operationId: webhookDiscussionUpdated
      summary: A thread or post was moderated or edited
      description: "Approved, hidden, marked spam, edited, deleted, locked or unlocked, or the answer cleared."
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookDiscussionPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  subscription.created:
    post:
      operationId: webhookSubscriptionCreated
      summary: A subscription was created
      description: |
        Someone subscribed to a list of the endpoint's inbox, in any state (`pending` while
        waiting for the confirmation). Endpoints limited to an inbox receive the events of that
        inbox's lists.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  subscription.updated:
    post:
      operationId: webhookSubscriptionUpdated
      summary: A subscription changed state
      description: |
        Confirmed, unsubscribed (with `unsubscribe_reason`) or subscribed again;
        `previous_state` is the state before.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  broadcast.updated:
    post:
      operationId: webhookBroadcastUpdated
      summary: A broadcast changed state
      description: |
        Scheduled, back to draft, preparing, sending (started or resumed), paused (with
        `pause_reason`), sent, cancelled or failed; `previous_state` is the state before. Endpoints
        of an inbox get the broadcasts of that inbox.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookBroadcastPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  analytics.alert:
    post:
      operationId: webhookAnalyticsAlert
      summary: A property raised an alert
      description: |
        A spike, a drop, a goal drop, support load or a new referrer (`AnalyticsAlertKind`), once
        per alert. Endpoints of an inbox get the alerts of properties linked to that inbox.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookAnalyticsAlertPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: yuva_session
      description: |
        Member session set by a successful sign-in. Requests other than `GET` and `HEAD` with this
        cookie must send an `Origin` of the server's public origin (or a WebAuthn origin), or
        `Sec-Fetch-Site: same-origin` without `Origin` (`403 origin_not_allowed`), and a body as
        `application/json` or `multipart/form-data` (`415 unsupported_media_type`).
    apiKey:
      type: http
      scheme: bearer
      description: |
        A workspace API key, `yuva_<prefix>_<secret>`. Each operation a key may call needs one
        scope (`ApiKeyScope`); a call without it is refused with `403 insufficient_scope` naming the
        missing scope in `scope`. Operations that list no scope need a member session
        (`403 member_session_required`). An expired key is refused with `401 api_key_expired`.
    oauthToken:
      type: http
      scheme: bearer
      description: |
        An OAuth access token, `yuva_at_<secret>` (see the `oauth` tag). It acts as its member in
        the grant's workspace with the member's role and inbox access, narrowed by the granted
        scopes exactly like an API key (`403 insufficient_scope`, `403 member_session_required`).
        An expired token is refused with `401 token_expired`, a token for `<public URL>/mcp` with
        `401 token_wrong_resource`, and a revoked or unknown one with `401 unauthenticated`. Each
        token is limited to 600 requests a minute (`429 rate_limited` with `Retry-After`).
    contactSession:
      type: http
      scheme: bearer
      description: A contact session token from `POST /client/v1/session`, `yuva_cs_<secret>`.
    readerToken:
      type: http
      scheme: bearer
      description: |
        A reader token from `POST /v1/account/reader-tokens`, `yuva_rd_<secret>`, handed to a
        documentation site by the server's `/account/connect` popup. It works on the `/client/v1`
        discussion endpoints of its chat channel only.
    shareAccess:
      type: http
      scheme: bearer
      description: |
        An access token from `POST /client/v1/analytics-shares/{token}/access`, `yuva_sa_<…>`, for
        a share link with a password. It works on that link's endpoints only.
  parameters:
    WorkspaceHeader:
      name: Yuva-Workspace
      in: header
      required: false
      description: The workspace to act on; see "Workspace selection".
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes a retried request return the first response; see "Idempotency".
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: "^[\\x20-\\x7e]+$"
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OAuthRequestId:
      name: oauthRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OAuthGrantId:
      name: oauthGrantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PasskeyId:
      name: passkeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PushSubscriptionId:
      name: pushSubscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InboxId:
      name: inboxId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookIdHeader:
      name: webhook-id
      in: header
      required: true
      description: The delivery's id, the same on every retry; use it to ignore duplicates.
      schema:
        type: string
        examples: [msg_2KWPBgLlAfxdpx2AI54pPJ85f4W]
    WebhookTimestampHeader:
      name: webhook-timestamp
      in: header
      required: true
      description: Unix seconds of this attempt. Refuse values far from your clock.
      schema:
        type: string
    WebhookSignatureHeader:
      name: webhook-signature
      in: header
      required: true
      description: |
        Space-separated `v1,<base64>` signatures: HMAC-SHA256 over
        `<webhook-id>.<webhook-timestamp>.<body>` with the base64-decoded part of the
        `whsec_` secret (Standard Webhooks). Two during a secret rotation.
      schema:
        type: string
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LabelId:
      name: labelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CannedReplyId:
      name: cannedReplyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelKey:
      name: channel_key
      in: path
      required: true
      description: The chat channel's public key.
      schema:
        type: string
        maxLength: 200
    AnalyticsPropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnalyticsGoalId:
      name: goalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnalyticsFunnelId:
      name: funnelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnalyticsSegmentId:
      name: segmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnalyticsShareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnalyticsExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnalyticsShareToken:
      name: token
      in: path
      required: true
      description: The share link's token, `yuva_sh_…`.
      schema:
        type: string
        maxLength: 200
    AnalyticsAnnotationId:
      name: annotationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ListId:
      name: listId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MigrationId:
      name: migrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DesignId:
      name: designId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BroadcastId:
      name: broadcastId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DesignVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        maxLength: 60
    TemplateLocale:
      name: locale
      in: query
      description: The language of the template's text; English by default.
      schema:
        $ref: "#/components/schemas/EmailTemplateLocale"
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsentFormat:
      name: format
      in: query
      description: "`csv` (the default) or `json`."
      schema:
        type: string
        enum: [csv, json]
    ListConsentFormat:
      name: format
      in: query
      description: "`csv` (the default), `json`, or `iys` for İYS's consent fields."
      schema:
        type: string
        enum: [csv, json, iys]
    DiscussionId:
      name: discussionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DiscussionPostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocsSiteFilter:
      name: site
      in: query
      description: |
        Only the pages of this site: an origin, `scheme://host[:port]` (as in `GET /v1/docs/sites`).
        Without it, every site.
      schema:
        type: string
        maxLength: 300
        examples: ["https://docs.example.com"]
    DocsDays:
      name: days
      in: query
      description: The rating window in days, `7`, `30` or `90`; 30 by default.
      schema:
        type: integer
        format: int32
        default: 30
    Search:
      name: q
      in: query
      description: Full-text search (Postgres `simple` configuration, `websearch` syntax).
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      description: Page size, 1 to 100; 25 by default.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MigrationFileProblem:
      description: The export file was refused or is incomplete; `reason` or `missing_parts` say why.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/MigrationFileProblem"
    BroadcastProblem:
      description: The broadcast was refused; `items` or `recipients` say why.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BroadcastProblem"
    EmailDesignProblem:
      description: The design was refused; `errors` names each problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/EmailDesignProblem"
    IngressRejection:
      description: The message is refused; `reason` is shown to the sender.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngressRejection"
    SignedIn:
      description: Signed in; the session cookie is set.
      headers:
        Set-Cookie:
          description: "`yuva_session`, HttpOnly, SameSite=Lax."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Me"
  schemas:
    Role:
      type: string
      enum: [owner, admin, agent]
    Locale:
      type: string
      description: The language of e-mails sent to the person.
      enum: [en, tr]
    Email:
      type: string
      format: email
      maxLength: 320
      examples: [owner@example.com]
    SignInCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        reader:
          type: boolean
          description: |
            Sign in as a reader (the account page and its `/account/connect` popup): the code is sent
            to any address, and verifying it creates the person when there is none yet.
        locale:
          $ref: "#/components/schemas/Locale"
          description: |
            The language the sign-in page is shown in. Used only when the address belongs to no
            person and has no invite: the code e-mail is written in it, and the person that
            verifying the code creates gets it as their locale. An existing person keeps their own
            locale, and an invite's locale wins over it. Absent: English.
    SignInCodeVerify:
      type: object
      required: [email, code]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          type: string
          pattern: "^[0-9]{6}$"
          examples: ["042917"]
    Person:
      type: object
      required: [id, email, name, locale, availability]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
          description: Empty until the person sets it.
        locale:
          $ref: "#/components/schemas/Locale"
        availability:
          $ref: "#/components/schemas/Availability"
    Workspace:
      type: object
      required: [id, name, bots_may_send, broadcasts, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        retention_days:
          type: integer
          format: int32
          description: >-
            Closed conversations untouched for this many days are deleted with their messages and
            attachments, and raw e-mails older than this are deleted. Absent when everything is kept.
        bots_may_send:
          type: boolean
          description: |
            Whether API keys deliver messages. Off: a key's outgoing message must be a draft
            (`403 bot_sending_disabled`) and a key cannot send drafts; members review and send
            them. On: a key with `messages:write` sends directly, and one that also has
            `drafts:send` sends drafts. Members always may.
        broadcasts:
          $ref: "#/components/schemas/WorkspaceBroadcasts"
        created_at:
          type: string
          format: date-time
    WorkspaceCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    WorkspaceUpdate:
      type: object
      description: Only the fields sent change; at least one is required.
      properties:
        retention_days:
          type: [integer, "null"]
          format: int32
          minimum: 1
          maximum: 36500
          description: "`null` keeps everything. Owners, or an API key with `workspace:manage`."
        bots_may_send:
          type: boolean
          description: Owners and admins, with a member session.
        broadcasts_by_keys:
          type: boolean
          description: Whether API keys and OAuth tokens with `broadcasts:send` may schedule and resume broadcasts. Owners and admins, with a member session.
    WorkspaceDeletion:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The workspace's name, exactly; anything else is refused with `400 confirmation_mismatch`.
    AccountDeletion:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The person's e-mail address (case is ignored); anything else is refused with `400 confirmation_mismatch`.
    Membership:
      type: object
      required: [workspace, member_id, role]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        member_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
    Me:
      type: object
      required: [person, memberships]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    MeUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 200
        locale:
          $ref: "#/components/schemas/Locale"
        availability:
          $ref: "#/components/schemas/Availability"
    Member:
      type: object
      required: [id, person_id, email, name, role, availability, online, created_at]
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        availability:
          $ref: "#/components/schemas/Availability"
        online:
          type: boolean
          description: |
            The member has a `/v1/realtime` connection seen in the last 75 seconds (any panel tab
            or device). `member.presence` events on `/v1/realtime` report changes.
        created_at:
          type: string
          format: date-time
    MemberPresence:
      type: object
      required: [member_id, availability, online]
      properties:
        member_id:
          type: string
          format: uuid
        availability:
          $ref: "#/components/schemas/Availability"
        online:
          type: boolean
    Viewing:
      type: object
      required: [member_id, conversation_id, viewing]
      properties:
        member_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        viewing:
          type: boolean
          description: "`false` when the member no longer has the conversation open anywhere."
    ViewingEvent:
      type: object
      description: |
        Another member opened (`viewing: true`) or left a conversation, as their panel reported
        with a `viewing` frame; leaving includes hiding the page and disconnecting. Right after a
        connection reports a conversation, it also gets one `viewing: true` event for every other
        member who already has it open. Not stored: it has no `id` and is not replayed. Sent to
        member sessions that can see the conversation's inbox; members do not get their own.
      required: [type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        type:
          type: string
          enum: [viewing]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Viewing"
    MemberPresenceEvent:
      type: object
      description: |
        A member's `availability` or `online` changed (they opened or closed the panel, or set
        themselves away). Carries the member's current state, so it may repeat the previous one.
        Not stored: it has no `id` and is not replayed; reload `/v1/members` after a reconnect.
        A server process that stops without closing its connections sends none: such members
        turn offline in `/v1/members` 75 seconds later. Sent to member sessions only, the member's
        own included.
      required: [type, workspace_id, created_at, data]
      properties:
        type:
          type: string
          enum: [member.presence]
        workspace_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/MemberPresence"
    ContactPresenceEvent:
      type: object
      description: |
        One of a contact's `/client/v1/realtime` connections opened or closed. Carries the
        contact's current presence, so it may repeat the previous one.
        Not stored: it has no `id` and is not replayed; read `/v1/contacts/{contactId}/presence`
        after a reconnect. A connection that ends without closing (a server process that died) is
        announced within about two minutes.
      required: [type, workspace_id, created_at, data]
      properties:
        type:
          type: string
          enum: [contact.presence]
        workspace_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ContactPresence"
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    MemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    InviteCreate:
      type: object
      required: [email, role]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        locale:
          $ref: "#/components/schemas/Locale"
    Invite:
      type: object
      required: [id, email, role, locale, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        locale:
          $ref: "#/components/schemas/Locale"
        invited_by:
          type: string
          format: uuid
          description: The inviting member, absent when that member was removed.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
    ApiKeyScope:
      type: string
      description: |
        - `conversations:read`: list, get and count conversations; list messages; attachments,
          message e-mail and raw source; list labels and canned replies.
        - `conversations:write`: create, update (status, assignee, snooze, priority, labels), move
          and bulk-update conversations.
        - `messages:write`: outgoing and incoming messages, drafts: create, edit, discard.
        - `drafts:send`: send a draft (`POST /v1/messages/{id}/send`), together with
          `messages:write`.
        - `notes:write`: notes.
        - `contacts:read`: list, look up and get contacts, presence.
        - `contacts:write`: create, update, delete and merge contacts.
        - `inboxes:read`: workspace, members, inboxes, inbox members, channels.
        - `inboxes:manage`: create, update and delete inboxes and channels, inbox access, secret
          and key rotation.
        - `labels:write`: create, update and delete labels.
        - `canned_replies:write`: create, update and delete canned replies.
        - `webhooks:manage`: webhooks, their deliveries and attempts.
        - `workspace:manage`: update the workspace, usage.
        - `feedback:write`: feedback.
        - `lists:read`: mailing lists, subscriptions, growth, consent exports.
        - `lists:write`: create, change and delete lists; add, unsubscribe and delete
          subscribers; resend confirmations.
        - `broadcasts:read`: broadcasts, their audience counts, reviews and reports; e-mail
          designs, their snapshots and renders, images, the template gallery. Deliveries also
          need `contacts:read`.
        - `broadcasts:write`: create, change and delete draft broadcasts and send tests; create,
          save, copy, archive and restore designs; upload and delete images.
        - `broadcasts:send`: schedule, unschedule, pause, resume and cancel broadcasts. Scheduling
          and resuming also need the workspace's `broadcasts.by_keys`. Never implied: a key made
          without naming its scopes does not hold it.
        - `migrations:manage`: detect, create, change, connect, test and delete migrations into
          Yuva. Owners and admins only; never offered to agents' tokens, refused for keys limited
          to inboxes.
        - `analytics:read`: analytics properties.
        - `analytics:write`: server-side analytics events; for API keys only, never offered to
          OAuth clients.
        - `analytics:manage`: create, change and delete analytics properties, rotate their keys,
          delete their data. Never offered to agents' tokens, refused for keys limited to inboxes.

        `lists:*`, `broadcasts:*`, `migrations:manage` and `analytics:*` are never added to keys made before they existed.
      enum:
        - conversations:read
        - conversations:write
        - messages:write
        - drafts:send
        - notes:write
        - contacts:read
        - contacts:write
        - inboxes:read
        - inboxes:manage
        - labels:write
        - canned_replies:write
        - webhooks:manage
        - workspace:manage
        - feedback:write
        - lists:read
        - lists:write
        - broadcasts:read
        - broadcasts:write
        - broadcasts:send
        - migrations:manage
        - analytics:read
        - analytics:write
        - analytics:manage
    BotAvatarUrl:
      type: string
      format: uri
      maxLength: 2000
      description: An `https` image URL.
    ApiKey:
      type: object
      required: [id, name, prefix, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The visible start of the key, `yuva_<prefix>`.
          examples: [yuva_k3x9q2mf]
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        inbox_ids:
          type: array
          description: The inboxes the key is limited to; absent when it sees every inbox.
          items:
            type: string
            format: uuid
        expires_at:
          type: string
          format: date-time
          description: After this the key is refused with `401 api_key_expired`; absent when it does not expire.
        bot_name:
          type: string
          description: The bot's display name when it differs from `name`.
        bot_avatar_url:
          $ref: "#/components/schemas/BotAvatarUrl"
        created_by:
          type: string
          format: uuid
          description: The member who created the key, absent when that member was removed.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          description: Every scope when absent.
          minItems: 1

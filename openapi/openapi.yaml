    PushNotification:
      type: object
      description: |
        The JSON a push delivers to the service worker (`event.data.json()`), encrypted per
        RFC 8291 (`aes128gcm`). Show it with `registration.showNotification(title, {body, tag,
        data})` and open `url` on click. Pushes of one conversation share `tag` (and the push
        `Topic`), so a newer one replaces the older.
      required: [event, title, body, url, tag]
      properties:
        event:
          type: string
          description: What caused it (see the `notifications` tag), or `test`.
          enum: [new_live_conversation, new_async_conversation, message_in_my_conversation, message_in_unassigned_conversation, assigned_to_me, mentioned, test]
        title:
          type: string
          description: The inbox name and the contact's name.
          examples: ["Support · Ayşe Yılmaz"]
        body:
          type: string
          description: The start of the message (at most 140 characters), or what happened.
        url:
          type: string
          description: |
            Path to open, relative to the server's public URL:
            `/conversations/{id}?workspace_id={workspace}` (`/` for a test).
          examples: ["/conversations/0199a3f0-7c1e-7b4a-9d2e-3f1c2b4a5d6e?workspace_id=0199a3f0-0000-7000-8000-000000000001"]
        tag:
          type: string
          description: "`conversation-{id}`, or `test`."
        conversation_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
    PasskeyCeremony:
      type: object
      required: [ceremony_id, options]
      properties:
        ceremony_id:
          type: string
        options:
          type: object
          additionalProperties: true
          description: |
            WebAuthn options in their JSON form (`{"publicKey": ...}`), for
            `PublicKeyCredential.parseCreationOptionsFromJSON` or
            `parseRequestOptionsFromJSON`.
    PasskeyCeremonyResult:
      type: object
      required: [ceremony_id, credential]
      properties:
        ceremony_id:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The `PublicKeyCredential` in its JSON form (`credential.toJSON()`).
    PasskeyRegistration:
      type: object
      required: [ceremony_id, credential]
      properties:
        ceremony_id:
          type: string
        name:
          type: string
          maxLength: 200
          description: A label for the passkey; defaults to "Passkey".
        credential:
          type: object
          additionalProperties: true
          description: The `PublicKeyCredential` in its JSON form (`credential.toJSON()`).
    Slug:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      minLength: 1
      maxLength: 64
      examples: [acme-app]
    LanguageTag:
      type: string
      description: A BCP 47 language tag.
      pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      maxLength: 35
      examples: [en, tr]
    InboxMode:
      type: string
      description: |
        `live` shows who is available, typing and read receipts; `async` shows the expected reply
        time instead.
      enum: [live, async]
    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
    BusinessHoursInterval:
      type: object
      required: [day, start, end]
      properties:
        day:
          $ref: "#/components/schemas/Weekday"
        start:
          type: string
          description: Local time in the inbox's timezone, `HH:MM`.
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          examples: ["09:00"]
        end:
          type: string
          description: Local time, `HH:MM` or `24:00`; after `start`.
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
          examples: ["17:30"]
    BusinessHours:
      type: object
      description: When `enabled` is false the inbox counts as always open.
      required: [enabled, intervals]
      properties:
        enabled:
          type: boolean
        intervals:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/BusinessHoursInterval"
    InboxBranding:
      type: object
      properties:
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          examples: ["#2563eb"]
        logo_url:
          type: string
          format: uri
          maxLength: 2000
        greeting:
          type: string
          maxLength: 500
    Inbox:
      type: object
      required: [id, name, slug, branding, default_locale, timezone, mode, business_hours, ask_for_rating, sender, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          $ref: "#/components/schemas/Slug"
        branding:
          $ref: "#/components/schemas/InboxBranding"
        default_locale:
          $ref: "#/components/schemas/LanguageTag"
        timezone:
          type: string
          description: An IANA time zone name.
          examples: [Europe/Istanbul]
        mode:
          $ref: "#/components/schemas/InboxMode"
        expected_reply_minutes:
          type: integer
          format: int32
          description: Shown to contacts in `async` mode; absent when not set.
        business_hours:
          $ref: "#/components/schemas/BusinessHours"
        ask_for_rating:
          type: boolean
          description: |
            Contacts may rate a closed conversation (`good` or `bad`, with an optional comment):
            the widget and the mobile SDKs offer it, and e-mail contacts get a request with two
            links after a member's conversation is closed. Off by default. Only conversations
            closed after it was turned on can be rated; turning it off and on again starts over.
        sender:
          $ref: "#/components/schemas/InboxSender"
        import:
          $ref: "#/components/schemas/InboxImport"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InboxImport:
      type: object
      description: |
        A migration is filling the inbox with the history of an old mailbox: while it scans,
        copies or syncs, and while a copy that has started is paused or needs attention. Absent
        otherwise. Everyone who can see the inbox sees it; the migration itself, its counts and
        its errors stay with owners, admins and holders of `migrations:manage`. When more than one
        migration targets the inbox, the most recently created one. Its appearance, state changes
        and disappearance come as `inbox.updated`; `percent` moves between them without an event.
      required: [address, state, percent]
      properties:
        address:
          type: string
          description: The old mailbox's address.
          examples: [support@example.com]
        state:
          type: string
          description: |
            `scanning` (reading the mailbox before the copy starts), `copying`, `paused`,
            `needs_attention` (stopped until an owner or admin acts), `syncing` (the history is
            copied; new mail in the old mailbox is still read until the switch is done).
          enum: [scanning, copying, paused, needs_attention, syncing]
          x-enum-varnames: [ImportScanning, ImportCopying, ImportPaused, ImportNeedsAttention, ImportSyncing]
        percent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Messages done of those planned, rounded down; 0 while scanning, 100 while syncing.
    InboxCreate:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: "#/components/schemas/Slug"
        branding:
          $ref: "#/components/schemas/InboxBranding"
        default_locale:
          $ref: "#/components/schemas/LanguageTag"
        timezone:
          type: string
          maxLength: 64
          description: Defaults to `UTC`.
        mode:
          $ref: "#/components/schemas/InboxMode"
        expected_reply_minutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 43200
        business_hours:
          $ref: "#/components/schemas/BusinessHours"
        ask_for_rating:
          type: boolean
          default: false
    InboxUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: "#/components/schemas/Slug"
        branding:
          $ref: "#/components/schemas/InboxBranding"
        default_locale:
          $ref: "#/components/schemas/LanguageTag"
        timezone:
          type: string
          maxLength: 64
        mode:
          $ref: "#/components/schemas/InboxMode"
        expected_reply_minutes:
          type: [integer, "null"]
          format: int32
          minimum: 1
          maximum: 43200
          description: "`null` clears it."
        business_hours:
          $ref: "#/components/schemas/BusinessHours"
        ask_for_rating:
          type: boolean
        sender:
          $ref: "#/components/schemas/InboxSenderUpdate"
          description: Owners, admins and keys with `inboxes:manage`.
    InboxCreated:
      type: object
      required: [inbox, identity_secret]
      properties:
        inbox:
          $ref: "#/components/schemas/Inbox"
        identity_secret:
          type: string
          description: Signs identity tokens (HS256). It is not shown again.
    IdentitySecret:
      type: object
      required: [identity_secret]
      properties:
        identity_secret:
          type: string
          description: Signs identity tokens (HS256). It is not shown again.
    InboxList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Inbox"
    ChannelKind:
      type: string
      description: |
        `email`, `chat` (web widget), `app` (mobile SDKs) or `api` (server to server).
      enum: [email, chat, app, api]
    ChannelSettings:
      type: object
      additionalProperties: true
      description: Free-form settings, stored as given. The settings Yuva acts on are in `email` and `chat`.
    SmtpTls:
      type: string
      description: |
        `starttls` upgrades a plain connection (port 587), `tls` connects with TLS (port 465),
        `none` sends in the clear (local relays and test servers only).
      enum: [starttls, tls, none]
    SmtpSettings:
      type: object
      description: The outbound SMTP account. The password is never returned.
      required: [host, port, username, tls, password_set]
      properties:
        host:
          type: string
        port:
          type: integer
          format: int32
        username:
          type: string
        tls:
          $ref: "#/components/schemas/SmtpTls"
        password_set:
          type: boolean
    SmtpSettingsInput:
      type: object
      required: [host]
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: Defaults to 465 with `tls`, else 587.
        username:
          type: string
          maxLength: 320
        password:
          type: string
          maxLength: 1024
          description: Stored encrypted. Absent keeps the stored password; empty removes it.
        tls:
          $ref: "#/components/schemas/SmtpTls"
    EmailAutoReply:
      type: object
      description: |
        A greeting e-mailed when a new conversation starts by e-mail, at most once per contact
        within `interval_hours`. It carries `Auto-Submitted: auto-replied` and is never sent in
        answer to automatic mail.
      required: [enabled, text, interval_hours]
      properties:
        enabled:
          type: boolean
        text:
          type: string
          maxLength: 5000
        interval_hours:
          type: integer
          format: int32
          minimum: 1
          maximum: 8760
    EmailAutoReplyInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        text:
          type: string
          maxLength: 5000
          description: Required when `enabled`.
        interval_hours:
          type: integer
          format: int32
          minimum: 1
          maximum: 8760
          description: Defaults to 24.
    EmailChannel:
      type: object
      description: Settings of an `email` channel.
      required: [address, display_name, auto_reply, broadcast_rate]
      properties:
        address:
          $ref: "#/components/schemas/Email"
          description: |
            The address the channel receives mail at, unique on the server. `*@example.com` makes a
            catch-all channel (one per domain): it receives mail to every address of the domain that
            no other channel has, and replies go out from the address the contact wrote to, so the
            SMTP account must be allowed to send from the whole domain. `from_address` is then used
            only for conversations that have no such address and cannot itself be a catch-all.
        display_name:
          type: string
          description: The name in `From`; the channel name when empty.
        from_address:
          $ref: "#/components/schemas/Email"
        smtp:
          $ref: "#/components/schemas/SmtpSettings"
        auto_reply:
          $ref: "#/components/schemas/EmailAutoReply"
        broadcast_smtp:
          $ref: "#/components/schemas/SmtpSettings"
          description: |
            A separate SMTP account for broadcasts, so complaints about marketing mail never land
            on the support account; absent when broadcasts use `smtp`.
        broadcast_rate:
          type: integer
          format: int32
          description: Broadcast mails a second through this channel.
        dkim:
          $ref: "#/components/schemas/EmailDkim"
          description: The channel's Yuva DKIM key; absent without one.
    EmailChannelInput:
      type: object
      required: [address]
      properties:
        address:
          $ref: "#/components/schemas/Email"
          description: |
            The address the channel receives mail at, unique on the server. `*@example.com` makes a
            catch-all channel (one per domain): it receives mail to every address of the domain that
            no other channel has, and replies go out from the address the contact wrote to, so the
            SMTP account must be allowed to send from the whole domain. `from_address` is then used
            only for conversations that have no such address and cannot itself be a catch-all.
        display_name:
          type: string
          maxLength: 200
        from_address:
          $ref: "#/components/schemas/Email"
        smtp:
          $ref: "#/components/schemas/SmtpSettingsInput"
        auto_reply:
          $ref: "#/components/schemas/EmailAutoReplyInput"
        broadcast_smtp:
          $ref: "#/components/schemas/SmtpSettingsInput"
          description: |
            The broadcast SMTP account. Absent keeps the stored one; its `password` absent keeps
            the stored password. Remove it with `broadcast_smtp_remove`.
        broadcast_smtp_remove:
          type: boolean
          description: "`true` removes the broadcast SMTP account; broadcasts then use `smtp`."
        broadcast_rate:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Broadcast mails a second; absent keeps the stored pace (5 for a new channel).
        dkim:
          $ref: "#/components/schemas/EmailDkimInput"
    EmailDkim:
      type: object
      description: |
        A DKIM key Yuva signs the channel's broadcast mail with. `dns_name` and `dns_value` are the
        TXT record to publish; they follow the sending domain (`from_address`, else `address`).
      required: [selector, enabled, dns_name, dns_value]
      properties:
        selector:
          type: string
        enabled:
          type: boolean
          description: Mail is signed with the key.
        dns_name:
          type: string
          examples: ["yuva._domainkey.example.com"]
        dns_value:
          type: string
          examples: ["v=DKIM1; k=rsa; p=MIIBIjANBgkqh..."]
        unsupported_reason:
          type: string
          description: |
            Why Yuva does not sign the channel's mail even when `enabled`: its broadcasts go through
            Amazon SES, which rewrites `From`, `To`, `Reply-To` and `Date` after any signature added
            before it and signs with the verified domain itself. Absent when Yuva signs.
    EmailDkimInput:
      type: object
      description: |
        Absent keeps the stored state. `enabled: true` needs a key (`POST
        /v1/channels/{id}/dkim-key`, else `400`) whose record DNS answers at `dns_name` with the
        same public key (`409 dkim_dns_missing`), and an account other than Amazon SES sending the
        broadcasts (`409 dkim_relay_unsupported`). Changing the sending domain turns signing off
        until it is enabled again for the new domain.
      required: [enabled]
      properties:
        enabled:
          type: boolean
    DkimKeyCreate:
      type: object
      required: [selector]
      properties:
        selector:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
          description: The DNS label the key is published under, such as `yuva` or `yuva2026`.
    DeliverabilityState:
      type: string
      description: |
        `queued` until the probe is sent; `sent` until it arrives; `received` when the trusted
        `Authentication-Results` were read; `unverifiable` when it arrived without them (the
        server sets no `YUVA_INGRESS_AUTHSERV_ID`, or the mail did not come through that
        receiving server), so only DNS is known; `timeout` when it did not arrive within 10
        minutes; `failed` when it could not be sent (`error`).
      enum: [queued, sent, received, unverifiable, timeout, failed]
      x-enum-varnames: [DeliverabilityQueued, DeliverabilitySent, DeliverabilityReceived, DeliverabilityUnverifiable, DeliverabilityTimeout, DeliverabilityFailed]
    AuthStatus:
      type: string
      description: |
        A result as the receiving server reported it (RFC 8601); `unknown` until it is read or
        when it was not reported.
      enum: [pass, fail, softfail, neutral, none, policy, temperror, permerror, unknown]
      x-enum-varnames: [AuthPass, AuthFail, AuthSoftfail, AuthNeutral, AuthNone, AuthPolicy, AuthTemperror, AuthPermerror, AuthUnknown]
    DeliverabilitySpf:
      type: object
      required: [status, aligned]
      properties:
        status:
          $ref: "#/components/schemas/AuthStatus"
        domain:
          type: string
          description: The envelope sender's domain the result is for (`smtp.mailfrom`).
        aligned:
          type: boolean
          description: "`domain` shares its organizational domain with `From` (DMARC relaxed alignment)."
        record:
          type: string
          description: The SPF record of the sending domain itself; absent when it has none.
    DkimSignature:
      type: object
      required: [domain, status, aligned, covers_list_unsubscribe]
      properties:
        domain:
          type: string
          description: "`d=`"
        selector:
          type: string
          description: "`s=`"
        status:
          $ref: "#/components/schemas/AuthStatus"
        aligned:
          type: boolean
          description: "`domain` shares its organizational domain with `From`."
        covers_list_unsubscribe:
          type: boolean
          description: "Its `h=` lists both `List-Unsubscribe` and `List-Unsubscribe-Post` (RFC 8058)."
    DeliverabilityDkim:
      type: object
      required: [status, aligned, covers_list_unsubscribe, signatures]
      properties:
        status:
          $ref: "#/components/schemas/AuthStatus"
          description: The result of the signature aligned with `From`, else of the first one reported.
        domain:
          type: string
        aligned:
          type: boolean
          description: A signature aligned with `From` passed.
        covers_list_unsubscribe:
          type: boolean
          description: That passing aligned signature covers `List-Unsubscribe` and `List-Unsubscribe-Post`.
        signatures:
          type: array
          description: Every DKIM signature of the probe with the receiving server's result for it.
          items:
            $ref: "#/components/schemas/DkimSignature"
    DmarcPolicy:
      type: string
      enum: [none, quarantine, reject]
      x-enum-varnames: [DmarcPolicyNone, DmarcPolicyQuarantine, DmarcPolicyReject]
    DeliverabilityDmarc:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/AuthStatus"
        policy:
          $ref: "#/components/schemas/DmarcPolicy"
        record:
          type: string
          description: The DMARC record that applies to the sending domain; absent when there is none.
    DeliverabilityMx:
      type: object
      required: [domain, hosts]
      properties:
        domain:
          type: string
          description: The domain of the channel's reply address.
        hosts:
          type: array
          description: Its MX hosts by preference; empty when it has none.
          items:
            type: string
    DeliverabilityYuvaDkim:
      type: object
      required: [selector, dns_name, published]
      properties:
        selector:
          type: string
        dns_name:
          type: string
        published:
          type: boolean
          description: DNS answers at `dns_name` with the channel's public key.
    DeliverabilityCheck:
      type: object
      required: [state, domain, spf, dkim, dmarc, created_at]
      properties:
        state:
          $ref: "#/components/schemas/DeliverabilityState"
        error:
          type: string
          description: "`failed` only: why the probe was not sent, such as the SMTP server's answer."
        domain:
          type: string
          description: The sending domain, of `From`.
        tls:
          type: boolean
          description: The probe went to the SMTP server encrypted (STARTTLS or TLS).
        spf:
          $ref: "#/components/schemas/DeliverabilitySpf"
        dkim:
          $ref: "#/components/schemas/DeliverabilityDkim"
        dmarc:
          $ref: "#/components/schemas/DeliverabilityDmarc"
        mx:
          $ref: "#/components/schemas/DeliverabilityMx"
        yuva_dkim:
          $ref: "#/components/schemas/DeliverabilityYuvaDkim"
        created_at:
          type: string
          format: date-time
        checked_at:
          type: string
          format: date-time
          description: When the probe arrived or failed.
    Channel:
      type: object
      required: [id, inbox_id, kind, name, settings, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChannelKind"
        name:
          type: string
        settings:
          $ref: "#/components/schemas/ChannelSettings"
        email:
          $ref: "#/components/schemas/EmailChannel"
        chat:
          $ref: "#/components/schemas/ChatChannel"
        app:
          $ref: "#/components/schemas/AppChannel"
        forwarding_address:
          type: string
          description: |
            `email` channels, when the server has a forwarding domain: another address the channel

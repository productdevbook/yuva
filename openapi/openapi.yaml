        inbox (`409 name_taken`).

        Owners, admins and API keys. Scope: `lists:write`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailingListCreate"
      responses:
        "201":
          description: The list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailingList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/lists/{listId}:
    get:
      operationId: getMailingList
      summary: A mailing list
      description: "Scope: `lists:read`."
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailingList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:

        `migration.progress`, on `/v1/realtime` only: the counts of a copying migration, at most
        every 2 seconds, and when it starts or stops waiting for the provider. Not stored, no id, never replayed, never a webhook;
        reload the migration after a reconnect. Delivered to owners, admins and API keys or
        tokens holding `migrations:manage`.
      required: [type, workspace_id, created_at, data]
      properties:
        type:
          type: string
          enum: [migration.progress]
        workspace_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/MigrationProgress"
    MigrationForwardingConfirmationData:
      type: object
      required: [migration_id, confirmation]
      properties:
        migration_id:
          type: string
          format: uuid
        confirmation:
          $ref: "#/components/schemas/MigrationForwardingConfirmation"
    MigrationForwardingConfirmationEvent:
      type: object
      description: |
        `migration.forwarding_confirmation`, on `/v1/realtime` only: the provider mailed a
        forwarding confirmation to the forwarding address of a migration's channel. Not stored,
        never a webhook; the migration keeps it as `forwarding_confirmation`. Delivered to owners,
        admins and API keys or tokens holding `migrations:manage`.
      required: [type, workspace_id, created_at, data]
      properties:
        type:
          type: string
          enum: [migration.forwarding_confirmation]
        workspace_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/MigrationForwardingConfirmationData"
    MigrationEventData:
      type: object
      required: [migration]
      properties:
        migration:
          $ref: "#/components/schemas/Migration"
        previous_state:
          $ref: "#/components/schemas/MigrationState"
          description: Absent when the migration was just created.
    MigrationEvent:
      type: object
      description: |
        `migration.updated`: a migration was created or changed state, delivery to Yuva was
        verified, or a forwarding confirmation arrived. Delivered to owners, admins and API keys
        or tokens holding `migrations:manage`; never a webhook.
      required: [id, type, workspace_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [migration.updated]
          x-enum-varnames: [MigrationUpdated]
        workspace_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/MigrationEventData"
    ConversationImport:
      type: object
      description: Where an imported conversation came from.
      required: [at]
      properties:
        migration_id:
          type: string
          format: uuid
          description: Absent once the migration was deleted.
        source:
          $ref: "#/components/schemas/MigrationSource"
          description: Absent once the migration was deleted.
        preset:
          $ref: "#/components/schemas/MigrationPresetId"
          description: Absent once the migration was deleted.
        at:
          type: string
          format: date-time
          description: When it was imported.
    ImportedAuthor:
      type: object
      description: An imported message's sender from the team who is not mapped to a member.
      required: [name, address]
      properties:
        name:
          type: string
        address:
          type: string
    ConversationEvent:
      type: object
      description: A conversation was created, or its status, snooze, assignee, priority, labels or subject changed.
      required: [id, type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [conversation.created, conversation.updated]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Conversation"
    ConversationMovedEvent:
      type: object
      description: |
        A conversation left this event's inbox for another one. Sent to whoever can see the old
        inbox, so it can drop the conversation; `conversation.updated` follows for the new inbox.
      required: [id, type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [conversation.moved]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
          description: The inbox it left.
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ConversationMoved"
    ConversationMoved:
      type: object
      required: [id, inbox_id, previous_inbox_id]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        previous_inbox_id:
          type: string
          format: uuid
    MessageCreatedEvent:
      type: object
      description: A message, note or event message was added to a conversation.
      required: [id, type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [message.created]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Message"
    DraftEvent:
      type: object
      description: |
        A draft was written, edited or discarded (`data` is the draft as it was). Sending a draft
        emits `message.created`.
      required: [id, type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [draft.created, draft.updated, draft.deleted]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Message"
    MessageUpdatedEvent:
      type: object
      description: A message changed, e.g. its e-mail delivery state.
      required: [id, type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [message.updated]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Message"
    ContactUpdatedEvent:
      type: object
      description: A contact changed.
      required: [id, type, workspace_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [contact.updated]
        workspace_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Contact"
    ContactDeletedEvent:
      type: object
      description: A contact was deleted with its conversations.
      required: [id, type, workspace_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [contact.deleted]
        workspace_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ContactRef"
    InboxUpdatedEvent:
      type: object
      description: An inbox's settings changed, or an import into it (`import`) started, changed state or ended.
      required: [id, type, workspace_id, inbox_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [inbox.updated]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Inbox"
    InboxCreatedEvent:
      type: object
      description: An inbox was created.
      required: [id, type, workspace_id, inbox_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [inbox.created]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Inbox"
    InboxDeletedEvent:
      type: object
      description: An inbox was deleted with its channels and conversations.
      required: [id, type, workspace_id, inbox_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [inbox.deleted]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/InboxRef"
    ConversationReadEvent:
      type: object
      description: The receiving member's read cursor moved, in this or another tab or device.
      required: [id, type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [conversation.read]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ConversationRead"
    ContactRead:
      type: object
      description: The contact's read position in a conversation.
      required: [conversation_id, last_read_message_id, read_at]
      properties:
        conversation_id:
          type: string
          format: uuid
        last_read_message_id:
          type: string
          format: uuid
        read_at:
          type: string
          format: date-time
          description: The contact has read every message created at or before this time.
    ContactReadEvent:
      type: object
      description: The contact read the conversation further, in the widget or an app.
      required: [id, type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [contact.read]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ContactRead"
    ConversationPinEvent:
      type: object
      description: The receiving member pinned or unpinned a conversation, in this or another tab or device.
      required: [id, type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [conversation.pin]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ConversationPin"
    InboxAccessChangedEvent:
      type: object
      description: A member was given or lost access to an inbox. Reload the inboxes and conversations when it is about you.
      required: [id, type, workspace_id, inbox_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [inbox_access.changed]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/InboxAccessChange"
    ContactRef:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        merged_into_id:
          type: string
          format: uuid
          description: Set on `contact.deleted` when the contact was merged into this one.
    InboxRef:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    InboxAccessChange:
      type: object
      required: [inbox_id, member_id, granted]
      properties:
        inbox_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        granted:
          type: boolean
    RealtimeReady:
      type: object
      description: The replay is over; live events follow. `last_event_id` is the stream position.
      required: [type, last_event_id]
      properties:
        type:
          type: string
          enum: [ready]
        last_event_id:
          type: integer
          format: int64
    RealtimeResyncRequired:
      type: object
      description: The requested `last_event_id` is gone; reload over HTTP. `ready` follows.
      required: [type]
      properties:
        type:
          type: string
          enum: [resync_required]
    StoredEvent:
      description: An event as `GET /v1/events` returns it, told apart by `type`; the same objects realtime and webhooks carry.
      oneOf:
        - $ref: "#/components/schemas/ConversationEvent"
        - $ref: "#/components/schemas/ConversationMovedEvent"
        - $ref: "#/components/schemas/MessageCreatedEvent"
        - $ref: "#/components/schemas/MessageUpdatedEvent"
        - $ref: "#/components/schemas/DraftEvent"
        - $ref: "#/components/schemas/ContactUpdatedEvent"
        - $ref: "#/components/schemas/ContactDeletedEvent"
        - $ref: "#/components/schemas/InboxCreatedEvent"
        - $ref: "#/components/schemas/InboxUpdatedEvent"
        - $ref: "#/components/schemas/InboxDeletedEvent"
        - $ref: "#/components/schemas/InboxAccessChangedEvent"
        - $ref: "#/components/schemas/ConversationReadEvent"
        - $ref: "#/components/schemas/ContactReadEvent"
        - $ref: "#/components/schemas/ConversationPinEvent"
        - $ref: "#/components/schemas/DiscussionEvent"
        - $ref: "#/components/schemas/SubscriptionEvent"
        - $ref: "#/components/schemas/BroadcastEvent"
        - $ref: "#/components/schemas/MigrationEvent"
        - $ref: "#/components/schemas/AnalyticsAlertEvent"
      discriminator:
        propertyName: type
        mapping:
          conversation.created: "#/components/schemas/ConversationEvent"
          conversation.updated: "#/components/schemas/ConversationEvent"
          conversation.moved: "#/components/schemas/ConversationMovedEvent"
          message.created: "#/components/schemas/MessageCreatedEvent"
          message.updated: "#/components/schemas/MessageUpdatedEvent"
          draft.created: "#/components/schemas/DraftEvent"
          draft.updated: "#/components/schemas/DraftEvent"
          draft.deleted: "#/components/schemas/DraftEvent"
          contact.updated: "#/components/schemas/ContactUpdatedEvent"
          contact.deleted: "#/components/schemas/ContactDeletedEvent"
          inbox.created: "#/components/schemas/InboxCreatedEvent"
          inbox.updated: "#/components/schemas/InboxUpdatedEvent"
          inbox.deleted: "#/components/schemas/InboxDeletedEvent"
          inbox_access.changed: "#/components/schemas/InboxAccessChangedEvent"
          conversation.read: "#/components/schemas/ConversationReadEvent"
          contact.read: "#/components/schemas/ContactReadEvent"
          conversation.pin: "#/components/schemas/ConversationPinEvent"
          discussion.created: "#/components/schemas/DiscussionEvent"
          discussion.post_created: "#/components/schemas/DiscussionEvent"
          discussion.answered: "#/components/schemas/DiscussionEvent"
          discussion.updated: "#/components/schemas/DiscussionEvent"
          subscription.created: "#/components/schemas/SubscriptionEvent"
          subscription.updated: "#/components/schemas/SubscriptionEvent"
          broadcast.updated: "#/components/schemas/BroadcastEvent"
          migration.updated: "#/components/schemas/MigrationEvent"
          analytics.alert: "#/components/schemas/AnalyticsAlertEvent"
    EventPage:
      type: object
      required: [events, next, has_more]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/StoredEvent"
        next:
          type: integer
          format: int64
          description: Send as `after` on the next call.
        has_more:
          type: boolean
          description: More events follow `next`; call again without waiting.
    EventPosition:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          description: The newest event id of the workspace; `0` when there is none.
    RealtimeMessage:
      description: One server message on `/v1/realtime`, told apart by `type`.
      oneOf:
        - $ref: "#/components/schemas/ConversationEvent"
        - $ref: "#/components/schemas/ConversationMovedEvent"
        - $ref: "#/components/schemas/MessageCreatedEvent"
        - $ref: "#/components/schemas/MessageUpdatedEvent"
        - $ref: "#/components/schemas/DraftEvent"
        - $ref: "#/components/schemas/ContactUpdatedEvent"
        - $ref: "#/components/schemas/ContactDeletedEvent"
        - $ref: "#/components/schemas/InboxCreatedEvent"
        - $ref: "#/components/schemas/InboxUpdatedEvent"
        - $ref: "#/components/schemas/InboxDeletedEvent"
        - $ref: "#/components/schemas/InboxAccessChangedEvent"
        - $ref: "#/components/schemas/ConversationReadEvent"
        - $ref: "#/components/schemas/ContactReadEvent"
        - $ref: "#/components/schemas/ConversationPinEvent"
        - $ref: "#/components/schemas/DiscussionEvent"
        - $ref: "#/components/schemas/SubscriptionEvent"
        - $ref: "#/components/schemas/BroadcastEvent"
        - $ref: "#/components/schemas/MigrationEvent"
        - $ref: "#/components/schemas/AnalyticsAlertEvent"
        - $ref: "#/components/schemas/MigrationProgressEvent"
        - $ref: "#/components/schemas/MigrationForwardingConfirmationEvent"
        - $ref: "#/components/schemas/BroadcastProgressEvent"
        - $ref: "#/components/schemas/ListImportEvent"
        - $ref: "#/components/schemas/ListImportProgressEvent"
        - $ref: "#/components/schemas/TypingEvent"
        - $ref: "#/components/schemas/MemberPresenceEvent"
        - $ref: "#/components/schemas/ContactPresenceEvent"
        - $ref: "#/components/schemas/ViewingEvent"
        - $ref: "#/components/schemas/RealtimeReady"
        - $ref: "#/components/schemas/RealtimeResyncRequired"
      discriminator:
        propertyName: type
        mapping:
          conversation.created: "#/components/schemas/ConversationEvent"
          conversation.updated: "#/components/schemas/ConversationEvent"
          conversation.moved: "#/components/schemas/ConversationMovedEvent"
          message.created: "#/components/schemas/MessageCreatedEvent"
          message.updated: "#/components/schemas/MessageUpdatedEvent"
          draft.created: "#/components/schemas/DraftEvent"
          draft.updated: "#/components/schemas/DraftEvent"
          draft.deleted: "#/components/schemas/DraftEvent"
          contact.updated: "#/components/schemas/ContactUpdatedEvent"
          contact.deleted: "#/components/schemas/ContactDeletedEvent"
          inbox.created: "#/components/schemas/InboxCreatedEvent"
          inbox.updated: "#/components/schemas/InboxUpdatedEvent"
          inbox.deleted: "#/components/schemas/InboxDeletedEvent"
          inbox_access.changed: "#/components/schemas/InboxAccessChangedEvent"
          conversation.read: "#/components/schemas/ConversationReadEvent"
          contact.read: "#/components/schemas/ContactReadEvent"
          conversation.pin: "#/components/schemas/ConversationPinEvent"
          discussion.created: "#/components/schemas/DiscussionEvent"
          discussion.post_created: "#/components/schemas/DiscussionEvent"
          discussion.answered: "#/components/schemas/DiscussionEvent"
          discussion.updated: "#/components/schemas/DiscussionEvent"
          subscription.created: "#/components/schemas/SubscriptionEvent"
          subscription.updated: "#/components/schemas/SubscriptionEvent"
          broadcast.updated: "#/components/schemas/BroadcastEvent"
          migration.updated: "#/components/schemas/MigrationEvent"
          analytics.alert: "#/components/schemas/AnalyticsAlertEvent"
          migration.progress: "#/components/schemas/MigrationProgressEvent"
          migration.forwarding_confirmation: "#/components/schemas/MigrationForwardingConfirmationEvent"
          broadcast.progress: "#/components/schemas/BroadcastProgressEvent"
          list_import.updated: "#/components/schemas/ListImportEvent"
          list_import.progress: "#/components/schemas/ListImportProgressEvent"
          typing: "#/components/schemas/TypingEvent"
          member.presence: "#/components/schemas/MemberPresenceEvent"
          contact.presence: "#/components/schemas/ContactPresenceEvent"
          viewing: "#/components/schemas/ViewingEvent"
          ready: "#/components/schemas/RealtimeReady"
          resync_required: "#/components/schemas/RealtimeResyncRequired"
    Availability:
      type: string
      description: |
        `auto`: available in `live` inboxes while connected to `/v1/realtime` within business
        hours. `away`: never shown as available.
      enum: [auto, away]
    Origin:
      type: string
      description: A web origin, `scheme://host[:port]`, without a path.
      pattern: "^https?://[^/?#\\s]+$"
      maxLength: 300
      examples: ["https://www.example.com"]
    ChatLauncherPosition:
      type: string
      enum: [right, left]
    ChatLauncher:
      type: object
      description: The floating launcher. Absent values fall back to the inbox branding.
      properties:
        position:
          $ref: "#/components/schemas/ChatLauncherPosition"
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    ChatChannel:
      type: object
      description: Settings of a `chat` (web widget) channel.
      required: [public_key, allowed_origins, allow_anonymous, ask_email_offline, greeting, launcher, discussions]
      properties:
        public_key:
          type: string
          description: |
            Identifies the channel to the widget (`channel_key`). Not a secret: it is embedded in
            web pages. Rotate it with `POST /v1/channels/{id}/public-key`.
        allowed_origins:
          type: array
          description: The only origins whose pages may use the widget, compared exactly.
          items:
            $ref: "#/components/schemas/Origin"
        allow_anonymous:
          type: boolean
          description: Visitors without an identity token may chat.
        ask_email_offline:
          type: boolean
          description: The widget asks for an e-mail address when nobody is available.
        greeting:
          type: string
          description: Shown before the first message; the inbox branding greeting when empty.
        launcher:
          $ref: "#/components/schemas/ChatLauncher"
        discussions:
          $ref: "#/components/schemas/DiscussionMode"
    ChatChannelInput:
      type: object
      required: [allowed_origins]
      properties:
        allowed_origins:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/Origin"
        allow_anonymous:
          type: boolean
          description: Defaults to false.
        ask_email_offline:
          type: boolean
          description: Defaults to true.
        greeting:
          type: string
          maxLength: 500
        launcher:
          $ref: "#/components/schemas/ChatLauncher"
        discussions:
          $ref: "#/components/schemas/DiscussionMode"
          description: Defaults to `moderated`; on an update, absent keeps the current setting.
    AppPlatform:
      type: string
      enum: [ios, android]
    AppChannel:
      type: object
      description: |
        Settings of an `app` (mobile SDKs) channel. Native apps send no `Origin`, so the key is not
        tied to origins; anonymous use is off unless allowed.
      required: [public_key, allow_anonymous, platforms]
      properties:
        public_key:
          type: string
          description: |
            Identifies the channel to the SDKs (`channel_key`). Not a secret: it ships inside the
            app. Rotate it with `POST /v1/channels/{id}/public-key`.
        allow_anonymous:
          type: boolean
          description: Users without an identity token may write.
        platforms:
          type: array
          description: The platforms the app ships on, for the panel.
          items:
            $ref: "#/components/schemas/AppPlatform"
    AppChannelInput:
      type: object
      properties:
        allow_anonymous:
          type: boolean
          description: Defaults to false.
        platforms:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: Defaults to both.
          items:
            $ref: "#/components/schemas/AppPlatform"
    ConversationKind:
      type: string
      description: |
        `feedback` conversations carry `feedback` metadata; everything else is `conversation`.
      enum: [conversation, feedback]
    FeedbackCategory:
      type: string
      enum: [bug, idea, praise, other]
    Feedback:
      type: object
      description: What a `feedback` conversation was sent with. Absent fields were not sent.
      required: [category, allow_email]
      properties:
        category:
          $ref: "#/components/schemas/FeedbackCategory"
        allow_email:
          type: boolean
          description: The contact allowed replies by e-mail.
        app_version:
          type: string
        build:

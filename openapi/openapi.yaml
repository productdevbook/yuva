      properties:
        kind:
          type: string
          enum: [metric_change, metric_new, row_change, new_value, support_hotspot]
          x-enum-varnames: [AnalyticsInsightMetricChange, AnalyticsInsightMetricNew, AnalyticsInsightRowChange, AnalyticsInsightNewValue,

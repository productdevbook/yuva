                $ref: "#/components/schemas/WebhookAttemptList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/oauth/requests/{oauthRequestId}:
    get:
      operationId: getOAuthRequest
      summary: Read a pending authorization request
      description: |
        For the consent page, with a member session. Names the client, where it redirects, the
        resource, and for each of the person's workspaces the scopes that can be granted there:
        the scopes the client asked for (every scope when it asked for none) that the person's role
        can use; `inboxes:manage`, `labels:write`, `canned_replies:write`, `webhooks:manage` and
        `workspace:manage` are not offered to agents. A request is valid for 10 minutes and once;
        afterwards, or for an unknown id, `404 not_found`.
      tags: [oauth]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/OAuthRequestId"
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthRequest"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/oauth/requests/{oauthRequestId}/approve:
    post:
      operationId: approveOAuthRequest
      summary: Approve an authorization request
      description: |
        With a member session. Grants the client the chosen scopes in the chosen workspace and
        answers the URL to send the browser to: the client's redirect URI with a `code` (single
        use, valid 60 seconds), `state` and `iss`. Scopes not offered in that workspace, or a
        workspace the person is not a member of, are refused (`400 validation_failed`,
        `403 not_a_member`).
      tags: [oauth]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/OAuthRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthApproval"
      responses:

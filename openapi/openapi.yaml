        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        locale:
          $ref: "#/components/schemas/Locale"
        invited_by:
          type: string
          format: uuid
          description: The inviting member, absent when that member was removed.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
    ApiKey:
      type: object
      required: [id, name, prefix, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The visible start of the key, `yuva_<prefix>`.
          examples: [yuva_k3x9q2mf]
        created_by:
          type: string
          format: uuid
          description: The member who created the key, absent when that member was removed.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    ApiKeyCreated:
      type: object
      required: [api_key, secret]
      properties:
        api_key:
          $ref: "#/components/schemas/ApiKey"
        secret:
          type: string
          description: The full key. It is not shown again.
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    Passkey:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
    PasskeyCeremony:
      type: object
      required: [ceremony_id, options]
      properties:
        ceremony_id:
          type: string
        options:
          type: object
          additionalProperties: true
          description: |
            WebAuthn options in their JSON form (`{"publicKey": …}`), for
            `PublicKeyCredential.parseCreationOptionsFromJSON` or
            `parseRequestOptionsFromJSON`.
    PasskeyCeremonyResult:
      type: object
      required: [ceremony_id, credential]
      properties:
        ceremony_id:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The `PublicKeyCredential` in its JSON form (`credential.toJSON()`).
    PasskeyRegistration:
      type: object
      required: [ceremony_id, credential]
      properties:
        ceremony_id:
          type: string
        name:
          type: string
          maxLength: 200
          description: A label for the passkey; defaults to "Passkey".
        credential:
          type: object
          additionalProperties: true
          description: The `PublicKeyCredential` in its JSON form (`credential.toJSON()`).
    Slug:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      minLength: 1
      maxLength: 64
      examples: [acme-app]
    LanguageTag:
      type: string
      description: A BCP 47 language tag.
      pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      maxLength: 35
      examples: [en, tr]
    InboxMode:
      type: string
      description: |
        `live` shows who is available, typing and read receipts; `async` shows the expected reply
        time instead.
      enum: [live, async]
    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
    BusinessHoursInterval:
      type: object
      required: [day, start, end]
      properties:
        day:
          $ref: "#/components/schemas/Weekday"
        start:
          type: string
          description: Local time in the inbox's timezone, `HH:MM`.
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          examples: ["09:00"]
        end:
          type: string
          description: Local time, `HH:MM` or `24:00`; after `start`.
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
          examples: ["17:30"]
    BusinessHours:
      type: object
      description: When `enabled` is false the inbox counts as always open.
      required: [enabled, intervals]
      properties:
        enabled:
          type: boolean
        intervals:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/BusinessHoursInterval"
    InboxBranding:
      type: object
      properties:
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          examples: ["#2563eb"]
        logo_url:
          type: string
          format: uri
          maxLength: 2000
        greeting:
          type: string
          maxLength: 500
    Inbox:
      type: object
      required: [id, name, slug, branding, default_locale, timezone, mode, business_hours, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          $ref: "#/components/schemas/Slug"
        branding:
          $ref: "#/components/schemas/InboxBranding"
        default_locale:
          $ref: "#/components/schemas/LanguageTag"
        timezone:
          type: string
          description: An IANA time zone name.
          examples: [Europe/Istanbul]
        mode:
          $ref: "#/components/schemas/InboxMode"
        expected_reply_minutes:
          type: integer
          format: int32
          description: Shown to contacts in `async` mode; absent when not set.
        business_hours:
          $ref: "#/components/schemas/BusinessHours"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InboxCreate:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: "#/components/schemas/Slug"
        branding:
          $ref: "#/components/schemas/InboxBranding"
        default_locale:
          $ref: "#/components/schemas/LanguageTag"
        timezone:
          type: string
          maxLength: 64
          description: Defaults to `UTC`.
        mode:
          $ref: "#/components/schemas/InboxMode"
        expected_reply_minutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 43200
        business_hours:
          $ref: "#/components/schemas/BusinessHours"
    InboxUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: "#/components/schemas/Slug"
        branding:
          $ref: "#/components/schemas/InboxBranding"
        default_locale:
          $ref: "#/components/schemas/LanguageTag"
        timezone:
          type: string
          maxLength: 64
        mode:
          $ref: "#/components/schemas/InboxMode"
        expected_reply_minutes:
          type: [integer, "null"]
          format: int32
          minimum: 1
          maximum: 43200
          description: "`null` clears it."
        business_hours:
          $ref: "#/components/schemas/BusinessHours"
    InboxCreated:
      type: object
      required: [inbox, identity_secret]
      properties:
        inbox:
          $ref: "#/components/schemas/Inbox"
        identity_secret:
          type: string
          description: Signs identity tokens (HS256). It is not shown again.
    IdentitySecret:
      type: object
      required: [identity_secret]
      properties:
        identity_secret:
          type: string
          description: Signs identity tokens (HS256). It is not shown again.
    InboxList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Inbox"
    ChannelKind:

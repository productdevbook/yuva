openapi: 3.1.1
info:
  title: Yuva API
  version: 0.1.0
  summary: Customer messaging for many products in one inbox.
  license:
    name: MIT
    identifier: MIT
  description: |
    Yuva answers every user of every product you run: e-mail, live chat and in-app
    conversations in one inbox.

    ## Surfaces

    - `/v1` is for members (panel session) and workspace API keys.
    - `/client/v1` is for the web widget and the mobile SDKs.
    - `/healthz` and `/readyz` are for load balancers and orchestrators.

    ## Errors

    Errors are `application/problem+json` documents (RFC 9457) with a stable `code`.

    ## Authentication

    - Members sign in with a one-time code sent by e-mail or with a passkey. Both set the
      `yuva_session` cookie (HttpOnly, SameSite=Lax).
    - Host backends and scripts send a workspace API key as `Authorization: Bearer <key>`. A key
      acts on its own workspace only.

    ## Workspace selection

    A member session belongs to a person, who can be a member of several workspaces. Workspace
    endpoints act on the workspace named in the `Yuva-Workspace` header; when the header is absent
    and the person belongs to exactly one workspace, that workspace is used. An API key always acts
    on its own workspace; a `Yuva-Workspace` header naming another workspace is refused.
servers:
  - url: /
security:
  - session: []
  - apiKey: []
tags:
  - name: system
    description: Health, readiness and build information.
  - name: auth
    description: Sign-in with an e-mailed code or a passkey, sign-out.
  - name: me
    description: The signed-in person and their passkeys.
  - name: workspace
    description: The current workspace, its members and invites.
  - name: api-keys
    description: Workspace API keys for host backends and scripts.
  - name: inboxes
    description: Inboxes (one per product or brand) and who may see them.
  - name: channels
    description: How messages reach an inbox. Settings only for now.
  - name: contacts
    description: The people writing in.
  - name: conversations
    description: Threads between a contact and an inbox.
  - name: messages
    description: Messages, notes, events and their attachments.
  - name: labels
    description: Workspace labels for conversations.
  - name: canned-replies
    description: Saved answers members insert into replies.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness
      description: Answers `200` while the process is running. It does not touch the database.
      tags: [system]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness
      description: Answers `200` when the server can reach its database, `503` otherwise.
      tags: [system]
      security: []
      responses:
        "200":
          description: The server is ready to take traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is not reachable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/version:
    get:
      operationId: getVersion
      summary: Server version
      description: The version of the running server build.
      tags: [system]
      security: []
      responses:
        "200":
          description: The build version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /v1/auth/code:
    post:
      operationId: requestSignInCode
      summary: Request a sign-in code
      description: |
        Sends a one-time code to the address when it belongs to a member or has a pending invite.
        The answer is the same either way, so it does not reveal whether an address is known.
        Codes expire after 10 minutes; only the most recent code of an address is accepted.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInCodeRequest"
      responses:
        "202":
          description: Accepted. A code is on its way if the address is known.
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /v1/auth/code/verify:
    post:
      operationId: verifySignInCode
      summary: Sign in with a code
      description: |
        Exchanges a valid code for a member session. Each code accepts five attempts. Pending
        invites for the address are accepted on success.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInCodeVerify"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/Problem"
  /v1/auth/passkey/options:
    post:
      operationId: beginPasskeySignIn
      summary: Start a passkey sign-in
      description: |
        Returns the options for `navigator.credentials.get()` (discoverable credentials) and a
        ceremony id to send back with the result. The ceremony expires after 5 minutes.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The ceremony options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"
  /v1/auth/passkey:
    post:
      operationId: finishPasskeySignIn
      summary: Sign in with a passkey
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyCeremonyResult"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/Problem"
  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out
      description: Ends the current member session and clears the cookie.
      tags: [auth]
      security:
        - session: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: Clears `yuva_session`.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in person
      description: The person behind the session and the workspaces they belong to.
      tags: [me]
      security:
        - session: []
      responses:
        "200":
          description: The person and their memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: Update the signed-in person
      tags: [me]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: The updated person and their memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys:
    get:
      operationId: listPasskeys
      summary: List passkeys
      tags: [me]
      security:
        - session: []
      responses:
        "200":
          description: The person's passkeys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: finishPasskeyRegistration
      summary: Register a passkey
      description: Completes a registration started with `POST /v1/me/passkeys/options`.
      tags: [me]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistration"
      responses:
        "201":
          description: The registered passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys/options:
    post:
      operationId: beginPasskeyRegistration
      summary: Start a passkey registration
      description: |
        Returns the options for `navigator.credentials.create()` and a ceremony id to send back
        with the result. The ceremony expires after 5 minutes.
      tags: [me]
      security:
        - session: []
      responses:
        "200":
          description: The ceremony options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys/{passkeyId}:
    delete:
      operationId: deletePasskey
      summary: Remove a passkey
      tags: [me]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/PasskeyId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/workspace:
    get:
      operationId: getWorkspace
      summary: The current workspace
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/members:
    get:
      operationId: listMembers
      summary: List members
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The workspace's members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/members/{memberId}:
    get:
      operationId: getMember
      summary: Get a member
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMember
      summary: Change a member's role
      description: |
        Owners and admins only, with a member session. Only an owner grants or takes away the
        `owner` role. The last owner cannot be demoted.
      tags: [workspace]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: The updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeMember
      summary: Remove a member
      description: |
        Owners and admins only, with a member session; only an owner removes an owner. The last
        owner cannot be removed.
      tags: [workspace]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/invites:
    get:
      operationId: listInvites
      summary: List pending invites
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Invites that are not accepted yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInvite
      summary: Invite a member
      description: |
        Owners and admins only, with a member session; only an owner invites an owner. Sends an
        invitation e-mail; the invite is accepted when the person signs in with a code sent to
        that address. Inviting the same address again replaces the pending invite. Invites expire
        after 7 days.
      tags: [workspace]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCreate"
      responses:
        "201":
          description: The invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/invites/{inviteId}:
    delete:
      operationId: deleteInvite
      summary: Withdraw an invite
      tags: [workspace]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InviteId"
      responses:
        "204":
          description: Withdrawn.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys
      description: Owners and admins only, with a member session. Revoked keys are included.
      tags: [api-keys]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The workspace's API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createApiKey
      summary: Create an API key
      description: |
        Owners and admins only, with a member session. The secret is returned once and stored
        only as a hash.
      tags: [api-keys]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
      responses:
        "201":
          description: The key and its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/api-keys/{apiKeyId}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Owners and admins only, with a member session. The key stops working at once.
      tags: [api-keys]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/inboxes:
    get:
      operationId: listInboxes
      summary: List inboxes
      description: |
        Owners, admins and API keys see every inbox; agents see the inboxes they were given access
        to.
      tags: [inboxes]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The visible inboxes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInbox
      summary: Create an inbox
      description: |
        Owners and admins only, with a member session. A new identity secret is generated; it is
        returned here and on rotation only, and stored encrypted.
      tags: [inboxes]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxCreate"
      responses:
        "201":
          description: The inbox and its identity secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{inboxId}:
    get:
      operationId: getInbox
      summary: Get an inbox
      description: An inbox the caller cannot see answers `404`.
      tags: [inboxes]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      responses:
        "200":
          description: The inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateInbox
      summary: Update an inbox
      description: Owners and admins only, with a member session.
      tags: [inboxes]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxUpdate"
      responses:
        "200":
          description: The updated inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inbox"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteInbox
      summary: Delete an inbox
      description: |
        Owners and admins only, with a member session. Deletes its channels, conversations,
        messages and attachments.
      tags: [inboxes]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{inboxId}/identity-secret:
    post:
      operationId: rotateInboxIdentitySecret
      summary: Rotate the identity secret
      description: |
        Owners and admins only, with a member session. Replaces the inbox's identity secret, which
        host backends use to sign identity tokens; tokens signed with the old secret stop working.
      tags: [inboxes]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      responses:
        "200":
          description: The new secret. It is not shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySecret"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{inboxId}/members:
    get:
      operationId: listInboxMembers
      summary: List members with access
      description: |
        Members granted access to this inbox. Owners and admins see every inbox without a grant and
        are not listed unless granted.
      tags: [inboxes]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      responses:
        "200":
          description: The members with access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{inboxId}/members/{memberId}:
    put:
      operationId: grantInboxAccess
      summary: Give a member access
      description: Owners and admins only, with a member session. Granting twice is a no-op.
      tags: [inboxes]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: The member has access.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeInboxAccess
      summary: Take a member's access away
      description: Owners and admins only, with a member session.
      tags: [inboxes]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: The access is gone.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/inboxes/{inboxId}/channels:
    get:
      operationId: listChannels
      summary: List an inbox's channels
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      responses:
        "200":
          description: The channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createChannel
      summary: Add a channel
      description: |
        Owners and admins only, with a member session. Settings are stored as given; the channels
        do not send or receive anything yet.
      tags: [channels]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelCreate"
      responses:
        "201":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/channels/{channelId}:
    get:
      operationId: getChannel
      summary: Get a channel
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: The channel.
          content:

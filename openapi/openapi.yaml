components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: yuva_session
      description: Member session set by a successful sign-in.
    apiKey:
      type: http
      scheme: bearer
      description: A workspace API key, `yuva_<prefix>_<secret>`.
  parameters:
    WorkspaceHeader:
      name: Yuva-Workspace
      in: header
      required: false
      description: The workspace to act on; see "Workspace selection".
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PasskeyId:
      name: passkeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InboxId:
      name: inboxId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LabelId:
      name: labelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CannedReplyId:
      name: cannedReplyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Search:
      name: q
      in: query
      description: Full-text search (Postgres `simple` configuration, `websearch` syntax).
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      description: Page size, 1 to 100; 25 by default.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    SignedIn:
      description: Signed in; the session cookie is set.
      headers:
        Set-Cookie:
          description: "`yuva_session`, HttpOnly, SameSite=Lax."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Me"
  schemas:
    Role:
      type: string
      enum: [owner, admin, agent]
    Locale:
      type: string
      description: The language of e-mails sent to the person.
      enum: [en, tr]
    Email:
      type: string
      format: email
      maxLength: 320
      examples: [owner@example.com]
    SignInCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"
    SignInCodeVerify:
      type: object
      required: [email, code]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          type: string
          pattern: "^[0-9]{6}$"
          examples: ["042917"]
    Person:
      type: object
      required: [id, email, name, locale]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
          description: Empty until the person sets it.
        locale:
          $ref: "#/components/schemas/Locale"
    Workspace:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
    Membership:
      type: object
      required: [workspace, member_id, role]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        member_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
    Me:
      type: object
      required: [person, memberships]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    MeUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 200
        locale:
          $ref: "#/components/schemas/Locale"
    Member:
      type: object
      required: [id, person_id, email, name, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
    MemberList:
      type: object

        "403":
          $ref: "#/components/responses/Problem"
  /v1/oauth/grants/{oauthGrantId}:
    delete:
      operationId: revokeOAuthGrant
      summary: Revoke a connected app
      description: |
        With a member session: a member revokes their own grants, owners and admins any grant in
        the workspace (another member's grant is `404 not_found` to an agent). Its tokens stop
        working at once.
      tags: [oauth]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/OAuthGrantId"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/events:
    get:
      operationId: listEvents
      summary: Events after a cursor
      description: |
        The events `/v1/realtime` and webhooks carry, in id order, for callers that poll instead of
        holding a WebSocket open. Each event is filtered exactly as the caller's realtime stream is:
        agents and API keys limited to inboxes see the events of the inboxes they can access, and
        `contact.updated` and `contact.deleted` also need `contacts:read`, `subscription.created` and
        `subscription.updated` `lists:read`.

        Pass the last event id you handled as `after` (`0` starts at the oldest kept event). Keep
        `next` and send it as `after` on the next call; `next` is the last event returned, or a
        later id when the events after it are ones the caller does not see. `has_more` is true
        when more events follow, so call again at once; otherwise poll later. A page can hold
        fewer than `limit` events while `has_more` is true.

        Events are kept 7 days. An `after` older than the oldest kept event answers
        `410 cursor_expired`: some events after it are gone. Reload what you need over the lists,
        then continue from `GET /v1/events/latest`'s `id`.

        Scope: `conversations:read`.
      tags: [realtime]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: after
          in: query
          required: true
          description: The last event id the caller handled; `0` for the oldest kept event.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          description: Events per page, 1 to 500; 100 by default.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: The events after `after`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
  /v1/events/latest:
    get:
      operationId: getLatestEvent
      summary: Current position of the event feed
      description: |
        The id of the workspace's newest event (`0` when there is none), whether or not the caller
        may see it. Pass it as `after` to `GET /v1/events` to receive only events from now on,
        after loading the current state over the lists.

        Scope: `conversations:read`.
      tags: [realtime]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The feed position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPosition"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties:
    get:
      operationId: listAnalyticsProperties
      summary: List analytics properties
      description: |
        The properties the caller can see, oldest first, with today's visitors (in each property's
        time zone) and the workspace's analytics usage this month: `usage.limit` is its monthly
        event cap, absent when there is none, and `usage.limit_reached_at` says when this month's
        events reached it; events over the cap are dropped until the month ends.

        Scope: `analytics:read`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The properties.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsPropertyList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAnalyticsProperty
      summary: Create an analytics property
      description: |
        A website or app to measure. The answer carries its `public_key`, which pages and apps send
        events with. `inbox_id` links the property to an inbox: agents of that inbox can then read
        it. A workspace has at most `YUVA_ANALYTICS_PROPERTIES_PER_WORKSPACE` properties
        (`403 property_limit`). A children's property (`audience: children`) cannot offer
        `consent_features` or `tracked_props`.

        Owners, admins and API keys without an inbox limit. Scope: `analytics:manage`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsPropertyCreate"
      responses:
        "201":
          description: The property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsProperty"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}:
    get:
      operationId: getAnalyticsProperty
      summary: An analytics property
      description: "Scope: `analytics:read`."
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      responses:
        "200":
          description: The property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsProperty"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateAnalyticsProperty
      summary: Update an analytics property
      description: |
        Changes the given fields. `inbox_id: null` unlinks the property from its inbox;
        `retention_months: null` keeps its rollups forever. A new `timezone` applies to events
        received from then on: finished days keep the zone they were counted in.

        Owners, admins and API keys without an inbox limit. Scope: `analytics:manage`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsPropertyUpdate"
      responses:
        "200":
          description: The updated property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsProperty"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAnalyticsProperty
      summary: Delete an analytics property
      description: |
        The body repeats the property's name exactly. Its key stops working at once (`404` on the
        collection endpoint); a background job then deletes its visits, events, rollups and salts,
        and finally the property.

        Owners, admins and API keys without an inbox limit. Scope: `analytics:manage`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsPropertyDeletion"
      responses:
        "202":
          description: The property is gone and its data is being deleted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/rotate-key:
    post:
      operationId: rotateAnalyticsKey
      summary: Give an analytics property a new public key
      description: |
        The property gets a new `public_key`. The old one keeps working for 24 hours
        (`previous_key_expires_at`), so pages and apps can be updated without losing events; a
        second rotation within that time ends the key before it at once.

        Owners, admins and API keys without an inbox limit. Scope: `analytics:manage`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      responses:
        "200":
          description: The property with its new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsProperty"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/delete-data:
    post:
      operationId: deleteAnalyticsData
      summary: Delete a property's collected data
      description: |
        Deletes the visits and events of the days `from` to `to` (dates in the property's time
        zone, at most 400 days apart), or with `all: true` every day's together with the rollups.
        The property and its key stay. A background job does the work; days it touched are rolled
        up again.

        Owners, admins and API keys without an inbox limit. Scope: `analytics:manage`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsDataDeletion"
      responses:
        "202":
          description: The data is being deleted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/query:
    post:
      operationId: queryAnalytics
      summary: Query a property's numbers
      description: |
        One query serves the panel, the API and the MCP tools: metrics over a range of the
        property's days, broken down by up to two dimensions (one of them may be a time grain) and
        narrowed by filters, with an optional comparison range. `?format=csv` answers the rows as CSV
        (one column per dimension and metric) instead.

        A visitor exists for one day (its salt does), so `visitors` over a range is the sum of each
        day's visitors; only a visitor who consented to the `persistent` feature counts once over
        the range (`AnalyticsMetric`). Finished days are read from daily rollups and open days (today, yesterday
        until it is rolled up, days with late events) from raw rows; `meta.served_from` says which.
        Totals, any single dimension, totals with one `is` filter on a visit dimension, and pages
        with one `is` filter on `channel`, `source` or `country` come from rollups. Other
        combinations need raw rows, which are kept for `YUVA_ANALYTICS_RAW_DAYS` days: a range that
        starts earlier answers `422 needs_raw_window`, with the first day that can be served in
        `raw_window_from`. Each day keeps its 1,000 most visited values of a dimension; the rest are
        added up as `(other)`.

        Events: an `event` breakdown comes from rollups without filters; a `prop` breakdown reads
        raw rows inside the raw window, for any prop key, and the rollups of the property's
        `tracked_props` before it. `segment_id` adds a saved segment's filters.

        `dataset: support` puts the linked inbox's conversations, page feedback, page ratings and
        discussions next to each page's views (`AnalyticsDataset`). `insights: true` adds fixed-rule
        `insights` to the answer.

        Queries run for at most 15 seconds and four at a time per workspace; a fifth waits up to
        two seconds and then answers `429`. Answers about finished days are cached for ten minutes,
        answers that include today for 30 seconds.

        Scope: `analytics:read`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
        - name: format
          in: query
          description: "`json` (the default) or `csv`."
          schema:
            type: string
            enum: [json, csv]
            x-enum-varnames: [AnalyticsFormatJSON, AnalyticsFormatCSV]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsQuery"
      responses:
        "200":
          description: The numbers.
          headers:
            Content-Disposition:
              description: With `format=csv`, an attachment file name.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: |
            `needs_raw_window`: the query needs raw rows for days that are no longer kept;
            `raw_window_from` is the first day it can serve. `range_too_large`: the range is longer
            than 400 days.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AnalyticsRangeProblem"
        "429":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/realtime:
    get:
      operationId: getAnalyticsRealtime
      summary: The last 30 minutes
      description: |
        Visitors and page views of the last 30 minutes, per minute, with the top pages, sources and
        countries. Cached for ten seconds.

        Scope: `analytics:read`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      responses:
        "200":
          description: The last 30 minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsRealtime"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/events:
    post:
      operationId: sendAnalyticsEvents
      summary: Send server-side analytics events
      description: |
        A host backend reports up to 100 events of its visitors, such as a signup its server
        handled, with `sdk/go/analytics` or any HTTP client. API keys only (`403 forbidden` for
        members' sessions); a key limited to inboxes reaches the properties of its inboxes. Scope:
        `analytics:write`.

        Each event names its visitor in one of two ways, neither stored:
        - `ip` and `user_agent` forwarded from the visitor's request, with `sec_ch_ua_platform`
          and `sec_ch_ua_mobile` when the request had them. They are hashed exactly as the
          collection endpoint hashes the browser's own request, so the event joins the visitor's
          browser visit of that day; the address is shortened first and used for the location,
          excluded addresses and the per-address limit like a browser's.
        - `visitor_key`, the backend's own key for the visitor (a session id, never an e-mail
          address), hashed under the day's salt like an app's process key. With it, `ip` only
          places the visitor and `user_agent` only describes the device.

        A visitor who consented to `persistent` in the browser or app can be named by the
        `persistent_id` it holds, with `consent: true`, so the event joins that visitor's days;
        `identity_token` with it identifies them, as `AnalyticsConsent` describes.

        `url` is the page (http(s), on one of the property's `domains`) or, for a property with
        `ios` or `android`, an app screen (`app://<app id>/<screen>`). A visit that a server event
        starts has platform `server`. `name` is `pageview` or a custom or built-in event with the
        rules of `AnalyticsEvent`; `engagement` is for browsers only. `timestamp` defaults to now;
        an event older than 72 hours is dropped as `late`.

        Invalid events are left out on their own and listed in `errors`; the others are taken.
        Taken but not stored, as on the collection endpoint and counted in the property's health:
        events with `dnt` or `gpc`; events of a `consent` property without `consent: true`; events
        from bots, excluded addresses or paths; events over the per-address or per-property limit
        or the workspace's monthly cap. When the server cannot take more events it answers `503`
        with `Retry-After`.
      tags: [analytics]
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsServerEvents"
      responses:
        "202":
          description: Taken; stored unless one of the rules above dropped them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEventsResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/retention:
    get:
      operationId: getAnalyticsRetention
      summary: How consented visitors come back
      description: |
        Cohorts of the visitors with a persistent id (the `persistent` consent feature): each
        cohort holds the visitors first seen in one day, week (from Monday) or month of the
        property's time zone, and `periods[n]` how many of them came back in the n-th period after
        it, `periods[0]` being the cohort itself. Days go up to 30 periods, weeks and months up to
        12. Visitors without consent are never in a cohort, so a property without the feature has
        none. The cohorts job rebuilds the numbers every hour (`built_at`); a persistent id is
        forgotten 13 months after it was first seen, so cohorts reach back at most that far.

        Scope: `analytics:read`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
        - name: grain
          in: query
          description: "`week` when absent."
          schema:
            type: string
            enum: [day, week, month]
            x-enum-varnames: [AnalyticsRetentionDay, AnalyticsRetentionWeek, AnalyticsRetentionMonth]
        - name: from
          in: query
          description: The first cohort's day; 30 days, 12 weeks or 12 months before today when absent.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: The last cohort's day; today when absent.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The cohorts, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsRetention"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: "`range_too_large`: `from` and `to` are more than 400 days apart."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/analytics/properties/{propertyId}/visitors/{persistentId}:
    delete:
      operationId: deleteAnalyticsVisitor
      summary: Delete a consented visitor's analytics
      description: |
        For a person's erasure request: deletes everything stored under a persistent id (the
        value their browser or app holds, `AnalyticsConsent.p`), its raw visits and events, its
        cohort days and its link to a contact. Days already rolled up are rolled up again without
        them. Answers `204` whether or not anything was stored under the id. Owners, admins and
        API keys without an inbox limit.

        Scope: `analytics:manage`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
        - name: persistentId
          in: path
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: "^[A-Za-z0-9_-]+$"
      responses:
        "204":
          description: Nothing is stored under the id any more.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/health:
    get:
      operationId: getAnalyticsHealth
      summary: How a property's collection is doing
      description: |
        Events accepted and dropped per day and reason (bots, rate limits, refused origins, invalid
        payloads, the monthly cap, a full buffer, exclusions), events that had something scrubbed,
        the last event, days waiting for their rollup, and the GeoIP database in use. Nothing about
        a dropped request is stored but its count. When `geoip.attribution` is present, show it
        with a link to `geoip.attribution_url` wherever locations are shown.

        Scope: `analytics:read`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
        - name: days
          in: query
          description: How many days back, today included.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: The property's collection health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsHealth"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

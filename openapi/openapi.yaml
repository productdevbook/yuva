              schema:
                $ref: "#/components/schemas/AnalyticsSubscription"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateAnalyticsSubscription
      summary: Choose my reports and alerts of a property
      description: |
        Weekly reports go out on Monday morning (08:00 in the property's time zone) about the week
        before, monthly ones on the 1st about the month before, in the member's language, to the
        member's address: plain numbers, no images, nothing that tracks opening or clicks. Alerts
        are fixed rules checked every hour (`AnalyticsAlertKind`); each alert is sent once. Member
        session only; the member must see the property.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsSubscriptionUpdate"
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSubscription"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/subscription/send-report:
    post:
      operationId: sendAnalyticsReport
      summary: Send me a report now
      description: |
        Mails the calling member the report of the last seven finished days (`weekly`) or the last
        month (`monthly`, by the subscription; `weekly` when there is none), so they see what it
        looks like. Five an hour per member (`429`). Member session only.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      responses:
        "202":
          description: The report is on its way.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/alerts:
    get:
      operationId: listAnalyticsAlerts
      summary: List a property's alerts
      description: |
        The alerts the property raised, newest first, at most 100; each also has an annotation on
        its day and an `analytics.alert` event and webhook. With `before`, older ones.

        Scope: `analytics:read`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
        - name: before
          in: query
          description: "`created_at` of the last alert of the previous page."
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsAlertList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/shares:
    get:
      operationId: listAnalyticsShares
      summary: List a property's share links
      description: |
        Newest first, revoked and expired links included (`active` tells them apart). A link's
        token is shown only once, when it is made; the list carries its first characters as
        `token_prefix`.

        Scope: `analytics:read`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      responses:
        "200":
          description: The share links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsShareList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAnalyticsShare
      summary: Make a read-only share link
      description: |
        A link anyone holding it can open at `<public URL>/share/<token>` without signing in. It
        shows only the `views` it lists, of this property only, read-only. With a `password` the
        viewer unlocks it first (`POST /client/v1/analytics-shares/{token}/access`); the password
        is stored as an argon2id hash and the token as a SHA-256 hash, so neither can be shown
        again: the answer carries the `token` and the `url` once. `expires_at` ends the link;
        `embed_origins` lists the sites whose pages may show it in an iframe (the share page's
        `frame-ancestors`); without them no other site can frame it. A property has at most 50
        links (`403 share_limit`).

        Owners, admins and API keys without an inbox limit. Scope: `analytics:manage`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsShareCreate"
      responses:
        "201":
          description: The link with its token, shown only now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsShareCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/shares/{shareId}:
    patch:
      operationId: updateAnalyticsShare
      summary: Change a share link
      description: |
        Changes the given fields; the token stays. A new `password` (or `password: null`, which
        removes it) ends every viewer's unlocked access at once. `expires_at: null` keeps the link
        until it is revoked. A revoked link cannot be changed (`409 share_revoked`).

        Owners, admins and API keys without an inbox limit. Scope: `analytics:manage`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
        - $ref: "#/components/parameters/AnalyticsShareId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsShareUpdate"
      responses:
        "200":
          description: The updated link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsShare"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAnalyticsShare
      summary: Delete a share link
      description: |
        The link stops working at once and leaves the list.

        Owners, admins and API keys without an inbox limit. Scope: `analytics:manage`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
        - $ref: "#/components/parameters/AnalyticsShareId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/shares/{shareId}/revoke:
    post:
      operationId: revokeAnalyticsShare
      summary: Revoke a share link
      description: |
        The link stops working at once and stays in the list with `revoked_at`. Revoking a revoked
        link changes nothing.

        Owners, admins and API keys without an inbox limit. Scope: `analytics:manage`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
        - $ref: "#/components/parameters/AnalyticsShareId"
      responses:
        "200":
          description: The revoked link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsShare"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/exports:
    get:
      operationId: listAnalyticsExports
      summary: List a property's exports
      description: |
        Newest first, until each expires. `raw` exports are listed only for callers who may make
        them.

        Scope: `analytics:read`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      responses:
        "200":
          description: The exports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsExportList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAnalyticsExport
      summary: Export a property's numbers or raw events
      description: |
        A background job writes the file to the server's storage; poll `getAnalyticsExport` until
        `status` is `done`, then download it with `downloadAnalyticsExport`. Files are kept seven
        days (`expires_at`) and then deleted.

        - `view`: the rows of one `query` (as `queryAnalytics` answers it, every row, no
          comparison), CSV or NDJSON.
        - `daily`: one row per day of `range` (at most 400 days) with visitors, visits, page views,
          views per visit, bounce rate, visit duration, time on page and scroll depth, broken down
          by `dimension` when given, CSV or NDJSON.
        - `raw`: every stored event of `range` (at most 31 days, inside the raw window of
          `YUVA_ANALYTICS_RAW_DAYS`, else `422 needs_raw_window`) with its visit's description, as
          NDJSON only (`AnalyticsRawEvent`). It carries no visitor hash, salt, address, contact or
          stored visit id: a visit is a number that counts up within the file. Bots are left out.
          Raw rows are pseudonymous personal data, so raw exports need `analytics:manage` and an
          owner, an admin or an API key without an inbox limit (`403`).

        CSV cells that start with `=`, `+`, `-`, `@`, a tab or a carriage return get a leading `'`
        so spreadsheets do not run them as formulas. A file larger than 1 GiB fails with
        `error` `too_large`. A workspace runs at most three exports at a time (`429 rate_limited`).

        Scope: `analytics:read`; `analytics:manage` for `raw`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsExportCreate"
      responses:
        "202":
          description: The export, queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsExport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: "`needs_raw_window` or `range_too_large`: the range cannot be exported."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AnalyticsRangeProblem"
        "429":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/exports/{exportId}:
    get:
      operationId: getAnalyticsExport
      summary: An export and its progress
      description: "Scope: `analytics:read`; `analytics:manage` for `raw`."
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
        - $ref: "#/components/parameters/AnalyticsExportId"
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsExport"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAnalyticsExport
      summary: Delete an export
      description: |
        Deletes the export and its file before it expires; one still running stops at its next
        step.

        Scope: `analytics:read`; `analytics:manage` for `raw`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
        - $ref: "#/components/parameters/AnalyticsExportId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/analytics/properties/{propertyId}/exports/{exportId}/download:
    get:
      operationId: downloadAnalyticsExport
      summary: Download an export's file
      description: |
        `text/csv` or `application/x-ndjson`, always as a download (`Content-Disposition:
        attachment`). An export that is not `done` answers `409 export_not_ready`; an expired or
        deleted one `404`. Links cannot carry headers, so the workspace can also be named with the
        `workspace_id` query parameter instead of `Yuva-Workspace`.

        Scope: `analytics:read`; `analytics:manage` for `raw`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
        - $ref: "#/components/parameters/AnalyticsExportId"
        - name: workspace_id
          in: query
          description: The workspace to act on, for links that cannot send `Yuva-Workspace`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The file. NDJSON has one JSON object per line, `AnalyticsRawEvent` for `raw`.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/AnalyticsRawEvent"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/realtime:
    get:
      operationId: realtime
      summary: Live events (WebSocket)
      description: |
        Upgrades to a WebSocket that streams the workspace's events as they are committed. Members
        authenticate with the session cookie; the `Origin` header must then be the server's public
        origin (or one of the configured WebAuthn origins). API keys and OAuth access tokens send
        `Authorization: Bearer <key>`. Browsers cannot set headers on a WebSocket, so the workspace
        can also be named with the `workspace_id` query parameter instead of `Yuva-Workspace`.

        Every server message is one JSON text frame matching `RealtimeMessage`. Events carry an
        increasing `id`; within a workspace ids are in commit order. Owners, admins and API keys
        receive every event of the workspace. Agents, and API keys limited to inboxes, receive the
        events of the inboxes they can access and contact events; agents also get
        `inbox_access.changed` events about themselves. Access is re-read when such an event
        arrives and every 30 seconds. An API key or token needs `conversations:read`, and contact
        events reach it only with `contacts:read`. `inbox.created` reaches owners,
        admins and API keys (an agent learns of a new inbox from `inbox_access.changed`);
        `inbox.deleted` reaches everyone who could see the inbox. `conversation.read` and
        `conversation.pin` reach only the connections of the member who read or pinned. `typing` (a contact or another member typing) has no
        `id`, is not stored and is not replayed. `member.presence` (a member of the workspace opened
        or closed the panel or changed `availability`) reaches member sessions only, also has no
        `id` and is not replayed; so does `viewing` (another member opened or left a conversation),
        which follows inbox access like conversation events. `contact.presence` (a contact
        connected to or disconnected from `/client/v1/realtime`) follows contact events, also has no
        `id` and is not replayed. `contact.read` (the contact read the conversation up to a
        message) follows conversation events.

        A member session's open connection also makes the member available to contacts of `live`
        inboxes they can access (see `availability` on `/v1/me`).

        Resuming: after the replay (if any) the server sends `ready` with `last_event_id`, the
        stream position at that moment. Remember the larger of that value and the `id` of every
        event received, and reconnect with `?last_event_id=<it>`. The server then replays the
        events after it, without gaps or duplicates, before the live ones. Events are kept for 7
        days; when `last_event_id` is no longer known the server sends `resync_required` (reload
        everything over HTTP) followed by `ready` and continues live. Without `last_event_id` there
        is no replay.

        The server pings every 30 seconds. A member's panel reports the conversation it shows with
        a text frame `{"type": "viewing", "conversation_id": "<id>"}`, and
        `{"type": "viewing", "conversation_id": null}` when it shows none or the page is hidden;
        send it again after every reconnect. While a connection of the member views a
        conversation, the member gets no push or e-mail notification about it. Other members who
        can see the conversation get a `viewing` event when the member opens or leaves it, and
        the reporting connection gets a `viewing` event for each other member already there.
        Other client frames are ignored. Close codes: 1008 (`unauthenticated`, `forbidden`) when the session
        or membership ends, 1013 (`slow_consumer`) when the client does not read fast enough, 1012
        (`restart`) when the server restarts or loses its event feed. Reconnect with
        `last_event_id` after any of them except 1008. While the server is reconnecting its own event
        feed the upgrade is refused with 503 `realtime_unavailable`; retry with backoff.
      tags: [realtime]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: workspace_id
          in: query
          description: The workspace to act on, for clients that cannot send `Yuva-Workspace`.
          schema:
            type: string
            format: uuid
        - name: last_event_id
          in: query
          description: Replay the events after this one before streaming live ones.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "101":
          description: |
            Switching to the WebSocket protocol. Each text frame is one `RealtimeMessage`; the
            content below describes a frame, not an HTTP body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /client/v1/session:
    post:
      operationId: createClientSession
      summary: Start a contact session
      description: |
        Exchanges a channel's public key, and optionally an identity token or a visitor id, for a
        contact session. Send the returned `token` as `Authorization: Bearer <token>` on every other
        `/client/v1` request and on `/client/v1/realtime`. Sessions last 7 days after their last
        use.

        - With `identity_token` (a JWT, HS256, signed by the host backend with the inbox's identity
          secret; see `sdk/go`): the contact is found by `sub` (the host's user id, per inbox),
          then by the token's `email` when it carries `email_verified: true` and that contact has
          no external id in this inbox, or created. `name`, `locale` and `attrs` from the token
          are saved on the contact; a verified `email` becomes one of its addresses, an unverified
          one is kept like a typed address and never used to find a contact. `exp` is required and at most 10 minutes ahead; tokens
          with another `alg`, a wrong signature or a missing or past `exp`, and a token whose
          `jti` was already used, answer `401 invalid_identity_token`. When `visitor_id` names an anonymous visitor of this inbox,
          that visitor's conversations move to the identified contact and the visitor id ends.
        - Without it, the visitor is anonymous, which the channel must allow
          (`403 anonymous_not_allowed` otherwise). `visitor_id` from an earlier session of this
          inbox resumes that visitor and their conversations; an unknown or ended one starts a new
          visitor. Keep the returned `visitor_id` (e.g. in `localStorage`) and send it next time.

        For a `chat` channel, browsers must call from one of the channel's allowed origins
        (`403 origin_not_allowed`, also without an `Origin` header); an `app` channel's key needs no
        origin. Requests are rate limited per IP address and per channel (`429 rate_limited`), and an
        IP address starts at most `YUVA_ANONYMOUS_CONTACTS_PER_HOUR` new anonymous visitors per
        channel and hour (default 20; `429 anonymous_limit`; resuming a visitor does not count). A
        blocked contact answers `403 contact_blocked`.
      tags: [client]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientSessionCreate"
      responses:
        "201":
          description: The session, the contact and the inbox's public settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSession"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
    get:
      operationId: getClientSession
      summary: The current contact session
      description: The contact and the inbox's public settings with the current presence, without the token.
      tags: [client]
      security:
        - contactSession: []
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSessionInfo"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteClientSession
      summary: End the contact session
      description: Ends the session, e.g. when the host app's user signs out.
      tags: [client]
      security:
        - contactSession: []
      responses:
        "204":
          description: Ended.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /client/v1/channels/{channel_key}:
    get:
      operationId: getClientChannel
      summary: A chat or app channel's public settings
      description: |
        The inbox's public settings for a `chat` or `app` channel's public key, without a session:
        name, branding, mode, business hours, presence or the expected reply time, the chat
        settings and the feedback categories. Nothing is created, so a widget can show its
        launcher and greeting before the visitor writes and start a session
        (`POST /client/v1/session`) only then.

        For a `chat` channel, browsers must call from one of the channel's allowed origins
        (`403 origin_not_allowed`, also without an `Origin` header); an `app` channel's key needs no
        origin. Requests are rate limited per IP address (`429 rate_limited`).

        A widget that gets `403 origin_not_allowed` is embedded on a page the channel does not
        allow: it should show nothing (no launcher, no offline notice), not retry, and leave a
        console message naming the origin. Every other `/client/v1` call from that page is refused
        the same way, so there is nothing it could offer. `404` (unknown key) is treated alike;
        network errors and `429` are worth retrying.
      tags: [client]
      security: []
      parameters:
        - name: channel_key
          in: path
          required: true
          description: The chat or app channel's public key.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: The inbox's public settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientInbox"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/channels/{channel_key}/page-ratings:
    post:
      operationId: createPageRating
      summary: Rate a documentation page
      description: |
        Counts one `up` or `down` for a documentation page on a `chat` channel's public key, without
        a session. Nothing about the visitor is stored and no contact or conversation is created:
        ratings are a per-page, per-day counter. The page is the URL without query and fragment;
        its origin must be one of the channel's allowed origins (`400 page_origin`). `title` is
        what the page shows as its title; the latest one is kept.

        A visitor who changes their mind sends the new `rating` with the one they gave before as
        `previous`: the previous count goes down by one (on the latest day that has one, within 90
        days) and the new one up. The same `rating` as `previous` changes nothing.

        Browsers must call from one of the channel's allowed origins (`403 origin_not_allowed`).
        Requests are rate limited per IP address and per channel like session starts
        (`429 rate_limited`). An `app` channel's key answers `404`.
      tags: [client]
      security: []
      parameters:
        - $ref: "#/components/parameters/ChannelKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageRatingCreate"
      responses:
        "204":
          description: Counted.
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/channels/{channel_key}/discussions:
    get:
      operationId: listClientDiscussions
      summary: A documentation page's discussion threads
      description: |
        The published threads of a page in the channel's inbox, without a session. The page is
        matched without query and fragment, and its origin must be one of the channel's allowed
        origins (`400 page_origin`). A channel with discussions off answers `403 discussions_off`.

        `sort`: `new` (default, newest first), `top` (most votes first) or `unanswered` (threads
        without an accepted answer only, those nobody replied to first, then newest).

        Authors are shown by display name and initials only. Without `Authorization` the answer may
        be cached for a minute (`Cache-Control: public, max-age=60`). With a reader token or a contact
        session of this channel the caller's own threads still waiting for a member are included and
        `mine`, `voted` and `following` are filled in; that answer is not cached (`private, no-store`).
        An unknown or expired token answers `401`.

        Browsers must call from one of the channel's allowed origins (`403 origin_not_allowed`).
        Rate limited per IP address (`429 rate_limited`). An `app` channel's key answers `404`.
      tags: [client]
      security:
        - {}
        - readerToken: []
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/ChannelKey"
        - name: page
          in: query
          required: true
          description: The page's URL.

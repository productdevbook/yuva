        workspace still waiting for approval, and makes the author's later posts wait for a member
        whatever the channel's setting. A member's post answers `400 validation_failed`.
        Member sessions only.
      tags: [discussions]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/DiscussionPostId"
      responses:
        "200":
          description: The hidden post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscussionPost"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/discussion-posts/{postId}/vote:
    put:
      operationId: voteDiscussionPost
      summary: Vote for a post as a member
      description: |
        One vote per member and post (the opening post votes for the thread); voting again changes
        nothing. Member sessions only.
      tags: [discussions]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/DiscussionPostId"
      responses:
        "200":
          description: The post with its vote count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscussionPost"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unvoteDiscussionPost
      summary: Take a member's vote back
      description: Member sessions only.
      tags: [discussions]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/DiscussionPostId"
      responses:
        "200":
          description: The post with its vote count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscussionPost"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/lists:
    get:
      operationId: listMailingLists
      summary: List mailing lists
      description: |
        The lists of the inboxes the caller can see, newest first, with their subscription counts.
        Archived lists are left out unless `archived=true`, which lists only them.

        Scope: `lists:read`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: inbox_id
          in: query
          schema:
            type: string
            format: uuid
        - name: archived
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailingListPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMailingList
      summary: Create a mailing list
      description: |
        A list of an inbox. `channel_id` names the inbox's e-mail channel that sends the list's
        confirmation and welcome mails; it must be an e-mail channel of the same inbox with an SMTP
        account (`409 email_channel_required`). A list without one still takes subscribers from the

      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DiscussionPostItem"
        next_cursor:
          type: string
          description: Absent on the last page.
    DiscussionCreate:
      type: object
      required: [channel_id, page_url, title, body]
      properties:
        channel_id:
          type: string
          format: uuid
          description: A chat channel that allows the page's origin.
        page_url:
          type: string
          maxLength: 2000
        page_title:
          type: string
          maxLength: 300
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 20000
          description: Markdown.
    ClientDiscussionCreate:
      type: object
      required: [page_url, title, body]
      properties:
        page_url:
          type: string
          maxLength: 2000
          description: The page's absolute URL; query and fragment are dropped.
        page_title:
          type: string
          maxLength: 300
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 20000
          description: Markdown.
    DiscussionUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        locked:
          type: boolean
    DiscussionPostCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
          description: Markdown.
        parent_post_id:
          type: string
          format: uuid
          description: A reply to the thread (not the opening post) to answer; absent for a reply to the thread.
    DiscussionPostUpdate:
      type: object
      minProperties: 1
      properties:
        state:
          type: string
          enum: [published, hidden]
        body:
          type: string
          minLength: 1
          maxLength: 20000
        title:
          type: string
          minLength: 3
          maxLength: 200
          description: Opening post only.
    ClientDiscussionPostUpdate:
      type: object
      minProperties: 1
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
        title:
          type: string
          minLength: 3
          maxLength: 200
          description: Opening post only.
    DiscussionAnswer:
      type: object
      required: [post_id]
      properties:
        post_id:
          type: string
          format: uuid
    DiscussionFromConversation:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 20000
          description: The public question, as the member edits it (Markdown).
        answer:
          type: string
          minLength: 1
          maxLength: 20000
          description: Posted by the member and marked as the accepted answer.
        page_url:
          type: string
          maxLength: 2000
          description: The page, when the conversation has none or another one is meant.
        page_title:
          type: string
          maxLength: 300
    DiscussionEventData:
      type: object
      required: [discussion]
      properties:
        discussion:
          $ref: "#/components/schemas/Discussion"
        post:
          $ref: "#/components/schemas/DiscussionPost"
          description: The post the event is about; absent for changes to the thread alone.
    DiscussionEvent:
      type: object
      description: |
        `discussion.created`: a thread was started (also when it waits for approval: see `state`).
        `discussion.post_created`: a reply was written, with the reply in `post`.
        `discussion.answered`: an answer was accepted, with it in `post`.
        `discussion.updated`: a post or the thread was approved, hidden, marked spam, edited,
        deleted, locked or unlocked, or the answer was cleared; `post` names the post when one
        changed.
      required: [id, type, workspace_id, inbox_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [discussion.created, discussion.post_created, discussion.answered, discussion.updated]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/DiscussionEventData"
    WebhookDiscussionPayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/DiscussionEventData"
    BroadcastState:
      type: string
      description: |
        `draft` → `scheduled` (until `scheduled_at`) → `preparing` (taking the audience) →
        `sending` → `sent`. `paused` stops sending until resumed; `cancelled` ends it for good;
        `failed` when it cannot go on (its channel was removed).
      enum: [draft, scheduled, preparing, sending, paused, sent, cancelled, failed]
    BroadcastPauseReason:
      type: string
      description: |
        `member`: someone paused it. `bounce_rate`: 5% or more of the mails sent since it started
        or was resumed bounced (after at least 200). `complaint_rate`: 0.3% or more were reported as
        spam (after at least 1,000). `sender_error`: the SMTP server refused the account, its TLS or
        too many mails in a row (`state_detail` has its answer). `workspace_suspended`: the
        workspace was suspended from sending. `operator`: the server's operator paused it.
      enum: [member, bounce_rate, complaint_rate, sender_error, workspace_suspended, operator]
    BroadcastConditionOp:
      type: string
      description: |
        Compares the contact attribute named by `attribute`: `eq`, `neq`, `contains` (text,
        ignoring case) and `gt`, `lt` (as numbers when both sides are numbers, else as text) with
        `value`; `in` with any of `values`; `exists` and `not_exists` with nothing. A contact
        without the attribute matches only `neq` and `not_exists`.
      enum: [eq, neq, exists, not_exists, contains, gt, lt, in]
      x-enum-varnames: [ConditionEq, ConditionNeq, ConditionExists, ConditionNotExists, ConditionContains, ConditionGt, ConditionLt, ConditionIn]
    BroadcastCondition:
      type: object
      required: [attribute, op]
      properties:
        attribute:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
        op:
          $ref: "#/components/schemas/BroadcastConditionOp"
        value:
          type: string
          maxLength: 500
        values:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 500
    BroadcastAudience:
      type: object
      required: [list_ids, conditions, locales]
      properties:
        list_ids:
          type: array
          description: Lists of the broadcast's inbox, in order of preference for a contact on several.
          maxItems: 10
          items:
            type: string
            format: uuid
        conditions:
          type: array
          description: Every condition must match.
          maxItems: 10
          items:
            $ref: "#/components/schemas/BroadcastCondition"
        locales:
          type: array
          description: Keep only contacts whose language is one of these (`tr` also matches `tr-TR`); empty keeps every language.
          maxItems: 20
          items:
            $ref: "#/components/schemas/LanguageTag"
    BroadcastAudienceInput:
      type: object
      required: [list_ids]
      properties:
        list_ids:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
        conditions:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/BroadcastCondition"
        locales:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/LanguageTag"
    BroadcastSkipped:
      type: object
      description: |
        Recipients left out: when the audience was taken (`suppressed`, `opted_out`) or later,
        before their mail went out (`unsubscribed`, `suppressed`, `opted_out`, `cancelled`).
      required: [suppressed, opted_out, unsubscribed, cancelled]
      properties:
        suppressed:
          type: integer
          format: int64
        opted_out:
          type: integer
          format: int64
        unsubscribed:
          type: integer
          format: int64
        cancelled:
          type: integer
          format: int64
    BroadcastCounts:
      type: object
      description: |
        `recipients` is the audience taken when sending started; `queued` the mails still to go
        out. `sent` counts mails the SMTP server accepted; `failed` those it refused for good
        without naming a bad address. `bounced` and `complained` count recipients whose mail
        bounced or who reported it as spam, `unsubscribed` those who left a list through this
        broadcast's links, `replied` those who answered (a conversation), `auto_replied` the
        automatic answers (out of office), `clicked` recipients who opened a link (click tracking
        only).
      required: [recipients, queued, sent, failed, bounced, complained, unsubscribed, replied, auto_replied, clicked, skipped]
      properties:
        recipients:
          type: integer
          format: int64
        prepared:
          type: integer
          format: int64
          description: "`preparing` only: recipients taken so far."
        queued:
          type: integer
          format: int64
        sent:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        bounced:
          type: integer
          format: int64
        complained:
          type: integer
          format: int64
        unsubscribed:
          type: integer
          format: int64
        replied:
          type: integer
          format: int64
        auto_replied:
          type: integer
          format: int64
        clicked:
          type: integer
          format: int64
        skipped:
          $ref: "#/components/schemas/BroadcastSkipped"
    Broadcast:
      type: object
      required: [id, inbox_id, name, subject, preheader, audience, click_tracking, utm, utm_campaign, state, counts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
          description: The inbox's e-mail channel it goes out through; absent until chosen or when removed.
        name:
          type: string
          description: Shown to the team only.
        subject:
          type: string
          description: May hold merge fields.
        preheader:
          type: string
          description: The preview text after the subject; the design's own when empty.
        design_id:
          type: string
          format: uuid
        design_version:
          type: integer
          format: int32
          description: The design's version frozen when it was scheduled; later edits to the design do not change it.
        audience:
          $ref: "#/components/schemas/BroadcastAudience"
        click_tracking:
          type: boolean
          description: Links go through `/c/{token}` on the server's link domain and unique clicks are counted. Off by default.
        utm:
          type: boolean
          description: |
            Links to the web get `utm_source=newsletter`, `utm_medium=email` and
            `utm_campaign=<utm_campaign>` (a link that has a `utm_` parameter of its own keeps its
            own), so Analytics counts the visits of the campaign. On by default.
        utm_campaign:
          type: string
          description: The campaign's name in links; made from `name` when the broadcast is created.
        state:
          $ref: "#/components/schemas/BroadcastState"
        pause_reason:
          $ref: "#/components/schemas/BroadcastPauseReason"
        state_detail:
          type: string
          description: Why it paused or failed, in words (an SMTP answer, the rates).
        scheduled_at:
          type: string
          format: date-time
          description: When sending starts or started.
        waiting_until:
          type: string
          format: date-time
          description: The workspace's daily limit is reached; sending continues at this time (the next 00:00 UTC).
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        last_test_at:
          type: string
          format: date-time
        counts:
          $ref: "#/components/schemas/BroadcastCounts"
        created_by:
          type: string
          format: uuid
          description: The member who created it.
        scheduled_by:
          type: string
          format: uuid
          description: The member who scheduled it.
        scheduled_by_api_key:
          type: string
          format: uuid
          description: The API key that scheduled it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BroadcastRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    BroadcastCreate:
      type: object
      required: [inbox_id, name]
      properties:
        inbox_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        subject:
          type: string
          maxLength: 300
        preheader:
          type: string
          maxLength: 300
        design_id:
          type: string
          format: uuid
        audience:
          $ref: "#/components/schemas/BroadcastAudienceInput"
        click_tracking:
          type: boolean
        utm:
          type: boolean
          description: On when absent at creation.
        utm_campaign:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9][a-z0-9_.-]*$"
          description: Lowercase letters, digits, `-`, `_` and `.`; made from `name` when absent at creation.
    BroadcastUpdate:
      type: object
      minProperties: 1
      properties:
        channel_id:
          type: [string, "null"]
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        subject:
          type: string
          maxLength: 300
        preheader:
          type: string
          maxLength: 300
        design_id:
          type: [string, "null"]
          format: uuid
        audience:
          $ref: "#/components/schemas/BroadcastAudienceInput"
        click_tracking:
          type: boolean
        utm:
          type: boolean
          description: On when absent at creation.
        utm_campaign:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9][a-z0-9_.-]*$"
          description: Lowercase letters, digits, `-`, `_` and `.`; made from `name` when absent at creation.
    BroadcastPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Broadcast"
        next_cursor:
          type: string
    BroadcastAudienceExcluded:
      type: object
      description: |
        Contacts of the lists who would not get the mail: only `unsubscribed` or only `pending` on
        the lists, `suppressed` (the address bounced or complained), `opted_out` (objected to all
        mail from the workspace), `blocked` contacts, `filtered` (a condition or language does not
        match) and `duplicate` (subscriptions beyond the one mail a contact gets).
      required: [unsubscribed, pending, suppressed, opted_out, blocked, filtered, duplicate]
      properties:
        unsubscribed:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        suppressed:
          type: integer
          format: int64
        opted_out:
          type: integer
          format: int64
        blocked:
          type: integer
          format: int64
        filtered:
          type: integer
          format: int64
        duplicate:
          type: integer
          format: int64
    BroadcastListCount:
      type: object
      required: [list_id, recipients]
      properties:
        list_id:
          type: string
          format: uuid
        recipients:
          type: integer
          format: int64
    BroadcastAudienceCount:
      type: object
      required: [recipients, excluded, missing_merge_fields, by_list]
      properties:
        recipients:
          type: integer
          format: int64
        excluded:
          $ref: "#/components/schemas/BroadcastAudienceExcluded"
        missing_merge_fields:
          type: object
          description: Per merge field without a fallback (`contact.first_name`), the recipients it would be empty for.
          additionalProperties:
            type: integer
            format: int64
        by_list:
          type: array
          description: Recipients by the list their mail goes out under.
          items:
            $ref: "#/components/schemas/BroadcastListCount"
    BroadcastReviewKey:
      type: string
      enum: [sender_identity, sender_ready, approval, design, audience_nonempty, merge_fields, html_size, images_alt, links, subject, deliverability, daily_cap, test_sent, click_tracking]
    BroadcastReviewStatus:
      type: string
      enum: [ok, warning, blocking]
      x-enum-varnames: [ReviewOk, ReviewWarning, ReviewBlocking]
    BroadcastReviewItem:
      type: object
      required: [key, status]
      properties:
        key:
          $ref: "#/components/schemas/BroadcastReviewKey"
        status:
          $ref: "#/components/schemas/BroadcastReviewStatus"
        detail:
          type: string
          description: What is wrong or what to know, in English.
    BroadcastReview:
      type: object
      required: [ready, recipients, items]
      properties:
        ready:
          type: boolean
          description: No item is `blocking`.
        recipients:
          type: integer
          format: int64
          description: The audience count the review used; pass it as `confirm_recipients` to schedule only this audience.
        html_bytes:
          type: integer
          format: int32
        days:
          type: integer
          format: int32
          description: How many UTC days sending takes under the workspace's daily limit; absent without a limit.
        items:
          type: array
          items:
            $ref: "#/components/schemas/BroadcastReviewItem"
    BroadcastProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            items:
              type: array
              description: "`review_failed` only: the blocking review items."
              items:
                $ref: "#/components/schemas/BroadcastReviewItem"
            recipients:
              type: integer
              format: int64
              description: "`audience_changed` only: the audience count now."
    BroadcastTest:
      type: object
      properties:
        member_ids:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: uuid
        contact_id:
          type: string
          format: uuid
    BroadcastTestResult:
      type: object
      required: [sent_to]
      properties:
        sent_to:
          type: array
          items:
            $ref: "#/components/schemas/Email"
    BroadcastSchedule:
      type: object
      properties:
        send_at:
          type: string
          format: date-time
        confirm_recipients:
          type: integer
          format: int64
          minimum: 0
    BroadcastDeliveryState:
      type: string
      description: |
        `queued` until sent (temporary SMTP failures are retried after 5 minutes, 30 minutes, 2
        hours and 6 hours), then `sent`, `failed` (refused for good or out of retries), `bounced`,
        `complained`; `skipped` when the recipient left before their mail went out or the broadcast
        was cancelled.
      enum: [queued, sent, failed, bounced, complained, skipped]
    BroadcastSkipReason:
      type: string
      enum: [suppressed, opted_out, unsubscribed, cancelled]
    BroadcastDelivery:
      type: object
      required: [id, contact, email, state, attempts, created_at]
      properties:
        id:
          type: string
          format: uuid
        contact:
          $ref: "#/components/schemas/SubscriptionContact"
        email:
          $ref: "#/components/schemas/Email"
        list_id:
          type: string
          format: uuid
          description: The list the mail went out under; absent when the list was deleted.
        state:
          $ref: "#/components/schemas/BroadcastDeliveryState"
        skip_reason:
          $ref: "#/components/schemas/BroadcastSkipReason"
        error:
          type: string
          description: The SMTP server's answer when it refused the mail or the last retry failed.
        attempts:
          type: integer
          format: int32
        sent_at:
          type: string
          format: date-time
        bounced_at:
          type: string
          format: date-time
        complained_at:
          type: string
          format: date-time
        unsubscribed_at:
          type: string
          format: date-time
        replied_at:
          type: string
          format: date-time
        auto_replied_at:
          type: string
          format: date-time
        clicked_at:
          type: string
          format: date-time
        conversation_id:
          type: string
          format: uuid
          description: The conversation the recipient's reply opened.
        created_at:
          type: string
          format: date-time
    BroadcastDeliveryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BroadcastDelivery"
        next_cursor:
          type: string
    BroadcastRates:
      type: object
      description: Shares of `sent`, from 0 to 1; all 0 before anything was sent.
      required: [bounced, complained, unsubscribed, replied, clicked]
      properties:
        bounced:
          type: number
          format: double
        complained:
          type: number
          format: double
        unsubscribed:
          type: number
          format: double
        replied:
          type: number
          format: double
        clicked:
          type: number
          format: double
    BroadcastReportPoint:
      type: object
      required: [at, sent, bounced, complained, unsubscribed, replied, clicked]
      properties:
        at:
          type: string
          format: date-time
          description: The start of the hour or UTC day.
        sent:
          type: integer
          format: int64
        bounced:
          type: integer
          format: int64
        complained:
          type: integer
          format: int64
        unsubscribed:
          type: integer
          format: int64
        replied:
          type: integer
          format: int64
        clicked:
          type: integer
          format: int64
    BroadcastReportLink:
      type: object
      required: [url, clicks]
      properties:
        url:
          type: string
        clicks:
          type: integer
          format: int64
          description: Recipients who opened it.
    BroadcastReportReply:
      type: object
      required: [conversation_id, contact, at]
      properties:
        conversation_id:
          type: string
          format: uuid
        contact:
          $ref: "#/components/schemas/SubscriptionContact"
        at:
          type: string
          format: date-time
    BroadcastReport:
      type: object
      required: [broadcast_id, counts, rates, timeline, replies]
      properties:
        broadcast_id:
          type: string
          format: uuid
        counts:
          $ref: "#/components/schemas/BroadcastCounts"
        rates:
          $ref: "#/components/schemas/BroadcastRates"
        timeline:
          type: array
          description: Per hour for the first 72 hours after sending started, then per UTC day; only periods with something in them.
          items:
            $ref: "#/components/schemas/BroadcastReportPoint"
        links:
          type: array
          description: Click tracking only, most clicked first.
          items:
            $ref: "#/components/schemas/BroadcastReportLink"
        replies:
          type: array
          description: The first 50 conversations opened by replies.
          items:
            $ref: "#/components/schemas/BroadcastReportReply"
        campaign_visits:
          type: array
          description: |
            With `utm` and the scope `analytics:read`: per Analytics property the caller sees, the
            visits whose `utm_campaign` is the broadcast's, from the day sending started; only
            properties with any.
          items:
            $ref: "#/components/schemas/BroadcastCampaignVisits"
    BroadcastCampaignVisits:
      type: object
      required: [property_id, property_name, visitors, visits, pageviews]
      properties:
        property_id:
          type: string
          format: uuid
        property_name:
          type: string
        visitors:
          type: integer
          format: int64
        visits:
          type: integer
          format: int64
        pageviews:
          type: integer
          format: int64
    BroadcastEventData:
      type: object
      required: [broadcast]
      properties:
        broadcast:
          $ref: "#/components/schemas/Broadcast"
        previous_state:
          $ref: "#/components/schemas/BroadcastState"
    BroadcastEvent:
      type: object
      description: |
        `broadcast.updated`: the broadcast changed state. Delivered to callers who hold
        `broadcasts:read` and can see its inbox.
      required: [id, type, workspace_id, inbox_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [broadcast.updated]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/BroadcastEventData"
    BroadcastProgress:
      type: object
      required: [id, state, counts]
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/BroadcastState"
        counts:
          $ref: "#/components/schemas/BroadcastCounts"
        waiting_until:
          type: string
          format: date-time
    BroadcastProgressEvent:
      type: object
      description: |
        `broadcast.progress`, on `/v1/realtime` only: the counts of a preparing or sending broadcast,
        at most every 5 seconds. Not stored, no id, never replayed; reload the broadcast after a
        reconnect.
      required: [type, workspace_id, inbox_id, created_at, data]
      properties:
        type:
          type: string
          enum: [broadcast.progress]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/BroadcastProgress"
    WebhookBroadcastData:
      type: object
      required: [broadcast]
      properties:
        broadcast:
          $ref: "#/components/schemas/Broadcast"
        previous_state:
          $ref: "#/components/schemas/BroadcastState"
    WebhookBroadcastPayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/WebhookBroadcastData"
    BroadcastsMode:
      type: string
      description: |
        The server's `YUVA_BROADCASTS`: `on`, `approval` (a workspace sends only after the
        operator approves it, then within a warm-up limit) or `off` (no broadcasts; lists and forms
        still work).
      enum: ["on", approval, "off"]
    BroadcastsStatus:
      type: string
      description: |
        `allowed`; `approval_required` (ask with `POST /v1/workspace/broadcast-approval`);
        `approval_requested` (waiting for the operator); `suspended` (the operator suspended it,
        or 0.3% of its broadcast mail in the last 30 days was reported as spam).
      enum: [allowed, approval_required, approval_requested, suspended]
    WorkspaceBroadcasts:
      type: object
      required: [mode, status, sent_today, by_keys]
      properties:
        mode:
          $ref: "#/components/schemas/BroadcastsMode"
        status:
          $ref: "#/components/schemas/BroadcastsStatus"
        reason:
          type: string
          description: The operator's or the server's reason for the status.
        status_at:
          type: string
          format: date-time
        daily_limit:
          type: integer
          format: int64
          description: Recipients the workspace may send to today (UTC), all broadcasts together; absent without a limit.
        sent_today:
          type: integer
          format: int64
        by_keys:
          type: boolean
          description: API keys and OAuth tokens with `broadcasts:send` may schedule and resume broadcasts. Off by default.
    BroadcastApprovalRequest:
      type: object
      required: [website, sender_description, consent_description]
      properties:
        website:
          type: string
          format: uri
          maxLength: 2000
        sender_description:
          type: string
          minLength: 1
          maxLength: 2000
          description: Who sends and what the broadcasts are about.
        consent_description:
          type: string
          minLength: 1
          maxLength: 2000
          description: How the subscribers agreed to get them.
    MailingListCounts:
      type: object
      required: [subscribed, pending, unsubscribed]
      properties:
        subscribed:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        unsubscribed:
          type: integer
          format: int64
    MailingList:
      type: object
      required: [id, inbox_id, name, description, double_opt_in, public, commercial, welcome, sender_ready, counts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
          description: The inbox's e-mail channel that sends the list's confirmation and welcome mails; absent when none.
        name:
          type: string
        description:
          type: string
          description: Shown on subscribe forms and the preference page.
        double_opt_in:
          type: boolean
          description: Form subscribers confirm by mail before they are subscribed.
        public:
          type: boolean
          description: Offered on subscribe forms and the preference page; private lists are filled by the API and members only.
        commercial:
          type: boolean
          description: Marketing content. Off for service announcements to existing users; it changes no sending rule and is part of the consent export.
        welcome:
          type: boolean
          description: Send a receipt with an unsubscribe link right after someone subscribes.
        sender_ready:
          type: boolean
          description: "`channel_id` names an e-mail channel with an SMTP account, so the list's mails can go out."
        archived_at:
          type: string
          format: date-time
        counts:
          $ref: "#/components/schemas/MailingListCounts"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MailingListRef:
      type: object
      required: [id, inbox_id, name]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        name:
          type: string
    MailingListCreate:
      type: object
      required: [inbox_id, name]
      properties:
        inbox_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        double_opt_in:
          type: boolean
          default: true
        public:
          type: boolean
          default: true
        commercial:
          type: boolean
          default: true
        welcome:
          type: boolean
          default: true
        channel_id:
          type: string
          format: uuid
    MailingListUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        double_opt_in:
          type: boolean
        public:
          type: boolean
        commercial:
          type: boolean
        welcome:
          type: boolean
        channel_id:
          type: [string, "null"]
          format: uuid
          description: "`null` leaves the list without a sending channel."
        archived:
          type: boolean
    MailingListPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MailingList"
        next_cursor:
          type: string
          description: Absent on the last page.
    MailingListGrowthDay:
      type: object
      required: [date, new, confirmed, unsubscribed]
      properties:
        date:
          type: string
          format: date
        new:
          type: integer
          format: int64
          description: Subscriptions created that day, in any state.
        confirmed:
          type: integer
          format: int64
        unsubscribed:
          type: integer
          format: int64
    MailingListGrowth:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/MailingListGrowthDay"
        confirmation_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
    SubscriptionState:
      type: string
      description: |
        `pending`: waiting for the person to confirm by mail (deleted after 30 days).
        `subscribed`: the person agreed. `unsubscribed`: the person (or a member, a key, a
        complaint) ended it; only the person subscribes again.
      enum: [pending, subscribed, unsubscribed]
    SubscriptionSource:
      type: string
      description: |
        How the subscription began: `form` (a subscribe form), `identity` (the widget or an app
        for a signed-in user), `api` (an API key or OAuth token), `member` (the panel), `import`,
        or `preferences` (the person on the `/m/` page).
      enum: [form, identity, api, member, import, preferences]
    UnsubscribeReason:
      type: string
      description: |
        `link` (the unsubscribe page), `one_click` (RFC 8058 from the mail client), `preferences`
        (the preference page), `client` (the widget or an app), `member`, `api`, `complaint` (the
        person reported a mail as spam), `erasure`.
      enum: [link, one_click, preferences, client, member, api, complaint, erasure]
    SubscriptionContact:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Subscription:
      type: object
      required: [id, list_id, contact, email, state, source, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        list_id:
          type: string
          format: uuid
        contact:
          $ref: "#/components/schemas/SubscriptionContact"
        email:
          $ref: "#/components/schemas/Email"
        state:
          $ref: "#/components/schemas/SubscriptionState"
        source:
          $ref: "#/components/schemas/SubscriptionSource"
        consent_at:
          type: string
          format: date-time
          description: When the person agreed (the confirmation for double opt-in).
        confirmed_at:
          type: string
          format: date-time
        confirmation_sent_at:
          type: string
          format: date-time
        unsubscribed_at:
          type: string
          format: date-time
        unsubscribe_reason:
          $ref: "#/components/schemas/UnsubscribeReason"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConsentEventKind:
      type: string
      description: |
        `requested` (someone asked to subscribe), `confirmation_sent`, `confirmed` (the person
        confirmed by mail), `subscribed` (subscribed without a confirmation, with the declared
        proof), `unsubscribed`, `complained`.
      enum: [requested, confirmation_sent, confirmed, subscribed, unsubscribed, complained]
    ConsentEvent:
      type: object
      required: [id, subscription_id, kind, source, detail, created_at]
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ConsentEventKind"
        source:
          type: string
          description: Who or what caused it, such as `form`, `identity`, `api`, `member`, `import`, `link`, `one_click`, `preferences`, `client`, `complaint`.
        ip:
          type: string
          description: The client's IP address, when the person acted.
        user_agent:
          type: string
        page_url:
          type: string
          description: The page the person subscribed on, or the one the API caller declared.
        consent_text:
          type: string
          description: The label the person agreed to, as the form or the API caller sent it.
        member_id:
          type: string
          format: uuid
        api_key_id:
          type: string
          format: uuid
        broadcast_id:
          type: string
          format: uuid
        import_id:
          type: string
          format: uuid
          description: The CSV import that wrote it; `consent_text` then holds the importer's attestation.
        detail:
          type: object
          additionalProperties: true
          description: "More proof: `obtained_at` and `reference` declared by an API caller, `oauth_client` for a token, `import_id` and `consent_source` for an import."
        created_at:
          type: string
          format: date-time
    SubscriptionDetail:
      allOf:
        - $ref: "#/components/schemas/Subscription"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/ConsentEvent"
    SubscriptionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
        next_cursor:
          type: string
          description: Absent on the last page.
    SubscriptionConsent:
      type: object
      description: How the person agreed, as the caller declares it; stored as proof.
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
          description: "`true`: the person already agreed. `false`: mail them a confirmation first."
        obtained_at:
          type: string
          format: date-time
        text:
          type: string
          maxLength: 2000
          description: The statement the person agreed to.
        ip:
          type: string
          maxLength: 64
        page_url:
          type: string
          maxLength: 2048
        reference:
          type: string
          maxLength: 500
          description: Your own record of the consent, such as an order or sign-up id.
    SubscriptionCreate:
      type: object
      required: [consent]
      description: Name the person with `email`, `contact_id` or `external_id` (at least one).
      properties:
        email:
          type: string
          maxLength: 320
        contact_id:
          type: string
          format: uuid
        external_id:
          type: string
          minLength: 1
          maxLength: 200
          description: The host app's id for the person in the list's inbox.
        name:
          type: string
          maxLength: 200
        locale:
          $ref: "#/components/schemas/LanguageTag"
        attributes:
          $ref: "#/components/schemas/Attributes"
        consent:
          $ref: "#/components/schemas/SubscriptionConsent"
    SubscriptionUpdate:
      type: object
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/SubscriptionState"
    ContactSubscription:
      allOf:
        - $ref: "#/components/schemas/Subscription"
        - type: object
          required: [list]
          properties:
            list:
              $ref: "#/components/schemas/MailingListRef"
    ContactSubscriptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactSubscription"
    ConsentRecord:
      type: object
      description: One consent event with its subscription, list and the subscription's current state.
      required: [list_id, list_name, commercial, subscription_id, contact_id, email, state, source, event_id, event_kind, event_source, event_at, detail]
      properties:
        list_id:
          type: string
          format: uuid
        list_name:
          type: string
        commercial:
          type: boolean
        subscription_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        state:
          $ref: "#/components/schemas/SubscriptionState"
        source:
          $ref: "#/components/schemas/SubscriptionSource"
        consent_at:
          type: string
          format: date-time
        unsubscribed_at:
          type: string
          format: date-time
        unsubscribe_reason:
          $ref: "#/components/schemas/UnsubscribeReason"
        event_id:
          type: string
          format: uuid
        event_kind:
          $ref: "#/components/schemas/ConsentEventKind"
        event_source:
          type: string
        event_at:
          type: string
          format: date-time
        ip:
          type: string
        user_agent:
          type: string
        page_url:
          type: string
        consent_text:
          type: string
        member_id:
          type: string
          format: uuid
        api_key_id:
          type: string
          format: uuid
        detail:
          type: object
          additionalProperties: true
    ConsentExport:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConsentRecord"
    InboxSender:
      type: object
      description: |
        Who sends the inbox's list mail, for the footer the law asks for (CAN-SPAM, CASL, Türkiye's
        Regulation on Commercial Communication): the legal name, a postal address, a registration
        such as a MERSİS number or VAT id, and a contact (an e-mail address, phone or URL).
      properties:
        legal_name:
          type: string
        postal_address:
          type: string
        registration:
          type: string
        contact:
          type: string
    InboxSenderUpdate:
      type: object
      description: The given fields change; `null` or an empty string clears one.
      properties:
        legal_name:
          type: [string, "null"]
          maxLength: 200
        postal_address:
          type: [string, "null"]
          maxLength: 500
        registration:
          type: [string, "null"]
          maxLength: 200
        contact:
          type: [string, "null"]
          maxLength: 320
    SubscriptionEventData:
      type: object
      required: [subscription, list]
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
        list:
          $ref: "#/components/schemas/MailingListRef"
        previous_state:
          $ref: "#/components/schemas/SubscriptionState"
          description: "`subscription.updated` only: the state before."
    SubscriptionEvent:
      type: object
      description: |
        `subscription.created`: someone subscribed (any state). `subscription.updated`: the state
        changed (confirmed, unsubscribed, subscribed again). Delivered to callers who hold
        `lists:read` and can see the list's inbox.
      required: [id, type, workspace_id, inbox_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [subscription.created, subscription.updated]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/SubscriptionEventData"
    WebhookSubscriptionData:
      type: object
      required: [subscription, list, contact]
      properties:
        subscription:
          $ref: "#/components/schemas/Subscription"
        list:
          $ref: "#/components/schemas/MailingListRef"
        previous_state:
          $ref: "#/components/schemas/SubscriptionState"
        contact:
          $ref: "#/components/schemas/WebhookContact"
    WebhookSubscriptionPayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/WebhookSubscriptionData"
    ListImportState:
      type: string
      description: |
        `validating` (the file is read and checked, nothing written), `ready` (checked; waiting
        for `/start`), `importing`, `done`, `failed` (see `error`), `cancelled`.
      enum: [validating, ready, importing, done, failed, cancelled]
    ListImportEncoding:
      type: string
      enum: [utf-8, utf-16le, utf-16be, windows-1254, windows-1252]
    ListImportField:
      type: string
      description: |
        What a column holds. `name` is the full name; `first_name` and `last_name` are joined into
        it. `attribute` fills the contact attribute named by `attribute`; `skip` ignores the
        column.
      enum: [email, name, first_name, last_name, locale, external_id, attribute, skip]
    ListImportColumn:
      type: object
      required: [index, header, field]
      properties:
        index:
          type: integer
          format: int32
          minimum: 0
          description: The column's position, from 0.
        header:
          type: string
          description: The column's name in the header row.
        field:
          $ref: "#/components/schemas/ListImportField"
        attribute:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
          description: The attribute key, with `field` `attribute`.
    ListImportColumnMapping:
      type: object
      required: [index, field]
      properties:
        index:
          type: integer
          format: int32
          minimum: 0
          maximum: 99
        field:
          $ref: "#/components/schemas/ListImportField"
        attribute:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
          description: Required with `field` `attribute`.
    ListImportMappingUpdate:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          maxItems: 100
          description: Columns left out are skipped. Exactly one must be `email`.
          items:
            $ref: "#/components/schemas/ListImportColumnMapping"
    ListImportCounts:
      type: object
      description: |
        `valid` is found by the validation: rows that would be added. The rest are refused rows
        by reason, `existing` (already `subscribed` or `pending` on the list) and, while and after
        importing, `added` and `created_contacts`.
      required: [valid, existing, invalid_email, no_mail_domain, role_address, duplicate, suppressed, opted_out, unsubscribed, added, created_contacts]
      properties:
        valid:
          type: integer
          format: int64
        existing:
          type: integer
          format: int64
        invalid_email:
          type: integer
          format: int64
        no_mail_domain:
          type: integer
          format: int64
          description: The address's domain has no MX, A or AAAA record, or a null MX.
        role_address:
          type: integer
          format: int64
          description: Such as `postmaster@`, `abuse@`, `noreply@`.
        duplicate:
          type: integer
          format: int64
          description: The address appears earlier in the file.
        suppressed:
          type: integer
          format: int64
        opted_out:
          type: integer
          format: int64
        unsubscribed:
          type: integer
          format: int64
          description: The address unsubscribed from this list.
        added:
          type: integer
          format: int64
        created_contacts:
          type: integer
          format: int64
    ListImport:
      type: object
      required: [id, list_id, state, filename, reconfirm, attestation, consent_source, rows_total, rows_done, counts, columns, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        list_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/ListImportState"
        filename:
          type: string
        encoding:
          $ref: "#/components/schemas/ListImportEncoding"
        delimiter:
          type: string
          description: The column separator found in the header row.
          enum: [comma, semicolon, tab]
        reconfirm:
          type: boolean
          description: New addresses become `pending` and get a confirmation mail instead of being subscribed.
        attestation:
          type: string
          description: The statement the importer accepted.
        consent_source:
          type: string
          description: Where and when the people in the file agreed, as the importer wrote it.
        rows_total:
          type: integer
          format: int32
          description: Data rows in the file, empty rows left out; 0 until validated.
        rows_done:
          type: integer
          format: int32
        counts:
          $ref: "#/components/schemas/ListImportCounts"
        columns:
          type: array
          description: The file's columns with what each holds; empty until validated.
          items:
            $ref: "#/components/schemas/ListImportColumn"
        preview:
          type: array
          description: The first 20 data rows, cells cut at 200 characters; absent once the import ends.
          items:
            type: array
            items:
              type: string
        error:
          type: string
          description: Why the import failed.
        member_id:
          type: string
          format: uuid
          description: The member who uploaded it.
        api_key_id:
          type: string
          format: uuid
          description: The key that uploaded it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        errors_until:
          type: string
          format: date-time
          description: When the refused rows (`/errors`) are deleted.
    ListImportPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListImport"
        next_cursor:
          type: string
          description: Absent on the last page.
    ListImportUpload:
      type: object
      required: [file, attestation, consent_source]
      properties:
        file:
          type: string
          format: binary
        attestation:
          type: string
          minLength: 1
          maxLength: 2000
        consent_source:
          type: string
          minLength: 1
          maxLength: 1000
        reconfirm:
          type: boolean
        mapping:
          type: string
          description: A `ListImportMappingUpdate` as JSON.
    ListImportProgress:
      type: object
      required: [id, list_id, state, rows_total, rows_done, counts]
      properties:
        id:
          type: string
          format: uuid
        list_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/ListImportState"
        rows_total:
          type: integer
          format: int32
        rows_done:
          type: integer
          format: int32
        counts:
          $ref: "#/components/schemas/ListImportCounts"
    ListImportProgressEvent:
      type: object
      description: |
        `list_import.progress`, on `/v1/realtime` only: the progress of an importing CSV file, at
        most once a second. Not stored, no id, never replayed. Delivered to callers who hold
        `lists:read` and can see the list's inbox.
      required: [type, workspace_id, inbox_id, created_at, data]
      properties:
        type:
          type: string
          enum: [list_import.progress]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ListImportProgress"
    ListImportEvent:
      type: object
      description: |
        `list_import.updated`, on `/v1/realtime` only: an import became `ready`, `importing`,
        `done`, `failed` or `cancelled`. Not stored, no id, never replayed, no webhook; reload the
        import after a reconnect. Delivered to callers who hold `lists:read` and can see the list's
        inbox.
      required: [type, workspace_id, inbox_id, created_at, data]
      properties:
        type:
          type: string
          enum: [list_import.updated]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ListImport"
    ClientMailingList:
      type: object
      required: [id, name, description, double_opt_in]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        double_opt_in:
          type: boolean
    ClientMailingLists:
      type: object
      required: [lists, form_token]
      properties:
        lists:
          type: array
          items:
            $ref: "#/components/schemas/ClientMailingList"
        form_token:
          type: string
          description: Send it back with the form, 2 seconds to 2 hours from now.
    ClientSubscriptionCreate:
      type: object
      required: [email, list_ids, page_url, consent_text, form_token]
      properties:
        email:
          type: string
          maxLength: 320
        name:
          type: string
          maxLength: 200
        list_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
        locale:
          $ref: "#/components/schemas/LanguageTag"
        page_url:
          type: string
          maxLength: 2000
          description: The page with the form.
        consent_text:
          type: string
          minLength: 1
          maxLength: 2000
          description: The consent label exactly as the visitor saw it.
        form_token:
          type: string
          maxLength: 500
        website:
          type: string
          maxLength: 500
          description: A honeypot field hidden from people; leave it empty.
    ClientSubscriptionAccepted:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: boolean
          description: At least one of the lists has double opt-in, so tell the visitor to check their inbox.
    ClientSubscription:
      type: object
      required: [list]
      properties:
        list:
          $ref: "#/components/schemas/ClientMailingList"
        state:
          $ref: "#/components/schemas/SubscriptionState"
          description: Absent when the contact never subscribed to the list.
    ClientSubscriptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientSubscription"
    ClientSubscriptionPut:
      type: object
      required: [consent_text]
      properties:
        consent_text:
          type: string
          minLength: 1
          maxLength: 2000
          description: The label the user agreed to.
        page_url:
          type: string
          maxLength: 2000
    ClientSubscriptionStatus:
      type: object
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/SubscriptionState"
    ReaderAccount:
      type: object
      required: [person_id, email, name, initials, locale, email_notifications, member]
      properties:
        person_id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
          description: Shown on the person's posts; empty until set.
        initials:
          type: string
        locale:
          $ref: "#/components/schemas/Locale"
        email_notifications:
          type: boolean
          description: E-mails about followed threads; on by default.
        member:
          type: boolean
          description: The person is a member of at least one workspace.
    ReaderAccountUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 200
        email_notifications:
          type: boolean
    ReaderTokenCreate:
      type: object
      required: [channel_key, origin]
      properties:
        channel_key:
          type: string
          maxLength: 200
          description: The chat channel's public key, from the `channel` query parameter of `/account/connect`.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The origin of the page that opened the popup.
    ReaderToken:
      type: object
      required: [token, expires_at, origin, channel_key, reader]
      properties:
        token:
          type: string
          description: "`yuva_rd_<secret>`, shown once."
        expires_at:
          type: string
          format: date-time
        origin:
          $ref: "#/components/schemas/Origin"
          description: The target origin for `postMessage`, as normalized.
        channel_key:
          type: string
        reader:
          $ref: "#/components/schemas/ReaderProfile"
    ReaderProfile:
      type: object
      required: [initials]
      properties:
        name:
          type: string
          description: Absent when the person has no name yet.
        initials:
          type: string
    ReaderDiscussion:
      type: object
      description: A thread as the reader's account lists it.
      required: [id, workspace_name, inbox_name, page, title, state, locked, answered, reply_count, votes, started, following, created_at, last_activity_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_name:
          type: string
        inbox_name:
          type: string
          description: The product whose documentation it is on.
        page:
          type: string
        page_title:
          type: string
        title:
          type: string
        state:
          $ref: "#/components/schemas/DiscussionState"
        locked:
          type: boolean
        answered:
          type: boolean
        reply_count:
          type: integer
          format: int32
        votes:
          type: integer
          format: int32
        started:
          type: boolean
          description: The reader started it.
        following:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
    ReaderDiscussionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReaderDiscussion"
        next_cursor:
          type: string
          description: Absent on the last page.
    ReaderNotificationKind:
      type: string
      description: "`reply`: a new reply in a followed thread. `answer`: an answer was accepted there."
      enum: [reply, answer]
    ReaderNotification:
      type: object
      required: [id, kind, discussion_id, title, page, inbox_name, excerpt, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ReaderNotificationKind"
        discussion_id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        title:
          type: string
          description: The thread's title.
        page:
          type: string
        inbox_name:
          type: string
        author:
          $ref: "#/components/schemas/DiscussionAuthor"
        excerpt:
          type: string
          description: |
            The start of the post as plain text: the text of its rendered HTML (no Markdown or
            markup), whitespace collapsed, at most 200 characters, cut at a word boundary and ending in an ellipsis.
        created_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
    ReaderNotificationPage:
      type: object
      required: [items, unread]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReaderNotification"
        unread:
          type: integer
          format: int64
        next_cursor:
          type: string
          description: Absent on the last page.
    ReaderNotificationsRead:
      type: object
      properties:
        ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
    TypingCreate:
      type: object
      properties:
        typing:
          type: boolean
          default: true
          description: "`false` when the typist stopped or sent the message."
    TypingAuthor:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [member, contact]
        member_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        name:
          type: string
          description: The member's display name.
    Typing:
      type: object
      required: [conversation_id, typing, author]
      properties:
        conversation_id:
          type: string
          format: uuid
        typing:
          type: boolean
        author:
          $ref: "#/components/schemas/TypingAuthor"
    TypingEvent:
      type: object
      description: |
        Someone is typing in a conversation (`typing: true`) or stopped. Not stored: it has no `id`
        and is not replayed. Members do not receive their own.
      required: [type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        type:
          type: string
          enum: [typing]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Typing"
    ClientSessionCreate:
      type: object
      required: [channel_key]
      properties:
        channel_key:
          type: string
          minLength: 1
          maxLength: 200
          description: The chat or app channel's `public_key`.
        identity_token:
          type: string
          maxLength: 8192
          description: A JWT (HS256) from the host backend; see `sdk/go`.
        visitor_id:
          type: string
          maxLength: 200
          description: The `visitor_id` of an earlier anonymous session in this browser.
    ClientMember:
      type: object
      description: What a contact may see of a member.
      required: [name, initials]
      properties:
        name:
          type: string
          description: The display name; empty when the member has not set one.
        initials:
          type: string
          description: Up to two letters for an avatar; empty when the name is.
    ClientPresence:
      type: object
      description: Who can answer now, in a `live` inbox.
      required: [available, members]
      properties:
        available:
          type: boolean
          description: |
            Someone with access is connected, not set to away, and the inbox is within its business
            hours.
        members:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ClientMember"
    ClientChatSettings:
      type: object
      required: [greeting, launcher_position, ask_email_offline, allow_anonymous, discussions]
      properties:
        greeting:
          type: string
          description: The channel greeting, else the inbox branding greeting, else empty.
        launcher_position:
          $ref: "#/components/schemas/ChatLauncherPosition"
        launcher_color:
          type: string
          description: The channel's launcher color, else the inbox branding color; absent when neither is set.
        ask_email_offline:
          type: boolean
        allow_anonymous:
          type: boolean
        discussions:
          $ref: "#/components/schemas/DiscussionMode"
          description: "`off` on `app` channels."
    ClientInbox:
      type: object
      description: |
        The inbox's public settings. `live` inboxes carry `presence`; `async` inboxes never do and
        show `expected_reply_minutes` instead.
      required: [id, name, branding, default_locale, timezone, mode, business_hours, open_now, chat, feedback_categories, ask_for_rating]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        branding:
          $ref: "#/components/schemas/InboxBranding"
        default_locale:
          $ref: "#/components/schemas/LanguageTag"
        timezone:
          type: string
        mode:
          $ref: "#/components/schemas/InboxMode"
        business_hours:
          $ref: "#/components/schemas/BusinessHours"
        open_now:
          type: boolean
          description: Within business hours now (always true when they are not enabled).
        expected_reply_minutes:
          type: integer
          format: int32
          description: "`async` inboxes only; absent when not set."
        presence:
          $ref: "#/components/schemas/ClientPresence"
        chat:
          $ref: "#/components/schemas/ClientChatSettings"
        feedback_categories:
          type: array
          description: The categories `POST /client/v1/feedback` accepts, in display order.
          items:

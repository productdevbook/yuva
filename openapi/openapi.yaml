openapi: 3.1.1
info:
  title: Yuva API
  version: 0.0.15
  summary: Customer messaging for many products in one inbox.
  license:
    name: MIT
    identifier: MIT
  description: |
    Yuva answers every user of every product you run: e-mail, live chat and in-app
    conversations in one inbox.

    ## Surfaces

    - `/v1` is for members (panel session) and workspace API keys.
    - `/client/v1` is for the web widget and the mobile SDKs.
    - `/healthz` and `/readyz` are for load balancers and orchestrators.

    ## Errors

    Errors are `application/problem+json` documents (RFC 9457) with a stable `code`.

    ## Authentication

    - Members sign in with a one-time code sent by e-mail or with a passkey. Both set the
      `yuva_session` cookie (HttpOnly, SameSite=Lax).
    - Host backends, scripts and bots send a workspace API key as `Authorization: Bearer <key>`.
      A key acts on its own workspace only, and only with its scopes (see `api-keys`).
    - OAuth clients (MCP clients, member apps) send an access token as
      `Authorization: Bearer <token>`; it acts as the member who approved it, only with the granted
      scopes (see `oauth`).
    - Contacts (widget, SDKs) send a contact session token as `Authorization: Bearer <token>` on
      `/client/v1`; see the `client` tag.

    ## Idempotency

    Every authenticated `POST` on `/v1` and `/client/v1` accepts an `Idempotency-Key` header (1 to
    255 printable ASCII characters). The key is remembered for 24 hours per caller (API key,
    member or contact) with the method, path, a SHA-256 of the body and the response. The same key
    with the same request returns the stored response with `Idempotent-Replayed: true`; with a
    different request it is refused with `409 idempotency_key_reused`, and while the first request
    is still running with `409 idempotency_key_in_use`. `5xx` answers are not stored, so the request
    can be retried. Endpoints that need no sign-in, and those that act on the signed-in person
    rather than a workspace (`/v1/me/...`, `/v1/auth/...`), ignore the header.

    ## Workspace selection

    A member session belongs to a person, who can be a member of several workspaces. Workspace
    endpoints act on the workspace named in the `Yuva-Workspace` header; when the header is absent
    and the person belongs to exactly one workspace, that workspace is used. An API key always acts
    on its own workspace; a `Yuva-Workspace` header naming another workspace is refused.
servers:
  - url: /
security:
  - session: []
  - apiKey: []
  - oauthToken: []
tags:
  - name: system
    description: Health, readiness and build information.
  - name: auth
    description: Sign-in with an e-mailed code or a passkey, sign-out.
  - name: me
    description: The signed-in person and their passkeys.
  - name: workspace
    description: The current workspace, its members and invites.
  - name: api-keys
    description: |
      Workspace API keys for host backends, scripts and bots. A key holds scopes (`ApiKeyScope`),
      may be limited to some inboxes and may expire; these are fixed when the key is made. A key
      limited to inboxes sees what an agent with access to exactly those inboxes sees and cannot
      hold `inboxes:manage`, `webhooks:manage`, `workspace:manage` or `migrations:manage`; an inbox that is deleted
      drops out of the limit, and a key whose every inbox is gone sees nothing. Keys made before
      scopes existed hold every scope.

      Every key is a bot: messages, notes and conversation events written with it have author type
      `bot` with the key's id, and show its current `bot_name` (the key's name unless one is set)
      and `bot_avatar_url` in the panel, the widget, the SDKs, webhooks and as the display name of
      outgoing e-mail.
  - name: inboxes
    description: Inboxes (one per product or brand) and who may see them.
  - name: channels
    description: |
      How messages reach an inbox. E-mail channels receive mail through `/ingress/email` and send
      replies through their own SMTP account. `chat` (web widget) and `app` (mobile SDKs) channels
      have a public key that starts contact sessions on `/client/v1`; `api` channels let host
      backends post feedback with an API key (`POST /v1/feedback`).
  - name: contacts
    description: |
      The people writing in. Agents see only contacts with a conversation or external id in an
      inbox they can access, or in no inbox at all (others answer `404`); they set external ids
      only in their inboxes, keeping the contact's ids in other inboxes, and change `emails` only
      of contacts that appear in no other inbox (`403 forbidden`).
  - name: conversations
    description: Threads between a contact and an inbox.
  - name: messages
    description: Messages, notes, events and their attachments.
  - name: labels
    description: Workspace labels for conversations.
  - name: canned-replies
    description: Saved answers members insert into replies.
  - name: docs
    description: |
      Documentation pages on a product's own site: ratings per page, feedback sent from a page, and
      counts of the page's discussions.
  - name: discussions
    description: |
      Public discussions on documentation pages, for the team: threads, replies, the moderation
      queue, accepted answers, and turning a private conversation into a thread. Reading needs
      `conversations:read`; writing and moderating need a member session. Threads in inboxes the
      caller cannot see answer `404`.
  - name: account
    description: |
      The reader account: every person (members included) can sign in on the server's own pages and
      write in discussions on documentation sites. Readers who are not members sign in with
      `POST /v1/auth/code` and `reader: true`. A site's `<yuva-discussions>` element opens
      `/account/connect?channel=<key>&origin=<origin>` in a popup, which hands it a reader token
      (`POST /v1/account/reader-tokens`). These endpoints act on the signed-in person across every
      workspace and need a person session.
  - name: lists
    description: |
      Mailing lists of an inbox, their subscriptions and the consent records behind them. Owners
      and admins manage lists and subscribers; agents read the lists of the inboxes they can
      access; lists in inboxes the caller cannot see answer `404`. Keys and tokens need
      `lists:read` or `lists:write`; neither is added to keys made before they existed.

      A subscription is `pending` (waiting for the person to confirm), `subscribed` or
      `unsubscribed`. Every change writes an append-only consent event (`ConsentEvent`) with what
      happened, when and from where. Only the person moves an `unsubscribed` subscription back,
      through a confirmation mail; members and keys get `409 unsubscribed`. An address that
      unsubscribed from everything, complained, or belonged to a contact deleted after objecting is
      remembered as a keyed hash in the workspace and refused with `409 opted_out`.

      Confirmation and welcome mails go out through the list's e-mail channel (`channel_id`),
      under the inbox's brand, in English, Turkish or German by the contact's locale else the
      inbox's. Their links lead to two server pages that need no sign-in: `/s/{token}` confirms a
      subscription and `/m/{token}` unsubscribes from the list, from any of the inbox's public
      lists, or from everything. Opening either page changes nothing; only its button does.
      `/m/{token}` also takes the RFC 8058 one-click `POST` (`List-Unsubscribe=One-Click`).
      Pending subscriptions are deleted after 30 days, unsubscribed ones and their consent events
      after 3 years.
  - name: designs
    description: |
      E-mail designs for broadcasts, the images they use and the template gallery. A design is an
      `EmailDesignDocument`: blocks (section, columns, heading, text, image, button, divider, spacer,
      social, footer) and a theme. The server renders it to table HTML with inline styles and a
      plain-text part (`POST /v1/email-designs/render`) and always adds the required footer last:
      the inbox's sender identity (`Inbox.sender`), why the person gets the mail, and the
      unsubscribe and preference links.

      Owners, admins, API keys and OAuth tokens with `broadcasts:read` or `broadcasts:write`;
      agents get `403 forbidden`. A key limited to inboxes reads the designs of its inboxes and the
      workspace-wide ones (no `inbox_id`), and writes only designs of its inboxes; designs of other
      inboxes answer `404`.

      Rich text (`text.html`, `footer.html` and, without `p` and lists, `heading.text`) is a subset
      of HTML: `p`, `br`, `strong`, `em`, `u`, `s`, `a` with `href`, `ul`, `ol`, `li`, `code`, and no
      other attribute. Every write sanitises it and refuses a document whose rich text sanitising
      would change (`422 invalid_rich_text`, naming the block), so what is stored is exactly what
      was sent. Links are `https`, `http`, `mailto` or `tel` URLs of at most 2,048 characters.
      Styles are never stored; the renderer adds them.

      Merge fields `{{ contact.first_name | "there" }}` work in headings, text, button labels,
      footer text, the preheader and the query of button and link URLs: `contact.name`,
      `contact.first_name`, `contact.email`, `contact.attributes.<key>`, `inbox.name`,
      `list.name`, `unsubscribe_url` and `preferences_url`. Unknown fields are refused
      (`422 unknown_merge_field`); a fallback is at most 100 characters. Values are escaped where
      they land and never become markup.

      `schema` is the format version of a document. The server upgrades older documents on read and
      write and refuses newer ones (`422 unsupported_schema`), so an older server never changes a
      newer document. Invalid documents answer `422 invalid_design` with one entry in `errors` per
      problem (`block_id`, `field`, `code`); a document over 300 KiB of JSON or 200 blocks answers
      `413 design_too_large`.

      Saves are optimistic: `PUT` sends the `version` it started from as `base_version`; when
      someone saved in between it answers `409 version_conflict` with the current design in
      `design`. The server keeps the newest 50 snapshots of a design (`versions`): one at most every
      10 minutes of editing, one when a save asks for it (`snapshot: true`), one on every
      restore and one of the current version (`conflict`) whenever a save or restore answers
      `409 version_conflict`, so the edit that won is never lost whatever the other tab does next.
      The newest `conflict` snapshot is never pruned.

      Images are uploaded (PNG, JPEG, GIF, WebP; never SVG), re-encoded without metadata and at
      most 1,200 pixels wide (WebP is stored as PNG or JPEG) and served publicly at
      `/i/{token}` (the image's `url`): no cookies, `Cache-Control: public, max-age=31536000,
      immutable`, an `ETag`, and nothing recorded per request. Designs use only the workspace's
      own images. The images of a workspace count towards `YUVA_EMAIL_IMAGES_MAX_BYTES`
      (`409 image_quota`).

      The gallery (`/v1/email-templates`) holds the starter designs that ship with the server
      (`templates/email` in the repository, MIT) in English, Turkish and German. Their previews are
      public at `/email-templates/{slug}/{locale}.html` and `/email-templates/{slug}/{locale}.webp`.
  - name: broadcasts
    description: |
      Broadcasts: one e-mail to many contacts (newsletters, product updates, announcements), sent on
      behalf of an inbox through one of its e-mail channels, from a design to the subscribers of its
      lists. A reply becomes a conversation in the inbox with `broadcast_id`. Owners, admins and API
      keys create and send them; agents read the broadcasts of their inboxes so they understand a
      reply. Keys and OAuth tokens need `broadcasts:read`, `broadcasts:write` or `broadcasts:send`,
      and schedule or resume only while the workspace's `broadcasts.by_keys` is on.

      A broadcast never goes out through the server's own mailer: it uses the channel's broadcast
      SMTP account (`email.broadcast_smtp`) when set, else its support account, at the channel's
      pace (`email.broadcast_rate` mails a second). Every mail carries `List-Unsubscribe` with
      one-click (RFC 8058), `List-Id`, `Feedback-ID` and `X-Auto-Response-Suppress`, and the
      required footer with the unsubscribe and preference links. Bounces (SES through SNS,
      delivery reports to the channel, SMTP refusals) suppress the address for all mail; a
      complaint about a broadcast suppresses broadcasts only, unsubscribes the address from every
      list of the workspace and remembers the objection. A broadcast pauses itself at 5% bounces
      (after 200 mails) or 0.3% complaints (after 1,000), and a workspace whose broadcast mail of
      the last 30 days reached 0.3% complaints is suspended from sending.

      `YUVA_BROADCAST_DAILY_RECIPIENTS` and the operator's per-workspace limit cap the recipients
      of a workspace per UTC day; a send that reaches the cap continues the next day
      (`waiting_until`).
  - name: migrations
    description: |
      Moving to Yuva: a team brings the history of the mailbox it uses today into an inbox, then
      switches its mail over. Every mailbox is read over IMAP with an app password (presets for
      Gmail, Google Workspace, Yandex, iCloud, Zoho, Yahoo, Fastmail, GMX and any other server),
      or from an export file uploaded in parts (Google Takeout, mbox, `.eml` or Maildir in a zip),
      which needs no access to the account and is the fast way for a very large Gmail mailbox.
      Outlook.com and Microsoft 365 accept no passwords: "Sign in with Microsoft" obtains only a
      token for IMAP, sent with `AUTHENTICATE XOAUTH2`. Help desks (Zendesk and Help Scout) are
      read over their APIs with the team's own OAuth client. Yuva only reads the source: it opens folders with `EXAMINE`, fetches with
      `BODY.PEEK`, and its connection refuses every command that could delete, move or mark
      anything; a help desk's connection sends only `GET` requests, besides the token exchange.

      Owners, admins and API keys without an inbox limit manage migrations; agents get `403`.
      Keys and OAuth tokens need `migrations:manage`, which agents' tokens are never offered.
      Credentials are encrypted under the server's master key, never returned or logged, and
      deleted when the migration ends. Every action is recorded with who did it.
  - name: analytics
    description: |
      Cookieless analytics for the workspace's own websites and apps. A property
      (`AnalyticsProperty`) is one product's sites and apps; its public key names it on
      `POST /client/v1/analytics/{key}`, which the `/yuva-analytics.js` script calls. No IP address
      is stored and nothing is put on the visitor's device: the address is shortened (IPv4 /24,
      IPv6 /48) before anything else uses it, and a visitor is a keyed hash of the shortened address
      and the user agent under a salt that exists for one day of the property's time zone. Apps
      send screens and events with a key held in memory for the life of the process instead of
      the address, and host backends send server-side events with an API key that has
      `analytics:write` (`sendAnalyticsEvents`).

      Owners and admins manage properties. Agents read the properties linked to inboxes they can
      access; a property without an inbox is visible to owners, admins and API keys without an
      inbox limit. Properties the caller cannot see answer `404`. Keys and OAuth tokens need
      `analytics:read` or `analytics:manage`; keys limited to inboxes cannot hold
      `analytics:manage`, agents' tokens are never offered it, and no `analytics:*` scope is added
      to keys made before they existed. `YUVA_ANALYTICS=off` removes the feature: these endpoints
      and the collection endpoint answer `404`.

      Numbers come from one query operation (`queryAnalytics`), the last 30 minutes from
      `getAnalyticsRealtime`, and how collection is doing (accepted and dropped events, the GeoIP
      database) from `getAnalyticsHealth`. Locations come from the shortened address; children's
      properties keep only the country.
  - name: realtime
    description: Live workspace events over WebSocket, and the same events as a feed to poll.
  - name: client
    description: |
      The contact side, for the web widget and the mobile SDKs. A contact session starts at
      `POST /client/v1/session` with a `chat` or `app` channel's public key and, for signed-in
      users of the host app, an identity token; every other call sends the session token as a
      bearer token. Requests for a `chat` channel must come from a browser on one of its allowed
      origins (CORS; a request without an `Origin` header is refused). Requests for an `app`
      channel come from native apps, which send no `Origin`, and are not checked against origins;
      a browser on an origin no chat channel allows is still refused. Contacts see their own
      conversations in the session's inbox, never notes, internal events, other contacts or member
      e-mail addresses; of members only their display name and initials.
  - name: notifications
    description: |
      Notifying members of new conversations, messages and assignments: Web Push to the panel
      installed as a PWA (VAPID, RFC 8030/8291/8292) and e-mail as a fallback. A push
      subscription belongs to the browser that created it and to the session that registered it
      (it ends with sign-out); it receives notifications from every workspace of the person.
      Preferences are per member, with per-inbox overrides.

      What causes a notification (`event` in `PushNotification`, keys of `NotificationEvents`):

      - `new_live_conversation`, `new_async_conversation`: the first message of a conversation,
        from the contact, in a `live` or `async` inbox. Every member with access to the inbox is a
        candidate.
      - `message_in_my_conversation`: a later contact message in a conversation assigned to the
        member.
      - `message_in_unassigned_conversation`: a later contact message in an unassigned
        conversation; every member with access is a candidate.
      - `assigned_to_me`: someone else assigned a conversation to the member.
      - `mentioned`: someone else mentioned the member in a note (`mentions` on the note).

      Never notified: the member who caused it (their own assignment), conversations marked spam,
      a member whose open panel reports that it is showing that conversation (the `viewing` frame
      on `/v1/realtime`), and, while the member's `availability` is `away`, everything except
      `message_in_my_conversation`, `assigned_to_me` and `mentioned`.

      Defaults by role (`defaults` in `NotificationSettings`): push for everything except, for
      agents, `new_async_conversation` and `message_in_unassigned_conversation`; e-mail only for
      `message_in_my_conversation`, `assigned_to_me` and `mentioned`, for every role.

      E-mail fallback: when an event with `email: true` is still unread after
      `email_delay_minutes` (15 by default), one e-mail lists the conversation's unread contact
      messages and the notes mentioning the member, and links to it; at most one e-mail per conversation and member per hour. It goes
      to the person's sign-in address in their locale.
  - name: webhooks
    description: |
      Signed HTTP callbacks to host backends per the Standard Webhooks specification
      (https://www.standardwebhooks.com): `webhook-id`, `webhook-timestamp` and
      `webhook-signature` headers, JSON payloads `{type, timestamp, workspace_id, data}`, retries
      with exponential backoff for about 24 hours, then the endpoint is disabled. `sdk/go/webhook`
      verifies them. The payloads are described under `webhooks`.
  - name: ingress
    description: |
      Inbound mail and delivery reports from mail infrastructure. These endpoints are not called
      by members or API keys; they authenticate with a signature over the request.
  - name: oauth
    description: |
      Yuva is its own OAuth 2.1 authorization server, for MCP clients and member apps:
      authorization code with PKCE (`S256` only), public clients without a secret, registered
      dynamically (RFC 7591) or named by a Client ID Metadata Document URL. `GET /oauth/authorize`
      sends the browser to the panel's consent page, `/oauth/consent?request=<id>`, which reads the
      request and approves or denies it with the `/v1/oauth/requests` endpoints and a member
      session. Resource indicators (RFC 8707) are required: `<public URL>/mcp` gives a token for
      `/mcp` only, `<public URL>` one for `/v1`, `/v1/realtime` and `/mcp`.

      A grant is one member, one workspace and one client; approving the same client again in the
      same workspace replaces its scopes and resource. Its access tokens act as the member, narrowed
      by the granted scopes (`ApiKeyScope`): operations that list no scope need a member session.
      Access tokens live 1 hour, refresh tokens 30 days and are rotated on every use; reusing a
      rotated refresh token revokes the grant. A member who leaves or is removed loses every grant.
      Messages, notes, drafts and conversation events written with a token name the client in
      `via` on their author.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness
      description: Answers `200` while the process is running. It does not touch the database.
      tags: [system]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness
      description: Answers `200` when the server can reach its database, `503` otherwise.
      tags: [system]
      security: []
      responses:
        "200":
          description: The server is ready to take traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is not reachable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/version:
    get:
      operationId: getVersion
      summary: Server version
      description: |
        The version of the running server build and whether anyone may sign up (`signup`), so a
        sign-in page can offer "Create an account" or say that the server is invite only.
      tags: [system]
      security: []
      responses:
        "200":
          description: The build version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /v1/auth/code:
    post:
      operationId: requestSignInCode
      summary: Request a sign-in code
      description: |
        Sends a one-time code to the address when it belongs to a person (a member, a former member
        or a reader) or has a pending invite, or to any address with `reader: true` or when the
        server's sign-up is `open` (see `GET /v1/version`); that code creates the person, with no
        workspace, on verification. The answer is the same either way and takes the same
        time (the mail is sent after it), so it does not reveal whether an address is known. Codes expire after 10 minutes; only the
        most recent code of an address is accepted.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInCodeRequest"
      responses:
        "202":
          description: Accepted. A code is on its way if the address is known.
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /v1/auth/code/verify:
    post:
      operationId: verifySignInCode
      summary: Sign in with a code
      description: |
        Exchanges a valid code for a member session. Each code accepts five attempts. After 20
        wrong codes for an address within 24 hours, codes for it are refused
        (`429 sign_in_paused`) until older failures leave that window, and the member is told by
        e-mail; passkeys still work. Pending invites for the address are accepted on success. An
        address that is not yet a person becomes one when it has an invite, when the code was
        requested with `reader: true`, or when the server's sign-up is `open`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInCodeVerify"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /v1/auth/passkey/options:
    post:
      operationId: beginPasskeySignIn
      summary: Start a passkey sign-in
      description: |
        Returns the options for `navigator.credentials.get()` (discoverable credentials) and a
        ceremony id to send back with the result. The ceremony expires after 5 minutes.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The ceremony options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"
  /v1/auth/passkey:
    post:
      operationId: finishPasskeySignIn
      summary: Sign in with a passkey
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyCeremonyResult"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/Problem"
  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out
      description: Ends the current member session and clears the cookie.
      tags: [auth]
      security:
        - session: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: Clears `yuva_session`.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in person
      description: The person behind the session and the workspaces they belong to.
      tags: [me]
      security:
        - session: []
      responses:
        "200":
          description: The person and their memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: Update the signed-in person
      tags: [me]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: The updated person and their memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMe
      summary: Delete the signed-in person's account
      description: |
        Removes the person with their memberships, sessions, passkeys, push subscriptions,
        sign-in codes, reader tokens and reader notifications, and clears the cookie. Messages they
        wrote stay in their conversations without an author (`author.member_id` absent). As a
        reader, their discussion posts stay without an author (`author.deleted`), their votes and
        follows go, and in each workspace the contact linked to them is deleted when it has no
        conversations and no external ids, else only unlinked. Refused with `409 last_owner` while the
        person is the only owner of a workspace: make someone else an owner or delete that
        workspace first. Needs a member session; the body repeats the person's e-mail address.
      tags: [me]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletion"
      responses:
        "204":
          description: Deleted.
          headers:
            Set-Cookie:
              description: Clears `yuva_session`.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys:
    get:
      operationId: listPasskeys
      summary: List passkeys
      tags: [me]
      security:
        - session: []
      responses:
        "200":
          description: The person's passkeys.

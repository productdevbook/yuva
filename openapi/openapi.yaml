      enum: [inbox, sent, archive, all, user, label, spam, trash, drafts, other]
      x-enum-varnames: [FolderKindInbox, FolderKindSent, FolderKindArchive, FolderKindAll, FolderKindUser, FolderKindLabel, FolderKindSpam, FolderKindTrash, FolderKindDrafts, FolderKindOther]
    MigrationFolder:

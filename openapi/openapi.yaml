            $ref: "#/components/schemas/MigrationAction"
        member_id:
          type: string
          format: uuid
          description: The member who created it; absent for API keys or when the member left.
        api_key_id:
          type: string
          format: uuid
          description: The API key that created it.
        via:
          type: string
          description: The OAuth client it was created through.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        live_from:
          type: string
          format: date-time
          description: |
            When the copy ended and catch-up sync began. Mail the old mailbox received before is

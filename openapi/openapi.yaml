  /v1/inboxes/{inboxId}/channels:
    get:
      operationId: listChannels
      summary: List an inbox's channels
      description: "Scope: `inboxes:read`."
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      responses:
        "200":
          description: The channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createChannel
      summary: Add a channel
      description: |
        Owners, admins and API keys. An `email` channel needs `email` (its
        address and outbound SMTP account); a `chat` channel needs `chat` (at least one allowed
        origin) and gets a generated public key; an `app` channel takes `app` (optional, defaults
        apply) and gets a generated public key; `settings` are stored as given.
        An address belongs to one channel of the whole server, because inbound mail picks its
        channel by the recipient alone; a taken address answers `409 email_address_taken`.

        Scope: `inboxes:manage`.
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelCreate"
      responses:
        "201":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/channels/{channelId}:
    get:
      operationId: getChannel
      summary: Get a channel
      description: "Scope: `inboxes:read`."
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateChannel
      summary: Update a channel
      description: |
        Owners, admins and API keys. `email` replaces the e-mail settings as a
        whole, except that an absent `smtp.password` keeps the stored one; `chat` and `app` replace
        those settings as a whole, except the public key.

        Scope: `inboxes:manage`.
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
      responses:
        "200":
          description: The updated channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteChannel
      summary: Remove a channel
      description: |
        Owners, admins and API keys. Conversations that started on it keep
        their messages and lose their `channel_id`.

        Scope: `inboxes:manage`.
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/channels/{channelId}/public-key:
    post:
      operationId: rotateChannelPublicKey
      summary: Rotate a chat or app channel's public key
      description: |
        Owners, admins and API keys. Gives a `chat` or `app` channel a new public
        key; widgets and apps built with the old key can no longer start sessions, existing contact
        sessions keep working. Other kinds answer `400`.

        Scope: `inboxes:manage`.
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: The channel with its new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/channels/{channelId}/forwarding-address/rotate:
    post:
      operationId: rotateForwardingAddress
      summary: Give an e-mail channel a new forwarding address
      description: |
        Owners, admins and API keys. Every e-mail channel receives mail at
        `forwarding_address` (`<token>@` the server's forwarding domain) besides its own address,
        so a mailbox can forward to Yuva without a loop. Rotating gives it a new token; mail to the
        old forwarding address is refused from then on, so change the forwarding at the provider
        too. Other kinds, and servers without a forwarding domain, answer `400`.

        Scope: `inboxes:manage`.
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: The channel with its new forwarding address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/channels/{channelId}/deliverability-check:
    post:
      operationId: checkDeliverability
      summary: Check how an e-mail channel's broadcasts authenticate
      description: |
        Sends a probe through the channel's broadcast SMTP account (its support account when it
        has none) to the channel's own address, with the headers a broadcast carries, and looks up
        DNS: the SPF record and DMARC record of the sending domain, the MX of the reply address's
        domain and, when the channel has a Yuva DKIM key, its record. The probe is recognised when
        it arrives and never becomes a conversation; the result is read only from the
        `Authentication-Results` of the receiving server the operator trusts
        (`YUVA_INGRESS_AUTHSERV_ID`) and from the DKIM signature aligned with `From`. Read it with
        `GET /v1/channels/{id}/deliverability`; it is `sent` until the probe arrives and `timeout`
        when it has not within 10 minutes. A new check replaces the previous one.

        `409 email_channel_required` when the channel is not an e-mail channel or cannot send;
        at most 6 checks an hour per channel (`429 rate_limited`).

        Owners, admins and API keys. Scope: `inboxes:manage`.
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "202":
          description: The check, `queued`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverabilityCheck"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /v1/channels/{channelId}/deliverability:
    get:
      operationId: getDeliverability
      summary: Get the last deliverability check of an e-mail channel
      description: |
        The last check and what it found. `404 not_found` when the channel was never checked. The
        broadcast review reads it: a warning when the channel was never checked, the check did not
        finish or found no DMARC record, blocking when it found no passing DKIM signature.

        Scope: `inboxes:read`.
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: The last check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverabilityCheck"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/channels/{channelId}/dkim-key:
    post:
      operationId: createDkimKey
      summary: Create a DKIM key for an e-mail channel
      description: |
        Creates an RSA 2048 key that Yuva signs the channel's broadcasts, tests, list mails and
        deliverability probes with, once enabled. The private key is stored encrypted under the
        server's master key and never returned. Publish `dns_value` as a TXT record at `dns_name`
        (a provider that limits TXT strings to 255 characters splits it into several strings of
        one record), then enable it with `PATCH /v1/channels/{id}` and `email.dkim.enabled`,
        which looks the record up first. The signature uses `d=` the sending domain,
        relaxed/relaxed canonicalization and `rsa-sha256`, and covers `List-Unsubscribe` and
        `List-Unsubscribe-Post`; the provider's own signature stays next to it.

        `409 dkim_exists` when the channel has a key (remove it first); `409
        email_channel_required` when the channel is not an e-mail channel.

        Owners, admins and API keys. Scope: `inboxes:manage`.
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DkimKeyCreate"
      responses:
        "201":
          description: The key's selector and the DNS record to publish.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDkim"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDkimKey
      summary: Remove an e-mail channel's DKIM key
      description: |
        Stops signing with it and deletes the key; a channel without a key also answers `204`.
        `409 email_channel_required` when the channel is not an e-mail channel.

        Owners, admins and API keys. Scope: `inboxes:manage`.
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/contacts:
    get:
      operationId: listContacts
      summary: List contacts
      description: |
        Newest first, or most recently active first with `sort=last_seen` (contacts never seen sort
        by when they were created). `q` searches names, e-mail addresses and external ids.
        With `sort=last_seen`, a contact who becomes active while you page moves above the pages
        already read and does not appear on the later ones; no contact appears twice.
        Each item carries `activity`, counted over the inboxes the caller can see.

        Scope: `contacts:read`.
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/Search"
        - name: kind
          in: query
          description: |
            `known`: the contact has an e-mail address or an external id. `visitor`: neither (an
            anonymous widget visitor, or someone known only by a typed, unconfirmed address).
          schema:
            type: string
            enum: [known, visitor]
        - name: has_open
          in: query
          description: Only contacts with (`true`) or without (`false`) an open conversation the caller can see; spam does not count.
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [created, last_seen]
            default: created
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of contacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createContact
      summary: Create a contact
      description: "Scope: `contacts:write`."
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreate"
      responses:
        "201":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/contacts/lookup:
    get:
      operationId: lookupContact
      summary: Find a contact by external id
      description: |
        The contact a host app knows by `external_id` in the given inbox. An inbox the caller
        cannot see answers `404`.

        Scope: `contacts:read`.
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: inbox_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: external_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/contacts/by-external-id:
    delete:
      operationId: deleteContactByExternalId
      summary: Delete a contact by external id
      description: |
        Owners, admins and API keys not limited to inboxes. Deletes the contact the host app knows by `external_id` in the
        given inbox, exactly like `DELETE /v1/contacts/{contactId}`: all their conversations,
        messages, attachments, sessions and addresses, in every inbox. Call it when a user deletes
        their account in the host app (GDPR, KVKK). Emits `contact.deleted`, whose webhook payload
        still carries the external ids. An unknown external id, or an inbox the caller cannot see,
        answers `404`.

        Scope: `contacts:write`.
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: inbox_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: external_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/contacts/{contactId}:
    get:
      operationId: getContact
      summary: Get a contact
      description: "Scope: `contacts:read`."
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateContact
      summary: Update a contact
      description: |
        `emails`, `external_ids` and `attributes` replace the stored values when given.

        Scope: `contacts:write`.
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: The updated contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteContact
      summary: Delete a contact
      description: |
        Owners, admins and API keys not limited to inboxes. Deletes the contact with all their conversations, messages
        and attachments.

        Scope: `contacts:write`.
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ContactId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/contacts/{contactId}/merge:
    post:
      operationId: mergeContact
      summary: Merge another contact into this one
      description: |
        Owners, admins and API keys not limited to inboxes. The contact in the path keeps its id and gains the source's
        e-mail addresses, external ids, attributes (its own value wins on a key both have), its
        name and locale when it has none, and every conversation of the source. The source is
        deleted with its sessions and visitor ids; identity tokens and inbound mail for its
        addresses and external ids now find this contact. Emits `conversation.updated` for each
        moved conversation, `contact.updated` for this contact and `contact.deleted` (with
        `merged_into_id`) for the source.

        Scope: `contacts:write`.
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMerge"
      responses:
        "200":
          description: The merged contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/contacts/{contactId}/notes:
    get:
      operationId: listContactNotes
      summary: List notes about a contact
      description: |
        Team-only notes about the contact, not tied to a conversation, newest first. Whoever can
        see the contact can read and add them; contacts never see them, and no event or webhook
        carries them.

        Scope: `contacts:read`.
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ContactId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactNotePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createContactNote
      summary: Add a note about a contact
      description: "Scope: `contacts:write`."
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactNoteCreate"
      responses:
        "201":
          description: The note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactNote"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/contacts/{contactId}/notes/{noteId}:
    delete:
      operationId: deleteContactNote
      summary: Delete a note about a contact
      description: |
        Its author (a member, or the API key that wrote it) or an owner or admin; anyone else gets
        `403 forbidden`.

        Scope: `contacts:write`.
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ContactId"
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/contacts/{contactId}/summary:
    get:
      operationId: getContactSummary
      summary: How the team served a contact
      description: |
        First-reply time and ratings over the contact's conversations the caller can see. The
        counts of conversations are on the contact's `activity`.

        Scope: `contacts:read` and `conversations:read`.
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSummary"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/contacts/{contactId}/presence:
    get:
      operationId: getContactPresence
      summary: Whether a contact is connected
      description: |
        Whether the contact has a live `/client/v1/realtime` connection (widget or app in the
        foreground), and when one was last seen. A host backend that sends its own push
        notifications can skip the push while the contact is online; webhooks carry the same
        `contact.online`, and `contact.presence` events on `/v1/realtime` report changes.

        Scope: `contacts:read`.
      tags: [contacts]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: The contact's presence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPresence"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/contacts/{contactId}/visits:
    get:
      operationId: listContactVisits
      summary: A contact's recent visits
      description: |
        The visits linked to the contact on the analytics properties the caller can see, newest
        first, from the raw window (`YUVA_ANALYTICS_RAW_DAYS`). A visit is linked only when the
        visitor consented to the `persistent` and `identify` features of the property and the
        host's backend identified them with a valid identity token; visits of anyone else are never
        joined to a contact, so for most contacts the list is empty. Deleting the contact deletes
        these visits; merging contacts moves them.

        Scopes: `contacts:read` and `analytics:read`.
      tags: [contacts, analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ContactId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: "`next_cursor` of the previous page."
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: The visits, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsContactVisitList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/contacts/{contactId}/subscriptions:
    get:
      operationId: listContactSubscriptions
      summary: A contact's subscriptions
      description: |
        The contact's subscriptions to the lists of the inboxes the caller can see.

        Scopes: `contacts:read` and `lists:read`.
      tags: [contacts, lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: The subscriptions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubscriptionList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/contacts/{contactId}/consent:
    get:
      operationId: exportContactConsent
      summary: Export a contact's consent records
      description: |
        Every consent event of the contact's subscriptions to the lists the caller can see, oldest
        first, in the rows of `exportListConsent`: for answering a data subject's access request
        (GDPR Art. 15, KVKK Art. 11).

        Scopes: `contacts:read` and `lists:read`.
      tags: [contacts, lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ContactId"
        - $ref: "#/components/parameters/ConsentFormat"
      responses:
        "200":
          description: The records.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentExport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/conversations:
    get:
      operationId: listConversations
      summary: List conversations
      description: |
        Most recent activity (message or note) first, in the inboxes the caller can see. `q` is a
        full-text search over the subject, the messages and notes, and the contact; a negated term
        (`-word`, `-"some phrase"`) excludes every conversation in which any of those contains it.

        Scope: `conversations:read`.

        Each item carries the contact (id, name, first e-mail address), a preview of the last
        `message` (notes and events are not previewed), and `unread` and `pinned_at` for the
        calling member.
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: inbox_id
          in: query
          schema:
            type: string
            format: uuid
        - name: contact_id
          in: query
          description: Only this contact's conversations. A contact of another workspace answers `404`.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ConversationStatus"
        - name: assignee
          in: query
          description: A member id, `me` (member sessions only) or `unassigned`.
          schema:
            type: string
            examples: [me]
        - name: label_id
          in: query
          schema:
            type: string
            format: uuid
        - name: spam
          in: query
          description: |
            `true` lists only conversations flagged as spam (the spam view); without it, or with
            `false`, spam is left out.
          schema:
            type: boolean
            default: false
        - name: kind
          in: query
          description: |
            Only conversations of these kinds, e.g. `feedback` for the feedback view. Repeat the
            parameter (`kind=feedback&kind=conversation`) or give a comma-separated list
            (`kind=feedback,conversation`).
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ConversationKind"
        - name: channel_kind
          in: query
          description: |
            Only conversations that started on a channel of these kinds (`channel_kind` on the
            conversation). Repeat the parameter or give a comma-separated list. Conversations
            without a `channel_kind` never match.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ChannelKind"
        - name: site
          in: query
          description: |
            Only conversations sent from a page of this site: an origin, `scheme://host[:port]`,
            matched against the origin of `page.page_url`.
          schema:
            type: string
            maxLength: 300
            examples: ["https://docs.example.com"]
        - name: category
          in: query
          description: |
            Only feedback of this category (implies `kind=feedback`; with a `kind` list that lacks
            `feedback`, `400`).
          schema:
            $ref: "#/components/schemas/FeedbackCategory"
        - name: page
          in: query
          description: |
            Only conversations sent from this documentation page (a URL; query and fragment are
            ignored).
          schema:
            type: string
            maxLength: 2000
        - name: broadcast_id
          in: query
          description: Only conversations opened by replies to this broadcast.
          schema:
            type: string
            format: uuid
        - name: pinned
          in: query
          description: |
            `true` lists only the conversations the calling member pinned, `false` only the others;
            without it, both. Member sessions only (`400 validation_failed` for API keys).
          schema:
            type: boolean
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createConversation
      summary: Start a conversation
      description: "Scope: `conversations:write`."
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreate"
      responses:
        "201":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/conversations/counts:
    get:
      operationId: getConversationCounts
      summary: Count open conversations
      description: |
        Open conversations in the inboxes the caller can see: all of them, those assigned to the
        calling member (`0` for API keys), unassigned ones, and per inbox, per assignee and per
        label. Inboxes, assignees and labels without open conversations are left out of their lists. Conversations flagged as
        spam are counted only in `spam`.

        Scope: `conversations:read`.
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationCounts"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/home:
    get:
      operationId: getHome
      summary: Everything the workspace has today, in one answer
      description: |
        The panel's Home page in one request, for the calling member and only what they may see.
        Member sessions only (API keys and OAuth tokens answer `403 member_session_required`).
        Every block is read from the counters and rollups the server keeps; none of it spends the
        workspace's analytics query slots.

        - `inbox` (every member): open, unassigned and waiting conversations in the inboxes the
          member can see, counted as `GET /v1/conversations/counts` counts them (spam left out),
          and the conversation that has waited longest. A conversation waits while the contact's
          last message has no reply from a member or bot after it; `since` is the contact's first
          message after the last reply.
        - `analytics` (when the server collects analytics): the properties the member can see, as
          `GET /v1/analytics/properties` lists them, each with visitors today, visitors in the last
          30 minutes (as `GET /v1/analytics/properties/{id}/realtime` counts them) and visitors per
          local day for the last seven days. Left out for an agent who can see no property.
        - `broadcasts` (when the server sends broadcasts): the last sent broadcast of the inboxes
          the member can see. There is no open tracking, so there are no opens.
        - `setup` (owners and admins): the setup checklist, built from the same state as the MCP
          `get_setup_state` tool.
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The Home blocks the member may see.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/stats:
    get:
      operationId: getStats
      summary: Team activity since a moment
      description: |
        What the team did in the inboxes the caller can see (or in one of them) from `since` until
        now: replies sent by members (messages members wrote or drafts they sent; not notes, not
        bots' own messages), conversations closed, the median time from a contact's first
        message to the first member reply, over the conversations whose first reply falls in the
        window, and the ratings contacts gave in it. `members` breaks replies and closes down per member, leaving out members with
        neither. Nothing is stored for it; it is counted from the messages each time.

        `since` defaults to the start of today in `timezone` (an IANA name, `UTC` by default); the
        panel sends the browser's zone. It must be in the past and at most 366 days ago.

        Scope: `conversations:read`.
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: inbox_id
          in: query
          description: Only this inbox (`404` when the caller cannot see it).
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          description: Start of the window; the start of today in `timezone` when absent.
          schema:
            type: string
            format: date-time
        - name: timezone
          in: query
          description: IANA time zone for the default `since`.
          schema:
            type: string
            maxLength: 64
            default: UTC
            examples: ["Europe/Istanbul"]
      responses:
        "200":
          description: The activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/conversations/bulk:
    post:
      operationId: bulkUpdateConversations
      summary: Change several conversations at once
      description: |
        Applies one change to up to 100 conversations: a status (with `snooze_until` for
        `snoozed`), an assignee (`null` unassigns), labels to add and labels to remove. Each
        conversation is changed in its own transaction, records the same `event` messages and
        emits the same events and webhooks as `PATCH /v1/conversations/{conversationId}`.
        A conversation the caller cannot see (or of another workspace) is listed in `failed`
        with `not_found`; one whose inbox the new assignee cannot access with
        `validation_failed`. A request that is invalid as a whole (no change, an unknown label or
        member, a past `snooze_until`) is refused with `400` and changes nothing.

        Scope: `conversations:write`.
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationBulkUpdate"
      responses:
        "200":
          description: Which conversations changed and which were refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationBulkResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: Get a conversation
      description: "Scope: `conversations:read`."
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateConversation
      summary: Update a conversation
      description: |
        Changes to the assignee, the status and the labels are recorded as `event` messages.
        `snooze_until` is required with status `snoozed` and cleared by any other status.

        Scope: `conversations:write`.
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationUpdate"
      responses:
        "200":
          description: The updated conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/conversations/{conversationId}/move:
    post:
      operationId: moveConversation
      summary: Move a conversation to another inbox
      description: |
        The caller must see both inboxes. Messages, notes, labels and attachments move with the
        conversation; the assignee stays only when they can access the new inbox. The
        conversation continues on the new inbox's channel of the same kind (for e-mail the one
        its chat continuity would use); an e-mail conversation is refused with
        `409 no_email_channel` when the new inbox has none. The timeline gets a `moved` event.
        `conversation.updated` reports the new inbox; members watching the old one get
        `conversation.moved`.

        Scope: `conversations:write`.
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationMove"
      responses:
        "200":
          description: The moved conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/conversations/{conversationId}/discussion:
    post:
      operationId: createDiscussionFromConversation
      summary: Turn a private conversation into a public thread
      description: |
        Starts a published thread from a conversation with the text the member supplies: nothing of
        the conversation itself becomes public, and the conversation stays private and unchanged.
        The page is `page_url`, else the conversation's page (`page` on the conversation), else
        `400 validation_failed`; a chat channel of the conversation's inbox must allow the page's
        origin and have discussions on (`409 no_discussion_channel` otherwise; the conversation's own
        channel is preferred).

        The conversation's contact becomes the thread's author only when they are a signed-in
        reader (linked to a person) or known to the host app (an external id in the inbox);
        otherwise the calling member is. With `answer`, the member's reply is posted and marked as
        the accepted answer. The author follows the thread. A conversation becomes one thread
        (`409 already_discussed`); `conversation_id` on the thread links back.

        Member sessions only.
      tags: [discussions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscussionFromConversation"
      responses:
        "201":
          description: The thread and its posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscussionDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      summary: List a conversation's messages
      description: |
        Messages, notes and events, oldest first by default. With `order=desc` the newest come
        first and `next_cursor` pages backward, so a thread can load its latest page and then
        older ones.

        Scope: `conversations:read`.
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ConversationId"
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMessage
      summary: Post a message or a note
      description: |
        Members post replies (`message`, direction `out`) and notes. An `in` message is written on
        behalf of the conversation's contact and is allowed with an API key only. Messages and notes
        posted with an API key have a `bot` author unless they are `in`.

        Scope for API keys: `notes:write` for a note, `messages:write` for a message. While the
        workspace's `bots_may_send` is off, a key's outgoing message must be a draft
        (`403 bot_sending_disabled`).

        `draft: true` stores an outgoing message as a draft: nothing is delivered, and
        `draft.created` is emitted instead of `message.created`. Edit it with
        `PATCH /v1/messages/{id}`, discard it with `DELETE /v1/messages/{id}` and deliver it with
        `POST /v1/messages/{id}/send`. A draft cannot be a note or an `in` message.

        Send `multipart/form-data` to attach files: the fields of `MessageCreate` as form fields
        and up to 10 `files` parts. Each file must be within the server's size limit and have an
        allowed content type. The type is checked against the content: a file whose content does
        not match its declared type (a text file sent as `image/png`) is refused with 415
        `attachment_type_mismatch`; a file declared without a type or as
        `application/octet-stream` gets the type detected from its content.

        A repeated `client_id` in the same conversation returns the stored message with `200`
        instead of writing it again.

        A message or note posted by a member moves that member's read cursor to it in the same
        transaction, with the same `conversation.read` event as `POST .../read`.

        A member's reply (`message`, `out`) in a conversation that started on an `email` channel is
        e-mailed to the contact through the channel's SMTP account by a background job: the message
        is returned with `delivery.state` `queued`, and `message.updated` events report `sent` or
        `failed`. Notes are never e-mailed. When the recipient address is undeliverable (bounced or
        complained) the reply is refused with `409 email_undeliverable`; when the channel has no
        SMTP account, with `409 email_not_configured`. A catch-all channel (`*@domain`) sends from the
        address the contact wrote to; when the conversation has none and the channel has no
        `from_address`, the reply is refused with `409 email_no_sender`.
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MessageCreateMultipart"
      responses:
        "200":
          description: The message stored earlier with this `client_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "201":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
  /v1/conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      summary: Mark a conversation read
      description: |
        Moves the calling member's read cursor to `message_id`, or to the latest message, note or
        event when it is absent. The cursor only moves forward; an older `message_id` leaves it
        where it is. When it moves, a `conversation.read` event reaches the member's other
        connections. Posting a message or note moves the author's cursor the same way. Member
        sessions only.
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationReadCreate"
      responses:
        "200":
          description: The member's read state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationRead"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/conversations/{conversationId}/unread:
    post:
      operationId: markConversationUnread
      summary: Mark a conversation unread
      description: |
        Marks the conversation unread for the calling member, wherever their read cursor is: it is
        `unread` in their lists until they read it again (`POST .../read`, or a message or note
        of their own). Others are not affected. A `conversation.read` event with `unread: true`
        reaches the member's connections. Member sessions only.
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The member's read state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationRead"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/conversations/{conversationId}/pin:
    put:
      operationId: pinConversation
      summary: Pin a conversation
      description: |
        Pins the conversation to the top of the calling member's lists; nobody else sees it.
        Pinning a pinned conversation keeps its `pinned_at`. A `conversation.pin` event reaches the
        member's connections. Member sessions only.
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The member's pin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPin"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unpinConversation
      summary: Unpin a conversation
      description: |
        Takes the calling member's pin away; unpinning a conversation that is not pinned changes
        nothing. A `conversation.pin` event reaches the member's connections when a pin was
        removed. Member sessions only.
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The member's pin, without `pinned_at`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPin"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/conversations/{conversationId}/typing:
    post:
      operationId: setMemberTyping
      summary: Tell others you are typing
      description: |
        Shows the calling member as typing a reply in the conversation: other members with access
        receive a `typing` event on `/v1/realtime`, and the conversation's contact receives one on
        `/client/v1/realtime` when the inbox is `live`. Call it while the member composes a reply
        (not a note), at most every few seconds; clients stop showing the indicator after about
        6 seconds without another one, or at once on `typing: false`. Nothing is stored. Member
        sessions only.
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypingCreate"
      responses:
        "204":
          description: Sent.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/drafts:
    get:
      operationId: listDrafts
      summary: List pending drafts
      description: |
        Drafts waiting to be sent, edited or discarded in the conversations the caller can see,
        newest first, each with its conversation. `author` narrows them to drafts by bots (API
        keys), by assistants (members through an OAuth client, `author.via` set) or by members in
        the panel. The page carries `total`, the number of drafts matching the filters over all
        pages, for a badge.

        Scope: `conversations:read`.

        Realtime: `draft.created`, `draft.updated` and `draft.deleted` carry the draft; a sent
        draft arrives as `message.created` with the draft's id and `draft: false`;
        `conversation.updated`, `conversation.moved` and `inbox_access.changed` can change the
        conversation summary or hide items.
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: inbox_id
          in: query
          description: Only drafts in this inbox. An inbox the caller cannot see answers `404`.
          schema:
            type: string
            format: uuid
        - name: author
          in: query
          schema:
            $ref: "#/components/schemas/DraftAuthorKind"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of drafts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/attachments/{attachmentId}:
    get:
      operationId: downloadAttachment
      summary: Download an attachment
      description: |
        Always served as a download (`Content-Disposition: attachment`). Links cannot carry
        headers, so the workspace can also be named with the `workspace_id` query parameter
        instead of `Yuva-Workspace`.

        Scope: `conversations:read`.
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AttachmentId"
        - name: workspace_id
          in: query
          description: The workspace to act on, for links that cannot send `Yuva-Workspace`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/messages/{messageId}:
    patch:
      operationId: updateMessage
      summary: Edit a draft
      description: |
        Changes a draft's text; emits `draft.updated`. Anything that is not a draft answers
        `409 not_a_draft`.

        Scope: `messages:write`.
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageUpdate"
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMessage
      summary: Discard a draft
      description: |
        Deletes a draft with its attachments; emits `draft.deleted`. Anything that is not a draft
        answers `409 not_a_draft`.

        Scope: `messages:write`.
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Discarded.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/messages/{messageId}/send:
    post:
      operationId: sendMessage
      summary: Send a draft
      description: |
        Delivers a draft like a new outgoing message: its time becomes now, `sent_by` names who
        sent it, the author stays the draft's author, and `message.created` is emitted (an e-mail
        conversation e-mails it, as in `createMessage`). Anything that is not a draft answers
        `409 not_a_draft`.

        Members always may. An API key needs `drafts:send` and `messages:write`, and the
        workspace's `bots_may_send` (`403 bot_sending_disabled`).
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: The sent message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/messages/{messageId}/email:
    get:
      operationId: getMessageEmail
      summary: Get a message's e-mail details
      description: |
        The full text with the quoted history and signature that the thread hides, the full
        sanitized HTML, the original HTML with the sender's styling, and the headers that matter.
        Only messages that came or went by e-mail have them; others answer `404`.

        Scope: `conversations:read`.
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: The e-mail details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEmailDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/messages/{messageId}/raw:
    get:
      operationId: downloadMessageRaw
      summary: Download the original e-mail
      description: |
        The message exactly as it was received, as `message/rfc822` (an `.eml` download). Only
        inbound e-mail keeps its original; others answer `404`. Links cannot carry headers, so the
        workspace can also be named with the `workspace_id` query parameter.

        Scope: `conversations:read`.
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MessageId"
        - name: workspace_id
          in: query
          description: The workspace to act on, for links that cannot send `Yuva-Workspace`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The original message.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:

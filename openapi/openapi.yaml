  /v1/lists/{listId}/subscriptions:
    get:
      operationId: listSubscriptions
      summary: List a list's subscriptions
      description: |
        Newest first. `q` matches the address or the contact's name.

        Scope: `lists:read`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/SubscriptionState"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSubscription
      summary: Add a subscriber
      description: |
        Adds an address (or a contact's first address) to the list, for host backends and members
        who collected consent themselves. The caller declares it in `consent`:

        - `confirmed: true`: the person already agreed (when, the text they saw, where, a
          reference to your own record). The subscription is `subscribed` at once and the list's
          welcome mail is sent.
        - `confirmed: false`: the subscription is `pending` and the person gets a confirmation mail;
          nothing is sent to them until they confirm.

        The contact is found by `contact_id`, by `external_id` in the list's inbox, or by the
        address, else created with `name`, `locale`, `external_id` and `attributes`; an existing
        contact keeps what it has (only an empty name and missing locale are filled).

        Answers `201` for a new subscription and `200` with the existing one when the address is
        already `subscribed` or `pending` (a `pending` one with `confirmed: true` becomes
        `subscribed`). Refused: `409 unsubscribed` when the address unsubscribed from this list, and
        with `confirmed: true` also when it asked again and waits for its confirmation: only the
        person can come back, by asking on a form or in the app and confirming the mail they get;
        no member or key sends them a confirmation. `409 opted_out` when it unsubscribed from
        everything, complained or was erased after objecting, `409 suppressed` when mail to it
        bounced or was reported as spam, `400 validation_failed` without `consent` or
        `consent.confirmed`, `400 invalid_email`, `429 confirmation_limit` when the address already
        got 3 confirmation mails today.

        Owners, admins and API keys. Scope: `lists:write`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCreate"
      responses:
        "200":
          description: The address was already on the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "201":
          description: The new subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /v1/lists/{listId}/subscriptions/{subscriptionId}:
    get:
      operationId: getSubscription
      summary: A subscription with its consent events
      description: "Scope: `lists:read`."
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: The subscription and its events, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetail"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateSubscription
      summary: Unsubscribe a subscriber
      description: |
        The only change a member or key can make is `state: unsubscribed`; anything that would
        make a subscription `subscribed` answers `409 confirmation_required` (add an address that
        never unsubscribed with `consent.confirmed: false` to mail the person a confirmation).

        Owners, admins and API keys. Scope: `lists:write`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpdate"
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSubscription
      summary: Delete a subscription
      description: |
        Deletes the subscription and its consent events. An `unsubscribed` subscription leaves the
        address opted out, so it cannot be added back by a member or a key.

        Owners, admins and API keys. Scope: `lists:write`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/lists/{listId}/subscriptions/{subscriptionId}/confirmation:
    post:
      operationId: resendSubscriptionConfirmation
      summary: Mail the confirmation again
      description: |
        Queues another confirmation mail for a `pending` subscription (`409 not_pending`
        otherwise). At most 3 per subscription and day and 10 in all (`429 confirmation_limit`);
        a list without a usable e-mail channel answers `409 email_channel_required`.

        Owners, admins and API keys. Scope: `lists:write`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "202":
          description: Queued.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /v1/lists/{listId}/consent-export:
    get:
      operationId: exportListConsent
      summary: Export a list's consent records
      description: |
        One row per consent event of the list's subscriptions, with the subscription's address and
        current state, oldest first: proof of consent (GDPR Art. 7(1)) and refusals for your own
        records or an upload to a registry such as İYS. `since` keeps the events from then on.
        `format=csv` (the default) quotes every cell and prefixes cells starting with `=`, `+`,
        `-`, `@`, tab or carriage return with `'`, so spreadsheets do not run them as formulas.

        `format=iys` is a helper for registering the list's consents in Türkiye's İYS yourself: a
        CSV with one row per subscription that is `subscribed` (status `ONAY`) or `unsubscribed`
        (status `RET`), in the fields of İYS's consent model: `recipient` (the address), `type`
        (`EPOSTA`), `source` (`HS_WEB` for forms and the preference page, `HS_EORTAM` for the
        rest), `status`, `consentDate` (when the person agreed or refused, `YYYY-MM-DD HH:MM:SS`
        in Türkiye's time) and `recipientType` (`BIREYSEL`). `since` keeps the subscriptions that
        agreed or refused from then on. Pending subscriptions are left out. Check the rows against
        your own records before uploading; only commercial lists need registering.

        Scope: `lists:read`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/ListConsentFormat"
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The records.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentExport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/lists/{listId}/imports:
    get:
      operationId: listListImports
      summary: List a list's CSV imports
      description: |
        Newest first.

        Scope: `lists:read`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of imports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListImportPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createListImport
      summary: Upload a CSV file of subscribers
      description: |
        One `file` part (a CSV file of at most 20 MiB with a header row) plus the importer's
        declaration of consent: `attestation`, the statement they accepted (such as "Everyone in
        this file agreed to receive {list} from {sender}; I can show how and when"), and
        `consent_source`, where and when the people agreed. Both are required
        (`422 attestation_required`) and are stored on the import and on every consent event it
        writes. `reconfirm=true` subscribes nobody: every new address becomes `pending` and gets
        the list's confirmation mail, spread over days by the workspace's daily sending limit; the
        list then needs a usable e-mail channel (`409 email_channel_required`). `mapping` is an
        optional JSON `ListImportMappingUpdate`; without it the columns are guessed from the
        headers.

        The import starts `validating`: the file is read (UTF-8 with or without BOM, UTF-16 with
        BOM, else Windows-1254 when it holds Turkish letters, else Windows-1252; `,`, `;` or tab
        found from the header row; quotes per RFC 4180), each address checked (syntax, a domain
        that takes mail, role addresses such as `postmaster@`, duplicates, suppressed, opted out
        or unsubscribed from the list) and nothing is written yet. It then becomes `ready` with
        `counts`, `columns` and `preview`, or `failed` with `error` (a file over the server's row
        limit, 100,000 by default, fails). Start it with `/start`.

        One import per workspace validates or imports at a time (`409 import_running`). A file
        that is not text answers `415 not_csv`, one over 20 MiB `413 file_too_large`.

        Owners, admins and API keys. Scope: `lists:write`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ListImportUpload"
      responses:
        "202":
          description: The import, `validating`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListImport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/lists/{listId}/imports/{importId}:
    get:
      operationId: getListImport
      summary: A CSV import
      description: "Scope: `lists:read`."
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListImport"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateListImport
      summary: Change an import's column mapping
      description: |
        Only while `ready` (`409 not_ready`): sets what each column holds and validates the file
        again (the import goes back to `validating`). Exactly one column must be `email`.

        Owners, admins and API keys. Scope: `lists:write`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/ImportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListImportMappingUpdate"
      responses:
        "200":
          description: The import, `validating`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListImport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: cancelListImport
      summary: Cancel an import
      description: |
        Stops a `validating`, `ready` or `importing` import and deletes the uploaded file.
        Subscriptions it already added stay, with their consent events. A finished import is left
        as it is.

        Owners, admins and API keys. Scope: `lists:write`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/ImportId"
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/lists/{listId}/imports/{importId}/start:
    post:
      operationId: startListImport
      summary: Start a validated import
      description: |
        Moves a `ready` import to `importing` (`409 not_ready` otherwise; `422
        email_column_required` when no column is mapped to `email`; `409 import_running` while
        another import of the workspace runs). Rows are added 1,000 per transaction, each address
        checked again; `rows_done` and `counts` grow as it goes and `list_import.progress` reaches
        `/v1/realtime` at most once a second. Addresses that unsubscribed from the list, opted out
        of the workspace or are suppressed are never added. Contacts are found by address or
        created with the row's name and locale; mapped attributes only fill keys a contact does
        not have yet. Imports send no `subscription.*` events or webhooks per row and no welcome
        mail. The upload is deleted when the import ends; refused rows stay downloadable from
        `/errors` for 7 days.

        Owners, admins and API keys. Scope: `lists:write`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/ImportId"
      responses:
        "202":
          description: The import, `importing`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListImport"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/lists/{listId}/imports/{importId}/errors:
    get:
      operationId: getListImportErrors
      summary: Download an import's refused rows
      description: |
        A CSV file with one row per refused row of the file: `row` (the line the row starts on,
        the header being line 1), `email` as written in the file and `reason`: `invalid_email`,
        `no_mail_domain`, `role_address`, `duplicate`, `suppressed`, `opted_out` or `unsubscribed`.
        Cells are quoted and formula-like values defused as in the consent export. Filled while
        the import runs; `404` once it is 7 days past its end.

        Scope: `lists:read`.
      tags: [lists]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: The refused rows.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/email-templates:
    get:
      operationId: listEmailTemplates
      summary: List the template gallery

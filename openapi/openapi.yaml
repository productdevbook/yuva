            $ref: "#/components/schemas/MigrationPerson"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/MigrationLabelMapping"
        quiet_period_hours:
          type: integer
          format: int32
          description: How long sync runs after delivery is verified without finding mail that did not also arrive at Yuva.
    MigrationOptionsInput:
      type: object
      description: The options to change; others keep their value.
      properties:
        folders:
          type: [array, "null"]
          maxItems: 1000
          description: "`null` for the preset's default."
          items:
            type: string
            minLength: 1
            maxLength: 1000
        since:
          type: [string, "null"]
          format: date-time
        skip_automatic:
          type: boolean
        close_after_days:
          type: integer
          format: int32
          minimum: 0
          maximum: 3650
        keep_originals:
          type: boolean
        team_addresses:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Email"
        people:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/MigrationPerson"
        labels:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/MigrationLabelMapping"
        inboxes:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/MigrationInboxMapping"
        quiet_period_hours:
          type: integer
          format: int32
          minimum: 1
          maximum: 336
    Migration:
      type: object

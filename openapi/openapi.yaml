  /v1/analytics/properties/{propertyId}/funnels/{funnelId}/report:
    get:
      operationId: getAnalyticsFunnelReport
      summary: How visitors went through a funnel
      description: |
        Per step, the visitors who completed it after every step before it within one visit, from
        the raw events of the range. A visitor exists for one day, so a funnel never crosses
        midnight; visitors over a range are added up per day. Visitors with a persistent id (the
        `persistent` consent feature) are also followed across visits and days of the range, in
        `consented_visitors`. The range must lie inside the raw
        window (`422 needs_raw_window`) and span at most 90 days, or 31 when the property counted
        more than 10 million events over the last 30 days (`422 range_too_large`). Answers are
        cached for ten minutes.

        Scope: `analytics:read`.
      tags: [analytics]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/AnalyticsPropertyId"
        - $ref: "#/components/parameters/AnalyticsFunnelId"
        - name: period
          in: query
          description: A period ending today as in `AnalyticsRange`; `30d` when neither it nor `from` and `to` are given.
          schema:
            type: string
            enum: [today, yesterday, 7d, 28d, 30d, 90d, month, last_month]
            x-enum-varnames: [AnalyticsFunnelToday, AnalyticsFunnelYesterday, AnalyticsFunnelLast7Days, AnalyticsFunnelLast28Days,
              AnalyticsFunnelLast30Days, AnalyticsFunnelLast90Days, AnalyticsFunnelThisMonth, AnalyticsFunnelLastMonth]
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The funnel's steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsFunnelReport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: "`needs_raw_window` or `range_too_large`, as described above."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AnalyticsRangeProblem"
        "429":
          $ref: "#/components/responses/Problem"

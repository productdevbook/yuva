          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSubscriptionStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unsubscribeClient
      summary: Unsubscribe the session contact
      description: |
        Unsubscribes the session's contact from a public list of the session's inbox at once.
        Nothing to unsubscribe is not an error.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/ListId"
      responses:
        "204":
          description: Unsubscribed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /client/v1/conversations:
    get:
      operationId: listClientConversations
      summary: List the contact's conversations
      description: |
        The contact's conversations in the session's inbox, on any channel, latest message first.

        "409":
          $ref: "#/components/responses/Problem"
  /v1/webhooks/{webhookId}/attempts:
    get:
      operationId: listWebhookAttempts
      summary: The endpoint's delivery log
      description: |
        Owners, admins and API keys. The last attempts to the endpoint, newest first: status code,
        latency, the first 1 KiB of the response body and the error. The newest 100 are kept.
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/WebhookId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAttemptList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/realtime:
    get:
      operationId: realtime
      summary: Live events (WebSocket)
      description: |
        Upgrades to a WebSocket that streams the workspace's events as they are committed. Members
        authenticate with the session cookie; the `Origin` header must then be the server's public
        origin (or one of the configured WebAuthn origins). API keys send
        `Authorization: Bearer <key>`. Browsers cannot set headers on a WebSocket, so the workspace
        can also be named with the `workspace_id` query parameter instead of `Yuva-Workspace`.

        Every server message is one JSON text frame matching `RealtimeMessage`. Events carry an
        increasing `id`; within a workspace ids are in commit order. Owners, admins and API keys
        receive every event of the workspace. Agents receive the events of the inboxes they can
        access, contact events, and `inbox_access.changed` events about themselves; their access is
        re-read when such an event arrives and every 30 seconds. `inbox.created` reaches owners,
        admins and API keys (an agent learns of a new inbox from `inbox_access.changed`);
        `inbox.deleted` reaches everyone who could see the inbox. `conversation.read` reaches only
        the connections of the member who read. `typing` (a contact or another member typing) has no
        `id`, is not stored and is not replayed.

        A member session's open connection also makes the member available to contacts of `live`
        inboxes they can access (see `availability` on `/v1/me`).

        Resuming: after the replay (if any) the server sends `ready` with `last_event_id`, the
        stream position at that moment. Remember the larger of that value and the `id` of every
        event received, and reconnect with `?last_event_id=<it>`. The server then replays the
        events after it, without gaps or duplicates, before the live ones. Events are kept for 24
        hours; when `last_event_id` is no longer known the server sends `resync_required` (reload
        everything over HTTP) followed by `ready` and continues live. Without `last_event_id` there
        is no replay.

        The server pings every 30 seconds. A member's panel reports the conversation it shows with
        a text frame `{"type": "viewing", "conversation_id": "<id>"}`, and
        `{"type": "viewing", "conversation_id": null}` when it shows none or the page is hidden;
        send it again after every reconnect. While a connection of the member views a
        conversation, the member gets no push or e-mail notification about it. Other client
        frames are ignored. Close codes: 1008 (`unauthenticated`, `forbidden`) when the session
        or membership ends, 1013 (`slow_consumer`) when the client does not read fast enough, 1012
        (`restart`) when the server restarts or loses its event feed. Reconnect with
        `last_event_id` after any of them except 1008. While the server is reconnecting its own event
        feed the upgrade is refused with 503 `realtime_unavailable`; retry with backoff.
      tags: [realtime]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: workspace_id
          in: query
          description: The workspace to act on, for clients that cannot send `Yuva-Workspace`.
          schema:
            type: string
            format: uuid
        - name: last_event_id
          in: query
          description: Replay the events after this one before streaming live ones.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "101":
          description: |
            Switching to the WebSocket protocol. Each text frame is one `RealtimeMessage`; the
            content below describes a frame, not an HTTP body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /client/v1/session:
    post:
      operationId: createClientSession
      summary: Start a contact session
      description: |
        Exchanges a channel's public key, and optionally an identity token or a visitor id, for a
        contact session. Send the returned `token` as `Authorization: Bearer <token>` on every other
        `/client/v1` request and on `/client/v1/realtime`. Sessions last 7 days after their last
        use.

        - With `identity_token` (a JWT, HS256, signed by the host backend with the inbox's identity
          secret; see `sdk/go`): the contact is found by `sub` (the host's user id, per inbox),
          then by the token's `email`, or created. `name`, `email`, `locale` and `attrs` from the
          token are saved on the contact. `exp` is required and at most 10 minutes ahead; tokens
          with another `alg`, a wrong signature or a missing or past `exp` answer
          `401 invalid_identity_token`. When `visitor_id` names an anonymous visitor of this inbox,
          that visitor's conversations move to the identified contact and the visitor id ends.
        - Without it, the visitor is anonymous, which the channel must allow
          (`403 anonymous_not_allowed` otherwise). `visitor_id` from an earlier session of this
          inbox resumes that visitor and their conversations; an unknown or ended one starts a new
          visitor. Keep the returned `visitor_id` (e.g. in `localStorage`) and send it next time.

        For a `chat` channel, browsers must call from one of the channel's allowed origins
        (`403 origin_not_allowed`, also without an `Origin` header); an `app` channel's key needs no
        origin. Requests are rate limited per IP address and per channel (`429 rate_limited`). A
        blocked contact answers `403 contact_blocked`.
      tags: [client]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientSessionCreate"
      responses:
        "201":
          description: The session, the contact and the inbox's public settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSession"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
    get:
      operationId: getClientSession
      summary: The current contact session
      description: The contact and the inbox's public settings with the current presence, without the token.
      tags: [client]
      security:
        - contactSession: []
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSessionInfo"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteClientSession
      summary: End the contact session
      description: Ends the session, e.g. when the host app's user signs out.
      tags: [client]
      security:
        - contactSession: []
      responses:
        "204":
          description: Ended.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /client/v1/channels/{channel_key}:
    get:
      operationId: getClientChannel
      summary: A chat or app channel's public settings
      description: |
        The inbox's public settings for a `chat` or `app` channel's public key, without a session:
        name, branding, mode, business hours, presence or the expected reply time, the chat
        settings and the feedback categories. Nothing is created, so a widget can show its
        launcher and greeting before the visitor writes and start a session
        (`POST /client/v1/session`) only then.

        For a `chat` channel, browsers must call from one of the channel's allowed origins
        (`403 origin_not_allowed`, also without an `Origin` header); an `app` channel's key needs no
        origin. Requests are rate limited per IP address (`429 rate_limited`).

        A widget that gets `403 origin_not_allowed` is embedded on a page the channel does not
        allow: it should show nothing (no launcher, no offline notice), not retry, and leave a
        console message naming the origin. Every other `/client/v1` call from that page is refused
        the same way, so there is nothing it could offer. `404` (unknown key) is treated alike;
        network errors and `429` are worth retrying.
      tags: [client]
      security: []
      parameters:
        - name: channel_key
          in: path
          required: true
          description: The chat or app channel's public key.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: The inbox's public settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientInbox"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/conversations:
    get:
      operationId: listClientConversations
      summary: List the contact's conversations
      description: |
        The contact's conversations in the session's inbox, on any channel, latest message first.
        Members' notes and internal events are never shown to contacts.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConversationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createClientConversation
      summary: Start a conversation
      description: |
        Starts a conversation on the session's channel with its first message. Send
        `multipart/form-data` to attach files (`body`, `subject`, `client_id` as form fields and up
        to 10 `files` parts), with the same size and type rules as `/v1`. Rate limited per IP
        address and per channel.
      tags: [client]
      security:
        - contactSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientConversationCreate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ClientConversationCreateMultipart"
      responses:
        "201":
          description: The conversation and its first message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConversationCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/conversations/{conversationId}:
    get:
      operationId: getClientConversation
      summary: Get one of the contact's conversations
      description: Another contact's conversation, or one of another inbox, answers `404`.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConversation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /client/v1/conversations/{conversationId}/messages:
    get:
      operationId: listClientMessages
      summary: List a conversation's messages
      description: |
        The messages to and from the contact, oldest first by default; with `order=desc` the newest
        come first and `next_cursor` pages backward. Notes and events are left out.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMessagePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createClientMessage
      summary: Send a message
      description: |
        Adds the contact's message. A closed, pending or snoozed conversation is reopened. A
        repeated `client_id` in the same conversation returns the stored message with `200`.
        Send `multipart/form-data` to attach files, as for starting a conversation. Rate limited
        per IP address and per channel.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientMessageCreate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ClientMessageCreateMultipart"
      responses:
        "200":
          description: The message stored earlier with this `client_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMessage"
        "201":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/conversations/{conversationId}/read:
    post:
      operationId: markClientConversationRead
      summary: Mark a conversation read
      description: |
        Moves the contact's read cursor to `message_id`, or to the latest message when it is
        absent; it only moves forward. Replies the contact has read are not e-mailed to them.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientReadCreate"
      responses:
        "200":
          description: The contact's read state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientReadState"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /client/v1/conversations/{conversationId}/typing:
    post:
      operationId: setClientTyping
      summary: Tell members the contact is typing
      description: |
        Members with access receive a `typing` event on `/v1/realtime`. Call it at most every few
        seconds while the contact types, and with `typing: false` when they stop. Nothing is
        stored. Rate limited per session.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypingCreate"
      responses:
        "204":
          description: Sent.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/feedback:
    post:
      operationId: createClientFeedback
      summary: Send feedback
      description: |
        Starts a `feedback` conversation on the session's channel with its first message: a
        category, the text and what the app knows about where it was sent from (app version,
        build, OS, device, locale, screen, installation id). It is answered like any other
        conversation and listed with the contact's conversations (`kind: feedback`).

        `allow_email: true` lets members' replies the contact has not read in the app be e-mailed
        to them (after the same delay as chat replies); `email` is the address to use while the
        contact has no address from an identity token or their own mail, kept like
        `PUT /client/v1/contact/email`. Without `allow_email`, replies reach the contact only in
        the app.

        Send `multipart/form-data` to attach screenshots (the other fields as form fields and up to
        10 `files` parts), with the same size and type rules as messages. `client_id` makes the
        request idempotent: the same `client_id` again answers `201` with the first conversation.
        Rate limited per IP address and per channel.
      tags: [client]
      security:
        - contactSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientFeedbackCreate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ClientFeedbackCreateMultipart"
      responses:
        "201":
          description: The feedback conversation and its first message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConversationCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/contact/email:
    put:
      operationId: setClientContactEmail
      summary: Leave an e-mail address for replies
      description: |
        Stores the address the contact typed (e.g. when nobody is available), so replies they have
        not read can be e-mailed to them. A typed address is never used to find or merge an
        existing contact; it is used only while the contact has no address from an identity token
        or from their own mail, and becomes one of their addresses once they answer such an e-mail.
        Allowed when the channel asks for an address (`ask_email_offline`), else `403 forbidden`.
      tags: [client]
      security:
        - contactSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientEmailUpdate"
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientContact"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/attachments/{attachmentId}:
    get:
      operationId: downloadClientAttachment
      summary: Download an attachment
      description: |
        An attachment of a message (not a note) in one of the contact's conversations, served as a
        download. Fetch it with the `Authorization` header and show it from a blob URL.
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /client/v1/realtime:
    get:
      operationId: clientRealtime
      summary: Live events for a contact (WebSocket)
      description: |
        Upgrades to a WebSocket that streams the events of the contact's own conversations in the
        session's inbox. Authenticate with the session token, either as the `token` query
        parameter or as a WebSocket subprotocol: offer `yuva` and `yuva.token.<token>`
        (`new WebSocket(url, ["yuva", "yuva.token." + token])`); the server selects `yuva`.
        Cookies are not used. A browser's `Origin` must be one of the channel's allowed origins.

        Every server message is one JSON text frame matching `ClientRealtimeMessage`. Stored events
        (`conversation.created`, `conversation.updated`, `message.created`, `message.updated`,
        `read`) carry an increasing `id`; resume exactly as on `/v1/realtime`: remember the larger
        of `ready.last_event_id` and the last `id` received, reconnect with `?last_event_id=`, and
        reload over HTTP on `resync_required`. `typing`, `presence` and `inbox.updated` have no
        `id` and are not replayed. `message.*` carries only messages (no notes or internal events),
        and `conversation.updated` only the status. `typing` (a member typing), `read` (how far
        members have read) and `presence` (whether someone is available; sent after `ready` and
        whenever it changes) come only for `live` inboxes. `inbox.updated` carries the inbox's
        public settings, the same `ClientInbox` as `GET /client/v1/channels/{channel_key}`, whenever
        a member changes the inbox (mode, business hours, branding, greeting) or the session's
        channel; replace the settings shown with it. After a reconnect, fetch the channel settings
        again, since a change made while disconnected is not replayed.

        The server pings every 30 seconds; the client sends nothing. Close codes as on
        `/v1/realtime`: 1008 when the session ends or the contact is deleted (start a new session),
        1013 and 1012 (reconnect with `last_event_id`).
      tags: [client]
      security:
        - contactSession: []
      parameters:
        - name: token
          in: query
          description: The contact session token, when it is not sent as a subprotocol.
          schema:
            type: string
        - name: last_event_id
          in: query
          description: Replay the events after this one before streaming live ones.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "101":
          description: |
            Switching to the WebSocket protocol. Each text frame is one `ClientRealtimeMessage`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRealtimeMessage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /ingress/email:
    post:
      operationId: ingestEmail
      summary: Receive an e-mail
      description: |
        Called by the edge Email Worker or any MTA with the raw message and its envelope. The
        signature is `v1=` and the lowercase hex HMAC-SHA256, keyed with the server's
        `YUVA_INGRESS_SECRET`, over `<X-Yuva-Timestamp>.<X-Yuva-Envelope-To>.<raw body>`. The
        timestamp must be within 5 minutes of the server's clock. A message with a Message-ID seen
        before on the same channel is accepted again without being stored twice.

        Refusals are permanent (4xx) and carry a `reason` that the sending server shows to the
        sender. 5xx means try again later.
      tags: [ingress]
      security: []
      parameters:
        - name: X-Yuva-Envelope-To
          in: header
          required: true
          schema:
            type: string
        - name: X-Yuva-Envelope-From
          in: header
          required: false
          schema:
            type: string
        - name: X-Yuva-Timestamp
          in: header
          required: true
          description: Unix time in seconds.
          schema:
            type: string
            pattern: "^[0-9]+$"
        - name: X-Yuva-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^v1=[0-9a-f]{64}$"
      requestBody:
        required: true
        description: The raw RFC 5322 message, at most 25 MiB.
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Accepted earlier (same Message-ID on the same channel).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressResult"
        "202":
          description: Accepted, stored or deliberately dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressResult"
        "400":
          $ref: "#/components/responses/IngressRejection"
        "401":
          $ref: "#/components/responses/IngressRejection"
        "403":
          $ref: "#/components/responses/IngressRejection"
        "404":
          $ref: "#/components/responses/IngressRejection"
        "413":
          $ref: "#/components/responses/IngressRejection"
        "429":
          $ref: "#/components/responses/IngressRejection"
        "503":
          $ref: "#/components/responses/IngressRejection"
  /ingress/ses:
    post:
      operationId: ingestSes
      summary: Receive an SES notification
      description: |
        Amazon SNS delivers Amazon SES bounce and complaint notifications here. The SNS signature
        is verified against the AWS signing certificate, and the topic must be one of
        `YUVA_SES_TOPIC_ARNS`. A subscription confirmation is confirmed by fetching its
        `SubscribeURL` (only on an `sns.<region>.amazonaws.com` host). A permanent bounce or a
        complaint marks the recipient undeliverable in the workspace that sent the message and the
        message `failed`.
      tags: [ingress]
      security: []
      requestBody:
        required: true
        description: The SNS message (SNS sends it as `text/plain`).
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Handled or ignored.
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
webhooks:
  conversation.created:
    post:
      operationId: webhookConversationCreated
      summary: A conversation started
      description: |
        Any channel, feedback included (which also sends `feedback.created`).
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookConversationPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  conversation.updated:
    post:
      operationId: webhookConversationUpdated
      summary: A conversation changed
      description: |
        Status, assignee, priority, labels, subject or spam flag changed, or it moved to
        another contact.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookConversationPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  message.created:
    post:
      operationId: webhookMessageCreated
      summary: A message was added
      description: |
        A message to or from the contact. Members' notes only for endpoints with
        `include_notes`; internal events never. When a member answers and `contact.online` is
        false, the contact has no live connection: send your push notification.

        The conversation is `data.message.conversation_id` (the same as `data.conversation.id`).
        Put it in the push payload as `yuva_conversation_id` (APNs: a top-level key next to `aps`;
        FCM: a `data` entry); `Yuva.handleNotification` in the Swift and Kotlin SDKs reads it and
        returns the conversation to open. Map the contact to your user with
        `data.contact.external_ids`.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessagePayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  feedback.created:
    post:
      operationId: webhookFeedbackCreated
      summary: Feedback arrived
      description: |
        A `feedback` conversation started, from an app or with `POST /v1/feedback`, with its
        first message.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookFeedbackPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  contact.updated:
    post:
      operationId: webhookContactUpdated
      summary: A contact changed
      description: |
        Name, addresses, external ids, attributes or the blocked flag changed.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookContactPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
  contact.deleted:
    post:
      operationId: webhookContactDeleted
      summary: A contact was deleted
      description: |
        With the external ids the contact had, so the host can match its own user.
      tags: [webhooks]
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookIdHeader"
        - $ref: "#/components/parameters/WebhookTimestampHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookContactDeletedPayload"
      responses:
        "200":
          description: Any 2xx answer counts as delivered.
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: yuva_session
      description: Member session set by a successful sign-in.
    apiKey:
      type: http
      scheme: bearer
      description: A workspace API key, `yuva_<prefix>_<secret>`.
    contactSession:
      type: http
      scheme: bearer
      description: A contact session token from `POST /client/v1/session`, `yuva_cs_<secret>`.
  parameters:
    WorkspaceHeader:
      name: Yuva-Workspace
      in: header
      required: false
      description: The workspace to act on; see "Workspace selection".
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PasskeyId:
      name: passkeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PushSubscriptionId:
      name: pushSubscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InboxId:
      name: inboxId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookIdHeader:
      name: webhook-id
      in: header
      required: true
      description: The delivery's id, the same on every retry; use it to ignore duplicates.
      schema:
        type: string
        examples: [msg_2KWPBgLlAfxdpx2AI54pPJ85f4W]
    WebhookTimestampHeader:
      name: webhook-timestamp
      in: header
      required: true
      description: Unix seconds of this attempt. Refuse values far from your clock.
      schema:
        type: string
    WebhookSignatureHeader:
      name: webhook-signature
      in: header
      required: true
      description: |
        Space-separated `v1,<base64>` signatures: HMAC-SHA256 over
        `<webhook-id>.<webhook-timestamp>.<body>` with the base64-decoded part of the
        `whsec_` secret (Standard Webhooks). Two during a secret rotation.
      schema:
        type: string
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LabelId:
      name: labelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CannedReplyId:
      name: cannedReplyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Search:
      name: q
      in: query
      description: Full-text search (Postgres `simple` configuration, `websearch` syntax).
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      description: Page size, 1 to 100; 25 by default.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IngressRejection:
      description: The message is refused; `reason` is shown to the sender.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngressRejection"
    SignedIn:
      description: Signed in; the session cookie is set.
      headers:
        Set-Cookie:
          description: "`yuva_session`, HttpOnly, SameSite=Lax."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Me"
  schemas:
    Role:
      type: string
      enum: [owner, admin, agent]
    Locale:
      type: string
      description: The language of e-mails sent to the person.
      enum: [en, tr]
    Email:
      type: string
      format: email
      maxLength: 320
      examples: [owner@example.com]
    SignInCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"
    SignInCodeVerify:
      type: object
      required: [email, code]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          type: string
          pattern: "^[0-9]{6}$"
          examples: ["042917"]
    Person:
      type: object
      required: [id, email, name, locale, availability]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
          description: Empty until the person sets it.
        locale:
          $ref: "#/components/schemas/Locale"
        availability:
          $ref: "#/components/schemas/Availability"
    Workspace:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
    Membership:
      type: object
      required: [workspace, member_id, role]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        member_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
    Me:
      type: object
      required: [person, memberships]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    MeUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 200
        locale:
          $ref: "#/components/schemas/Locale"
        availability:
          $ref: "#/components/schemas/Availability"
    Member:
      type: object
      required: [id, person_id, email, name, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    MemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    InviteCreate:
      type: object
      required: [email, role]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        locale:
          $ref: "#/components/schemas/Locale"
    Invite:
      type: object
      required: [id, email, role, locale, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        role:
          $ref: "#/components/schemas/Role"
        locale:
          $ref: "#/components/schemas/Locale"
        invited_by:
          type: string
          format: uuid
          description: The inviting member, absent when that member was removed.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
    ApiKey:
      type: object
      required: [id, name, prefix, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The visible start of the key, `yuva_<prefix>`.
          examples: [yuva_k3x9q2mf]
        created_by:
          type: string
          format: uuid
          description: The member who created the key, absent when that member was removed.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    ApiKeyCreated:
      type: object
      required: [api_key, secret]
      properties:
        api_key:
          $ref: "#/components/schemas/ApiKey"
        secret:
          type: string
          description: The full key. It is not shown again.
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    Passkey:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
    VapidPublicKey:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: Uncompressed P-256 public key, base64url without padding.
    PushSubscriptionKeys:
      type: object
      required: [p256dh, auth]
      properties:
        p256dh:
          type: string
          maxLength: 200
          description: The browser's P-256 key, base64url (65 bytes decoded).
        auth:
          type: string
          maxLength: 100
          description: The authentication secret, base64url (16 bytes decoded).
    PushSubscriptionCreate:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2000
        keys:
          $ref: "#/components/schemas/PushSubscriptionKeys"
        user_agent:
          type: string
          maxLength: 200
          description: A label to tell devices apart in the list, such as "Chrome on Android".
    PushSubscription:
      type: object
      required: [id, endpoint, user_agent, current, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        endpoint:
          type: string
          description: Compare with `PushSubscription.endpoint` to find this browser's entry.
        user_agent:
          type: string
        current:
          type: boolean
          description: Registered by the calling session.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
        last_failure_at:
          type: string
          format: date-time
        last_error:
          type: string
          description: Why the last failed push failed.
    PushSubscriptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PushSubscription"
    NotificationChannels:
      type: object
      required: [push, email]
      properties:
        push:
          type: boolean
          description: Web Push to every subscribed browser of the person.
        email:
          type: boolean
          description: An e-mail when it is still unread after `email_delay_minutes`.
    NotificationEvents:
      type: object
      required: [new_live_conversation, new_async_conversation, message_in_my_conversation, message_in_unassigned_conversation, assigned_to_me]
      properties:
        new_live_conversation:
          $ref: "#/components/schemas/NotificationChannels"
        new_async_conversation:
          $ref: "#/components/schemas/NotificationChannels"
        message_in_my_conversation:
          $ref: "#/components/schemas/NotificationChannels"
        message_in_unassigned_conversation:
          $ref: "#/components/schemas/NotificationChannels"
        assigned_to_me:
          $ref: "#/components/schemas/NotificationChannels"
    NotificationEventsUpdate:
      type: object
      description: Some events and their channels.
      properties:
        new_live_conversation:
          $ref: "#/components/schemas/NotificationChannels"
        new_async_conversation:
          $ref: "#/components/schemas/NotificationChannels"
        message_in_my_conversation:
          $ref: "#/components/schemas/NotificationChannels"
        message_in_unassigned_conversation:
          $ref: "#/components/schemas/NotificationChannels"
        assigned_to_me:
          $ref: "#/components/schemas/NotificationChannels"
    NotificationSettings:
      type: object
      required: [events, defaults, email_delay_minutes, inboxes]
      properties:
        events:
          $ref: "#/components/schemas/NotificationEvents"
        defaults:
          $ref: "#/components/schemas/NotificationEvents"
        email_delay_minutes:
          type: integer
          minimum: 5
          maximum: 1440
          description: How long an event stays unread before the e-mail fallback is sent.
        inboxes:
          type: array
          description: Per-inbox overrides, for inboxes the member can still see.
          items:
            $ref: "#/components/schemas/InboxNotifications"
    NotificationSettingsUpdate:
      type: object
      minProperties: 1
      properties:
        events:
          $ref: "#/components/schemas/NotificationEventsUpdate"
        email_delay_minutes:
          type: integer
          minimum: 5
          maximum: 1440
    InboxNotifications:
      type: object
      required: [inbox_id, events, updated_at]
      properties:
        inbox_id:
          type: string
          format: uuid
        events:
          $ref: "#/components/schemas/NotificationEventsUpdate"
        updated_at:
          type: string
          format: date-time
    InboxNotificationsUpdate:
      type: object
      required: [events]
      properties:
        events:
          $ref: "#/components/schemas/NotificationEventsUpdate"
    PushNotification:
      type: object
      description: |
        The JSON a push delivers to the service worker (`event.data.json()`), encrypted per
        RFC 8291 (`aes128gcm`). Show it with `registration.showNotification(title, {body, tag,
        data})` and open `url` on click. Pushes of one conversation share `tag` (and the push
        `Topic`), so a newer one replaces the older.
      required: [event, title, body, url, tag]
      properties:
        event:
          type: string
          description: What caused it (see the `notifications` tag), or `test`.
          enum: [new_live_conversation, new_async_conversation, message_in_my_conversation, message_in_unassigned_conversation, assigned_to_me, test]
        title:
          type: string
          description: The inbox name and the contact's name.
          examples: ["Support · Ayşe Yılmaz"]
        body:
          type: string
          description: The start of the message (at most 140 characters), or what happened.
        url:
          type: string
          description: |
            Path to open, relative to the server's public URL:
            `/conversations/{id}?workspace_id={workspace}` (`/` for a test).
          examples: ["/conversations/0199a3f0-7c1e-7b4a-9d2e-3f1c2b4a5d6e?workspace_id=0199a3f0-0000-7000-8000-000000000001"]
        tag:
          type: string
          description: "`conversation-{id}`, or `test`."
        conversation_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
    PasskeyCeremony:
      type: object
      required: [ceremony_id, options]
      properties:
        ceremony_id:
          type: string
        options:
          type: object
          additionalProperties: true
          description: |
            WebAuthn options in their JSON form (`{"publicKey": …}`), for
            `PublicKeyCredential.parseCreationOptionsFromJSON` or
            `parseRequestOptionsFromJSON`.
    PasskeyCeremonyResult:
      type: object
      required: [ceremony_id, credential]
      properties:
        ceremony_id:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The `PublicKeyCredential` in its JSON form (`credential.toJSON()`).
    PasskeyRegistration:
      type: object
      required: [ceremony_id, credential]
      properties:
        ceremony_id:
          type: string
        name:
          type: string
          maxLength: 200
          description: A label for the passkey; defaults to "Passkey".
        credential:
          type: object
          additionalProperties: true
          description: The `PublicKeyCredential` in its JSON form (`credential.toJSON()`).
    Slug:
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      minLength: 1
      maxLength: 64
      examples: [acme-app]
    LanguageTag:
      type: string
      description: A BCP 47 language tag.
      pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      maxLength: 35
      examples: [en, tr]
    InboxMode:
      type: string
      description: |
        `live` shows who is available, typing and read receipts; `async` shows the expected reply
        time instead.
      enum: [live, async]
    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
    BusinessHoursInterval:
      type: object
      required: [day, start, end]
      properties:
        day:
          $ref: "#/components/schemas/Weekday"
        start:
          type: string
          description: Local time in the inbox's timezone, `HH:MM`.
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          examples: ["09:00"]
        end:
          type: string
          description: Local time, `HH:MM` or `24:00`; after `start`.
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
          examples: ["17:30"]
    BusinessHours:
      type: object
      description: When `enabled` is false the inbox counts as always open.
      required: [enabled, intervals]
      properties:
        enabled:
          type: boolean
        intervals:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/BusinessHoursInterval"
    InboxBranding:
      type: object
      properties:
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          examples: ["#2563eb"]
        logo_url:
          type: string
          format: uri
          maxLength: 2000
        greeting:
          type: string
          maxLength: 500
    Inbox:
      type: object
      required: [id, name, slug, branding, default_locale, timezone, mode, business_hours, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          $ref: "#/components/schemas/Slug"
        branding:
          $ref: "#/components/schemas/InboxBranding"
        default_locale:
          $ref: "#/components/schemas/LanguageTag"
        timezone:
          type: string
          description: An IANA time zone name.
          examples: [Europe/Istanbul]
        mode:
          $ref: "#/components/schemas/InboxMode"
        expected_reply_minutes:
          type: integer
          format: int32
          description: Shown to contacts in `async` mode; absent when not set.
        business_hours:
          $ref: "#/components/schemas/BusinessHours"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InboxCreate:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: "#/components/schemas/Slug"
        branding:
          $ref: "#/components/schemas/InboxBranding"
        default_locale:
          $ref: "#/components/schemas/LanguageTag"
        timezone:
          type: string
          maxLength: 64
          description: Defaults to `UTC`.
        mode:
          $ref: "#/components/schemas/InboxMode"
        expected_reply_minutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 43200
        business_hours:
          $ref: "#/components/schemas/BusinessHours"
    InboxUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: "#/components/schemas/Slug"
        branding:
          $ref: "#/components/schemas/InboxBranding"
        default_locale:
          $ref: "#/components/schemas/LanguageTag"
        timezone:
          type: string
          maxLength: 64
        mode:
          $ref: "#/components/schemas/InboxMode"
        expected_reply_minutes:
          type: [integer, "null"]
          format: int32
          minimum: 1
          maximum: 43200
          description: "`null` clears it."
        business_hours:
          $ref: "#/components/schemas/BusinessHours"
    InboxCreated:
      type: object
      required: [inbox, identity_secret]
      properties:
        inbox:
          $ref: "#/components/schemas/Inbox"
        identity_secret:
          type: string
          description: Signs identity tokens (HS256). It is not shown again.
    IdentitySecret:
      type: object
      required: [identity_secret]
      properties:
        identity_secret:
          type: string
          description: Signs identity tokens (HS256). It is not shown again.
    InboxList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Inbox"
    ChannelKind:
      type: string
      description: |
        `email`, `chat` (web widget), `app` (mobile SDKs) or `api` (server to server).
      enum: [email, chat, app, api]
    ChannelSettings:
      type: object
      additionalProperties: true
      description: Free-form settings, stored as given. The settings Yuva acts on are in `email` and `chat`.
    SmtpTls:
      type: string
      description: |
        `starttls` upgrades a plain connection (port 587), `tls` connects with TLS (port 465),
        `none` sends in the clear (local relays and test servers only).
      enum: [starttls, tls, none]
    SmtpSettings:
      type: object
      description: The outbound SMTP account. The password is never returned.
      required: [host, port, username, tls, password_set]
      properties:
        host:
          type: string
        port:
          type: integer
          format: int32
        username:
          type: string
        tls:
          $ref: "#/components/schemas/SmtpTls"
        password_set:
          type: boolean
    SmtpSettingsInput:
      type: object
      required: [host]
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: Defaults to 465 with `tls`, else 587.
        username:
          type: string
          maxLength: 320
        password:
          type: string
          maxLength: 1024
          description: Stored encrypted. Absent keeps the stored password; empty removes it.
        tls:
          $ref: "#/components/schemas/SmtpTls"
    EmailAutoReply:
      type: object
      description: |
        A greeting e-mailed when a new conversation starts by e-mail, at most once per contact
        within `interval_hours`. It carries `Auto-Submitted: auto-replied` and is never sent in
        answer to automatic mail.
      required: [enabled, text, interval_hours]
      properties:
        enabled:
          type: boolean
        text:
          type: string
          maxLength: 5000
        interval_hours:
          type: integer
          format: int32
          minimum: 1
          maximum: 8760
    EmailAutoReplyInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        text:
          type: string
          maxLength: 5000
          description: Required when `enabled`.
        interval_hours:
          type: integer
          format: int32
          minimum: 1
          maximum: 8760
          description: Defaults to 24.
    EmailChannel:
      type: object
      description: Settings of an `email` channel.
      required: [address, display_name, auto_reply]
      properties:
        address:
          $ref: "#/components/schemas/Email"
        display_name:
          type: string
          description: The name in `From`; the channel name when empty.
        from_address:
          $ref: "#/components/schemas/Email"
        smtp:
          $ref: "#/components/schemas/SmtpSettings"
        auto_reply:
          $ref: "#/components/schemas/EmailAutoReply"
    EmailChannelInput:
      type: object
      required: [address]
      properties:
        address:
          $ref: "#/components/schemas/Email"
        display_name:
          type: string
          maxLength: 200
        from_address:
          $ref: "#/components/schemas/Email"
        smtp:
          $ref: "#/components/schemas/SmtpSettingsInput"
        auto_reply:
          $ref: "#/components/schemas/EmailAutoReplyInput"
    Channel:
      type: object
      required: [id, inbox_id, kind, name, settings, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChannelKind"
        name:
          type: string
        settings:
          $ref: "#/components/schemas/ChannelSettings"
        email:
          $ref: "#/components/schemas/EmailChannel"
        chat:
          $ref: "#/components/schemas/ChatChannel"
        app:
          $ref: "#/components/schemas/AppChannel"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelCreate:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/ChannelKind"
        name:
          type: string
          minLength: 1
          maxLength: 200
        settings:
          $ref: "#/components/schemas/ChannelSettings"
        email:
          $ref: "#/components/schemas/EmailChannelInput"
        chat:
          $ref: "#/components/schemas/ChatChannelInput"
        app:
          $ref: "#/components/schemas/AppChannelInput"
    ChannelUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        settings:
          $ref: "#/components/schemas/ChannelSettings"
        email:
          $ref: "#/components/schemas/EmailChannelInput"
        chat:
          $ref: "#/components/schemas/ChatChannelInput"
        app:
          $ref: "#/components/schemas/AppChannelInput"
    ChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    ExternalId:
      type: object
      required: [inbox_id, external_id]
      properties:
        inbox_id:
          type: string
          format: uuid
        external_id:
          type: string
          minLength: 1
          maxLength: 200
          description: The host app's user id.
    Attributes:
      type: object
      additionalProperties: true
      description: Free-form data about the contact (plan, app version, …), at most 16 KiB.
    UndeliverableEmail:
      type: object
      description: An address that bounced permanently or complained; replies to it are refused.
      required: [email, reason, created_at]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        reason:
          type: string
          enum: [bounce, complaint]
        detail:
          type: string
          description: The diagnostic from the receiving server, when there was one.
        created_at:
          type: string
          format: date-time
    Contact:
      type: object
      required: [id, name, emails, external_ids, attributes, blocked, undeliverable, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emails:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        external_ids:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
        attributes:
          $ref: "#/components/schemas/Attributes"
        blocked:
          type: boolean
          description: Mail and chat from a blocked contact are refused.
        locale:
          $ref: "#/components/schemas/LanguageTag"
          description: The language from the contact's identity token; absent when not known.
        undeliverable:
          type: array
          description: The contact's addresses that must not be mailed.
          items:
            $ref: "#/components/schemas/UndeliverableEmail"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactPresence:
      type: object
      required: [contact_id, online]
      properties:
        contact_id:
          type: string
          format: uuid
        online:
          type: boolean
          description: A `/client/v1/realtime` connection of the contact was seen in the last 75 seconds.
        last_seen_at:
          type: string
          format: date-time
          description: The contact's last client activity (a connection or a session use); absent when never seen.
    FeedbackContact:
      type: object
      required: [external_id]
      properties:
        external_id:
          type: string
          minLength: 1
          maxLength: 200
          description: The host app's id for this user, per inbox.
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
          maxLength: 200
    FeedbackCreate:
      allOf:
        - $ref: "#/components/schemas/FeedbackFields"
        - type: object
          required: [inbox_id, contact, category, body]
          properties:
            inbox_id:
              type: string
              format: uuid
            contact:
              $ref: "#/components/schemas/FeedbackContact"
            category:
              $ref: "#/components/schemas/FeedbackCategory"
            subject:
              type: string
              maxLength: 500
            body:
              type: string
              minLength: 1
              maxLength: 65536
            client_id:
              type: string
              minLength: 1
              maxLength: 200
            allow_email:
              type: boolean
              default: false
    FeedbackCreated:
      type: object
      required: [conversation, message, contact]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        message:
          $ref: "#/components/schemas/Message"
        contact:
          $ref: "#/components/schemas/Contact"
    FeedbackCount:
      type: object
      required: [category, count]
      properties:
        category:
          $ref: "#/components/schemas/FeedbackCategory"
        count:
          type: integer
          format: int64
    WebhookEventType:
      type: string
      enum: [conversation.created, conversation.updated, message.created, feedback.created, contact.updated, contact.deleted]
    WebhookEndpoint:
      type: object
      required: [id, url, description, events, include_notes, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
          description: Absent for workspace endpoints.
        url:
          type: string
          format: uri
        description:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        include_notes:
          type: boolean
          description: "`message.created` also for members' notes."
        enabled:
          type: boolean
        disabled_at:
          type: string
          format: date-time
        disabled_reason:
          type: string
          description: |
            Why Yuva turned the endpoint off: every attempt failed for 24 hours, or it answered
            `410 Gone`. Absent while enabled or when a member turned it off.
        failing_since:
          type: string
          format: date-time
          description: Every attempt since then failed; absent while deliveries succeed.
        secret_rotated_at:
          type: string
          format: date-time
          description: While the previous secret still signs (24 hours after a rotation), when it was replaced.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookEndpointCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2000
        inbox_id:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 200
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
        include_notes:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
    WebhookEndpointUpdate:
      type: object
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          maxLength: 2000
        description:
          type: string
          maxLength: 200
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
        include_notes:
          type: boolean
        enabled:
          type: boolean
    WebhookEndpointSecret:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint:
          $ref: "#/components/schemas/WebhookEndpoint"
        secret:
          type: string
          description: "`whsec_` and 32 random bytes in base64. Shown only now."
    WebhookEndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
    WebhookDeliveryState:
      type: string
      description: |
        `pending` while attempts remain, `succeeded` after a 2xx answer, `failed` when the retries
        (about 24 hours) ran out or the endpoint was disabled.
      enum: [pending, succeeded, failed]
    WebhookAttempt:
      type: object
      required: [id, delivery_id, attempted_at, manual, success, latency_ms, response_body]
      properties:
        id:
          type: string
          format: uuid
        delivery_id:
          type: string
          format: uuid
        attempted_at:
          type: string
          format: date-time
        manual:
          type: boolean
          description: Sent by a redeliver.
        success:
          type: boolean
        status_code:
          type: integer
          format: int32
          description: Absent when no HTTP answer arrived.
        latency_ms:
          type: integer
          format: int32
        response_body:
          type: string
          description: The first 1 KiB of the answer.
        error:
          type: string
          description: Why the attempt failed (timeout, refused address, non-2xx status, …).
    WebhookAttemptList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookAttempt"
    WebhookDelivery:
      type: object
      required: [id, message_id, event_type, state, attempts, created_at]
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          description: The `webhook-id` header.
        event_type:
          $ref: "#/components/schemas/WebhookEventType"
        state:
          $ref: "#/components/schemas/WebhookDeliveryState"
        attempts:
          type: integer
          format: int32
        next_attempt_at:
          type: string
          format: date-time
          description: Pending deliveries only.
        last_attempt:
          $ref: "#/components/schemas/WebhookAttempt"
        created_at:
          type: string
          format: date-time
    WebhookDeliveryDetail:
      allOf:
        - $ref: "#/components/schemas/WebhookDelivery"
        - type: object
          required: [payload, attempt_log]
          properties:
            payload:
              type: object
              additionalProperties: true
              description: The body sent, one of the webhook payloads.
            attempt_log:
              type: array
              description: The delivery's attempts that are still kept, newest first.
              items:
                $ref: "#/components/schemas/WebhookAttempt"
    WebhookDeliveryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        next_cursor:
          type: string
          description: Absent on the last page.
    WebhookContact:
      type: object
      description: The contact as a host backend needs it.
      required: [id, name, emails, external_ids, attributes, online]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emails:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        external_ids:
          type: array
          description: The host app's ids for this person, per inbox.
          items:
            $ref: "#/components/schemas/ExternalId"
        attributes:
          $ref: "#/components/schemas/Attributes"
        locale:
          type: string
        online:
          type: boolean
          description: |
            The contact had a live `/client/v1/realtime` connection when the webhook was prepared.
            When false, the app is closed or in the background: a push notification is the way to
            reach them.
        last_seen_at:
          type: string
          format: date-time
    WebhookDeletedContact:
      type: object
      required: [id, external_ids]
      properties:
        id:
          type: string
          format: uuid
        external_ids:
          type: array
          items:
            $ref: "#/components/schemas/ExternalId"
    WebhookConversationData:
      type: object
      required: [conversation, contact]
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        contact:
          $ref: "#/components/schemas/WebhookContact"
    WebhookMessageData:
      type: object
      required: [message, conversation, contact]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        conversation:
          $ref: "#/components/schemas/Conversation"
        contact:
          $ref: "#/components/schemas/WebhookContact"
    WebhookContactData:
      type: object
      required: [contact]
      properties:
        contact:
          $ref: "#/components/schemas/WebhookContact"
    WebhookContactDeletedData:
      type: object
      required: [contact]
      properties:
        contact:
          $ref: "#/components/schemas/WebhookDeletedContact"
    WebhookPayloadBase:
      type: object
      description: Standard Webhooks payload envelope.
      required: [type, timestamp, workspace_id]
      properties:
        type:
          $ref: "#/components/schemas/WebhookEventType"
        timestamp:
          type: string
          format: date-time
          description: When the event happened (not when it was sent).
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
          description: The conversation's inbox; absent for contact events.
    WebhookConversationPayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/WebhookConversationData"
    WebhookMessagePayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/WebhookMessageData"
    WebhookFeedbackPayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/WebhookMessageData"
    WebhookContactPayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/WebhookContactData"
    WebhookContactDeletedPayload:
      allOf:
        - $ref: "#/components/schemas/WebhookPayloadBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/WebhookContactDeletedData"
    ContactCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        emails:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Email"
        external_ids:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExternalId"
        attributes:
          $ref: "#/components/schemas/Attributes"
        blocked:
          type: boolean
    ContactUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 200
        emails:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Email"
        external_ids:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExternalId"
        attributes:
          $ref: "#/components/schemas/Attributes"
        blocked:
          type: boolean
        clear_undeliverable:
          type: array
          maxItems: 20
          description: Addresses to mail again, e.g. after the recipient fixed their mailbox.
          items:
            $ref: "#/components/schemas/Email"
    ContactPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        next_cursor:
          type: string
          description: Absent on the last page.
    ConversationStatus:
      type: string
      enum: [open, pending, snoozed, closed]
    Priority:
      type: string
      enum: [low, normal, high, urgent]
    Conversation:
      type: object
      required: [id, inbox_id, contact_id, kind, subject, status, priority, spam, labels, last_activity_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ConversationKind"
        feedback:
          $ref: "#/components/schemas/Feedback"
          description: "`feedback` conversations only: category and what the app sent with it."
        channel_id:
          type: string
          format: uuid
          description: The channel it started on; absent when unknown or removed.
        related_conversation_id:
          type: string
          format: uuid
          description: |
            Set when this conversation was opened for a sender who answered in the e-mail thread of
            another contact's conversation (a forward, a CC'd colleague): the conversation whose
            thread the mail named. That mail never joins the other conversation and replies here go
            only to this conversation's contact. Absent otherwise or when that conversation is gone.
        subject:
          type: string
        status:
          $ref: "#/components/schemas/ConversationStatus"
        snooze_until:
          type: string
          format: date-time
        priority:
          $ref: "#/components/schemas/Priority"
        spam:
          type: boolean
          description: |
            Flagged as spam, e.g. because the first e-mail failed DMARC. Spam is left out of lists
            and counts unless asked for, and gets no automatic reply.
        assignee_id:
          type: string
          format: uuid
          description: The assigned member; absent when unassigned.
        labels:
          type: array
          description: Label ids.
          items:
            type: string
            format: uuid
        last_message_at:
          type: string
          format: date-time
          description: The last `message` to or from the contact.
        last_activity_at:
          type: string
          format: date-time
          description: The last message or note, or the creation time.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationCreate:
      type: object
      required: [inbox_id, contact_id]
      properties:
        inbox_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
          description: A channel of the same inbox.
        subject:
          type: string
          maxLength: 500
        priority:
          $ref: "#/components/schemas/Priority"
        assignee_id:
          type: string
          format: uuid
          description: A member with access to the inbox.
        labels:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    ConversationUpdate:
      type: object
      minProperties: 1
      properties:
        subject:
          type: string
          maxLength: 500
        status:
          $ref: "#/components/schemas/ConversationStatus"
        snooze_until:
          type: string
          format: date-time
        priority:
          $ref: "#/components/schemas/Priority"
        spam:
          type: boolean
          description: Flag or unflag as spam.
        assignee_id:
          type: [string, "null"]
          format: uuid
          description: A member with access to the inbox; `null` unassigns.
        labels:
          type: array
          maxItems: 50
          description: Replaces the labels.
          items:
            type: string
            format: uuid
    ConversationContact:
      type: object
      description: The conversation's contact, enough for a list row.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          $ref: "#/components/schemas/Email"
          description: The contact's first e-mail address; absent when none is known.
    MessagePreview:
      type: object
      description: The last `message` of a conversation, for a list row.
      required: [id, kind, author_type, text, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/MessageKind"
        author_type:
          $ref: "#/components/schemas/AuthorType"
        text:
          type: string
          description: The plain-text body on one line, cut to 140 characters with `…` when longer.
        created_at:
          type: string
          format: date-time
    ConversationListItem:
      description: A conversation with what a list row shows.
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [contact, unread]
          properties:
            contact:
              $ref: "#/components/schemas/ConversationContact"
            last_message:
              $ref: "#/components/schemas/MessagePreview"
            unread:
              type: boolean
              description: |
                A message or note from someone other than the calling member is newer than the
                member's read cursor. Always `false` for API keys.
    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationListItem"
        next_cursor:
          type: string
          description: Absent on the last page.
    CountByID:
      type: object
      required: [id, count]
      properties:
        id:
          type: string
          format: uuid
        count:
          type: integer
          format: int64
    ConversationCounts:
      type: object
      description: Open conversations in the inboxes the caller can see.
      required: [all, mine, unassigned, spam, inboxes, labels, feedback, feedback_categories]
      properties:
        feedback:
          type: integer
          format: int64
          description: Open feedback conversations (included in the other counts too).
        feedback_categories:
          type: array
          description: Open feedback per category; categories without any are left out.
          items:
            $ref: "#/components/schemas/FeedbackCount"
        all:
          type: integer
          format: int64
        spam:
          type: integer
          format: int64
          description: Open conversations flagged as spam (not included in the other counts).
        mine:
          type: integer
          format: int64
        unassigned:
          type: integer
          format: int64
        inboxes:
          type: array
          description: Per inbox id.
          items:
            $ref: "#/components/schemas/CountByID"
        labels:
          type: array
          description: Per label id.
          items:
            $ref: "#/components/schemas/CountByID"
    ConversationReadCreate:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
          description: A message, note or event of the conversation; the latest when absent.
    ConversationRead:
      type: object
      description: A member's read cursor in a conversation.
      required: [conversation_id, member_id, unread]
      properties:
        conversation_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        last_read_message_id:
          type: string
          format: uuid
          description: Absent when the conversation has nothing to read yet.
        unread:
          type: boolean
    MessageKind:
      type: string
      description: |
        `message` goes to or comes from the contact, `note` is for members only, `event` records a
        change (assignment, status, labels).
      enum: [message, note, event]
    Direction:
      type: string
      enum: [in, out]
    AuthorType:
      type: string
      enum: [contact, member, system]
    MessageAuthor:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/AuthorType"
        member_id:
          type: string
          format: uuid
          description: Set for `member`; absent when that member was removed.
        contact_id:
          type: string
          format: uuid
          description: Set for `contact`.
    EventType:
      type: string
      enum: [assigned, unassigned, status_changed, labels_changed]
    MessageEvent:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/EventType"
        assignee_id:
          type: string
          format: uuid
          description: The new assignee (`assigned`).
        previous_assignee_id:
          type: string
          format: uuid
          description: The previous assignee (`assigned`, `unassigned`).
        status:
          $ref: "#/components/schemas/ConversationStatus"
        previous_status:
          $ref: "#/components/schemas/ConversationStatus"
        added_labels:
          type: array
          items:
            type: string
            format: uuid
        removed_labels:
          type: array
          items:
            type: string
            format: uuid
    Attachment:
      type: object
      required: [id, filename, content_type, size, inline, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Download it from `/v1/attachments/{id}`.
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
        content_id:
          type: string
          description: |
            The `Content-ID` of an inbound e-mail part, without angle brackets. The message HTML
            refers to it as `cid:<content_id>` in `img` sources.
        inline:
          type: boolean
          description: An inline part of an inbound e-mail (shown in the HTML) rather than an attachment.
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, conversation_id, kind, author, body, attachments, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/MessageKind"
        direction:
          $ref: "#/components/schemas/Direction"
        author:
          $ref: "#/components/schemas/MessageAuthor"
        body:
          type: string
          description: Plain text.
        html:
          type: string
          description: Sanitized HTML, when the message has an HTML form.
        client_id:
          type: string
        event:
          $ref: "#/components/schemas/MessageEvent"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        delivery:
          $ref: "#/components/schemas/MessageDelivery"
        email:
          $ref: "#/components/schemas/MessageEmail"
        created_at:
          type: string
          format: date-time
    MessageDelivery:
      type: object
      description: Delivery of an outgoing message by e-mail.
      required: [channel, state, updated_at]
      properties:
        channel:
          type: string
          enum: [email]
        state:
          type: string
          enum: [queued, sent, failed]
        error:
          type: string
          description: Why it failed (`failed` only).
        updated_at:
          type: string
          format: date-time
    MessageEmail:
      type: object
      description: |
        Set on messages that came or went by e-mail. `body` and `html` of the message show the new
        text only; `quoted` tells whether quoted history or a signature was hidden, which
        `GET /v1/messages/{id}/email` returns in full.
      required: [message_id, from, to, quoted, raw, auto, dmarc, has_remote_images]
      properties:
        message_id:
          type: string
          description: The `Message-ID` header without angle brackets.
        from:
          $ref: "#/components/schemas/Email"
        to:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        cc:
          type: array
          description: The `Cc` of an inbound mail, as received. Replies go to the contact only and copy no one.
          items:
            $ref: "#/components/schemas/Email"
        subject:
          type: string
        quoted:
          type: boolean
        raw:
          type: boolean
          description: The original is kept; download it from `/v1/messages/{id}/raw`.
        auto:
          type: boolean
          description: Automatic mail (auto-reply, list, bulk) or our own automatic message.
        dmarc:
          type: string
          description: The DMARC result from the receiving server's `Authentication-Results`.
          enum: [pass, fail, none, unknown]
        has_remote_images:
          type: boolean
          description: |
            The message's `html` loads images from other servers. They are kept as received; show
            them only when the member asks, since loading them tells the sender the mail was read.
    MessageEmailDetail:
      type: object
      required: [message_id, full_text, headers, has_remote_images]
      properties:
        message_id:
          type: string
        full_text:
          type: string
          description: The whole text part, quoted history and signature included.
        full_html:
          type: string
          description: The whole HTML part, sanitized.
        has_remote_images:
          type: boolean
          description: "`full_html` loads images from other servers; block them until the member asks."
        in_reply_to:
          type: string
        references:
          type: array
          items:
            type: string
        authentication_results:
          type: string
          description: The receiving server's `Authentication-Results` header, as received.
        headers:
          type: object
          description: Selected headers as received (Date, Reply-To, Auto-Submitted, Precedence, …).
          additionalProperties:
            type: string
    MessageCreate:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [message, note]
        direction:
          $ref: "#/components/schemas/Direction"
        body:
          type: string
          maxLength: 65536
          description: Required unless files are attached.
        html:
          type: string
          maxLength: 262144
          description: Sanitized before it is stored.
        client_id:
          type: string
          minLength: 1
          maxLength: 200
          description: Makes the request idempotent within the conversation.
    MessageCreateMultipart:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [message, note]
        direction:
          $ref: "#/components/schemas/Direction"
        body:
          type: string
          maxLength: 65536
        html:
          type: string
          maxLength: 262144
        client_id:
          type: string
          minLength: 1
          maxLength: 200
        files:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary
    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: string
          description: Absent on the last page.
    Label:
      type: object
      required: [id, name, color, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        created_at:
          type: string
          format: date-time
    LabelCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Defaults to `#6b7280`.
    LabelUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    LabelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Label"
    CannedReply:
      type: object
      required: [id, shortcut, title, body, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        shortcut:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CannedReplyCreate:
      type: object
      required: [shortcut, title, body]
      properties:
        shortcut:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 65536
    CannedReplyUpdate:
      type: object
      minProperties: 1
      properties:
        shortcut:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 65536
    CannedReplyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CannedReply"
    UsageMonth:
      type: object
      required: [month, conversations, messages, attachment_bytes]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          examples: ["2026-10"]
        conversations:
          type: integer
          format: int64
        messages:
          type: integer
          format: int64
        attachment_bytes:
          type: integer
          format: int64
    UsageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsageMonth"
    ConversationEvent:
      type: object
      description: A conversation was created, or its status, snooze, assignee, priority, labels or subject changed.
      required: [id, type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [conversation.created, conversation.updated]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Conversation"
    MessageCreatedEvent:
      type: object
      description: A message, note or event message was added to a conversation.
      required: [id, type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [message.created]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Message"
    MessageUpdatedEvent:
      type: object
      description: A message changed, e.g. its e-mail delivery state.
      required: [id, type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [message.updated]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Message"
    ContactUpdatedEvent:
      type: object
      description: A contact changed.
      required: [id, type, workspace_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [contact.updated]
        workspace_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Contact"
    ContactDeletedEvent:
      type: object
      description: A contact was deleted with its conversations.
      required: [id, type, workspace_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [contact.deleted]
        workspace_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ContactRef"
    InboxUpdatedEvent:
      type: object
      description: An inbox's settings changed.
      required: [id, type, workspace_id, inbox_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [inbox.updated]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Inbox"
    InboxCreatedEvent:
      type: object
      description: An inbox was created.
      required: [id, type, workspace_id, inbox_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [inbox.created]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Inbox"
    InboxDeletedEvent:
      type: object
      description: An inbox was deleted with its channels and conversations.
      required: [id, type, workspace_id, inbox_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [inbox.deleted]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/InboxRef"
    ConversationReadEvent:
      type: object
      description: The receiving member's read cursor moved, in this or another tab or device.
      required: [id, type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [conversation.read]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ConversationRead"
    InboxAccessChangedEvent:
      type: object
      description: A member was given or lost access to an inbox. Reload the inboxes and conversations when it is about you.
      required: [id, type, workspace_id, inbox_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [inbox_access.changed]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/InboxAccessChange"
    ContactRef:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    InboxRef:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    InboxAccessChange:
      type: object
      required: [inbox_id, member_id, granted]
      properties:
        inbox_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        granted:
          type: boolean
    RealtimeReady:
      type: object
      description: The replay is over; live events follow. `last_event_id` is the stream position.
      required: [type, last_event_id]
      properties:
        type:
          type: string
          enum: [ready]
        last_event_id:
          type: integer
          format: int64
    RealtimeResyncRequired:
      type: object
      description: The requested `last_event_id` is gone; reload over HTTP. `ready` follows.
      required: [type]
      properties:
        type:
          type: string
          enum: [resync_required]
    RealtimeMessage:
      description: One server message on `/v1/realtime`, told apart by `type`.
      oneOf:
        - $ref: "#/components/schemas/ConversationEvent"
        - $ref: "#/components/schemas/MessageCreatedEvent"
        - $ref: "#/components/schemas/MessageUpdatedEvent"
        - $ref: "#/components/schemas/ContactUpdatedEvent"
        - $ref: "#/components/schemas/ContactDeletedEvent"
        - $ref: "#/components/schemas/InboxCreatedEvent"
        - $ref: "#/components/schemas/InboxUpdatedEvent"
        - $ref: "#/components/schemas/InboxDeletedEvent"
        - $ref: "#/components/schemas/InboxAccessChangedEvent"
        - $ref: "#/components/schemas/ConversationReadEvent"
        - $ref: "#/components/schemas/TypingEvent"
        - $ref: "#/components/schemas/RealtimeReady"
        - $ref: "#/components/schemas/RealtimeResyncRequired"
      discriminator:
        propertyName: type
        mapping:
          conversation.created: "#/components/schemas/ConversationEvent"
          conversation.updated: "#/components/schemas/ConversationEvent"
          message.created: "#/components/schemas/MessageCreatedEvent"
          message.updated: "#/components/schemas/MessageUpdatedEvent"
          contact.updated: "#/components/schemas/ContactUpdatedEvent"
          contact.deleted: "#/components/schemas/ContactDeletedEvent"
          inbox.created: "#/components/schemas/InboxCreatedEvent"
          inbox.updated: "#/components/schemas/InboxUpdatedEvent"
          inbox.deleted: "#/components/schemas/InboxDeletedEvent"
          inbox_access.changed: "#/components/schemas/InboxAccessChangedEvent"
          conversation.read: "#/components/schemas/ConversationReadEvent"
          typing: "#/components/schemas/TypingEvent"
          ready: "#/components/schemas/RealtimeReady"
          resync_required: "#/components/schemas/RealtimeResyncRequired"
    Availability:
      type: string
      description: |
        `auto`: available in `live` inboxes while connected to `/v1/realtime` within business
        hours. `away`: never shown as available.
      enum: [auto, away]
    Origin:
      type: string
      description: A web origin, `scheme://host[:port]`, without a path.
      pattern: "^https?://[^/?#\\s]+$"
      maxLength: 300
      examples: ["https://www.example.com"]
    ChatLauncherPosition:
      type: string
      enum: [right, left]
    ChatLauncher:
      type: object
      description: The floating launcher. Absent values fall back to the inbox branding.
      properties:
        position:
          $ref: "#/components/schemas/ChatLauncherPosition"
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    ChatChannel:
      type: object
      description: Settings of a `chat` (web widget) channel.
      required: [public_key, allowed_origins, allow_anonymous, ask_email_offline, greeting, launcher]
      properties:
        public_key:
          type: string
          description: |
            Identifies the channel to the widget (`channel_key`). Not a secret: it is embedded in
            web pages. Rotate it with `POST /v1/channels/{id}/public-key`.
        allowed_origins:
          type: array
          description: The only origins whose pages may use the widget, compared exactly.
          items:
            $ref: "#/components/schemas/Origin"
        allow_anonymous:
          type: boolean
          description: Visitors without an identity token may chat.
        ask_email_offline:
          type: boolean
          description: The widget asks for an e-mail address when nobody is available.
        greeting:
          type: string
          description: Shown before the first message; the inbox branding greeting when empty.
        launcher:
          $ref: "#/components/schemas/ChatLauncher"
    ChatChannelInput:
      type: object
      required: [allowed_origins]
      properties:
        allowed_origins:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/Origin"
        allow_anonymous:
          type: boolean
          description: Defaults to false.
        ask_email_offline:
          type: boolean
          description: Defaults to true.
        greeting:
          type: string
          maxLength: 500
        launcher:
          $ref: "#/components/schemas/ChatLauncher"
    AppPlatform:
      type: string
      enum: [ios, android]
    AppChannel:
      type: object
      description: |
        Settings of an `app` (mobile SDKs) channel. Native apps send no `Origin`, so the key is not
        tied to origins; anonymous use is off unless allowed.
      required: [public_key, allow_anonymous, platforms]
      properties:
        public_key:
          type: string
          description: |
            Identifies the channel to the SDKs (`channel_key`). Not a secret: it ships inside the
            app. Rotate it with `POST /v1/channels/{id}/public-key`.
        allow_anonymous:
          type: boolean
          description: Users without an identity token may write.
        platforms:
          type: array
          description: The platforms the app ships on, for the panel.
          items:
            $ref: "#/components/schemas/AppPlatform"
    AppChannelInput:
      type: object
      properties:
        allow_anonymous:
          type: boolean
          description: Defaults to false.
        platforms:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: Defaults to both.
          items:
            $ref: "#/components/schemas/AppPlatform"
    ConversationKind:
      type: string
      description: "`feedback` conversations carry `feedback` metadata; everything else is `conversation`."
      enum: [conversation, feedback]
    FeedbackCategory:
      type: string
      enum: [bug, idea, praise, other]
    Feedback:
      type: object
      description: What a `feedback` conversation was sent with. Absent fields were not sent.
      required: [category, allow_email]
      properties:
        category:
          $ref: "#/components/schemas/FeedbackCategory"
        allow_email:
          type: boolean
          description: The contact allowed replies by e-mail.
        app_version:
          type: string
        build:
          type: string
        os:
          type: string
          examples: [iOS, Android]
        os_version:
          type: string
        device_model:
          type: string
          examples: ["iPhone17,1"]
        locale:
          type: string
        screen:
          type: string
          description: The app screen or route the feedback was sent from.
        installation_id:
          type: string
          description: The app's own id for this installation.
    FeedbackFields:
      type: object
      properties:
        app_version:
          type: string
          maxLength: 50
        build:
          type: string
          maxLength: 50
        os:
          type: string
          maxLength: 50
        os_version:
          type: string
          maxLength: 50
        device_model:
          type: string
          maxLength: 100
        locale:
          type: string
          maxLength: 35
        screen:
          type: string
          maxLength: 200
        installation_id:
          type: string
          maxLength: 200
    ClientFeedbackCreate:
      allOf:
        - $ref: "#/components/schemas/FeedbackFields"
        - type: object
          required: [category]
          properties:
            category:
              $ref: "#/components/schemas/FeedbackCategory"
            subject:
              type: string
              maxLength: 500
            body:
              type: string
              maxLength: 65536
              description: The feedback text. Required unless files are attached.
            client_id:
              type: string
              minLength: 1
              maxLength: 200
              description: The first message's `client_id`.
            allow_email:
              type: boolean
              default: false
            email:
              $ref: "#/components/schemas/Email"
    ClientFeedbackCreateMultipart:
      allOf:
        - $ref: "#/components/schemas/ClientFeedbackCreate"
        - type: object
          properties:
            files:
              type: array
              maxItems: 10
              items:
                type: string
                format: binary
    TypingCreate:
      type: object
      properties:
        typing:
          type: boolean
          default: true
          description: "`false` when the typist stopped or sent the message."
    TypingAuthor:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [member, contact]
        member_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        name:
          type: string
          description: The member's display name.
    Typing:
      type: object
      required: [conversation_id, typing, author]
      properties:
        conversation_id:
          type: string
          format: uuid
        typing:
          type: boolean
        author:
          $ref: "#/components/schemas/TypingAuthor"
    TypingEvent:
      type: object
      description: |
        Someone is typing in a conversation (`typing: true`) or stopped. Not stored: it has no `id`
        and is not replayed. Members do not receive their own.
      required: [type, workspace_id, inbox_id, conversation_id, created_at, data]
      properties:
        type:
          type: string
          enum: [typing]
        workspace_id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/Typing"
    ClientSessionCreate:
      type: object
      required: [channel_key]
      properties:
        channel_key:
          type: string
          minLength: 1
          maxLength: 200
          description: The chat or app channel's `public_key`.
        identity_token:
          type: string
          maxLength: 8192
          description: A JWT (HS256) from the host backend; see `sdk/go`.
        visitor_id:
          type: string
          maxLength: 200
          description: The `visitor_id` of an earlier anonymous session in this browser.
    ClientMember:
      type: object
      description: What a contact may see of a member.
      required: [name, initials]
      properties:
        name:
          type: string
          description: The display name; empty when the member has not set one.
        initials:
          type: string
          description: Up to two letters for an avatar; empty when the name is.
    ClientPresence:
      type: object
      description: Who can answer now, in a `live` inbox.
      required: [available, members]
      properties:
        available:
          type: boolean
          description: |
            Someone with access is connected, not set to away, and the inbox is within its business
            hours.
        members:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ClientMember"
    ClientChatSettings:
      type: object
      required: [greeting, launcher_position, ask_email_offline, allow_anonymous]
      properties:
        greeting:
          type: string
          description: The channel greeting, else the inbox branding greeting, else empty.
        launcher_position:
          $ref: "#/components/schemas/ChatLauncherPosition"
        launcher_color:
          type: string
          description: The channel's launcher color, else the inbox branding color; absent when neither is set.
        ask_email_offline:
          type: boolean
        allow_anonymous:
          type: boolean
    ClientInbox:
      type: object
      description: |
        The inbox's public settings. `live` inboxes carry `presence`; `async` inboxes never do and
        show `expected_reply_minutes` instead.
      required: [id, name, branding, default_locale, timezone, mode, business_hours, open_now, chat, feedback_categories]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        branding:
          $ref: "#/components/schemas/InboxBranding"
        default_locale:
          $ref: "#/components/schemas/LanguageTag"
        timezone:
          type: string
        mode:
          $ref: "#/components/schemas/InboxMode"
        business_hours:
          $ref: "#/components/schemas/BusinessHours"
        open_now:
          type: boolean
          description: Within business hours now (always true when they are not enabled).
        expected_reply_minutes:
          type: integer
          format: int32
          description: "`async` inboxes only; absent when not set."
        presence:
          $ref: "#/components/schemas/ClientPresence"
        chat:
          $ref: "#/components/schemas/ClientChatSettings"
        feedback_categories:
          type: array
          description: The categories `POST /client/v1/feedback` accepts, in display order.
          items:
            $ref: "#/components/schemas/FeedbackCategory"
    ClientContact:
      type: object
      required: [id, name, identified]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          $ref: "#/components/schemas/Email"
          description: The contact's first verified address (from an identity token or their own mail).
        typed_email:
          $ref: "#/components/schemas/Email"
          description: The address the contact typed, until it is verified.
        identified:
          type: boolean
          description: The session was started with an identity token.
    ClientSessionInfo:
      type: object
      required: [expires_at, contact, inbox]
      properties:
        expires_at:
          type: string
          format: date-time
          description: Moves forward with every use.
        visitor_id:
          type: string
          description: Anonymous sessions only. Keep it to resume this visitor later.
        contact:
          $ref: "#/components/schemas/ClientContact"
        inbox:
          $ref: "#/components/schemas/ClientInbox"
    ClientSession:
      allOf:
        - $ref: "#/components/schemas/ClientSessionInfo"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The contact session token. It is not shown again.
    ClientConversationStatus:
      type: object
      required: [id, status, updated_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ConversationStatus"
        updated_at:
          type: string
          format: date-time
    ClientMessagePreview:
      type: object
      required: [id, author_type, text, created_at]
      properties:
        id:
          type: string
          format: uuid
        author_type:
          $ref: "#/components/schemas/AuthorType"
        text:
          type: string
          description: The plain-text body on one line, cut to 140 characters with `…` when longer.
        created_at:
          type: string
          format: date-time
    ClientConversation:
      type: object
      required: [id, kind, subject, status, unread, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ConversationKind"
        feedback:
          $ref: "#/components/schemas/Feedback"
          description: "`feedback` conversations only."
        subject:
          type: string
        status:
          $ref: "#/components/schemas/ConversationStatus"
        last_message:
          $ref: "#/components/schemas/ClientMessagePreview"
        last_message_at:
          type: string
          format: date-time
        unread:
          type: boolean
          description: A message from a member is newer than the contact's read cursor.
        last_read_by_member_at:
          type: string
          format: date-time
          description: |
            `live` inboxes only: members have read every message created at or before this time
            (the latest read position of any member, as in the `read` realtime frame). Absent
            when no member has read the conversation, and in `async` inboxes.
        created_at:
          type: string
          format: date-time
    ClientConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientConversation"
        next_cursor:
          type: string
          description: Absent on the last page.
    ClientMessageAuthor:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/AuthorType"
        name:
          type: string
          description: "`member` only: the member's display name, possibly empty."
        initials:
          type: string
          description: "`member` only."
    ClientAttachment:
      type: object
      required: [id, filename, content_type, size, inline]
      properties:
        id:
          type: string
          format: uuid
          description: Download it from `/client/v1/attachments/{id}`.
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
        content_id:
          type: string
        inline:
          type: boolean
    ClientMessage:
      type: object
      required: [id, conversation_id, direction, author, body, attachments, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/Direction"
        author:
          $ref: "#/components/schemas/ClientMessageAuthor"
        body:
          type: string
        html:
          type: string
          description: Sanitized HTML, when the message has one.
        client_id:
          type: string
          description: The contact's own messages only.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ClientAttachment"
        created_at:
          type: string
          format: date-time
    ClientMessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientMessage"
        next_cursor:
          type: string
          description: Absent on the last page.
    ClientMessageCreate:
      type: object
      properties:
        body:
          type: string
          maxLength: 65536
          description: Plain text. Required unless files are attached.
        client_id:
          type: string
          minLength: 1
          maxLength: 200
          description: Makes the request idempotent within the conversation.
    ClientMessageCreateMultipart:
      type: object
      properties:
        body:
          type: string
          maxLength: 65536
        client_id:
          type: string
          minLength: 1
          maxLength: 200
        files:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary
    ClientConversationCreate:
      type: object
      properties:
        subject:
          type: string
          maxLength: 500
        body:
          type: string
          maxLength: 65536
          description: The first message. Required unless files are attached.
        client_id:
          type: string
          minLength: 1
          maxLength: 200
          description: The first message's `client_id`.
    ClientConversationCreateMultipart:
      type: object
      properties:
        subject:
          type: string
          maxLength: 500
        body:
          type: string
          maxLength: 65536
        client_id:
          type: string
          minLength: 1
          maxLength: 200
        files:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary
    ClientConversationCreated:
      type: object
      required: [conversation, message]
      properties:
        conversation:
          $ref: "#/components/schemas/ClientConversation"
        message:
          $ref: "#/components/schemas/ClientMessage"
    ClientReadCreate:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
          description: A message of the conversation; the latest when absent.
    ClientReadState:
      type: object
      required: [conversation_id, unread]
      properties:
        conversation_id:
          type: string
          format: uuid
        last_read_message_id:
          type: string
          format: uuid
        unread:
          type: boolean
    ClientEmailUpdate:
      type: object
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"
    ClientRead:
      type: object
      required: [conversation_id, read_at]
      properties:
        conversation_id:
          type: string
          format: uuid
        read_at:
          type: string
          format: date-time
          description: Members have read every message created at or before this time.
    ClientConversationCreatedEvent:
      type: object
      description: A conversation of the contact started (here, in another tab, or by a member).
      required: [id, type, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [conversation.created]
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ClientConversation"
    ClientConversationUpdatedEvent:
      type: object
      description: The conversation's status changed.
      required: [id, type, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [conversation.updated]
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ClientConversationStatus"
    ClientMessageEvent:
      type: object
      description: A message was added or changed.
      required: [id, type, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [message.created, message.updated]
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ClientMessage"
    ClientReadEvent:
      type: object
      description: A member read the conversation (`live` inboxes).
      required: [id, type, conversation_id, created_at, data]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [read]
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ClientRead"
    ClientTyping:
      type: object
      required: [conversation_id, typing, author]
      properties:
        conversation_id:
          type: string
          format: uuid
        typing:
          type: boolean
        author:
          $ref: "#/components/schemas/ClientMessageAuthor"
    ClientTypingEvent:
      type: object
      description: A member is typing a reply (`live` inboxes). No `id`; not replayed.
      required: [type, conversation_id, created_at, data]
      properties:
        type:
          type: string
          enum: [typing]
        conversation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ClientTyping"
    ClientPresenceEvent:
      type: object
      description: Who is available changed (`live` inboxes). No `id`; not replayed.
      required: [type, created_at, data]
      properties:
        type:
          type: string
          enum: [presence]
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ClientPresence"
    ClientInboxUpdatedEvent:
      type: object
      description: |
        The inbox's or the session channel's public settings changed. No `id`; not replayed.
      required: [type, created_at, data]
      properties:
        type:
          type: string
          enum: [inbox.updated]
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/ClientInbox"
    ClientRealtimeMessage:
      description: One server message on `/client/v1/realtime`, told apart by `type`.
      oneOf:
        - $ref: "#/components/schemas/ClientConversationCreatedEvent"
        - $ref: "#/components/schemas/ClientConversationUpdatedEvent"
        - $ref: "#/components/schemas/ClientMessageEvent"
        - $ref: "#/components/schemas/ClientReadEvent"
        - $ref: "#/components/schemas/ClientTypingEvent"
        - $ref: "#/components/schemas/ClientPresenceEvent"
        - $ref: "#/components/schemas/ClientInboxUpdatedEvent"
        - $ref: "#/components/schemas/RealtimeReady"
        - $ref: "#/components/schemas/RealtimeResyncRequired"
      discriminator:
        propertyName: type
        mapping:
          conversation.created: "#/components/schemas/ClientConversationCreatedEvent"
          conversation.updated: "#/components/schemas/ClientConversationUpdatedEvent"
          message.created: "#/components/schemas/ClientMessageEvent"
          message.updated: "#/components/schemas/ClientMessageEvent"
          read: "#/components/schemas/ClientReadEvent"
          typing: "#/components/schemas/ClientTypingEvent"
          presence: "#/components/schemas/ClientPresenceEvent"
          inbox.updated: "#/components/schemas/ClientInboxUpdatedEvent"
          ready: "#/components/schemas/RealtimeReady"
          resync_required: "#/components/schemas/RealtimeResyncRequired"
    IngressResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: |
            `stored` (a message was added), `duplicate` (seen before), `bounce` (a delivery report
            was applied) or `dropped` (deliberately ignored, e.g. mail from the channel's own
            address).
          enum: [stored, duplicate, bounce, dropped]
        conversation_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
    IngressRejection:
      type: object
      required: [reason, code]
      properties:
        reason:
          type: string
          description: Shown to the sender of the mail.
        code:
          type: string
          enum: [bad_signature, stale_timestamp, unknown_recipient, blocked_sender, too_large, malformed, rate_limited, not_configured, unavailable]
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: A release tag, a commit hash, or `dev`.
          examples: ["0.1.0"]
    Problem:
      type: object
      description: An RFC 9457 problem document.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URI that identifies the problem type.
        title:
          type: string
        status:
          type: integer
          format: int32
        code:
          type: string
          description: A stable, machine-readable error code.
          examples: [not_found]
        detail:
          type: string

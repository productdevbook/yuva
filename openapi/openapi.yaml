          description: Revenue the event carried, in the currency's minor units.
        currency:
          type: string
        engaged_ms:
          type: integer
        scroll:
          type: integer
        channel:
          type: string
        source:
          type: string
        referrer:
          type: string
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_campaign:
          type: string
        utm_term:
          type: string
        utm_content:
          type: string
        country:
          type: string
        region:
          type: string
        city:
          type: string
        device:
          type: string
        browser:
          type: string
        browser_version:
          type: string
        os:
          type: string
        os_version:
          type: string
        screen_size:
          type: string
        language:
          type: string
        platform:
          type: string
        app_version:
          type: string
    AnalyticsConsent:
      type: object
      description: |
        What the visitor agreed to in the site's or app's own consent tool. `p` and `j` count only
        with `a: 1`, on a property whose `consent_features` offer them; otherwise they are ignored
        and the event is counted as in default mode.
      properties:
        a:
          type: integer
          enum: [0, 1]
          description: "`1` when the visitor agreed to analytics."
        p:
          type: string
          minLength: 16
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: |
            The persistent id, for a visitor who also agreed to `persistent`: a random value of at
            least 128 bits (a UUID or base64url) that the script or SDK keeps on the device for at
            most 13 months from when it made it, and sends on every event, engagements included.
            The server keeps only a keyed hash of it under the property's own secret, so the same
            id means nothing on another property. With it the visitor counts once over several
            days, is told apart as new or returning, enters retention cohorts and crosses days in
            funnels. A value of the wrong shape is ignored.
          examples: [0f8fad5b-d9cb-469f-a165-70867728950e]
        j:
          type: string
          maxLength: 8192
          description: |
            An identity token of the property's linked inbox, signed by the host's backend as for
            `/client/v1/session` (HS256, `sub`, `exp` at most 10 minutes ahead, a `jti` used once),
            sent once after the user signs in, together with `p`, on a property that offers
            `identify`. It links the persistent id, and its visits, to the contact; the contact is
            found or made exactly as `/client/v1/session` does. A forged, expired or reused token is
            ignored and the event is still counted.
    AnalyticsEvent:
      type: object
      description: |
        One event. Keys the server does not know are ignored, so newer scripts keep working with
        older servers.
      required: [n, u]
      properties:
        n:
          type: string
          description: |
            `pageview`; `engagement` (sent once per view when the page is hidden or left); a built-in
            event: `outbound_click` (a link to another host, with prop `url`), `file_download` (a
            link to a file, with prop `url`), `not_found` (the page is the site's 404 page) or
            `chat_open` (the page's chat was opened); or a custom event's name, 1 to 120
            characters. `screen` and names starting with `$` or `yuva_` are reserved.

            `yuva_consent` is not an event and is never stored or counted: it carries a change of
            consent at once. With `c.a: 1`, `c.p` and `c.j` it identifies the visitor (see
            `AnalyticsConsent`); with `c.a: 0` and `c.p` it withdraws: the persistent id's link to
            a contact and its cohort days are deleted, so its visits leave the contact's page and
            retention. A withdrawal is taken even with `Sec-GPC` or `DNT`.
          minLength: 1
          maxLength: 120
          examples: [pageview, Signup, outbound_click]
        u:
          type: string
          description: |
            The page URL. Only the host and the path are kept; of the query, only `utm_source`,
            `utm_medium`, `utm_campaign`, `utm_term`, `utm_content`, `ref` and `source` are read, into
            the visit's acquisition. Path segments shaped like e-mail addresses are stored as
            `:email`. In an app, the screen: `app://<app id>/<screen>`, the screen's path
            percent-encoded (`app://com.example.shop/Product%20Detail`), read the same way.
          maxLength: 2000
        t:
          type: integer
          format: int64
          description: |
            Apps only: when the event happened, in milliseconds since the Unix epoch. Taken as now
            when absent or in the future; an event older than 72 hours is dropped as `late`.
          examples: [1760263200000]
        r:
          type: string
          description: "`document.referrer`; only its host and path are kept, and none when it is the page's own host."
          maxLength: 2000
        w:
          type: integer
          description: Viewport width in CSS pixels, turned into a screen size class and not stored.
        h:
          type: boolean
          description: The page uses hash routing, so the fragment is part of the path.
        ms:
          type: integer
          description: "`engagement` only: milliseconds the page was visible and focused, at most 30 minutes."
        sd:
          type: integer
          description: "`engagement` only: the deepest scroll position reached, in percent."
          minimum: 0
          maximum: 100
        p:
          type: object
          description: |
            Custom and built-in events only: up to 30 props. Keys have 1 to 300 characters and must
            not start with `$` or `yuva_`; values are strings, numbers or booleans, kept as text of
            at most 2,000 characters. A value shaped like an e-mail address is dropped (and counted
            as scrubbed); a children's property keeps no props but a built-in event's `url`. The
            `url` of `outbound_click` and `file_download` is kept without its query and fragment.
          maxProperties: 30
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
          examples: [{plan: pro, seats: 3}]
        $:
          $ref: "#/components/schemas/AnalyticsEventRevenue"
        i:
          type: boolean
          description: "`false` makes a custom event non-interactive, so a visit with only that event still bounces."
        c:
          $ref: "#/components/schemas/AnalyticsConsent"
    AnalyticsEventRevenue:
      type: object
      description: |
        Revenue a custom or built-in event carries: `a` the amount, a decimal with at most the
        currency's minor-unit digits (2 for most, 0 for JPY or KRW, 3 for KWD), `c` the ISO 4217
        code. It is stored in minor units per currency; Yuva converts nothing.
      required: [a, c]
      properties:
        a:
          description: As a string ("29.90") or a number.
          oneOf:
            - type: string
              maxLength: 32
            - type: number
          examples: ["29.90"]
        c:
          type: string
          pattern: "^[A-Za-z]{3}$"
          examples: [EUR]
    AnalyticsEventBatch:
      type: object
      description: Up to 100 events. Apps also send `k` and `a`, and one request per process key.
      required: [e]
      properties:
        k:
          type: string
          minLength: 16
          maxLength: 128
          description: |
            Apps only, required there: the process key, a random value (at least 128 bits, such as
            a UUID) the app makes at launch and keeps in memory only, never on disk. It stands for
            the visitor in place of the address: a relaunch makes a new key, so a new visitor and
            visit. Queued events keep the key of the process that recorded them.
          examples: [0f8fad5b-d9cb-469f-a165-70867728950e]
        a:
          $ref: "#/components/schemas/AnalyticsApp"
        e:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/AnalyticsEvent"
    AnalyticsApp:
      type: object
      description: |
        Apps only, required there: the app that sent the events, describing a visit it starts.
        Nothing here identifies a device.
      required: [platform]
      properties:
        platform:
          type: string
          enum: [ios, android]
          x-enum-varnames: [AnalyticsAppIos, AnalyticsAppAndroid]
        version:
          type: string
          maxLength: 50
          description: The app's version as users see it (`CFBundleShortVersionString`, `versionName`), the `app_version` dimension.
          examples: ["2.3.1"]
        os_version:
          type: string
          maxLength: 50
          description: The OS version; its major number is kept (`os_version` dimension `iOS 18`).
          examples: ["18.1"]
        device:
          type: string
          enum: [mobile, tablet, desktop]
          description: "`tablet` for iPads and Android tablets, `desktop` for Mac and ChromeOS."
        width:
          type: integer
          description: Screen width in points or dp, turned into a screen size class and not stored.
          examples: [390]
        language:
          type: string
          maxLength: 35
          description: The app's language as a BCP 47 tag; only its primary language is kept. `Accept-Language` when absent.
          examples: [tr-TR]
    AnalyticsBatch:
      description: One event, or up to 100 in `e`.
      oneOf:
        - $ref: "#/components/schemas/AnalyticsEvent"
        - $ref: "#/components/schemas/AnalyticsEventBatch"
    IngressResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: |
            `stored` (a message was added), `duplicate` (seen before), `bounce` (a delivery report
            was applied) or `dropped` (deliberately ignored, e.g. mail from the channel's own
            address).
          enum: [stored, duplicate, bounce, dropped]
        conversation_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
    IngressRejection:
      type: object

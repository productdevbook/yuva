      description: Kind-specific settings, stored as given. Not acted on yet.
    Channel:
      type: object
      required: [id, inbox_id, kind, name, settings, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChannelKind"
        name:
          type: string
        settings:
          $ref: "#/components/schemas/ChannelSettings"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelCreate:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/ChannelKind"
        name:
          type: string
          minLength: 1
          maxLength: 200
        settings:
          $ref: "#/components/schemas/ChannelSettings"
    ChannelUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        settings:
          $ref: "#/components/schemas/ChannelSettings"
    ChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    ExternalId:
      type: object

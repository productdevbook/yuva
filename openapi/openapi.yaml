        - $ref: "#/components/parameters/PasskeyId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/push/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      summary: The server's Web Push key
      description: |
        The VAPID public key to pass as `applicationServerKey` to `PushManager.subscribe()`: an
        uncompressed P-256 point, base64url without padding. 404 `push_disabled` when the server
        has no VAPID keys configured; hide push settings then.
      tags: [notifications]
      security:
        - session: []
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKey"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/me/push-subscriptions:
    get:
      operationId: listPushSubscriptions
      summary: List push subscriptions
      description: The signed-in person's push subscriptions, newest first.
      tags: [notifications]
      security:
        - session: []
      responses:
        "200":
          description: The subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPushSubscription
      summary: Register a push subscription
      description: |
        Saves the browser's `PushSubscription` (`subscription.toJSON()`) for the current session.
        Registering an endpoint that is already saved updates it and moves it to this session and
        person, so call it on every panel start while notification permission is granted. The
        endpoint must be an `https` URL on a public address. At most 20 subscriptions per person.
        404 `push_disabled` when the server has no VAPID keys.
      tags: [notifications]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionCreate"
      responses:
        "201":
          description: The saved subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/me/push-subscriptions/{pushSubscriptionId}:
    delete:
      operationId: deletePushSubscription
      summary: Remove a push subscription
      description: Call it before `PushSubscription.unsubscribe()` when the member turns push off.
      tags: [notifications]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/PushSubscriptionId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/me/push-subscriptions/{pushSubscriptionId}/test:
    post:
      operationId: testPushSubscription
      summary: Send a test notification
      description: |
        Queues a test notification to the subscription and returns its payload. The outcome shows
        up as `last_success_at` or `last_error` on the subscription.
      tags: [notifications]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/PushSubscriptionId"
      responses:
        "202":
          description: Queued; the push carries this payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushNotification"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/me/notifications:
    get:
      operationId: getNotificationSettings
      summary: Your notification settings
      description: The calling member's notification settings in the workspace. Member sessions only.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateNotificationSettings
      summary: Change your notification settings
      description: |
        Each event sent replaces that event's channels; events not sent keep theirs. Member
        sessions only.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsUpdate"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/me/notifications/inboxes/{inboxId}:
    put:
      operationId: setInboxNotifications
      summary: Override your notifications for one inbox
      description: |
        Replaces the member's override for the inbox: the events sent here win over the
        workspace-wide settings in that inbox; the others follow them. Member sessions only.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxNotificationsUpdate"
      responses:
        "200":
          description: The override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxNotifications"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteInboxNotifications
      summary: Remove your override for one inbox
      description: The inbox follows the workspace-wide settings again. Member sessions only.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/InboxId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/me/mentions:
    get:
      operationId: listMentions
      summary: Notes that mention you
      description: |
        Notes in the workspace whose `mentions` name the calling member, written by someone else,
        newest first, in conversations the member can see now. Each item has the note (a preview
        of its text and its author), the conversation, and `seen`: whether the member has read the
        conversation up to the note (`POST /v1/conversations/{id}/read`, or writing in it). The
        page carries `unseen`, the number of unseen mentions over all pages, for a badge. Member
        sessions only.

        Realtime: a new mention arrives as `message.created` with `kind: note` and the member in
        `mentions`; `conversation.read` changes `seen`; `conversation.moved` and
        `inbox_access.changed` can hide or show items.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of mentions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentionPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/account:
    get:
      operationId: getReaderAccount
      summary: The signed-in person as a reader
      description: |
        The reader account of the signed-in person: the name and initials shown on their posts, their
        sign-in address and their e-mail settings. Every person has one, members included; `member`
        says whether they also belong to a workspace (the account page then links to the team panel).
        Person sessions only.
      tags: [account]
      security:
        - session: []
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderAccount"
        "401":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateReaderAccount
      summary: Change the reader name or e-mail settings
      description: |
        `name` is the person's name (the same as `PATCH /v1/me`), shown on their posts; an empty name
        shows them as "Reader". `email_notifications` turns e-mails about followed threads on or off
        for every workspace; in-app notifications stay.
      tags: [account]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderAccountUpdate"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderAccount"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/account/reader-tokens:
    post:
      operationId: createReaderToken
      summary: Hand a reader token to a documentation site
      description: |
        Called by the server's own `/account/connect?channel=<key>&origin=<origin>` page, which a
        site's `<yuva-discussions>` element opens in a popup. Once the person is signed in, the page
        asks for a token for the chat channel and the origin of the window that opened it, and sends
        the answer to `window.opener` with `postMessage(..., origin)`, so only a page on that origin
        receives it.

        The origin must be one of the channel's allowed origins, compared exactly
        (`403 origin_not_allowed`), and the channel must have discussions on
        (`403 discussions_off`); an unknown key or an `app` channel's key answers `404`.

        The token (`yuva_rd_<secret>`) is sent as `Authorization: Bearer` on the `/client/v1`
        discussion endpoints of that channel. It lives 24 hours and ends earlier with the session that
        made it (sign-out), when the account is deleted, or with
        `DELETE /client/v1/reader-token`. In the channel's workspace it acts as the contact linked to
        the person, created on the first write; a person who is a member of that workspace with
        access to the inbox writes as that member.

        Person sessions only; like every cookie request it must come from the server's own origin.
      tags: [account]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderTokenCreate"
      responses:
        "201":
          description: The token, the origin to post it to and who it signs in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderToken"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/account/discussions:
    get:
      operationId: listReaderDiscussions
      summary: Threads the reader started or replied to
      description: |
        Across every workspace, the threads the person started or wrote in as a reader, most recent
        activity first. Threads that were hidden, and posts of theirs still waiting for a member,
        are included, so the reader sees where their writing stands. Person sessions only.
      tags: [account]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of threads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderDiscussionPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/account/following:
    get:
      operationId: listReaderFollowing
      summary: Threads the reader follows
      description: Across every workspace, most recent activity first. Person sessions only.
      tags: [account]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of threads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderDiscussionPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/account/following/{discussionId}:
    delete:
      operationId: unfollowReaderDiscussion
      summary: Stop following a thread
      description: Unknown threads, and threads the person does not follow, answer `404`.
      tags: [account]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/DiscussionId"
      responses:
        "204":
          description: No longer followed.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/account/notifications:
    get:
      operationId: listReaderNotifications
      summary: The reader's notifications
      description: |
        New replies and accepted answers in followed threads, across every workspace, newest first.
        `unread` counts the unread ones over all pages. Notifications are kept 90 days.
        Person sessions only.
      tags: [account]
      security:
        - session: []
      parameters:
        - name: unread
          in: query
          description: "`true` lists only unread notifications."
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderNotificationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/account/notifications/read:
    post:
      operationId: markReaderNotificationsRead
      summary: Mark notifications read
      description: The listed notifications, or all of them when `ids` is absent. Person sessions only.
      tags: [account]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderNotificationsRead"
      responses:
        "204":
          description: Marked.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/workspace:
    get:
      operationId: getWorkspace
      summary: The current workspace
      description: "Scope: `inboxes:read`."
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateWorkspace
      summary: Update the workspace
      description: |
        `retention_days`: owners, or an API key with `workspace:manage`. `bots_may_send` and
        `broadcasts_by_keys`: owners and admins with a member session (`403
        member_session_required` for a key).

        Scope: `workspace:manage`.
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: The updated workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteWorkspace
      summary: Delete the workspace
      description: |
        Owners only, with a member session; the body repeats the workspace's name exactly. The
        workspace stops answering at once: its members, API keys, widget and app sessions and
        e-mail addresses are refused from this request on, its webhook endpoints are removed and
        nothing more is sent to them. A background job then deletes everything else in batches:
        conversations, messages, attachments and raw e-mails with their stored files, contacts,
        inboxes, channels, members, invites and settings. People keep their account; members left
        with no other workspace lose their push subscriptions.
      tags: [workspace]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceDeletion"
      responses:
        "202":
          description: The workspace is closed and its data is being deleted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/workspace/broadcast-approval:
    post:
      operationId: requestBroadcastApproval
      summary: Ask the operator to allow broadcasts
      description: |
        On a server that runs with `YUVA_BROADCASTS=approval`, a new workspace sends broadcasts only
        after the server's operator approves it. The request tells the operator the website, what
        the workspace sends and how its subscribers agreed; `broadcasts.status` becomes
        `approval_requested` until the operator answers. `409 invalid_state` unless the status is
        `approval_required`.

        Owners only, with a member session.
      tags: [workspace]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastApprovalRequest"
      responses:
        "202":
          description: The request is with the operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/workspaces:
    post:
      operationId: createWorkspace
      summary: Create a workspace
      description: |
        Creates a workspace with the signed-in person as its owner. Only when the server's sign-up
        is `open` (`403 signup_closed` otherwise; operators create workspaces with
        `yuva bootstrap`). A person may have at most `YUVA_SIGNUP_WORKSPACES_PER_PERSON` live
        workspaces they created (`403 workspace_limit`), and at most
        `YUVA_SIGNUP_WORKSPACES_PER_IP` workspaces are created from one IP address (IPv6 /64) in 24
        hours (`429 rate_limited`). The name is 1 to 200 characters after trimming.

        Person sessions only; the `Yuva-Workspace` header is ignored. Send the new id as
        `Yuva-Workspace` to act on it.
      tags: [workspace]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreate"
      responses:
        "201":
          description: The new workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /v1/members:
    get:
      operationId: listMembers
      summary: List members
      description: |
        Every member of the workspace with their `availability` and whether they are `online`.

        Scope: `inboxes:read`.
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: The workspace's members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/members/{memberId}:
    get:
      operationId: getMember
      summary: Get a member
      description: "Scope: `inboxes:read`."
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMember
      summary: Change a member's role
      description: |
        Owners and admins only, with a member session. Only an owner grants or takes away the
        `owner` role. The last owner cannot be demoted.
      tags: [workspace]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: The updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeMember
      summary: Remove a member
      description: |
        Owners and admins only, with a member session; only an owner removes an owner. The last
        owner cannot be removed.
      tags: [workspace]
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/invites:
    get:
      operationId: listInvites
      summary: List pending invites
      tags: [workspace]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      responses:
        "200":
          description: Invites that are not accepted yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInvite
      summary: Invite a member
      description: |
        Owners and admins only, with a member session; only an owner invites an owner. Sends an

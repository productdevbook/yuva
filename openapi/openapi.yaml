    EmailDesignDocument:
      type: object
      description: |
        An e-mail design: a theme and up to 200 blocks (counting nested ones) in at most 300 KiB of
        JSON. Nesting is section › columns › blocks at most.
      required: [schema, theme, blocks]
      additionalProperties: false
      properties:
        schema:
          type: integer
          format: int32
          const: 1
          x-enum-varnames: [EmailDesignSchema1]
          description: The document format version.
        theme:
          $ref: "#/components/schemas/EmailTheme"
        preheader:
          type: string
          maxLength: 300
          description: The preview text inboxes show after the subject; a broadcast's own preheader wins.
        blocks:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/EmailBlock"
    EmailDesignIssue:
      type: object
      description: |
        One problem with a document. Error codes: `required`, `invalid`, `too_long`, `too_many`,
        `duplicate_id`, `nesting`, `invalid_rich_text`, `invalid_url`, `unknown_merge_field`,
        `merge_field_in_url`, `foreign_asset`, `asset_not_allowed`, `column_widths`. Warning codes
        are listed under `renderEmailDesign`.
      required: [code]
      properties:
        block_id:
          type: string
          description: The block; absent for the theme and the preheader.
        field:
          type: string
          description: The field, as a dotted path inside the block or the document.
          examples: [html, theme.colors.text, columns.1.width]
        code:
          type: string
          examples: [invalid_rich_text]
        detail:
          type: string
    EmailDesignProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/EmailDesignIssue"
            design:
              $ref: "#/components/schemas/EmailDesign"
              description: "`version_conflict` only: the design as it is now."
    EmailDesignSummary:
      type: object
      required: [id, name, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid

          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/conversations:
    get:
      operationId: listConversations
      summary: List conversations
      description: |
        Most recent activity (message or note) first, in the inboxes the caller can see. `q` is a
        full-text search over the subject, the messages and notes, and the contact; a negated term
        (`-word`, `-"some phrase"`) excludes every conversation in which any of those contains it.

        Each item carries the contact (id, name, first e-mail address), a preview of the last
        `message` (notes and events are not previewed) and `unread` for the calling member.
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
        - name: inbox_id
          in: query
          schema:
            type: string
            format: uuid
        - name: contact_id
          in: query
          description: Only this contact's conversations. A contact of another workspace answers `404`.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ConversationStatus"
        - name: assignee
          in: query
          description: A member id, `me` (member sessions only) or `unassigned`.
          schema:
            type: string
            examples: [me]
        - name: label_id
          in: query
          schema:
            type: string
            format: uuid
        - name: spam
          in: query
          description: |
            `true` lists only conversations flagged as spam (the spam view); without it, or with
            `false`, spam is left out.
          schema:
            type: boolean
            default: false
        - name: kind
          in: query
          description: Only conversations of this kind, e.g. `feedback` for the feedback view.
          schema:
            $ref: "#/components/schemas/ConversationKind"
        - name: category
          in: query
          description: Only feedback of this category (implies `kind=feedback`).
          schema:
            $ref: "#/components/schemas/FeedbackCategory"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createConversation
      summary: Start a conversation
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreate"
      responses:
        "201":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

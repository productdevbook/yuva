        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/webhooks/{webhookId}/secret:
    post:
      operationId: rotateWebhookSecret
      summary: Rotate the signing secret
      description: |
        Owners, admins and API keys. Returns a new secret once. For 24 hours deliveries carry
        signatures with both the new and the old secret (`webhook-signature` lists both), so the
        receiver can switch without dropping events.

        Scope: `webhooks:manage`.
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/WorkspaceHeader"
        - $ref: "#/components/parameters/WebhookId"
      responses:
        "200":
          description: The endpoint and its new secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointSecret"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/webhooks/{webhookId}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List an endpoint's deliveries
      description: |
        Owners, admins and API keys. Newest first, with the last attempt of each. Finished
        deliveries are kept 7 days.

        Scope: `webhooks:manage`.
      tags: [webhooks]
      parameters:

            type: string
            maxLength: 2000
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/DiscussionSort"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of threads.
          headers:
            Cache-Control:
              description: "`public, max-age=60` without a token, else `private, no-store`."

      responses:
        "200":
          description: The lists and a form token.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMailingLists"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/channels/{channel_key}/subscriptions:
    post:
      operationId: createClientSubscription
      summary: Subscribe from a form
      description: |
        A visitor subscribes to public lists of the chat channel's inbox, without a session. The
        answer is the same `202` for an address that is new, already subscribed, waiting for its
        confirmation, unsubscribed, opted out or undeliverable, so the form tells nobody whether an
        address is known: `confirmation` only says whether any of the lists asks the person to
        confirm by mail. What happens:

        - a new address on a list with double opt-in becomes `pending` and gets a confirmation mail;
          on a list without it, `subscribed` at once with the list's welcome mail;
        - a `pending` address gets the confirmation again; an `unsubscribed` or opted-out one
          becomes `pending` and gets a confirmation (only the person can come back);
        - a subscribed or undeliverable address changes nothing.

        The confirmation mail repeats nothing the visitor typed. `consent_text` is the label the
        visitor ticked, stored with `page_url`, the IP address and the user agent.

        Checks: the page's origin must be one of the channel's allowed origins (`400 page_origin`);
        `form_token` comes from `listClientMailingLists` and is accepted from 2 seconds to 2 hours
        after it was issued (`400 form_token`); `website` is a honeypot that must stay empty
        (a filled one is answered `202` and ignored); `list_ids` must be public lists of the
        channel's inbox (`404 list_not_found`); `400 invalid_email`. At most 10 requests per IP
        address and hour and 600 per channel and hour (`429 rate_limited` with `Retry-After`, the
        seconds until the hour ends); confirmation mails are
        capped per address (3 a day, 1 per list in 10 minutes) and per channel (1,000 a day)
        without changing the answer.

        Browsers must call from one of the channel's allowed origins (`403 origin_not_allowed`).
        An `app` channel's key answers `404`.
      tags: [client]
      security: []
      parameters:
        - $ref: "#/components/parameters/ChannelKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientSubscriptionCreate"
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSubscriptionAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /client/v1/discussions:
    post:
      operationId: createClientDiscussion
      summary: Start a thread
      description: |
        Starts a thread on a page of the token's chat channel (`page_url`'s origin must be one of its
        allowed origins, `400 page_origin`). Needs a reader token, or a contact session started with
        an identity token; anonymous visitors get `403 sign_in_required`. A channel with discussions
        off answers `403 discussions_off`.

        With the channel's `discussions: moderated` (the default) a reader's thread waits for a
        member (`state: pending`, visible only to its author and members) until one of their posts
        in the workspace has been approved; identity-token users and members are published at once.
        `open` publishes everyone at once, except authors whose posts were marked spam. The author
        follows the thread.

        Rate limited per author and per IP address (`429 rate_limited`).
      tags: [client]
      security:
        - readerToken: []
        - contactSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientDiscussionCreate"
      responses:
        "201":
          description: The thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discussion"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"

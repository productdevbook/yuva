        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/webhooks/{webhookId}/deliveries/{deliveryId}:
    get:
      operationId: getWebhookDelivery
      summary: Get a delivery with its payload and attempts
      description: "Scope: `webhooks:manage`."
      tags: [webhooks]

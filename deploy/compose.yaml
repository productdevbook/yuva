name: yuva-dev

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: yuva
      POSTGRES_PASSWORD: yuva
      POSTGRES_DB: yuva
    ports:
      - "127.0.0.1:55443:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuva -d yuva"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      YUVA_DATABASE_URL: postgres://yuva:yuva@db:5432/yuva?sslmode=disable
      YUVA_PUBLIC_URL: ${YUVA_PUBLIC_URL:-http://localhost:8809}
      YUVA_MASTER_KEY: ${YUVA_MASTER_KEY:-eXV2YS1kZXYtb25seS1tYXN0ZXIta2V5LTMyYnl0ZXM=}
      YUVA_STORAGE: local
      YUVA_STORAGE_DIR: /data/attachments
      YUVA_INGRESS_SECRET: ${YUVA_INGRESS_SECRET:-yuva-dev-only-ingress-secret}
    ports:
      - "0.0.0.0:8809:8080"
    volumes:
      - attachments:/data
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:58025:8025"
      - "127.0.0.1:51025:1025"
    restart: unless-stopped

volumes:
  db:
  attachments:

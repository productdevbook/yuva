name: yuva-dev

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: yuva
      POSTGRES_PASSWORD: yuva
      POSTGRES_DB: yuva
    ports:
      - "127.0.0.1:55443:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuva -d yuva"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      YUVA_DATABASE_URL: postgres://yuva:yuva@db:5432/yuva?sslmode=disable
      YUVA_PUBLIC_URL: ${YUVA_PUBLIC_URL:-http://localhost:8809}
    ports:
      - "0.0.0.0:8809:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:

package: oas
output: oas.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
output-options:
  skip-prune: true
  exclude-operation-ids: [realtime, ingestSlack, slackOAuthCallback, clientRealtime, collectAnalytics, ingestEmail, ingestSes, statusHeartbeat, statusHeartbeatPost, statusHeartbeatFail, statusHeartbeatFailPost, statusPush, ingestIssueWebhook, oauthAuthorizationServerMetadata, oauthProtectedResourceMetadata, oauthProtectedResourceMetadataMcp, oauthRegister, oauthAuthorize, oauthToken, oauthRevoke]
  nullable-type: true
  type-mapping:
    string:
      formats:
        uuid:
          type: uuid.UUID
          import: uuid

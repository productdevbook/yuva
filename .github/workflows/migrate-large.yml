name: Large mailbox migration

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-mailbox:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yuva
          POSTGRES_PASSWORD: yuva
          POSTGRES_DB: yuva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuva -d yuva_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      YUVA_TEST_DATABASE_URL: postgres://yuva:yuva@localhost:5432/yuva_test?sslmode=disable
      YUVA_TEST_IMAP_URL: imaps://:migrate-test-only@127.0.0.1:59993
      YUVA_TEST_IMAP_FIXTURES: /tmp/yuva-migrate-fixtures
      YUVA_TEST_LARGE_MAILBOX: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Dovecot with 200,000 messages (about 2 GB)
        run: |
          (cd api && go run ./internal/migrate/testdata/gen -out "$YUVA_TEST_IMAP_FIXTURES" -large -bulk 200000 -bulk-body 10000)
          du -sh "$YUVA_TEST_IMAP_FIXTURES/bulk"
          docker run -d --name dovecot -e USER_PASSWORD=migrate-test-only \
            -v "$PWD/deploy/dovecot/migrate-test.conf:/etc/dovecot/dovecot.conf:ro" -v "$YUVA_TEST_IMAP_FIXTURES:/srv/vmail" \
            -p 127.0.0.1:59993:31993 dovecot/dovecot:2.4.4
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/59993) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs dovecot
          exit 1
      - name: move the mailbox and report scan time, copy rate, peak memory and database growth
        working-directory: api
        run: go test ./internal/api/ -run '^TestDovecotLargeMailbox$' -count=1 -timeout 270m -v
      - name: the migration sent the mailbox nothing but reading commands
        run: |
          sudo sh -c 'cat "$0"/bulk/rawlog/*.in' "$YUVA_TEST_IMAP_FIXTURES" \
            | tr -d '\r' | awk 'NF >= 3 { c = toupper($3); if (c == "UID") c = c " " toupper($4); print c }' | sort -u | tee commands.txt
          test -s commands.txt
          ! grep -vxE 'CAPABILITY|NOOP|LOGOUT|STARTTLS|LOGIN|AUTHENTICATE|LIST|STATUS|EXAMINE|UNSELECT|SEARCH|UID SEARCH|FETCH|UID FETCH' commands.txt

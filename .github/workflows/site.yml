name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "sdk/shadcn/**"
      - "openapi/openapi.yaml"
      - "CHANGELOG.md"
      - "templates/email/**"
      - "api/internal/mail/design/icons/**"
      - ".github/workflows/site.yml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'productdevbook/yuva' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    environment: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
        run: bun install --frozen-lockfile && bun run i18n && bun run build && bun run links
      # versions upload/deploy leave the Worker's custom domains alone, so the token needs no zone access.
      - working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ vars.SITE_WORKER }}
        run: |
          out=$(bunx wrangler@4.148.0 versions upload --name "$WORKER" --assets ./dist --compatibility-date 2026-10-01)
          echo "$out"
          id=$(echo "$out" | sed -n 's/.*Worker Version ID: \([0-9a-f-]*\).*/\1/p')
          [ -n "$id" ] || { echo "no version id in the upload output" >&2; exit 1; }
          bunx wrangler@4.148.0 versions deploy "$id@100%" --name "$WORKER" -y

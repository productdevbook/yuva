name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/productdevbook/yuva

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a v-prefixed SemVer tag"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          declare -A found=(
            [openapi/openapi.yaml]="$(sed -n 's/^  version: //p' openapi/openapi.yaml | head -1)"
            [sdk/js/package.json]="$(jq -r .version sdk/js/package.json)"
            [sdk/kotlin/gradle.properties]="$(sed -n 's/^yuva.version=//p' sdk/kotlin/gradle.properties)"
            [sdk/swift/Sources/YuvaKit/Yuva.swift]="$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' sdk/swift/Sources/YuvaKit/Yuva.swift)"
            [deploy/mcpb/manifest.json]="$(jq -r .version deploy/mcpb/manifest.json)"
            [server.json]="$(jq -r .version server.json)"
          )
          for file in "${!found[@]}"; do
            if [[ "${found[$file]}" != "$version" ]]; then
              echo "::error file=$file::version is ${found[$file]}, the tag is $version"
              exit 1
            fi
          done
          for key in version appVersion; do
            chart="$(sed -n "s/^$key: \"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" deploy/helm/yuva/Chart.yaml)"
            if [[ "$chart" != "$version" ]]; then
              echo "::error file=deploy/helm/yuva/Chart.yaml::$key is $chart, the tag is $version"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Yuva
            org.opencontainers.image.description=Open-source customer messaging: e-mail, live chat and in-app conversations in one inbox.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          annotations: |
            org.opencontainers.image.title=Yuva
            org.opencontainers.image.description=Open-source customer messaging: e-mail, live chat and in-app conversations in one inbox.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: push the Helm chart to ghcr.io
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm lint --strict deploy/helm/yuva -f deploy/helm/yuva/ci/kind-values.yaml
          helm package deploy/helm/yuva --version "$VERSION" --app-version "$VERSION" -d dist
          printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "dist/yuva-$VERSION.tgz" oci://ghcr.io/productdevbook/charts

  mcpb:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: build the MCP Bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$bundle" dist
          cp -R deploy/mcpb/. "$bundle/"
          cp web/public/apple-touch-icon.png "$bundle/icon.png"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}"
            out="$bundle/server/$os-$arch/yuva"
            [[ "$os" == windows ]] && out="$bundle/server/yuva.exe"
            (cd api && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$out" ./cmd/yuva)
          done
          npx --yes @anthropic-ai/mcpb@2.1.2 validate "$bundle/manifest.json"
          npx --yes @anthropic-ai/mcpb@2.1.2 pack "$bundle" dist/yuva.mcpb
          sha="$(sha256sum dist/yuva.mcpb | cut -d' ' -f1)"
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/yuva.mcpb"
          jq --arg v "$VERSION" --arg url "$url" --arg sha "$sha" \
            '.version = $v | .packages |= map(if .registryType == "mcpb" then .identifier = $url | .version = $v | .fileSha256 = $sha else . end)' \
            server.json > dist/server.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb
          path: dist/
          if-no-files-found: error

  npm:
    needs: version
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: publish with npm trusted publishing
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          tag=latest
          [[ "$PRERELEASE" == true ]] && tag=next
          npm publish --access public --tag "$tag"

  release:
    needs: [version, image, chart, mcpb, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bunx changelogithub@15.0.5 --to "$TAG"
      - name: tag the Go module
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The release pushes this tag with the v tag: GITHUB_TOKEN may not create a ref once main's workflows changed.
          git ls-remote --exit-code --tags origin "refs/tags/sdk/go/$TAG" >/dev/null && exit 0
          git tag "sdk/go/$TAG" "$TAG"
          git push origin "sdk/go/$TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb
          path: dist
      - name: attach the MCP Bundle and server.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload --clobber "$TAG" dist/yuva.mcpb dist/server.json

  registry:
    needs: [version, release]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb
          path: dist
      - name: publish server.json to the MCP Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.8.1 -R modelcontextprotocol/registry -p mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish dist/server.json

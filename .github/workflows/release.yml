name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/productdevbook/yuva

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a v-prefixed SemVer tag"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          declare -A found=(
            [openapi/openapi.yaml]="$(sed -n 's/^  version: //p' openapi/openapi.yaml | head -1)"
            [sdk/js/package.json]="$(jq -r .version sdk/js/package.json)"
            [sdk/kotlin/gradle.properties]="$(sed -n 's/^yuva.version=//p' sdk/kotlin/gradle.properties)"
            [sdk/swift/Sources/YuvaKit/Yuva.swift]="$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' sdk/swift/Sources/YuvaKit/Yuva.swift)"
            [deploy/mcpb/manifest.json]="$(jq -r .version deploy/mcpb/manifest.json)"
            [server.json]="$(jq -r .version server.json)"
          )
          for file in "${!found[@]}"; do
            if [[ "${found[$file]}" != "$version" ]]; then
              echo "::error file=$file::version is ${found[$file]}, the tag is $version"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Yuva
            org.opencontainers.image.description=Open-source customer messaging: e-mail, live chat and in-app conversations in one inbox.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          annotations: |
            org.opencontainers.image.title=Yuva
            org.opencontainers.image.description=Open-source customer messaging: e-mail, live chat and in-app conversations in one inbox.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mcpb:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: build the MCP Bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$bundle" dist
          cp -R deploy/mcpb/. "$bundle/"
          cp web/public/apple-touch-icon.png "$bundle/icon.png"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}"
            out="$bundle/server/$os-$arch/yuva"
            [[ "$os" == windows ]] && out="$bundle/server/yuva.exe"
            (cd api && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$out" ./cmd/yuva)
          done
          npx --yes @anthropic-ai/mcpb@2.1.2 validate "$bundle/manifest.json"
          npx --yes @anthropic-ai/mcpb@2.1.2 pack "$bundle" dist/yuva.mcpb
          sha="$(sha256sum dist/yuva.mcpb | cut -d' ' -f1)"
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/yuva.mcpb"
          jq --arg v "$VERSION" --arg url "$url" --arg sha "$sha" \
            '.version = $v | .packages |= map(if .registryType == "mcpb" then .identifier = $url | .version = $v | .fileSha256 = $sha else . end)' \
            server.json > dist/server.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: mcpb
          path: dist/
          if-no-files-found: error

  npm:
    needs: version
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: publish with npm trusted publishing
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          tag=latest
          [[ "$PRERELEASE" == true ]] && tag=next
          npm publish --access public --tag "$tag"

  release:
    needs: [version, image, mcpb, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bunx changelogithub@15.0.5 --to "$TAG"
      - name: tag the Go module
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git tag "sdk/go/$TAG" "$TAG"
          git push origin "sdk/go/$TAG"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: mcpb
          path: dist
      - name: attach the MCP Bundle and server.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/yuva.mcpb dist/server.json

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      openapi: ${{ steps.parts.outputs.openapi }}
      api: ${{ steps.parts.outputs.api }}
      web: ${{ steps.parts.outputs.web }}
      edge: ${{ steps.parts.outputs.edge }}
      sdk_js: ${{ steps.parts.outputs.sdk_js }}
      sdk_shadcn: ${{ steps.parts.outputs.sdk_shadcn }}
      examples: ${{ steps.parts.outputs.examples }}
      site: ${{ steps.parts.outputs.site }}
      sdk_swift: ${{ steps.parts.outputs.sdk_swift }}
      sdk_kotlin: ${{ steps.parts.outputs.sdk_kotlin }}
      helm: ${{ steps.parts.outputs.helm }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: parts
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --no-renames "$base" HEAD)
          else
            files=.github/workflows/ci.yml
          fi
          printf '%s\n' "$files"
          ts='|^\.oxfmtrc\.json$|^\.oxlintrc\.json$'
          part() {
            if printf '%s\n' "$files" | grep -qE "$2|^\.github/workflows/ci\.yml$"; then v=true; else v=false; fi
            echo "$1=$v" >> "$GITHUB_OUTPUT"
            echo "$1: $v"
          }
          part openapi '^openapi/'
          part api '^(api|sdk/go|openapi|templates/email|deploy/dovecot)/'
          part web "^web/|^openapi/openapi\.yaml\$$ts"
          part edge "^edge/$ts"
          part sdk_js "^sdk/js/|^openapi/openapi\.yaml\$$ts"
          part sdk_shadcn "^sdk/shadcn/$ts"
          part examples "^(examples|sdk/js|sdk/shadcn)/$ts"
          part site "^(site|docs|sdk/shadcn|templates/email|api/internal/mail/design/icons)/|^openapi/openapi\.yaml$|^CHANGELOG\.md\$$ts"
          part sdk_swift '^sdk/swift/|^Package\.(swift|resolved)$'
          part sdk_kotlin '^sdk/kotlin/|^jitpack\.yml$'
          part helm '^deploy/helm/'

  openapi:
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npx --yes @redocly/cli@2.54.3 lint --config openapi/redocly.yaml --format=stylish openapi/openapi.yaml
        env:
          REDOCLY_TELEMETRY: "off"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: yuva
          POSTGRES_PASSWORD: yuva
          POSTGRES_DB: yuva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuva -d yuva_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      YUVA_TEST_DATABASE_URL: postgres://yuva:yuva@localhost:5432/yuva_test?sslmode=disable
      YUVA_TEST_IMAP_URL: imaps://:migrate-test-only@127.0.0.1:59993
      YUVA_TEST_IMAP_FIXTURES: /tmp/yuva-migrate-fixtures
      YUVA_TEST_XOAUTH2_URL: imaps://:migrate-test-only@127.0.0.1:59994
      YUVA_TEST_XOAUTH2_CERT: /tmp/yuva-xoauth2/tls.crt
      YUVA_TEST_XOAUTH2_INTROSPECTION: 127.0.0.1:29980
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          cache: false
      # setup-go's cache is keyed on go.sum alone and never refreshed, so every run compiled our packages again.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('api/go.sum', 'sdk/go/go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('api/go.sum', 'sdk/go/go.sum') }}-
      - name: Dovecot with the migration fixtures
        run: |
          (cd api && go run ./internal/migrate/testdata/gen -out "$YUVA_TEST_IMAP_FIXTURES")
          docker run -d --name dovecot -e USER_PASSWORD=migrate-test-only \
            -v "$PWD/deploy/dovecot/migrate-test.conf:/etc/dovecot/dovecot.conf:ro" -v "$YUVA_TEST_IMAP_FIXTURES:/srv/vmail" \
            -p 127.0.0.1:59993:31993 -p 127.0.0.1:59143:31143 dovecot/dovecot:2.4.4
          mkdir -p /tmp/yuva-xoauth2
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 -subj /CN=outlook.office365.com \
            -addext subjectAltName=DNS:outlook.office365.com -keyout /tmp/yuva-xoauth2/tls.key -out /tmp/yuva-xoauth2/tls.crt
          chmod 644 /tmp/yuva-xoauth2/tls.key /tmp/yuva-xoauth2/tls.crt
          docker run -d --name dovecot-xoauth2 --network host -e USER_PASSWORD=migrate-test-only \
            -v "$PWD/deploy/dovecot/migrate-test-xoauth2.conf:/etc/dovecot/dovecot.conf:ro" -v "$YUVA_TEST_IMAP_FIXTURES:/srv/vmail" \
            -v /tmp/yuva-xoauth2/tls.crt:/etc/dovecot/ssl/tls.crt:ro -v /tmp/yuva-xoauth2/tls.key:/etc/dovecot/ssl/tls.key:ro dovecot/dovecot:2.4.4
          for port in 59993 59994; do
            for i in $(seq 1 30); do
              if (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then continue 2; fi
              sleep 1
            done
            docker logs dovecot; docker logs dovecot-xoauth2
            exit 1
          done
      - name: api
        working-directory: api
        run: go generate ./... && go vet ./... && go test -count=1 ./... && go build ./...
      - name: the migration tests sent the mailboxes nothing but reading commands
        run: |
          sudo sh -c 'cat "$0"/*/rawlog/*.in' "$YUVA_TEST_IMAP_FIXTURES" \
            | tr -d '\r' | awk 'NF >= 3 { c = toupper($3); if (c == "UID") c = c " " toupper($4); print c }' | sort -u | tee commands.txt
          test -s commands.txt
          ! grep -vxE 'CAPABILITY|NOOP|LOGOUT|STARTTLS|LOGIN|AUTHENTICATE|LIST|STATUS|EXAMINE|UNSELECT|SEARCH|UID SEARCH|FETCH|UID FETCH' commands.txt
      - name: sdk/go
        working-directory: sdk/go
        run: go generate ./... && go vet ./... && go test -count=1 ./... && go build ./...
      - name: govulncheck
        run: |
          (cd api && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)
          (cd sdk/go && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)
      - name: generated code is committed
        run: git diff --exit-code -- api sdk/go
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: present
        run: echo "yes=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.present.outputs.yes == 'true'
        working-directory: web
        run: npm ci && npm run -s format:check && npm run -s lint && npm run -s extract && npx lingui compile --strict && npm run -s build
      - if: steps.present.outputs.yes == 'true'
        name: generated schema is committed
        working-directory: web
        run: npm run -s generate && git diff --exit-code -- src/lib/schema.gen.ts

  edge:
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: present
        run: echo "yes=$([ -f edge/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - if: steps.present.outputs.yes == 'true'
        working-directory: edge
        run: bun install --frozen-lockfile && bun run check

  sdk-js:
    needs: changes
    if: needs.changes.outputs.sdk_js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: present
        run: echo "yes=$([ -f sdk/js/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - if: steps.present.outputs.yes == 'true'
        working-directory: sdk/js
        run: bun install --frozen-lockfile && bun run check && bun run build
      - if: steps.present.outputs.yes == 'true'
        name: generated schema is committed
        working-directory: sdk/js
        run: bun run generate && git diff --exit-code -- src/schema.gen.ts

  sdk-shadcn:
    needs: changes
    if: needs.changes.outputs.sdk_shadcn == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - working-directory: sdk/shadcn
        run: bun install --frozen-lockfile && bun run check

  examples:
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: sdk/js
        working-directory: sdk/js
        run: bun install --frozen-lockfile && bun run build
      - name: format and lint
        run: >-
          npx --yes oxfmt@0.72.0 --check examples/nuxt-content examples/fumadocs examples/shadcn-next examples/headless-chat examples/inbox-feed
          && npx --yes oxlint@1.87.0 examples/nuxt-content examples/fumadocs examples/shadcn-next examples/headless-chat examples/inbox-feed
      - name: nuxt-content
        working-directory: examples/nuxt-content
        run: npm ci && npm run -s build
      - name: fumadocs
        working-directory: examples/fumadocs
        run: npm ci && npm run -s types:check && npm run -s build
      - name: shadcn-next
        working-directory: examples/shadcn-next
        run: npm ci && npm run -s build
      - name: headless-chat
        working-directory: examples/headless-chat
        run: npm ci && npm run -s typecheck
      - name: inbox-feed
        working-directory: examples/inbox-feed
        run: npm ci && npm run -s typecheck

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile && bun run format:check && bun run lint && bun run i18n && bun run build && bun run links
      - name: catalogs are committed
        run: git diff --exit-code -- site/src/locales

  sdk-swift:
    needs: changes
    if: needs.changes.outputs.sdk_swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: swift build
      - run: swift test
      - working-directory: sdk/swift/Example
        run: xcodebuild -project YuvaExample.xcodeproj -scheme YuvaExample -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build

  sdk-kotlin:
    needs: changes
    if: needs.changes.outputs.sdk_kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - working-directory: sdk/kotlin
        run: ./gradlew --console=plain check :sample:assembleDebug

  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/yuva
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: chart version is the repository version
        run: |
          want="$(sed -n 's/^  version: //p' openapi/openapi.yaml | head -1)"
          for key in version appVersion; do
            got="$(sed -n "s/^$key: \"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" "$CHART/Chart.yaml")"
            if [[ "$got" != "$want" ]]; then
              echo "::error file=$CHART/Chart.yaml::$key is $got, openapi/openapi.yaml is $want"
              exit 1
            fi
          done
      - name: lint and template
        run: |
          for values in "$CHART"/ci/*-values.yaml; do
            helm lint --strict "$CHART" -f "$values"
            helm template yuva "$CHART" -f "$values" > /dev/null
          done
          if helm template yuva "$CHART" > /dev/null 2>&1; then
            echo "::error::the chart rendered without publicUrl"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          build-args: VERSION=ci
          tags: yuva:ci
          load: true
          cache-from: |
            type=gha
            type=gha,scope=helm
          cache-to: type=gha,mode=max,scope=helm
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          cluster_name: yuva
      - name: install into kind
        run: |
          kind load docker-image yuva:ci --name yuva
          kubectl apply -f "$CHART/ci/postgres.yaml"
          kubectl rollout status deployment/postgres --timeout=180s
          helm install yuva "$CHART" -f "$CHART/ci/kind-values.yaml" \
            --set image.repository=yuva --set image.tag=ci --set image.pullPolicy=Never --wait --timeout 5m
          kubectl rollout status deployment/yuva --timeout=60s
      - name: /readyz answers 200
        run: |
          kubectl port-forward svc/yuva 18080:80 > /dev/null &
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/readyz || true)"
            [[ "$code" == 200 ]] && exit 0
            sleep 1
          done
          echo "::error::/readyz answered $code"
          exit 1
      - name: cluster state
        if: failure()
        run: |
          kubectl get all
          kubectl describe pods -l app.kubernetes.io/name=yuva
          kubectl logs deployment/yuva -c migrate --tail=100 || true
          kubectl logs deployment/yuva -c yuva --tail=200 || true
